jurisdiction: Autauga County
fips: "01001"
level: county
markets: [Montgomery]

layers:
  - role: parcels
    name: Autauga_Parcels (Prattville AGOL hosted — owner/tax rich)
    restUrl: "https://services1.arcgis.com/fWUhmUATXl9W5CJW/arcgis/rest/services/Autauga_Parcels/FeatureServer/0"
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: CALC_ACRE
    coverage: county-wide
    fieldMap:
      PARCELID: parcelId
      PARCEL_NUMBER: parcelIdAlt
      OWNER_NAME1: ownerName
      MAILING_ADDRESS1: mailingAddress.street
      MAILING_CITY: mailingAddress.city
      MAILING_STATE: mailingAddress.state
      MAILING_ZIP: mailingAddress.zip
      PROPERTY_ADDRESS1: situsAddress
      CALC_ACRE: acreage
      TOTAL_LAND_VALUE: tax.landValue
      TOTAL_IMP__VALUE: tax.improvementValue
      TOTAL_VALUE: tax.marketValue
      ASSD_VALUE: tax.assessedValue
      MUNICIPALITY_CODE: municipalityCode
    notes: >
      Verified 2026-09-23: HTTP 200 + count 33726. Hosted on City of Prattville AGOL
      org fWUhmUATXl9W5CJW but attributes are Autauga CAMA (owner/mail/values).
      Prefer over county Ering geometry-only. Autauga_Parcel_24 similar (33503).
      CaptureCAMA HTML: https://autauga.capturecama.com/parcelviewer
    status: usable

  - role: parcels
    name: Parcel (Autauga County EringMapServiceFS — geometry)
    restUrl: "https://autaugagis.autauga.com/arcgis/rest/services/Mapping/EringMapServiceFS/MapServer/185"
    layerId: 185
    geometry: polygon
    auth: none
    acreageField: CALC_ACRE
    coverage: county-wide
    fieldMap:
      PARCELID: parcelId
      PID2: parcelIdAlt
      CALC_ACRE: acreage
    notes: >
      Verified 2026-09-23 via curl -k (county SSL cert chain incomplete): count 33992.
      Geometry + PARCELID/CALC_ACRE only — no owner/tax. Use as official boundary
      fallback; prefer Autauga_Parcels AGOL for attributes.
    status: partial

  - role: zoning
    name: Unincorporated Autauga County zoning (none — plat/subdivision only)
    restUrl: null
    layerId: null
    geometry: none
    auth: n/a
    acreageField: null
    coverage: county-wide
    fieldMap: {}
    notes: >
      Verified 2026-09-24: autaugagis.autauga.com folders (Mapping/APV/Hosted/etc.) have no
      Zoning service; county Property Development page covers plat/subdivision review only.
      Municipal zoning inside Prattville: 01001-city-prattville (partial ZONING_JULY_2017).
      Unincorporated = true zoning gap.
    status: gap

gaps:
  - Unincorporated Autauga: no county zoning REST (plat/subdivision only; Prattville municipal partial)
  - No sale price on Autauga_Parcels
  - Official county server needs insecure SSL workaround; AGOL mirror preferred
  - No Autauga county zoning REST; municipal zoning via Prattville card inside city

