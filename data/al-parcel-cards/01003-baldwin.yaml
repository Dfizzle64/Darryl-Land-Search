state: AL
jurisdiction: Baldwin County
fips: "01003"
level: county
markets: [Mobile, Pensacola]

layers:
  - role: parcels
    name: Parcels (Baldwin Public ISV MapServer)
    restUrl: "https://web6.kcsgis.com/kcsgis/rest/services/Baldwin/Baldwin_Public_ISV/MapServer/31"
    layerId: 31
    geometry: polygon
    auth: none
    acreageField: CalcAcre
    coverage: county-wide
    fieldMap:
      PARCELID: parcelId
      PIN: parcelIdAlt
      PPIN: parcelIdAlt2
      acctNum: parcelIdAlt3
      Owner: ownerName
      MailAdd1: mailingAddress.street
      MailAdd2: mailingAddress.street2
      MailAdd3: mailingAddress.street3
      MailCity: mailingAddress.city
      MailState: mailingAddress.state
      MailZip1: mailingAddress.zip
      MailZip2: mailingAddress.zip4
      SitusAddNumber: situsAddress.number
      SitusAddName: situsAddress.street
      SitusAddCity: situsCity
      DeededAcres: acreage
      CalcAcres: acreageGis
      CalcAcre: acreageGisAlt
      StatedArea: acreageStated
      TTV: tax.marketValue
      TAV: tax.assessedValue
      CLandValue: tax.landValue
      CImpValue: tax.improvementValue
      CurrentUseValue: tax.currentUseValue
      TotalTaxDue: tax.due
      ZoningCode: zoning
      ZoningDesc: zoningDescription
      DeedRecorded: lastSale.recordedDate
      DeedSigned: lastSale.date
      PropertyClass: dorCode
      LegalDescription: legalDescription
    notes: >
      Verified 2026-09-23: HTTP 200 pjson + count 162037. Prefer CalcAcre for 5–150 ac
      filter (DeededAcres often 0/null on samples; CalcAcre populated e.g. 8.71, 37.63).
      Owner/mail/situs/TTV/TAV present; no sale price (deed epoch dates only).
      ZoningCode often null on parcels — spatial-join County Zoning layer 42.
      ISV viewer: https://isv.kcsgis.com/al.baldwin_revenue/
      Mapping page: https://baldwincountyal.gov/government/revenue-commission/divisions/mapping
      CRS WKID 102100/3857. maxRecordCount 2000. KCS-hosted.
      DEAD URL (404): https://al05baldrevenue.kcsgis.com/kcsgis/rest/services/Baldwin/Public/MapServer
      — do not use.
    status: usable

  - role: zoning
    name: County Zoning
    restUrl: "https://web6.kcsgis.com/kcsgis/rest/services/Baldwin/Baldwin_Public_ISV/MapServer/42"
    layerId: 42
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      ZONE_1: zoning
      PLAN_DEV_1: planningDev
      PLAN_DIS_1: planningDistrict
      PRD_NAME_1: prdName
    notes: >
      Verified 2026-09-23: count 47655. County zoning polygons for spatial join onto parcels.
      Municipal zoning inside cities may differ — treat as county/unincorporated baseline.
    status: usable

  - role: flu
    name: 2023_FLUM_Zoned_Areas
    restUrl: "https://web6.kcsgis.com/kcsgis/rest/services/Baldwin/Baldwin_Public_ISV/MapServer/43"
    layerId: 43
    geometry: polygon
    auth: none
    acreageField: null
    coverage: sample
    fieldMap:
      FLUM_Place: flu
    notes: >
      Verified 2026-09-23: count only 6 features (coarse FLUM categories e.g. Ideal Conservation,
      Moderate/High Density Development Potential).
      Not parcel-level future land use — partial/gap for site-level FLU.
    status: partial

gaps:
  - Prefer CalcAcre over DeededAcres for acreage filters (DeededAcres often empty)
  - No lastSale.price on Parcels/31 (deed dates only as epoch ms)
  - Parcel ZoningCode often empty; join County Zoning/42
  - FLUM layer is place-level (6 polys), not parcel FLU
  - al05baldrevenue.kcsgis.com Baldwin/Public MapServer returns 404

  - Municipal zoning cards: 01003-city-foley / gulf-shores / orange-beach (usable|partial); daphne + fairhope base = gap; join spatially (or Foley PID) onto /31
