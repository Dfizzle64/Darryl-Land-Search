    name: Unincorporated Blount County AL zoning (none on Public MapServer)
    restUrl: null
    layerId: null
    geometry: none
    auth: n/a
    acreageField: null
    coverage: county-wide
    fieldMap: {}
    notes: >
      Verified 2026-09-24: web5 Blount/Public/MapServer has flood zones / district labels —
      no Zoning district polygons. County publishes subdivision regulations (amended 2025);
      no public county zoning FeatureServer found this pass. WRONG GEOGRAPHY: Blount TN
      coa.blountgis.org / zoning task-force news is Tennessee — do not use.
    status: gap

gaps:
  - Unincorporated Blount AL: no Zoning REST on Public/32; do not use Blount TN GIS
  - situsAddress not on public layer
  - lastSale not on public layer
  - zoning / FLU not in Blount/Public catalog
  - Do not confuse with Blount TN GIS

