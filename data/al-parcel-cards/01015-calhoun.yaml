    name: Owner Parcels (Calhoun County Parcel_Viewer_IPV)
    restUrl: "https://gis.calhouncounty.org/arcgis/rest/services/Parcel_Viewer_IPV/MapServer/106"
    layerId: 106
    geometry: polygon
    auth: none
    acreageField: CALCULATED_ACRES
    coverage: county-wide
    fieldMap:
      PARCEL_NUMBER: parcelId
      PPIN: parcelIdKey (deep-link)
      NAME: ownerName
      PREVIOUS_OWNER: ownerNamePrior
      ADDRESS_1: mailingAddress.line1
      ADDRESS_2: mailingAddress.street
      ADDRESS_3: mailingAddress.line3
      CITY: mailingAddress.city
      STATE: mailingAddress.state
      ZIPCODE: mailingAddress.zip
      STREET_ADDRESS: situsAddress
      CALCULATED_ACRES: acreage
      DEEDED_ACRES: acreageDeed
      TOTAL_LAND_VALUE: tax.landValue
      TOTAL_IMPROVEMENT_VALUE: tax.improvementValue
      TOTAL_VALUE: tax.marketValue
      TOTAL_ASSD_VALUE: tax.assessedValue
      TAX_DISTRICT: tax.district
      SALE_PRICE: lastSale.price
      SALE_DATE: lastSale.date
      GOOD_SALE: lastSale.qualified
      LAST_DEED_BOOK: lastSale.deedBook
      LAST_DEED_PAGE: lastSale.deedPage
      LAND_USE: dorCode
      CURRENT_USE: currentUse
      NEIGHBORHOOD: neighborhood
      SUBDIVISION_DESC: subdivision
      IMP_YEAR_BUILT: yearBuilt
    notes: >
      Verified live 2026-09-28: ?f=json 200, anonymous, polygon, count 75424, maxRecordCount 10000; sample centroid -85.81,33.86 (Jacksonville, Calhoun AL — not Calhoun GA/IL). County-hosted ArcGIS Server 12 (gis.calhouncounty.org/arcgis/rest/services, directory browsable). Owner/mail/situs/CALCULATED_ACRES/values/SALE_PRICE+SALE_DATE+GOOD_SALE/LAND_USE present. Layer 105 Sales mirrors same schema/count. Other service layers: Subdivisions/80, FEMA Flood/91, city limits 92-100. No county zoning layer.
    status: usable

gaps:
  - SALE_PRICE often 0
  - No county zoning layer
  - altags.com deep-link pattern inferred from Lauderdale ISV config; altags.com unreachable from box 2026-09-28

