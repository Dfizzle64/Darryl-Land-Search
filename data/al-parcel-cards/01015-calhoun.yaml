    status: usable
    luCountyId: 8
    countyWhere: "YearAADT=2024 AND LUCountyID=8 AND AADT>0"
    stations2024: 655
    verifiedAt: "2026-09-28"
    verifiedBy: "Alabama Public Info Researcher"
    notes: "LUCountyID=8 is the 1-67 alphabetical index (Saint Clair sorts before Shelby, so LUCountyID=(FIPS3+1)/2); 655 stations with 2024 AADT>0 in this county (outStatistics count grouped by LUCountyID, fetched 2026-09-28 via external fetcher because aldotgis.dot.state.al.us TLS-EOFs from the box). Spot-checked LUCountyID 6=Bullock and 58=St. Clair by point location. Latest usable AADT year=2024 (2025 shells exist, AADT null). Auth none. Viewer https://aldotgis.dot.state.al.us/TDMPublic/."

