state: AL
jurisdiction: Dallas County
fips: "01047"
level: county
markets: [Rural OZ 2.0]

layers:
  - role: parcels
    name: ParcelsJoin (Dallas ParcelViewer — CaptureCAMA AGOL hosted)
    restUrl: "https://services8.arcgis.com/9e1lVZPGgkrztAhh/ArcGIS/rest/services/Dallas_ParcelViewer_Service/FeatureServer/2"
    layerId: 2
    geometry: polygon
    auth: none
    acreageField: TOTAL_AC
    coverage: county-wide
    fieldMap:
      PARCEL_ID: parcelId
      ACCOUNT: accountNumber
      PPIN: parcelIdKey (often null)
      OWNERNAME: ownerName
      CONAME: ownerCareOf
      ADDRESS: mailingAddress.street
      CITY: mailingAddress.city
      STATE: mailingAddress.state
      ZIPCODE: mailingAddress.zip
      SITUS_ADDR: situsAddress
      TOTAL_AC: acreage
      DEEDACRES: acreageDeed
      LAND_VAL: tax.landValue
      IMP_VAL: tax.improvementValue
      TOTALVALUE: tax.marketValue
      TAXES_DUE: tax.due
      DISTRICT: tax.district
      DEED_BOOK: lastSale.deedBook
      DEED_PAGE: lastSale.deedPage
      DEED_DATE: lastSale.date
      YEARBUILT: yearBuilt
      SQFT: buildingSqft
      MUNICIPAL: municipalityCode
      NEIGH_CODE: neighborhood
      LEGAL: legalDescription
    notes: >
      Verified live 2026-09-28: ?f=json 200, anonymous, polygon, count 29996, maxRecordCount 1000; sample centroid -87.05,32.41 (Selma, Dallas AL — not Dallas TX). Discovered in the Experience Builder config of the county CaptureCAMA Parcel Viewer (https://dallas.capturecama.com/parcelviewer/cdn/31/config.json). TOTAL_AC>0 on 14198, DEEDACRES>0 on 16598; 6351 parcels with TOTAL_AC 5–150. Where both are 0 compute acreage from geometry. No sale price (deed book/page/date only). Secondary MapServer gis.capturecama.com/arcgis/rest/services/DallasAL/DallasCapture/MapServer/163 (PARCEL) also referenced — not verified.
    status: usable

gaps:
  - No sale price
  - ~50% of parcels have TOTAL_AC=0 — fall back to DEEDACRES or computed area
  - Flagship alabamagis.com/dallas is still HTML-only; this AGOL layer is the REST source

