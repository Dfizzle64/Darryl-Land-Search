      TimberAcres: acreageTimber
      TTV: tax.marketValue
      TAV: tax.assessedValue
      CLandValue: tax.landValue
      CImpValue: tax.improvementValue
      TotalTaxDue: tax.due
      TaxDist: tax.district
      DeedBook: lastSale.deedBook
      DeedPage: lastSale.deedPage
      Neighborhood: neighborhood
      LegalDescription: legalDescription
      ParcelID_GISlink: parcelIdFormatted
      ZoningCode: zoning
      ZoningDesc: zoningDescription
      CurrentUseValue: tax.currentUseValue
      TaxYearDue: tax.year
    notes: >
      Verified live 2026-09-28 (?f=json 200 + 1-feature query with geometry, outSR 4326). Count 75665; polygon; maxRecordCount 2000; sample centroid -85.80,34.13 (Coosa River, Etowah AL). PARCELID 16-digit; PIN (text) = deep-link ppin. Owner/mail/situs/CalcAcres/TTV/TAV/tax due/DeedBook/DeedPage; ZoningCode/ZoningDesc attributes present (population not checked). No DeedRecorded date or sale price. Found via ISV config.
    status: usable

gaps:
