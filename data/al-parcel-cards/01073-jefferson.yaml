layers:
  - role: parcels
    name: Parcels (JCC Basemap)
    restUrl: "https://jccgis.jccal.org/server/rest/services/Basemap/Parcels/MapServer/0"
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: ACRES_APR
    coverage: county-wide
    fieldMap:
      PARCELID: parcelId
      PID: parcelIdAlt
      ParcelNo: parcelIdAlt2
      APP_PID: parcelIdAlt3
      OWNERNAME: ownerName
      Name2: ownerName2
      PROP_MAIL: mailingAddress.street
      CITYMAIL: mailingAddress.city
      STATE_Mail: mailingAddress.state
      ZIP_MAIL: mailingAddress.zip
      ADDR_APR: situsAddress
      Bldg_Number: situsAddress.number
      Street_Name: situsAddress.street
      Street_Type: situsAddress.streetType
      Street_Dir: situsAddress.dir
      Property_City: situsCity
      ZIP: situsZip
      ACRES_APR: acreage
      GIS_ACRES: acreageGis
      PriAcreage: acreageAlt
      AssdValue: tax.assessedValue
      PrevParcelLand: tax.landValuePrior
      PrevParcelImp: tax.improvementValuePrior
      PrevParcelTotal: tax.marketValuePrior
      Ownership: ownershipType
    notes: >
      Verified 2026-09-23: HTTP 200 pjson + count 410142. maxRecordCount 2000.
      OWNERNAME often fixed-width padded — trim on ingest. AssdValue is AL fractional
      assessed value (class ratios), not full market. Prefer county JCC over City of
      Birmingham EssentialsPublic MapServer (may mirror neighboring counties).
      Open data portal referenced: data-jeffco-al.opendata.arcgis.com
    status: usable

  - role: zoning
    name: Zoning (DDS FutureLandUse — unincorporated authoritative)
    restUrl: "https://jccgis.jccal.org/server/rest/services/DDS/FutureLandUse/FeatureServer/4"
    layerId: 4
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      ZNCODE: zoning
      ZNCODE_ID: zoningCodeId
      AUTHORITYID: zoningAuthority
      CASENUMB: zoningCaseNumber
      DATE_ZACTION: zoningActionDate
    notes: >
      Verified 2026-09-24: HTTP 200 pjson + count 10678 (AUTHORITYID=1 Jefferson County
      subset 10582). Layer description: "authoritative Zoning layer for Unincorporated
      Jefferson County" (Dept of Development Services). ZNCODE domains include A-1, R-1..R-6,
      C-1, I-1/I-3, INST-*, etc. (64 distinct codes sampled). CRS WKID 102630. maxRecordCount
      2000. MapServer twin DDS/Zoning/MapServer/3 (count 10582, same schema). Prefer this
      FeatureServer/4 over AGOL draft mirrors Current_Zoning (396) /
      Zoning_March_2025_BESTNEWZONELAYER (750) on org GWcL4L1LrmhPd7DI — incomplete drafts.
      Spatial-join onto Basemap/Parcels/0 for unincorporated; municipal cards win inside
      city limits (Birmingham/Hoover/Vestavia/Homewood).
    status: usable

  - role: flu
    name: Future Land Use (DDS FutureLandUse)
    restUrl: "https://jccgis.jccal.org/server/rest/services/DDS/FutureLandUse/FeatureServer/2"
    layerId: 2
    geometry: polygon
    auth: none
    acreageField: Acreage
    coverage: county-wide
    fieldMap:
      FLU: flu
      FLU_Type: fluType
      Acreage: acreage
      APP_PID: parcelIdAlt
    notes: >
      Verified 2026-09-24: count 67260. Consultant FLU added 2025-05-08 per layer desc.
      Codes sampled ER/AR/etc. Prefer for comprehensive-plan overlay; zoning remains
      FeatureServer/4 for district codes.
    status: usable

gaps:
  - Full market / sale fields not confirmed complete on this basemap layer this run
  - Do not use Birmingham city-mirrored Shelby polygons as Jefferson jurisdiction
  - AGOL org GWcL4L1LrmhPd7DI Current_Zoning / Zoning_March_2025 drafts are incomplete — use DDS FS/4
  - Municipal zoning still preferred inside city limits: 01073-city-birmingham (+FLU), hoover, vestavia-hills (partial), homewood; Hoover also spans Shelby

