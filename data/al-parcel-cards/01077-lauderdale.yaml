      TaxYear: tax.year
      DeedDate: lastSale.date
      SalePrice: lastSale.price
      CU: currentUse
      MunCode: municipalityCode
      LegalDesc: legalDescription
    notes: >
      Verified live 2026-09-28 (?f=json 200 + 1-feature query with geometry, outSR 4326). Count 55490; polygon; sample centroid -87.86,34.85 (Florence area, Lauderdale AL — not Lauderdale MS/TN). PID 16-digit; PPIN = deep-link key. Has SalePrice + DeedDate (sample SalePrice 0 — often blank/0). CalculatedAcres often 0 — prefer DeededAcres or compute from Shape.STArea() (sq ft? verify units). Found via ISV config.
    status: usable

gaps:
