state: AL
jurisdiction: Limestone County
fips: "01083"
level: county
markets: [Huntsville]

layers:
  - role: parcels
    name: Limestone ReMap Parcels (official county — preferred)
    restUrl: "https://gis.limestonecounty-al.gov/arcgis/rest/services/Limestone_Parcels/MapServer/1"
    layerId: 1
    geometry: polygon
    auth: none
    acreageField: CALC_ACRE
    coverage: county-wide
    fieldMap:
      ParcelNo: parcelId
      PID: parcelIdAlt
      OwnerName: ownerName
      OwnerName2: ownerName2
      MailAddress1: mailingAddress.street
      MailAddress2: mailingAddress.street2
      MailCity: mailingAddress.city
      MailState: mailingAddress.state
      MailZip: mailingAddress.zip
      PropertyAddr1: situsAddress
      PropertyCity: situsCity
      PropertyState: situsState
      PropertyZip: situsZip
      CALC_ACRE: acreage
      StatedArea: acreageAlt
      ForestAcreage: acreageForest
      TotalLandValue: tax.landValue
      TotalImpValue: tax.improvementValue
      TotalValue: tax.marketValue
      AssessmentClass: tax.assessmentClass
      MunicipalityCode: tax.municipality
      Neighborhood: neighborhood
      RecordYear: tax.year
      TIFDist: tax.tifDistrict
    notes: >
      Verified 2026-09-23: HTTP 200 pjson + count 39534. CRS WKID 102630 (AL West State
      Plane Feet). maxRecordCount 2000. Remap 2025 per service description — prefer over
      layer 0 (count 33527, same schema). Owner/situs/tax/acres present; no sale price/date
      fields. Many string fields are fixed-width padded — trim before display. FeatureServer
      twin: /Limestone_Parcels/FeatureServer/1 (same count). ISV:
      https://isv.kcsgis.com/al.limestone_revenue/. City of Madison / Huntsville hosts also
      mirror Limestone parcels (city-only extent) — do not treat as county-wide.
    status: usable

  - role: parcels
    name: Limestone Parcels (pre-remap — fallback)
    restUrl: "https://gis.limestonecounty-al.gov/arcgis/rest/services/Limestone_Parcels/MapServer/0"
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: CALC_ACRE
    coverage: county-wide
    fieldMap:
      ParcelNo: parcelId
      PID: parcelIdAlt
      OwnerName: ownerName
      CALC_ACRE: acreage
      TotalValue: tax.marketValue
      TotalLandValue: tax.landValue
      TotalImpValue: tax.improvementValue
    notes: >
      Verified 2026-09-23: count 33527. Same field schema as Remap layer 1 but older/lower
      count. Prefer layer 1.
    status: partial

  - role: parcels
    name: Limestone County Parcels (Huntsville CombinedParcels mirror)
    restUrl: "https://maps.huntsvilleal.gov/server/rest/services/Boundaries/CombinedParcels/MapServer/7"
    layerId: 7
    geometry: polygon
    auth: none
    acreageField: null
    coverage: unknown
    fieldMap: {}
    notes: >
      Present on CombinedParcels; prefer official gis.limestonecounty-al.gov Remap/1 for
      county-wide CAMA. City of Madison DV_PlanningPro1_MIL1/14 is city-extent only
      (count ~17461).
    status: partial

  - role: zoning
    name: Unincorporated Limestone County zoning (none — subdivision regs only)
    restUrl: null
    layerId: null
    geometry: none
    auth: n/a
    acreageField: null
    coverage: county-wide
    fieldMap: {}
    notes: >
      Verified 2026-09-24: gis.limestonecounty-al.gov Hosted/Revenue folders have no Zoning
      service (Revenue token-gated 499). County Engineering publishes subdivision regulations
      only — no county zoning district map. Municipal zoning where city limits cross into
      Limestone: Huntsville ZoningDistricts/5 and City of Madison DV_PlanningPro1 layers
      (see 01089 city cards). Unincorporated = true zoning gap.
    status: gap

gaps:
  - Unincorporated Limestone: no county zoning REST (subdivision only; city zoning via Huntsville/Madison cards)
  - No lastSale.price / lastSale.date on Limestone_Parcels layers
  - No county zoning/FLU FeatureServer verified this run (municipal zoning via Huntsville /
    Madison city cards where city limits cross into Limestone)
  - Revenue/ folder on county GIS returns Token Required (499) — not used
  - Trim padded OwnerName / address strings

