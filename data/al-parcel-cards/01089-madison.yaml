enrichment:
  aadt:
    luCountyId: 45
    year: 2024
    countyWhere: "YearAADT=2024 AND LUCountyID=45 AND AADT>0"
    stations2024: 1001
    countyCheckedAt: "2026-09-28"
    countyNote: "LUCountyID=45 is the 1-67 alphabetical index (Saint Clair sorts before Shelby, so LUCountyID=(FIPS3+1)/2); 1001 stations with 2024 AADT>0 in this county (outStatistics count grouped by LUCountyID, fetched 2026-09-28 via external fetcher because aldotgis.dot.state.al.us TLS-EOFs from the box). Spot-checked LUCountyID 6=Bullock and 58=St. Clair by point location."
    source: "ALDOT TDM Public (TrafficCounterPoint)"
    restUrl: "https://aldotgis.dot.state.al.us/pubgis2/rest/services/EGISATDServices/TDMPublic/MapServer/0"
    layerId: 0
    field: "AADT"
    geography: "state traffic count stations (points)"
    coverage: state-wide
    status: usable
    verifiedAt: "2026-09-24"
    verifiedBy: "Alabama Public Info Researcher"
    notes: "Official ALDOT EGISATDServices/TDMPublic MapServer; ~282482 multi-year points (YearAADT 2014–2025). Latest usable AADT year=2024 (~22009 with AADT>0; 2025 shells exist but AADT still null as of 2026-09-24). Filter YearAADT=2024; optional LUCountyID (1–67 alpha county index, e.g. Autauga=1 Jefferson=37 Madison=45). Companion YearAADT field. Auth none. Viewer https://aldotgis.dot.state.al.us/TDMPublic/. Dig: enrichment/AL/aadt-aldot-2026-09-24.md"

