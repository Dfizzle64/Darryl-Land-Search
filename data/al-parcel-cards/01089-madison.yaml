state: AL
jurisdiction: Madison County
fips: "01089"
level: county
markets: [Huntsville]

layers:
  - role: parcels
    name: Parcels (Madison Public ISV — CAMA join)
    restUrl: "https://web3.kcsgis.com/kcsgis/rest/services/Madison/Madison_Public_ISV/MapServer/185"
    layerId: 185
    geometry: polygon
    auth: none
    acreageField: Acres
    coverage: county-wide
    fieldMap:
      PIN: parcelId
      ParcelNum: parcelIdAlt
      ASSESS_NUM: parcelIdAlt2
      PropertyOwner: ownerName
      AccountOwner: ownerNameAlt
      PreviousOwners: ownerNamePrior
      MailingAddress: mailingAddress
      PropertyAddress: situsAddress
      Acres: acreage
      TotalLandValue: tax.landValue
      TotalBuildingValue: tax.improvementValue
      TotalAppraisedValue: tax.marketValue
      TotalAssessedValue: tax.assessedValue
      TotalUseValue: tax.useValue
      DeedDate: lastSale.date
      DeedType: lastSale.deedType
      DeedBook: lastSale.deedBook
      DeedPage: lastSale.deedPage
      TaxYear: tax.year
      TaxDistrict: tax.district
      ExemptCode: tax.exemptCode
      NeighborhoodName: neighborhood
      Subdivision: subdivision
    notes: >
      Verified 2026-09-23: HTTP 200 pjson + count 193320 (web3 and al05baldrevenue
      mirrors identical). CRS WKID 102100/3857. maxRecordCount 2000. Owner/tax/acres/
      deed present; no sale price field (DeedDate/DeedType only). Deep-link pattern via
      Huntsville CombinedParcels Url:
      https://madisonproperty.countygovservices.com/Property/Property/Summary?ppin={PIN}&taxyear=2027.
      Alternate host: https://al05baldrevenue.kcsgis.com/kcsgis/rest/services/Madison/Madison_Public_ISV/MapServer/185.
      ISV viewer: https://isv.kcsgis.com/al.madison_revenue/. Prefer this layer for
      ownership/tax/acreage source of truth.
    status: usable

  - role: parcels
    name: OwnerParcel (AL47 GAMAWeb StatePlane — geometry/IDs)
    restUrl: "https://al05baldrevenue.kcsgis.com/kcsgis/rest/services/Madison/AL47_GAMAWeb_FGDB_StatePlane/MapServer/0"
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: CALC_ACRE
    coverage: county-wide
    fieldMap:
      PARCELID: parcelId
      ASSESS_NUM: parcelIdAlt
      PPIN: parcelIdAlt2
      OLD_PARCEL_NO: parcelIdAlt3
      CALC_ACRE: acreage
    notes: >
      Verified 2026-09-23: count 193336. CRS WKID 102629 (AL East State Plane Feet).
      Geometry + parcel IDs / CALC_ACRE only — NO owner, tax, situs, or sale. Web Mercator
      twin: Madison/AL47_GAMAWeb MapServer (Parcel View /141 and related). Use as
      StatePlane measuring companion; join attributes from Public_ISV/185 via PPIN/PIN
      or ASSESS_NUM.
    status: partial

  - role: parcels
    name: Madison County Parcels (City of Huntsville CombinedParcels — deep-link Url)
    restUrl: "https://maps.huntsvilleal.gov/server/rest/services/Boundaries/CombinedParcels/MapServer/8"
    layerId: 8
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      PIN: parcelId
      PropertyOwner: ownerName
      MailingAddress: mailingAddress
      PropertyAddress: situsAddress
      Url: appraiserSearchUrl
    notes: >
      Verified 2026-09-23: count 193084. Slimmer schema than Public_ISV/185 but includes
      Url deep-link to madisonproperty.countygovservices.com. Prefer Public_ISV/185 for
      tax/acres; keep this for Url pattern. Also mirrored on City of Madison
      DV_PlanningPro1_MIL1/MapServer/13 (count 206348 — city host; verify before relying
      on extras).
    status: partial

  - role: zoning
    name: City of Madison Zoning (county GAMAWeb mirror — single layer)
    restUrl: "https://al05baldrevenue.kcsgis.com/kcsgis/rest/services/Madison/AL47_GAMAWeb/MapServer/114"
    layerId: 114
    geometry: polygon
    auth: none
    acreageField: null
    coverage: city-only
    fieldMap:
      Name: zoning
      FType: zoningTypeId
      Use_Status: zoningStatus
    notes: >
      Verified 2026-09-23: count 272; Name codes AG/R-1A/R-4/B1/M-1/PUD/etc. City-of-Madison
      only — spatial-join onto county parcels. Prefer official city card
      01089-city-madison.yaml (DV_PlanningPro1 split layers; higher polygon count). Also
      Huntsville Zoning mirror on same service layer 111 (count ~797) — see city-huntsville.
    status: partial

gaps:
  - No lastSale.price on Public_ISV/185 (DeedDate/DeedType only)
  - Countywide municipal zoning not on a single county layer; use city cards (Huntsville, Madison, OXR)
  - FLU not on county parcel REST this run
  - AL47 OwnerParcel is geometry/IDs only
  - Municipal zoning cards: 01089-city-huntsville.yaml, 01089-city-madison.yaml; OXR Zoning GAMAWeb/126 (~1454) optional

