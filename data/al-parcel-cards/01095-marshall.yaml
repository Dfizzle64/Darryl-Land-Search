level: county
markets: [Huntsville]

layers:
  - role: parcels
    name: Parcels (KCS Marshall/Public MapServer)
    restUrl: "https://web5.kcsgis.com/kcsgis/rest/services/Marshall/Public/MapServer/37"
    layerId: 37
    geometry: polygon
    auth: none
    acreageField: CalcAcres
    coverage: county-wide
    fieldMap:
      PARCELID: parcelId
      GIS_PARCELID: parcelIdAlt
      PIN: parcelIdAlt2
      PIN_PID: parcelIdComposite
      Owner: ownerName
      MailAdd1: mailingAddress.street
      MailAdd2: mailingAddress.street2
      MailAdd3: mailingAddress.street3
      MailCity: mailingAddress.city
      MailState: mailingAddress.state
      MailZip1: mailingAddress.zip
      MailZip2: mailingAddress.zip4
      SitusAddNumber: situsAddress.number
      SitusAddName: situsAddress.street
      SitusAddCity: situsCity
      DeededAcres: acreageDeed
      CalcAcres: acreage
      TTV: tax.marketValue
      TAV: tax.assessedValue
      CLandValue: tax.landValue
      CImpValue: tax.improvementValue
      TotalTaxDue: tax.due
      TaxYearDue: tax.year
      PropertyClass: dorCode
      LegalDescription: legalDescription
      DeedRecorded: lastSale.recordedDate
      DeedSigned: lastSale.date
    notes: >
      Verified 2026-09-23 (re-chase): HTTP 200 pjson + count 66601 county-wide.
      Prefer CalcAcres for 5–150 ac filter (sample query CalcAcres 5–150 → 11658;
      DeededAcres 5–150 → 2773 and often 0/null when CalcAcres is populated).
      No ZoningCode on this layer. CRS WKID 102100/3857. maxRecordCount 1000.
      ISV viewer: https://isv.kcsgis.com/al.marshall_revenue/
      Host: web5.kcsgis.com only (web3 folder 404; web4 has Marshall/iWorQ only;
      web6 Token Required 499). DEAD: Marshall/Marshall_Public_ISV (404/500),
      CaptureCAMA/Marshall (404/500). Prior CombinedParcels/9 (137 features) remains
      wrong-coverage sample — do not use as inventory.
    status: usable

  - role: parcels
    name: Marshall County Parcels (Huntsville CombinedParcels — fringe sample only)
    restUrl: "https://maps.huntsvilleal.gov/server/rest/services/Boundaries/CombinedParcels/MapServer/9"
    layerId: 9
    geometry: polygon
    auth: none
    acreageField: DeededAcres
    coverage: sample
    fieldMap:
      PIN: parcelId
      PARCELID: parcelIdAlt
      GIS_PARCELID: parcelIdAlt2
      Owner: ownerName
      DeededAcres: acreage
      CalcAcres: acreageGis
      TTV: tax.marketValue
      TAV: tax.assessedValue
    notes: >
      Count ~137 only — Huntsville fringe/sample. Prefer Marshall/Public/37.
    status: gap

  - role: zoning
    name: Unincorporated Marshall County zoning (none on Public MapServer)
    restUrl: null
    layerId: null
    geometry: none
    auth: n/a
    acreageField: null
    coverage: county-wide
    fieldMap: {}
    notes: >
      Verified 2026-09-24: web5 Marshall/Public/MapServer has no Zoning/FLU layer names;
      parcels/37 has no ZoningCode. County regulates via subdivision regulations (2025 PDF);
      no public county zoning FeatureServer found. WRONG GEOGRAPHY: valorgis.com
      PlanningDevelopment/MarshallZones is Marshall County KY (WKID 102667/2240) — do not use.
      Municipal zoning for Albertville/Guntersville/Arab not researched this pass.
    status: gap

gaps:
  - No Marshall County AL zoning REST on Public/37; MarshallZones ValoGIS is KY (wrong geography)
  - No municipal zoning REST researched for Albertville/Guntersville this pass
  - No lastSale.price on Public/37 (deed book/page/epoch dates only)
  - web6.kcsgis.com Marshall folder requires token (499)

