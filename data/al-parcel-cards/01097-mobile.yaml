markets: [Mobile]

layers:
  - role: parcels
    name: Revenue Tax Parcels (Mobile County AGOL / Facilities service)
    restUrl: "https://services2.arcgis.com/dJHAcAx6kccDBtM6/arcgis/rest/services/Mobile_County_Facilities/FeatureServer/0"
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: StatedArea
    coverage: county-wide
    fieldMap:
      Parcel_Number: parcelId
      Account_Number: parcelIdAlt
      PID: parcelIdAlt2
      Name1: ownerName
      Name2: ownerName2
      Address1: mailingAddress.street
      Address2: mailingAddress.street2
      City: mailingAddress.city
      State: mailingAddress.state
      Zip: mailingAddress.zip
      PropAddr1: situsAddress
      PropCity: situsCity
      PropZip: situsZip
      StatedArea: acreage
      PriAcreage: acreageAlt
      TotalValue: tax.marketValue
      ApprValue: tax.marketValueAlt
      AssdValue: tax.assessedValue
      TotalLandValue: tax.landValue
      TotalImpValue: tax.improvementValue
      Zoning: zoning
      URL_Revenue: appraiserSearchUrl
    notes: >
      Verified 2026-09-23: HTTP 200 pjson + count 211181; acreage filter sample returns
      private owners (e.g. LOFTON, TENSAW LAND & TIMBER) — NOT limited to county-owned
      facilities despite parent service name. Layer description: polygons + 2024 ownership
      join dated 2023/06/21 (treat as possibly stale vs CaptureCAMA geometry). Has
      URL_Revenue deep-link pattern
      https://esearch.mobilecopropertytax.com/Property/View/{Account_Number}?year=2024.
      Prefer this for owner/tax/situs; join fresher geometry from CaptureCAMA if needed.
      CRS WKID 102100/3857. maxRecordCount 2000.
    status: usable

  - role: parcels
    name: Tax Parcels (CaptureCAMA MapServer — geometry-strong)
    restUrl: "https://maps.capturecama.com/arcgis/rest/services/Mobile/Mobile03182025/MapServer/20"
    layerId: 20
    geometry: polygon
    auth: none
    acreageField: StatedArea
    coverage: county-wide
    fieldMap:
      Parcel_Num: parcelId
      Account_Nu: parcelIdAlt
      StatedArea: acreage
      Calculated: acreageGis
      Subdivisio: subdivision
    notes: >
      Verified 2026-09-23: folder Mobile lists Mobile03182025 (newest) and
      Mobile_County_Map_09042024. Both Tax Parcels layer 20 count 212064.
      Fields are parcel fabric / stated area only — NO owner, tax, situs, or sale.
      09042024 uses full names (Parcel_Number, Account_Number, CalculatedArea);
      03182025 truncates many field names. Public viewer:
      https://mobile.capturecama.com/parcelviewer/. Use as geometry companion to AGOL
      ownership layer. maxRecordCount 1000 on 09042024.
    status: partial

  - role: parcels
    name: Parcels (City of Mobile EG_Data_MS — county Revenue data hosted by city)
    restUrl: "https://maps.cityofmobile.org/arcgis/rest/services/EG_Data_MS/MapServer/1"
    layerId: 1
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      parcel: parcelId
      name: ownerName
      streetno: situsAddress.number
      streetname: situsAddress.street
      loc_city: situsCity
      mail_addr1: mailingAddress.street
      mail_addr2: mailingAddress.street2
      mail_city: mailingAddress.city
      mail_state: mailingAddress.state
      mail_zip: mailingAddress.zip
      land_value: tax.landValue
      improv_value: tax.improvementValue
      fmkt_value: tax.marketValue
      yr_sale: lastSale.date
      sq_feet: areaSqFt
      landuse: dorCode
    notes: >
      Verified 2026-09-23: count 213791 (county-scale, not city-only). Iteminfo/copyright
      references Mobile County Revenue Commission. Parcel IDs use R-prefix format different
      from CaptureCAMA/AGOL. Sample situs (streetno/streetname/loc_city) often null;
      fmkt_value and yr_sale often null in sample; acreage via sq_feet/43560.
      Prefer AGOL FeatureServer/0 for CAMA join + deep-link; keep this as alternate host.
      CRS WKID 102630 (AL West State Plane Feet). maxRecordCount 2000.
    status: partial

  - role: other
    name: Bisclient Mobile CAD viewer (no public parcel REST extracted)
    restUrl: null
    layerId: null
    geometry: none
    auth: n/a
    acreageField: null
    coverage: unknown
    fieldMap: {}
    notes: >
      https://gis.bisclient.com/alabama/mobilecad/ loads; config.json points at
      bisgis.maps.arcgis.com / revenue.maps.arcgis.com hubs only — no MapServer/FeatureServer
      parcel URL extracted this run. Do not scrape HTML.
    status: gap

  - role: zoning
    name: Unincorporated Mobile County zoning (none — official)
    restUrl: null
    layerId: null
    geometry: none
    auth: n/a
    acreageField: null
    coverage: county-wide
    fieldMap: {}
    notes: >
      Verified 2026-09-24: Mobile County Development and Zoning page states explicitly
      "There is no zoning in the unincorporated areas of Mobile County."
      https://www.mobilecountyal.gov/government/departments/engineering/engineering-services/planning-and-development/development-and-zoning/
      AGOL org dJHAcAx6kccDBtM6 and CaptureCAMA Mobile hosts have no Zoning FeatureServer.
      Parcel attribute Zoning on Facilities/0 is sparse/empty. Municipal zoning inside
      city limits: 01097-city-mobile.yaml (EG_Data_MS/20). ETJ/PJ permitting may apply
      near municipalities — not a county zoning district layer.
    status: gap

gaps:
  - No county Zoning FeatureServer/MapServer — true gap, not missing URL
  - Unincorporated Mobile County has no zoning ordinance (official county statement 2026-09-24)
  - CaptureCAMA Tax Parcels lack owner/tax/sale — geometry only
  - AGOL ownership join dated 2023/06/21 per layer description (may lag current CAMA)
  - lastSale.price not on AGOL layer; yr_sale on city layer mostly null in sample
  - Zoning attribute sparse/empty on AGOL sample; no separate county zoning FeatureServer verified
  - FLU not found on public Mobile REST this run
  - Dead URL: do not use al05 / unknown KCS Mobile hosts without re-probe

  - Municipal zoning: see 01097-city-mobile.yaml (EG_Data_MS/20); spatial-join onto AGOL parcels

