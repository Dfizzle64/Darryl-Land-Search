      maxRecordCount 2000. AL Montgomery confirmed (PropertyCity MONTGOMERY, etc.).
      Owner/mail/situs/values present; InstDate often null — no reliable sale price.
      Strings often fixed-width padded — trim on ingest. Prefer this FeatureServer over
