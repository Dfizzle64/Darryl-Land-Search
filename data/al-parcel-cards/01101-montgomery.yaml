      Calc_Acre: acreage
      TotalLandValue: tax.landValue
      TotalImpValue: tax.improvementValue
      TotalValue: tax.marketValue
      AssessmentClass: dorCode
      MunicipalityCode: municipalityCode
    notes: >
      Verified 2026-09-23: count 105511. Near-duplicate of gis.montgomeryal.gov schema.
      Prefer city GIS FeatureServer/0 as primary. ISV viewer:
      https://isv.kcsgis.com/al.montgomery_revenue/
    status: partial

  - role: zoning
    name: Unincorporated Montgomery County zoning (none — city Zoning FS is municipal)
    restUrl: null
    layerId: null
    geometry: none
    auth: n/a
    acreageField: null
    coverage: county-wide
    fieldMap: {}
    notes: >
      Verified 2026-09-24: gis.montgomeryal.gov Zoning/FeatureServer/0 (count 2049) is
      City of Montgomery municipal zoning — already filed as 01101-city-montgomery.yaml.
      No separate countywide unincorporated zoning layer on county/city GIS or KCS
      AL03_Public_ISV. County permitting exists outside city/Pike Road police jurisdictions
      but without a county zoning district map REST. Spatial-join city Zoning/0 only inside
      city limits. WRONG GEOGRAPHY: NY Montgomery AGOL parcels — stay clear.
    status: gap

gaps:
  - No unincorporated Montgomery County zoning REST — city Zoning/0 is municipal only
  - No reliable lastSale.price (InstDate sparse)
  - Trim padded OwnerName/address strings
  - City zoning is separate card 01101-city-montgomery — spatial-join inside city
  - Avoid NY Montgomery AGOL item

