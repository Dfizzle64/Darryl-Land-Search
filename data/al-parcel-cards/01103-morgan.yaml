state: AL
jurisdiction: Morgan County
fips: "01103"
level: county
markets: [Huntsville]

layers:
  - role: parcels
    name: Parcels (KCS VAM AL52 — preferred county CAMA)
    restUrl: "https://web4.kcsgis.com/kcsgis/rest/services/VAM/AL52_VAM_MS/MapServer/10"
    layerId: 10
    geometry: polygon
    auth: none
    acreageField: TotalAcres
    coverage: county-wide
    fieldMap:
      PARCELID: parcelId
      PID: parcelIdAlt
      PIN: parcelIdAlt2
      Owner: ownerName
      Owner2: ownerName2
      MailAdd1: mailingAddress.street
      MailAdd2: mailingAddress.street2
      MailCity: mailingAddress.city
      MailState: mailingAddress.state
      MailZip: mailingAddress.zip
      PropAddr1: situsAddress
      PropAddr2: situsAddress2
      PropCity: situsCity
      PropState: situsState
      PropZip: situsZip
      TotalAcres: acreage
      CalcAcres: acreageGis
      TimberAcreage: acreageTimber
      TotalLandValue: tax.landValue
      TotalImpValue: tax.improvementValue
      TotalValue: tax.marketValue
      AssdValue: tax.assessedValue
      SoldTotalPrice: lastSale.price
      LastSalesDate: lastSale.date
      LastDeed: lastSale.deed
      AssessmentClass: tax.assessmentClass
      TaxDist: tax.district
      MunCode: tax.municipality
      Neighborhood: neighborhood
      RecordYear: tax.year
    notes: >
      Verified 2026-09-23: HTTP 200 pjson + count 81122. CRS WKID 102100. maxRecordCount
      1000. Parent service is VAM (voting) but layer 10 is full CAMA parcels with owner/
      situs/tax/sale. Trim padded strings. ISV: https://isv.kcsgis.com/al.morgan_revenue/.
      Sample SoldTotalPrice>0 returns real sales (e.g. 62000 / 200000).
    status: usable

  - role: parcels
    name: Morgan County Parcels (Huntsville CombinedParcels mirror)
    restUrl: "https://maps.huntsvilleal.gov/server/rest/services/Boundaries/CombinedParcels/MapServer/10"
    layerId: 10
    geometry: polygon
    auth: none
    acreageField: TotalAcres
    coverage: county-wide
    fieldMap:
      PARCELID: parcelId
      PIN: parcelIdAlt
      PID: parcelIdAlt2
      Owner: ownerName
      TotalAcres: acreage
      CalcAcres: acreageGis
      TotalValue: tax.marketValue
      AssdValue: tax.assessedValue
      SoldTotalPrice: lastSale.price
      LastSalesDate: lastSale.date
    notes: >
      Verified 2026-09-23: count 76807 (slightly below VAM/10). Same schema family.
      Prefer web4 VAM/10 as primary; this is a City of Huntsville-hosted mirror.
    status: partial

  - role: zoning
    name: Unincorporated Morgan County zoning (none — flood/septic/driveway + subdivision)
    restUrl: null
    layerId: null
    geometry: none
    auth: n/a
    acreageField: null
    coverage: county-wide
    fieldMap: {}
    notes: >
      Verified 2026-09-24: Morgan County Engineer development page lists floodplain, sewage,
      and driveway permits plus subdivision regulations — no county zoning ordinance or
      Zoning REST. Official GIS host NXDOMAIN; web4 VAM has parcels only (no Zoning layer).
      Decatur municipal zoning still MapGeo-only (01103-city-decatur gap). Unincorporated
      = true zoning gap.
    status: gap

gaps:
  - Unincorporated Morgan County: no zoning REST (engineer site — flood/septic/driveway/subdivision only)
  - No official Morgan County GIS hostname resolved this run (gis/maps.morgancounty-al.gov NXDOMAIN)
  - No Decatur municipal zoning public FeatureServer/MapServer found (mapgeo viewer only —
    see 01103-city-decatur.yaml gap)
  - County zoning/FLU REST not verified
  - Trim padded Owner / address fields

