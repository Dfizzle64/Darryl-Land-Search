state: AL
jurisdiction: St. Clair County
fips: "01115"
level: county
markets: [Birmingham]

layers:
  - role: parcels
    name: Owner Parcels (PublicParcelViewerStPln)
    restUrl: "https://map.stclairco.com/arcgis/rest/services/PublicParcelViewerStPln/MapServer/57"
    layerId: 57
    geometry: polygon
    auth: none
    acreageField: DEEDED_ACR
    coverage: county-wide
    fieldMap:
      PARCELID: parcelId
      PPIN: parcelIdAlt
      NAME_1: ownerName
      ADDRESS_1: mailingAddress.street
      ADDRESS_2: mailingAddress.street2
      ADDRESS_3: mailingAddress.street3
      CITY: mailingAddress.city
      STATE: mailingAddress.state
      ZIPCODE: mailingAddress.zip
      STREET_ADD: situsAddress
      DEEDED_ACR: acreage
      CALCULAT_1: acreageGis
      SALE_PRICE: lastSale.price
      SALE_DATE: lastSale.date
      GOOD_SALE: lastSale.qualified
      ActualPric: lastSale.priceAlt
      SaleType: lastSale.type
      TOTAL_VALU: tax.marketValue
      TOTAL_ASSD: tax.assessedValue
      TOTAL_LAND: tax.landValue
      TOTAL_IMPR: tax.improvementValue
    notes: >
      Verified 2026-09-23: HTTP 200 pjson + count 61242. FeatureServer SOE for this
      service returns 500 — use MapServer query. CRS WKID 102629 (AL East State Plane Feet).
      maxRecordCount 2000. Revenue Commissioner / AL DOR mapping maintained.
    status: usable

  - role: parcels
    name: OwnerParcel_Ingen (cleaner CAMA names)
    restUrl: "https://map.stclairco.com/arcgis/rest/services/OwnerParcel_Ingen/MapServer/16"
    layerId: 16
    geometry: polygon
    auth: none
    acreageField: DEEDED_ACRES
    coverage: county-wide
    fieldMap:
      PARCELID: parcelId
      DEEDED_ACRES: acreage
      TOTAL_VALUE: tax.marketValue
      TOTAL_ASSD_VALUE: tax.assessedValue
      GOOD_SALE: lastSale.qualified
    notes: Same ownership/tax/sale cluster with less-truncated field names; prefer for joins.
    status: usable

  - role: zoning
    name: Owner Parcel Zone View (zoned subset)
    restUrl: "https://map.stclairco.com/arcgis/rest/services/Owner_Parcel_Zone_View_v3/MapServer/3"
    layerId: 3
    geometry: polygon
    auth: none
    acreageField: null
    coverage: sample
    fieldMap:
      ZoneCode: zoning
      OverlayZone: zoningOverlay
      CompPlan: flu
      TaxDist: tax.district
    notes: Zoned parcels only — not countywide coverage for every parcel.
    status: partial

gaps:
  - Zoning/FLU only on zoned-parcel subset layer
  - FeatureServer endpoint for PublicParcelViewer returns 500

