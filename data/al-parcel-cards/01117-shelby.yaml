      CUR_USE_VL: tax.currentUseValue
      OVRRIDE_ASD_VL: tax.assessedValue
      Zoning: zoning
    notes: >
      Verified 2026-09-23: HTTP 200 pjson + count 105582. Prefer over C_PARCEL for
      owner/tax/sale CAMA. CRS WKID 102630 (NAD 1983 StatePlane Alabama West Feet).
      Sibling folders PTC/DataShare/GISWeb/Cadastral/LandMarkData/SpatialView return
      HTTP 499 Token Required — avoid. GOOD_SALE / qualified sale flag not on this layer.
    status: usable

  - role: parcels
    name: C_PARCEL (PropertyTaxOfficeBase FeatureServer)
    restUrl: "https://maps.shelbyal.com/gisserver/rest/services/CaptureServices/PropertyTaxOfficeBase/FeatureServer/93"
    layerId: 93
    geometry: polygon
    auth: none
    acreageField: Acreage
    coverage: county-wide
    fieldMap:
      Assess_Num: parcelId
      Acreage: acreage
      Zoning: zoning
    notes: >
      Verified prior same-day research: ~108455 features; geometry-strong but lacks
      NAM1/owner/tax/sale CAMA join. Use only as fabric companion to Cadastral_2025/91.
    status: partial

  - role: zoning
    name: ZoneAll (district/school/zoning text)
    restUrl: "https://maps.shelbyal.com/gisserver/rest/services/LegacyServices/ShelbyALZoneAll10/MapServer/0"
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      idText: zoning
    notes: Zoning/district text blob in idText — spatial join; parcel Zoning often null.
    status: partial

gaps:
  - lastSale.qualified (GOOD_SALE) not on Cadastral_2025/91
  - FLU / comprehensive plan not found as public county layer
  - Token-gated sibling folders on same host
  - ISV_Parcels Indian Springs Village is city-only / SmartGov-restricted — avoid

  - Municipal zoning: 01117-city-helena (usable), pelham (usable via AGOL utility proxy), alabaster (gap); Hoover (01073-city-hoover) spans into Shelby

