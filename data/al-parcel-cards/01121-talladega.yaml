      PropertyClass: dorCode
      ZoningCode: zoning
      ZoningDesc: zoningDescription
      Subdivision: subdivision
      Neighborhood: neighborhood
      LegalDescription: legalDescription
    notes: >
      Verified 2026-09-24: HTTP 200 pjson + count 57181. CRS WKID 102100/3857.
      maxRecordCount 100000. Sample WGS84 centroid ~-86.34, 33.19 (Talladega AL) —
      geo-verified. Owner/mail/situs/tax/acres/deed + ZoningCode/ZoningDesc on parcel.
      No sale price. Prefer CalcAcres. Companion TylerTech Parcels on web6
      Talladega/Talladega_TylerTech/MapServer/1 (count 57771, similar CAMA schema).
      ISV: https://isv.kcsgis.com/al.talladega_revenue/. Prefer 911 Public/7 for
      ZoningCode join-free attributes.
    status: usable

  - role: parcels
    name: Parcels (Talladega TylerTech mirror)
    restUrl: "https://web6.kcsgis.com/kcsgis/rest/services/Talladega/Talladega_TylerTech/MapServer/1"
    layerId: 1
    geometry: polygon
    auth: none
    acreageField: CalcAcres
    coverage: county-wide
    fieldMap:
      PIN: parcelId
      PARCELID: parcelIdAlt
      PPIN: parcelIdAlt2
      Owner: ownerName
      CalcAcres: acreage
      DeededAcres: acreageDeed
      TTV: tax.marketValue
      TAV: tax.assessedValue
    notes: >
      Verified 2026-09-24: count 57771. Alternate CAMA host; prefer Talladega911
      Public/7 when ZoningCode needed.
    status: partial

  - role: zoning
    name: Zoning via OwnerParcel ZoningCode attribute
    restUrl: "https://web5.kcsgis.com/kcsgis/rest/services/Talladega911/Public/MapServer/7"
    layerId: 7
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      ZoningCode: zoning
      ZoningDesc: zoningDescription
    notes: >
      Verified 2026-09-24: ZoningCode/ZoningDesc present on OwnerParcel (many null
      in rural sample). No separate Zoning district FeatureServer on Talladega911
      Public or AL61_VAM_City_Districts (empty). Use parcel attributes; municipal
      district polygons not published separately this pass.
    status: partial

gaps:
  - No lastSale.price (deed book/page/date only)
  - ZoningCode often null outside munis; no standalone zoning polygon layer
  - FLU not on Talladega911 Public this pass

