gaps:
  - Unincorporated Tuscaloosa County: no public zoning REST (subdivision + municipal PJ only)
  - No lastSale.price on public parcel layer (deed date/book/page only)
  - Prefer rtMAP_ACRE over rtDEED_ACR for acreage filters
  - County has no public zoning REST — use city cards inside municipalities
  - Nearby Hale/Pickens/Bibb/Greene: Flagship/CaptureCAMA HTML only this pass (no usable REST)

