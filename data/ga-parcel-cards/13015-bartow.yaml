gaps:
  - "No public REST lastSale.price/date/qualified — BartowLand/ParcelInfo/Parcels have no sale fields; qPublic AppID=791 Sales Search / Yearly Sales are HTML/Beacon-only (CDN/bot 403)."
  - "No public REST tax.assessedValue/taxableValue beyond Total_Taxable_FMV (labeled Total Taxable FMV) — land/building/accessory components available."
  - "County FLU REST gap — 2018 Future Land Use Map is PDF (AGOL item 3c2f76d2227643c392c24600163cfbda); Joint Comp Plan 2023-2028 PDF via DCA. ExistingLandUse CurrentLandUse is EXISTING LU only, not FLU. qPublic 'Future Landuse 2018' viewer layer is not queryable REST."
  - "City zoning REST gap for Cartersville/Adairsville/Emerson/Euharlee/Kingston/White/Taylorsville — county BartowZoning STZONECODE='Incorporated' (~9146) stubs city interiors; qPublic Beacon city zoning layers are viewer-only."
  - "CityLimits / Administrative_Boundaries lack municipality NAME — use Tax_District / Tax_District_Desc (preferred) or E911_ID centroid decode."
  - "StructuralNumbers CITY and postal community are postal — municipality filter = Tax_District / CityLimits spatial only."
  - "PARCELID multipart common (e.g. 0002-0059-001 → 3 rings) — dissolve/group by PARCELID for unique parcel search."
  - "Assessor / Cartersville / Development / Production / Pictometry folders on www.bartowgis.org/arcgis return empty service lists (likely token-locked internal) — public path is AGOServices + Imagery + Roads + AGOL org 0tQ9yX5b2VG5RHei."
  - "Downloadable parcels/zoning sold by Bartow GIS ($500 countywide / $50/tile) — do not treat paid download as public REST; free REST above is preferred."
  - "qPublic AppID=791 LayerID=14444 may CDN/bot-403 automated clients; public for humans. Do not collect emails/phones."
  - "Rejected lookalikes: City of Bartow FL General Information (services8.arcgis.com/1wJDvJrOmH0GVxt1 — SR 2882 Florida, sample ~-81.92,27.96); AcworthParcels/AcworthZoning in Bartow org 0tQ9yX5b2VG5RHei (436/566 features near SE Bartow/Allatoona fringe ~-84.67,34.08 — misnamed subset, NOT City of Acworth Cobb primary zoning); Atlanta Regional Commission LandPro_2012 (Ug5xGQbHsD8zuZzM — stale regional land-cover/use, not cadastral); Regrid/paid statewide extracts; EVHS historic org 3QuY14XixnaLNBmr (cemeteries/historic only)."
  - "Enrichment vs thin in-app: full county 63688 geometry+PARCELID+owner/mailing/situs parts+FMV+taxDist+TOTALACRES (5–150=13412); county Zoning STZONECODE (Incorporated stub in cities); CityLimits/Tax_District municipality; existing LU optional; sales/FLU/city-zoning/assessed remain gap/HTML/PDF."

