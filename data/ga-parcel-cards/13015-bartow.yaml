      Street TAD overlays inside city. Spatial CityLimits E911_ID=2
      (~-84.80,34.12–34.20). PARCELID often C-prefix (C001-…).
    layers: []
    notes: >
      No official City of Cartersville ArcGIS FeatureServer/MapServer for
      zoning/FLU found (2026-09-23). cartersvillega.gov Planning has ordinance PDF
      only; gis.cartersvillega.gov / maps.cartersvillega.gov do not resolve. County
      BartowZoning STZONECODE='Incorporated' stubs city interiors — do NOT treat
      as city zoning code. qPublic Beacon lists "Cartersville Zoning" +
      "Cartersville Overlay Districts" + "Cartersville Voting Ward" as viewer
      layers (HTML/bot-walled). Geography/CAMA via Tax_District + BartowLand;
      city zoning certification is a gap vs county A-1/R-1/….
