      TOTALACRES 5–150 ≈2337; HOUSE_NO>0 ≈7799; LASTNAME filled ≈11499; CURR_VAL>0 ≈11499;
      PREV_VAL>0 ≈11494; FMVRES>0 ≈5927; MAVCURR>0 =0 (MAV* present but unused — do NOT
