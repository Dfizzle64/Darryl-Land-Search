    notes: >
      Preferred COUNTY-WIDE parcel GEOMETRY + WinGAP CAMA landbase for Macon-Bibb
      (consolidated Bibb County / former City of Macon + Payne City). AGOL org
      zPFLSOZ5HzUzzTQb (Macon-Bibb) FeatureServer name ParcelCAMA_Current_20250106;
      serviceItemId 0b8a3dedb19b4c3085f0868fcd4e0f38. Live count 71505 (2026-09-23).
      Near-identical twin (prefer for April-2025 label / +3 features):
      https://maconbibb.spatialitics.net/server/rest/services/ParcelCAMA_Current/MapServer/0
      (count 71508; mapName April2025Update; keywords Parcels,CAMA_Current,Wingap,Tax Assessor).
      Prefer this FeatureServer (supportsPagination=true, maxRecordCount 2000). SR NAD 1983
      StatePlane Georgia West FIPS 1002 Feet (wkid 102667 / latestWkid 2240). TOTALACRES_1>0
      ≈68165; TOTALACRES_1 5–150 ≈3337 (preferred multifamily acreage band); CALC_ACRE 5–150
      ≈4032 — prefer TOTALACRES_1 when >0, else CALC_ACRE. LASTNAME / SITEADDRESS /
      ZONINGCODE / ZIP / SITE_ZIP / SALEDATE filled ≈68348; CURR_VAL <> '0' ≈68136;
      SALEPRICE <> '0' ≈51918 (string field — coerce numeric; many nominal 1/10/100 —
      filter PRICE not in ('0','1','100') leaves ≈47088). FMVRES <> '0' ≈49795; FMVCOM <> '0'
      ≈4454. Compose situs from SITEADDRESS (or HOUSE_NO+STDIRECT+STREET_NAM+STTYPE).
      ADDRESS1 is typical mailing street (sometimes co-owner / DBA / % agent); ADDRESS2
      secondary line; CITY/STATE/ZIP are OWNER mailing (nationwide — e.g. BROOKLYN NY) —
      never municipality filter. DIGCLASS: R≈59054, C≈4535, E≈2771, A≈818, V≈596, I≈358,
      H≈134, null≈3160 (+ J/U/P sparse). TAXDISTRIC soft (no published REST name legend):
      11≈66549 (vast majority / consolidated Macon-Bibb), 09≈804, 12≈443, 07≈320, 10≈94,
      17≈73, 19≈51, 18≈10, 08≈4, null≈3160 — special/school/enterprise soft only; do NOT
      use as city filter (no remaining incorporated cities). ZONINGCODE is parcel-attributed
      (top R-1A≈15308, R-1AAA≈12182, R-2≈8931, A≈7412, R-1≈4362, PDR≈4074, R-3≈2404,
      PDE≈2236…); prefer ZoningDistrictsNew / MB_ZoningDistricts_Edit polygons for
      authoritative district boundaries (parcel codes include PDR/PDE/PDC subtypes +
      slash combos / typos — soft). REASON is WinGAP sale/transfer reason (FM≈20907,
      CP≈11963, QD≈5707, UQ≈3870, MP≈2152…) — soft lastSale.qualified; no published
      REST legend (FM appears arms-length/market; UQ unqualified; QD quitclaim-ish —
      certify via Assessor). SALEDATE max ≈2025-02-27 UTC on spatialitics twin; string
      SALEPRICE/CURR_VAL/FMV* need numeric cast. Official viewers: experience Zoning Map
      a72ae0e878c04e009c033240a6680dd4; maconbibb.maps.arcgis.com webappviewer
      48e7713100fa4db6b437fded980098e6; Open Data hub macon-bibb-county-open-data-maconbibb.hub.arcgis.com.
      Assessor HTML: qPublic SchneiderCorp App=BibbCountyGA (qpublic.net/ga/bibb →
      Application.aspx?App=BibbCountyGA&Layer=Parcels&PageType=Search). Deep-link:
      Application.aspx?App=BibbCountyGA&Layer=Parcels&PageType=Report&KeyValue={PARCEL_NO_1}
      (MAP_ROUTE dashed form e.g. O130-0278 also used in viewers). Geo-verified WGS84
      samples ~-83.695,32.847 (Fair St), ~-83.663,32.793 (Triple Hill), ~-83.721,32.745
      (Hartley Bridge), ~-83.611,32.817 (Walker Swamp / industrial), ~-83.828,32.877
      (Clay Dr west), county centroid ~-83.70,32.74 — Bibb County GA / Macon MSA
      (NOT Bibb County AL Centreville; NOT Macon County GA FIPS 13193 Oglethorpe;
      NOT Macon County AL/TN/IL; NOT Decatur IL "Macon Co. Tax Parcels" on
      maps.decaturil.gov). Rejected ARC LandPro_2012 stale regional as cadastral;
      rejected Regrid/ATTOM/CoreLogic paid; rejected AGOL Parcels/TaxParcels BS&A-style
      as preferred (count ~68958 but LASTUPDATE≈2018-03-02 UTC, PSTLZIP5 filled=0,
      CNTTXBLVAL>0=0, Midwestern winter/summer tax template, no SALEPRICE — usable only
      as assessed-value join on PARCELID≈MAP_ROUTE with staleness caveat); rejected
      LandParcelsMBC (386), Sales_Parcels_WFL1 (342 tax-sale listing), JIRMarch2025Parcels
      (2068 blight/JIR subset), gis.maconbibb.us/server/rest (Web Adaptor "Could not
      access any server machines" — blocked/down 2026-09-23).
    status: usable

