municipalities:
  - name: Macon-Bibb (consolidated government)
    level: county
    parentFips: "13021"
    joinToCountyParcels: >
      Entire ParcelCAMA_Current layer IS the consolidated jurisdiction (City of Macon +
      Bibb County + Payne City consolidated effective 2014-01-01). No remaining
      incorporated municipalities in Bibb County. Do NOT filter by mailing CITY='MACON'
      (owner mailing nationwide). Optional soft TAXDISTRIC='11' (~66549) covers almost
      all taxable parcels but is a tax-district code, not a city boundary.
    layers:
      - role: zoning
        name: ZoningDistrictsNew (countywide = local zoning)
        restUrl: https://services2.arcgis.com/zPFLSOZ5HzUzzTQb/arcgis/rest/services/ZoningDistrictsNew/FeatureServer/0
        layerId: 0
        geometry: polygon
        auth: none
        acreageField: null
        coverage: county-wide
        fieldMap:
          ZONECLASS: zoning
          ZONEDESC: zoningDescription
        notes: >
          Standing order city-over-county does not apply as separate cities — consolidated
          Macon-Bibb zoning IS the local zoning. Official map experience
          a72ae0e878c04e009c033240a6680dd4; ordinance mbpz.org/zoning.
        status: usable
      - role: flu
        name: MATS_Future_LandUse_2050
        restUrl: https://services2.arcgis.com/zPFLSOZ5HzUzzTQb/arcgis/rest/services/MATS_Future_LandUse_2050/FeatureServer/0
        layerId: 0
        geometry: polygon
        auth: none
        acreageField: null
        coverage: county-wide
        fieldMap:
          FLU2050: flu
          LUCode2050: fluCode
        notes: >
          Countywide FLU via MATS; certify vs 2040 Comp Plan PDF. Status partial.
        status: partial
      - role: parcels
        name: ParcelCAMA_Current_2025 (same as county preferred)
        restUrl: https://services2.arcgis.com/zPFLSOZ5HzUzzTQb/arcgis/rest/services/ParcelCAMA_Current_2025/FeatureServer/0
        layerId: 0
        geometry: polygon
        auth: none
        acreageField: TOTALACRES_1
        coverage: county-wide
        fieldMap:
          PARCEL_NO_1: parcelId
          TOTALACRES_1: acreage
          LASTNAME: ownerName
        notes: >
          No separate city CAMA — consolidated county layer is the parcel source.
        status: usable
    gaps:
      - "City of Macon and Payne City governments dissolved 2014-01-01 into Macon-Bibb County Consolidated Government — no separate city GIS cards or city-only FeatureServers required."
      - "No remaining incorporated municipalities inside Bibb County FIPS 13021."
    status: usable

gaps:
  - "No remaining incorporated municipalities (Macon + Payne City consolidated 2014) — municipalities section is consolidated-only; no city boundary FeatureServer needed for filters."
  - "gis.maconbibb.us/server/rest Web Adaptor returns 'Could not access any server machines' (2026-09-23) — PlanningAndZoning/Zoning MapServer and legacy portal services blocked/down; use AGOL zPFLSOZ5HzUzzTQb + maconbibb.spatialitics.net instead."
  - "No assessedValue/taxableValue on preferred WinGAP ParcelCAMA REST — use CURR_VAL market + qPublic HTML for assessed; AGOL Parcels CNTASSDVAL is assessed but ownership LASTUPDATE≈2018-03."
  - "AGOL Parcels / TaxParcels BS&A-style layer (count ~68958): PSTLZIP5 filled=0, CNTTXBLVAL>0=0, Midwestern winter/summer tax fields, no sales — do NOT prefer over ParcelCAMA_Current."
  - "SALEPRICE/CURR_VAL/FMV* are strings — numeric cast required; many SALEPRICE='0'/'1'/'100' nominal."
  - "No multi-sale history array on REST — only latest sale on polygon; prior sales via qPublic HTML (Application.aspx may bot 403)."
  - "REASON sale codes lack published REST legend — FM/UQ/QD etc. soft only."
  - "Parcel ZONINGCODE has PDR/PDE/PDC + slash combos / typos; authoritative boundaries = ZoningDistrictsNew ZONECLASS (PDS/PDM)."
  - "TAXDISTRIC codes lack published name legend — soft only; never city filter."
  - "Mailing CITY/STATE/ZIP nationwide — never municipality filter."
  - "MATS_Future_LandUse_2050 is MPO FLU tied to 2050 horizon — certify vs adopted Macon-Bibb 2040 Comp Plan PDF / Planning."
  - "MATS_Exist_LandUse is existing LU / not FLU — do not prefer as future land use."
  - "Sales_Parcels_WFL1 (342) is tax-sale listing subset — not countywide sales."
  - "JIRMarch2025Parcels (2068) and LandParcelsMBC (386) are subsets — not preferred countywide."
  - "WebZoning_2025_WFL1/0 is 9 hospital points — wrong geography/role despite name."
  - "MB_ZoningDistricts_Edit is edit-enabled (Query+Editing) — prefer ZoningDistrictsNew for read-only; spatialitics count 1915 slightly ahead of AGOL 1833."
  - "qPublic Schneider Application.aspx App=BibbCountyGA observed HTTP 403 to automated clients; qpublic.net/ga/bibb landing 200."
  - "Rejected lookalikes / non-preferred: Bibb County AL (Centreville) GIS; Macon County GA (FIPS 13193, Oglethorpe — different county); Macon County AL/TN/IL; Decatur IL maps.decaturil.gov Public/parcels 'Macon Co. Tax Parcels'; ARC LandPro_2012 stale regional as cadastral; Regrid/ATTOM/CoreLogic/DynamoSpatial paid; AGOL Parcels BS&A as preferred current CAMA; gis.maconbibb.us down services."
  - "No emails/phones collected; no paid vendors."

