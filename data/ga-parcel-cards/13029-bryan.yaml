  # PRIMARY — county-wide cadastral polygons + WinGAP-style CAMA (owner/mailing/situs/acres/FMV/CURR_VAL/zoning attr)
  - role: parcels
    name: PropertyDetails Parcels (official Bryan County GA ArcGIS Server)
    restUrl: https://bryangis.bryan-county.org/arcgis/rest/services/PropertyDetails/MapServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: TOTALACRES
    coverage: county-wide
    fieldMap:
      PARCEL_NO: parcelId
      PARCEL_N_1: parcelIdAlt
      REALKEY: ownerKey
      OWNKEY: ownerKeyAlt
      LASTNAME: ownerName
      ADDRESS1: mailingAddressLine1OrCoOwner
      ADDRESS2: mailingAddress
      ADDRESS3: mailingAddress2
      CITY: mailingCity
      STATE: mailingState
      ZIP_1: mailingZip
      HOUSE_NO: situsNumber
      STDIRECT: situsStreetDir
      STREET_NAM: situsStreet
      STTYPE: situsStreetType
      UNIT: situsUnit
      ZIP: situsZipPostal
      TOTALACRES: acreage
      WOODACRES: acreageWoodland
      CURR_VAL: tax.marketValue
      PREV_VAL: tax.priorMarketValue
      FMVRES: tax.marketValueResidential
      FMVCOM: tax.marketValueCommercial
      FMVACC: tax.marketValueAccessory
      MAVCURR: tax.assessedValue
      MAVRES: tax.assessedValueResidential
      MAVCOM: tax.assessedValueCommercial
      MAVACC: tax.assessedValueAccessory
      ZONINGCODE: zoning
      TAXDISTRIC: taxDistrict
      DIGCLASS: dorCode
      DIGSTRAT: dorStrata
      LEGAL_DESC: legalDescription
      SUBD_NAME: subdivision
      HOMEEXEMPT: homesteadExempt
      LANDGMD: georgiaMilitiaDistrict
      HISTYR1: tax.histYear1
      HISTVAL1: tax.histValue1
      HISTYR2: tax.histYear2
      HISTVAL2: tax.histValue2
      HISTYR3: tax.histYear3
      HISTVAL3: tax.histValue3
      FLD_ZONE: floodZone
      Shape_Area: shapeAreaSqFt
    notes: >
      Preferred COUNTY-WIDE parcel GEOMETRY + CAMA landbase (Bryan County GIS,
      bryangis.bryan-county.org ArcGIS Server 10.71). Live count 23200 (2026-09-23).
      SR NAD 1983 StatePlane Georgia East FIPS 1001 Feet (wkid 102666 / latestWkid 2239).
      maxRecordCount 1000; supportsPagination=false / supportsStatistics=false /
      supportsOrderBy=false — page via objectIds or spatial envelopes, not resultOffset.
      TOTALACRES>0 ≈22367; TOTALACRES 5–150 ≈2232 (preferred acreage band); LASTNAME filled
      ≈23200; HOUSE_NO>0 ≈19728; CURR_VAL>0 ≈22426; FMVRES+FMVCOM+FMVACC>0 ≈18495;
      ZONINGCODE non-blank ≈22019; MAVCURR>0 = 0 on live query (MAV* fields present but
      unused — do NOT rely on MAVCURR as assessed; prefer CURR_VAL as market and compose
      FMV components when needed). Compose situsAddress from HOUSE_NO + STDIRECT +
      STREET_NAM + STTYPE when HOUSE_NO>0. ZIP tracks situs postal (31324 Richmond Hill /
      31321 Pembroke samples even when mailing CITY=ALPHARETTA) — treat as situsZipPostal;
      ZIP_1 tracks mailing (out-of-state samples e.g. SC 29485, TX 75572, CA 91320) —
      mailingZip. CITY/STATE/ADDRESS2 are owner mailing (nationwide) — never municipality
      filter. TAXDISTRIC soft map (geo-checked): 1≈Pembroke (~1403, ~-81.62,32.12),
      2≈Richmond Hill (~7704, ~-81.27–81.32,31.90), 3≈unincorporated (~13319),
      0≈non-taxable/ROW stubs (~774) — prefer spatial MunicipalBoundaries over TAXDISTRIC.
      DIGCLASS: R≈20437, C≈800, E≈386, A≈307, V≈284, I≈83, J≈79, U≈46, blank≈774.
      HISTYR*/HISTVAL* are assessment value-year history (sample HISTYR1=2025) — NOT sales.
      Multipart parcels exist (same PARCEL_NO multiple FID, e.g. 065028×2). Official GIS:
      bryancountyga.gov GIS/Mapping (interactive maps page may Akamai-403 automated;
      REST open). Stale/broken twin URL Parcels/MapServer returns 500 "Service not found"
      — use PropertyDetails. Thinner Evolve/MapServer/1 Parcels count 19727 lacks FMV/
      CURR_VAL — do not prefer. Geo-verified WGS84 samples ~-81.255,31.765 (Hwy 144 south
      Bryan), ~-81.27–81.33,31.85–31.91 (Richmond Hill), ~-81.58–81.63,32.10–32.15
      (Pembroke), county boundary centroid ~-81.42,32.00 — Bryan County GA SW of Savannah
      (NOT Bryan TX, NOT Bryan OK, NOT Pembroke NC). Rejected ARC LandPro; rejected
      Regrid/ATTOM/DynamoSpatial paid; rejected SAGIS (Chatham-only, no Bryan folder).
    status: usable

