      FMVCOM: tax.marketValueCommercial
      FMVACC: tax.marketValueAccessory
      TAXDISTRIC: taxDistrict
      DIGCLASS: dorCode
      HOMEEXEMPT: homesteadExempt
    notes: >
      Tax/CAMA values live on preferred parcel polygons. Prefer CURR_VAL as
      tax.marketValue (≈22426 >0). Compose optional component FMV ≈ FMVRES+FMVCOM+FMVACC
      (≈18495 >0). MAVCURR/MAVRES/MAVCOM/MAVACC present in schema but MAVCURR>0 count=0
      live — no usable assessedValue REST field; GA 40% assessed detail via Beacon/qPublic
      HTML. HISTYR1–3 / HISTVAL1–3 are prior digest value years, not sales. Assessor HTML:
      Beacon SchneiderCorp AppID=639 LayerID=11303 (qpublic.net/ga/bryan →
      beacon.schneidercorp.com; Cloudflare/bot 403 automated; public for humans).
      Deep-link pattern: Application.aspx?AppID=639&LayerID=11303&PageTypeID=4&KeyValue={PARCEL_NO}.
      Tax Commissioner / paytaxes: bryancounty.paytaxes.net (HTML).
    status: usable

