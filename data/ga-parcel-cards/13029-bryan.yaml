gaps:
  - "No public REST lastSale.price/date/qualified — Beacon/qPublic AppID=639 LayerID=11303 Sales Search HTML only (Cloudflare/bot 403 automated). HISTYR*/HISTVAL* are assessment value years — not sales."
  - "MAVCURR/MAV* assessed fields present but MAVCURR>0 count=0 live — no usable assessedValue on REST; use CURR_VAL market + Beacon HTML for assessed/taxable."
  - "PropertyDetails MapServer: no pagination / no outStatistics / maxRecordCount 1000 — clients must objectId-batch or spatial-envelope page."
  - "Broken twin URL https://bryangis.bryan-county.org/arcgis/rest/services/Parcels/MapServer returns 500 Service not found — wire PropertyDetails/MapServer/0 only."
  - "Evolve/MapServer/1 Parcels (19727) thinner, no CURR_VAL/FMV — do not prefer over PropertyDetails."
  - "ZIP on parcels is situs postal; ZIP_1 is mailingZip — CITY/STATE/ADDRESS2 are owner mailing (nationwide); never municipality filter."
  - "TAXDISTRIC 0/1/2/3 lack published REST name legend — soft map 1=Pembroke / 2=Richmond Hill / 3=unincorp / 0=ROW; prefer MunicipalBoundaries spatial."
  - "County Zoning/0 is 16 dissolved UDO polys — spatial OK for unincorporated; inside cities prefer parcel ZONINGCODE + city Official Zoning Map PDF (RH Apr 15 2026)."
  - "ZONINGCODE='CITY' (~368) is a stub — not Euclidean district."
  - "Richmond Hill / Pembroke: no city-hosted zoning or FLU FeatureServer; county FLU stubs 'Richmond Hill City Limits' / 'Pembroke City Center' only."
  - "AddressPoints PARCELNO sparsely filled (~59) — spatial join for situs."
  - "Multipart parcels (same PARCEL_NO multiple FID) — dissolve/union on ingest."
  - "bryancountyga.gov interactive-maps page Akamai/Edge 403 to automated fetch; REST at bryangis.bryan-county.org remains open."
  - "SAGIS (pub.sagis.org) is Chatham/Savannah MPC — no Bryan folder; adjacency only, do not wire Chatham Pictometry for Bryan parcels."
  - "Rejected lookalikes / non-preferred: Bryan County OK voter precincts (csagis-uok.opendata.arcgis.com); Bryan TX municipal GIS; Richmond IN Wayne County Richmond_Zoning_Registered; Richmond VA City GIS; Pembroke NC Town UDO PDF; ARC LandPro_2012 stale regional as cadastral; Regrid/ATTOM/CoreLogic/DynamoSpatial paid Bryan extracts; CRC Bryan/Pembroke_Housing 2013 survey as preferred parcels; CoastalZoning FeatureServer/10 research canopy mirror (prefer official Zoning/0); stale Parcels/MapServer URL."
  - "No emails/phones collected (FireDistricts CONTACT/PHONE/EMAIL schema ignored); no paid vendors."

