        name: Metter_GeoData_View MetterZoning_CharacterArea
        restUrl: https://services5.arcgis.com/HHvUPZ2XuLOAJxjR/arcgis/rest/services/Metter_GeoData_View/FeatureServer/3
        layerId: 3
        geometry: polygon
        auth: none
        acreageField: null
        coverage: city-only
        fieldMap:
          Zoning: zoning
          CharaterArea: characterArea
        notes: >
          Preferred City of Metter zoning+character polygons (count 2844). Domain Zoning:
          R-2 Single-Family≈694, R-4 Multi-Family≈481, R-3 Two-Family≈409, L-1 Light
          Industrial≈147, R-5M Manufactured/Modular≈127, CBD≈124, CR Neighborhood/
          General Commercial≈103, PEH Public/Health/Education≈63, HOC≈56, plus
          HOC-1A/PW/R-0/PUD sparse. Older MetterZoning_Old/0 CODE numeric opaque
