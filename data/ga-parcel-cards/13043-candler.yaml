  - role: parcels
    name: Candler_County_Wide_View TaxParcel_26 (HOGARC)
    restUrl: https://services5.arcgis.com/HHvUPZ2XuLOAJxjR/arcgis/rest/services/Candler_County_Wide_View/FeatureServer/18
    layerId: 18
    geometry: polygon
    auth: none
    acreageField: STATEDAREA
    coverage: county-wide
    fieldMap:
      NAME: parcelId
      PARCELLABEL: parcelIdAlt
      MAP: mapSheet
      BLOCK: block
      PARCEL: parcelNumber
      SUBPARCEL: subParcel
      SEIPARCELSTREETADDRESS: situsAddress
      STATEDAREA: acreage
      CALCULATEDAREA: acreageCalculated
      CLASSIFICATION: dorCode
    notes: >
      Preferred COUNTY-WIDE parcel GEOMETRY (Heart of Georgia Altamaha RC / hogagis org
      HHvUPZ2XuLOAJxjR; Candler_County_Wide_View item d5beeecf6f0646368ed8263fa845bd5c;
      open data hogarc-hogarc.opendata.arcgis.com datasets …candler-county-wide-view).
      Live count 7151 (2026-09-24). Schema is THIN — NAME/PARCELLABEL + map/block/parcel
      parts + STATEDAREA acres + SEIPARCELSTREETADDRESS (mostly 'TBD') + geometry; NO
      owner/mailing/CURR_VAL/sale on this layer. STATEDAREA>0 ≈6610; STATEDAREA 5–150
      ≈2287 (preferred acreage band); CALCULATEDAREA unused (null on samples). Parcel id
      format e.g. "066    001" / "011    009 001" (padded NAME) — use as qPublic
      KeyValue. CountyBoundary/0 CNTYIDFP=13043 / NAME=Candler geo-verified. WGS84
      samples ~-82.222,32.385 / ~-82.243,32.376 / ~-82.228,32.367 — Candler County GA
      around Metter (~-82.06,32.40). Join CAMA via qPublic AppID=799 HTML
      KeyValue={NAME}. No CandlerCountyGA_WFS recovered. Rejected paid
      Regrid/USLandGrid/DynamoSpatial Candler extracts.
    status: usable

  - role: tax
    name: null — no CURR_VAL on TaxParcel_26; qPublic AppID=799 HTML
    restUrl: null
    layerId: null
    geometry: none
    auth: none
    acreageField: null
    coverage: unknown
    fieldMap: {}
    notes: >
      No market/assessed/taxable REST on TaxParcel_26. Assessor HTML
      qpublic.net/ga/candler → App=CandlerCountyGA / AppID=799 LayerID=11965
      (Cloudflare/bot 403 automated; public for humans). Deep-link KeyValue={NAME}.
