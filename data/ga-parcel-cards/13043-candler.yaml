  - role: sales
    name: null — no public REST sale history
    restUrl: null
    layerId: null
    geometry: none
    auth: none
    acreageField: null
    coverage: unknown
    fieldMap: {}
    notes: >
      No SALEPRICE/SALEDATE on TaxParcel_26. qPublic Sales Search AppID=799 HTML only.
      Rejected paid Regrid/ATTOM sales.
    status: gap

  - role: zoning
    name: Candler_County_Wide_View Proposed_Zoning
    restUrl: https://services5.arcgis.com/HHvUPZ2XuLOAJxjR/arcgis/rest/services/Candler_County_Wide_View/FeatureServer/19
    layerId: 19
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      MapPIN: parcelIdPin
      Zone: zoning
      ZoneType: zoningDescription
    notes: >
      Preferred county zoning polygons labeled Proposed_Zoning (count 7609; parcel-tied
      MapPIN e.g. 029-007-001 — different dash format from TaxParcel NAME "029A   015";
      prefer spatial join over string join). Domain Zone: AG-3≈4750, ME≈2253, R-1≈307,
      PU≈123, GC≈113, NC≈53, LI≈9, MHP≈1. ZoneType samples Agriculture. Title says
      "Proposed" — certify against adopted Candler zoning ordinance / PDF map before
      treating as final Euclidean; honest partial until staff confirms adoption.
      Geo-verified ~-82.11,32.35 Candler GA. City of Metter / Town of Pulaski have
      separate zoning layers.
    status: partial

  - role: flu
    name: Candler_County_Wide_View Landuse (EXTLU / FLULU)
    restUrl: https://services5.arcgis.com/HHvUPZ2XuLOAJxjR/arcgis/rest/services/Candler_County_Wide_View/FeatureServer/8
    layerId: 8
    geometry: polygon
    auth: none
    acreageField: Acreage
    coverage: county-wide
    fieldMap:
      FLULU: flu
      FLUDCA: fluDca
      EXTLU: existingLandUse
      EXTLUDCA: existingLandUseDca
      Acreage: acreage
    notes: >
      Preferred Future / existing land-use polygons (NOT parcel-tied — spatial intersect).
      Live count 7693. FLULU domain: Residential≈3639, Agriculture≈2620, Forestry≈1030,
      Commercial≈298, Public/Institutional≈53, Industrial≈42,
      Transportation/Communication/Utilities≈6, Park/Recreation/Conservation≈5. Prefer
      FLULU as flu; EXTLU as existing. Comp Plan character companion CharacterAreas/4
      (count 30; Urban Metter / Greater Metter / Rural Candler / Downtown Metter /
      Pulaski Fringe / Old Pulaski / corridors / Conservation / Industrial Park/Airport
      etc.) — planning character only.
    status: usable

  - role: other
    name: Candler_County_Wide_View CharacterAreas
    restUrl: https://services5.arcgis.com/HHvUPZ2XuLOAJxjR/arcgis/rest/services/Candler_County_Wide_View/FeatureServer/4
    layerId: 4
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      CHARACTER: characterArea
      FUTURE_CHA: characterAreaFuture
    notes: >
      Count 30 Comp Plan character polygons (Urban Metter, Greater Metter, Downtown
      Metter, Rural Candler, Pulaski Fringe, Old Pulaski, East Candler Growth Area,
      Conservation Areas, Industrial Park/Airport, Hwy corridors, Interstate
      Interchange, Crossroad Nodes, Historic Areas). Not Euclidean zoning; planning
      context / spatial join only.
    status: usable

municipalities:
