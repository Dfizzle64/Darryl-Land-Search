gaps:
  - "TaxParcel_26 is geometry+NAME/acres only — no owner/mailing/CURR_VAL/sale REST; qPublic AppID=799 HTML for CAMA (bot/CDN may 403)."
  - "SEIPARCELSTREETADDRESS mostly 'TBD' — weak situs on REST."
  - "No public REST lastSale.price/date — qPublic Sales Search HTML AppID=799."
  - "Proposed_Zoning title implies proposed — certify vs adopted ordinance; MapPIN dash format ≠ TaxParcel NAME padding (spatial join)."
  - "CALCULATEDAREA unused/null — use STATEDAREA for acres."
  - "No CandlerCountyGA_WFS recovered."
  - "Rejected paid Regrid/USLandGrid/DynamoSpatial; no emails/phones; skip water/utilities + AADT per tranche-3."

