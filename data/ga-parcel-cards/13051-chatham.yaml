gaps:
  - "EnerGov Parcel/13 (freshest weekly ownership, count 127454) has NO FairMarketValue/Total_Assessment — join Pictometry ParcelDigest or OpenData Digest 2025 on PIN for tax, or prefer Pictometry as single-layer parcel+tax."
  - "Pictometry/MapLayers service description text still says Digest Year 2021 but live Date_Updated is 2026-06-22 and Sale_YY max 2026 — trust live fields over stale description."
  - "Official zoning polygons (OpenData/4) cover all municipalities via CODE; parcel ZONEID is estimated only — spatial-join polygons for authoritative zoning."
  - "EnerGov Zoning/40 is UNICORP-only (496) despite description — do not use for Savannah/city parcels."
  - "AGOL Zoning_BND_AGOL FeatureServer/0 is Savannah-only (CODE=02, ~853) — flag partial; not full-county."
  - "FLU (OpenData/3, count 101682) is Savannah + unincorporated only — Pooler/Garden City/Port Wentworth/Bloomingdale/Tybee/Thunderbolt/Vernonburg have no public FLU REST."
  - "FLU PIN format often dashed — prefer spatial join to parcels over PIN equality."
  - "No multi-sale history array on REST; only latest sale on polygon — prior sales via qPublic AppID=1094 HTML."
  - "Total_Assessment is GA 40% assessed; no separate tax.taxableValue / exemption breakdown on these layers."
  - "Tybee folder on pub.sagis.org is empty; MPC folder has agenda/FEMA/MTP — not zoning/parcels."
  - "Rejected lookalikes: gisservices.chathamcountync.gov (Chatham County NC — wrong state); do not wire NC AssessmentInformation/Cadastral. Open-data hub sometimes surfaces unrelated AGOL — wire only pub.sagis.org / sagisservices.sagis.org verified endpoints."
  - "qPublic / schneidercorp AppID=1094 may return CDN/bot 403 to automated clients; public for humans."
  - "No emails/phones collected; no paid vendors."

