      Owner_name: ownerName
      Total_acre: acreage
    notes: >
      Preferred COUNTY-WIDE parcel GEOMETRY + owner/acres (River Valley Regional
      Commission RVRC_ELA AGOL org Ug5xGQbHsD8zuZzM — ParcelsChattCo FeatureServer/0).
      Live count 1785 (2026-09-24); Parcel_num filled 1785; Owner_name filled ≈1781;
