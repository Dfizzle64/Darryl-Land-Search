      layer. Join tax/sale via qPublic AppID=788 LayerID=11820 HTML
      (KeyValue={Parcel_num}; normalize whitespace e.g. "001    0001"). Geo-verified
      WGS84 centroids ~-84.892,32.254 / ~-84.896,32.246 / ~-84.899,32.245 /
      ~-84.907,32.244 / ~-84.721,32.296 — Chattahoochee County GA / Cusseta /
