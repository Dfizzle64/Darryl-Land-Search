layers:
  # PRIMARY — county-wide cadastral polygons (owner/mailing/situs/acres; no FMV/sales on this layer)
  - role: parcels
    name: ACC_Parcels (Athens-Clarke County Unified Government GIS — enigma.accgov.com)
    restUrl: https://enigma.accgov.com/server/rest/services/ACC_Parcels/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: ACRES
    coverage: county-wide
    fieldMap:
      PARCEL_NO: parcelId
      REALKEY: ownerKey
      OWNER_NAME: ownerName
      OWNER_ADD: mailingAddress
      CITY: mailingCity
      STATE: mailingState
      ZIP: mailingZip
      PAR_ADD: situsAddress
      HOUSE: situsNumber
      STNAM_TYP: situsStreet
      unit: situsUnit
      FLOOR: situsFloor
      ACRES: acreage
      Shape__Area: shapeAreaSqFt
      LEGAL_DESC: legalDescription
      EXEMPTION: homesteadExempt
      Neighbhd: neighborhood
      Parcel_Inf: appraiserInternalUrl
      FTR_CODE: featureCode
      ccy: changeYearSoft
      last_edited_date: lastUpdate
    notes: >
      Preferred COUNTY-WIDE parcel GEOMETRY + ownership/mailing/situs/acreage landbase
      for Clarke County / Athens-Clarke County Unified Government (ACC) — FIPS 13059,
      Athens MSA. Live count 43632 (2026-09-23). Identical twin:
      PlanningViewer2025/FeatureServer/3 (same count/schema). Hosted mirrors slightly
      behind: Hosted/ACC_PLANNING_VIEWER_2025/FeatureServer/3 count 42865;
      Hosted/ACC_PARCELS/FeatureServer/0 count 41987; AGOL org xSEULKvB31odt3XQ
      Parcel/FeatureServer/0 count 41989 (same schema — prefer enigma ACC_Parcels).
      Case_Map_ParcelsSEPT2026/MapServer/10 also 43632. Prefer ACC_Parcels FeatureServer
      (supportsPagination=true, supportsStatistics=true, maxRecordCount 2000). SR NAD 1983
      StatePlane Georgia West FIPS 1002 Feet (wkid 102667 / latestWkid 2240). ACRES>0
      ≈18551; ACRES 5–150 ≈2122 (preferred multifamily acreage band); Shape__Area
      217800–6534000 (≈5–150 ac GIS) ≈2061; ACRES=0|null ≈25081 (many condos/zero-lot /
      ROW — when ACRES=0 prefer Shape__Area/43560 for GIS acres). OWNER_NAME / PAR_ADD /
      ZIP filled ≈42951–42962; PARCEL_NO filled ≈43531; REALKEY filled ≈42962.
      Compose situs from PAR_ADD (or HOUSE + STNAM_TYP). CITY/STATE/ZIP are OWNER mailing
      (nationwide — ATHENS≈27910, WINTERVILLE≈1817, BOGART≈1619, WATKINSVILLE≈1344,
      ATLANTA≈1063, ALPHARETTA/LARGO/MARIETTA/MINNETONKA…) — never municipality filter.
      EXEMPTION soft (S0≈26580, S1≈8625, SC≈7463, SD≈161…) — homestead/exempt codes; no
      published REST legend. Parcel_Inf is INTERNAL shard URL
      (http://shard/gis/.../info.asp?key={REALKEY}) — not a public deep-link; use qPublic
      KeyValue={PARCEL_NO} instead. ccy sparsely filled (blank≈40583; years 2017–2026
      sparse) — soft change-year only. last_edited_date max ≈2026-09-23 UTC (fresh).
      Official viewers: Planning Experience
      https://experience.arcgis.com/experience/4ff11e146bac4516afe4571d3162ba10 ;
      athensclarke.maps.arcgis.com MapSeries
      appid=8f5a00e09802482b8641f2c98b19a42 ; Open Data hub
      data-athensclarke.opendata.arcgis.com. Assessor HTML: qPublic SchneiderCorp
      App=ClarkeCountyGA (qpublic.net/ga/clarke → Application.aspx?App=ClarkeCountyGA
      &Layer=Parcels&PageType=Search). Numeric AppID form also works:
      AppID=630&LayerID=11199&PageTypeID=4&PageID=4601&KeyValue={PARCEL_NO}
      (preserve internal spaces in PARCEL_NO, e.g. "172D  013A"). NOTE: Clarke County
      Board of Tax Assessors appraises ALL property in the county including Winterville
      and Bogart (not part of unified ACC government). Geo-verified WGS84 samples
      ~-83.336,33.890 (Barnett Shoals), ~-83.298,33.892 (Millstone Cir),
      ~-83.335,33.895 (Red Fox Run), ~-83.298,33.897 (Morton Rd), county centroid
      ~-83.38,33.95 — Clarke County GA / Athens MSA (NOT Clarke County VA Berryville;
      NOT Clarke County AL Grove Hill alabamagis.com/Clarke; NOT Athens OH/TX/AL
      lookalikes; NOT Oconee County GA Watkinsville as county card). Rejected ARC
      LandPro_2012 stale regional as cadastral; rejected Regrid/ATTOM/CoreLogic paid;
      rejected AGOL xSEULKvB31odt3XQ Parcel as preferred (stale count). NO tax.marketValue /
      assessedValue / lastSale on this layer — see tax/sales entries.
    status: usable

  - role: tax
