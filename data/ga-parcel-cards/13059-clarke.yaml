municipalities:
  - name: Athens-Clarke County (unified government)
    level: county
    parentFips: "13059"
    joinToCountyParcels: >
      Vast majority of ACC_Parcels IS the unified Athens-Clarke County government
      footprint (City of Athens + Clarke County consolidated 1991). Spatial:
      Clariti Municipality NAME='Athens-Clarke' OR ACC_Boundary; exclude Winterville
      and Bogart city-limit polys when needing unified-only. Soft: Addresses
      City='Athens' (~76860). Do NOT filter by mailing CITY='ATHENS' (owner mailing
      nationwide). Standing order city-over-county: ACC zoning/FLU ARE the local
      zoning/FLU for the unified area.
    layers:
      - role: zoning
        name: PlanningViewer2025 Zoning (unified ACC = local zoning)
        restUrl: https://enigma.accgov.com/server/rest/services/PlanningViewer2025/FeatureServer/14
        layerId: 14
        geometry: polygon
        auth: none
        acreageField: Acres
        coverage: county-wide
        fieldMap:
          CurrentZn: zoning
          CombinedZn: zoningCombined
          PARCEL_NO: parcelId
        notes: >
          Official ACC zoning for unified jurisdiction. Municode Title 9; Official
          Zoning Map 2024-02-06. Experience 4ff11e146bac4516afe4571d3162ba10.
        status: usable
      - role: flu
        name: PlanningViewer2025 Future Land Use
        restUrl: https://enigma.accgov.com/server/rest/services/PlanningViewer2025/FeatureServer/41
        layerId: 41
        geometry: polygon
        auth: none
        acreageField: ACRES
        coverage: county-wide
        fieldMap:
          Updated_FL: flu
          PARCEL_NO: parcelId
        notes: >
          ACC Comp Plan / 2045 FLU on public REST. Certify vs Planning Dept Comp Plan PDF.
        status: usable
      - role: parcels
        name: ACC_Parcels (same as county preferred)
        restUrl: https://enigma.accgov.com/server/rest/services/ACC_Parcels/FeatureServer/0
        layerId: 0
        geometry: polygon
        auth: none
        acreageField: ACRES
        coverage: county-wide
        fieldMap:
          PARCEL_NO: parcelId
          ACRES: acreage
          OWNER_NAME: ownerName
        notes: >
          No separate city CAMA — county Assessor layer covers unified ACC + Winterville
          + Bogart (Clarke portion).
        status: usable
    gaps:
      - "Former City of Athens and Clarke County governments consolidated 1991 into Athens-Clarke County Unified Government — no separate City of Athens GIS card required for the unified footprint."
      - "No tax.marketValue / assessedValue on REST for unified ACC — qPublic HTML only."
    status: usable

