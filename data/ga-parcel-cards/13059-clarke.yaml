    notes: >
      Preferred authoritative ACC zoning POLYGON layer (Official Zoning Map of
      Athens-Clarke County per Municode §9-3-3, dated 2024-02-06). Live count 43161
      (2026-09-23). Twin: Parcel_Zoning_Types/FeatureServer/0 (same count/schema);
