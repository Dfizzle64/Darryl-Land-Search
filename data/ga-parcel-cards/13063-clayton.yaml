    parentFips: "13063"
    joinToCountyParcels: "Spatial join / SITECITY='REX' (~6519 parcels); Rex is unincorporated — use county PEZ Zoning2025 / TaxAssessor ZONE (CVTTXCD COUNTY), not a municipal tax district"
    layers: []
    notes: >
      Rex is an unincorporated community / postal place in Clayton County, not an incorporated
      municipality (no MunicipalBoundary NAME=REX; no CVTTXDSCRP=REX). ~6519 parcels with
      SITECITY='REX' fall under COUNTY zoning (RS110/RS180/PUD/…). No separate Rex zoning/FLU REST.
      Wire county PEZ Zoning2025 + TaxAssessor/Parcels; do not expect city district codes.
    status: gap

gaps:
  - "No lastSale.qualified / deed-validity flag on parcel SALEPRICE/SALEDATE; parse strings; many SALEPRICE 0."
  - "PEZ Zoning2025 / Comp Plan 2039 FLUM cover unincorporated (~72k) only — municipal FLU not on those layers. Older Future_Land_Use_2034 is countywide but dated (2014) with many blank flu_descri."
  - "FLUM_Composite_04122024 AGOL is count 15 sample only — not county-wide; do not use as primary FLU."
  - "Municipal zoning for Morrow/Jonesboro/Riverdale/Lake City/Lovejoy on county ZONE is coarse R/C/I only; no independent city FeatureServers found. Forest Park has richer codes on the same county parcel layer."
  - "Rex is unincorporated — no city zoning REST; use county layers filtered by SITECITY or spatial place name."
  - "College Park has a small Clayton tax-district footprint (CVTTXCD=2, ~364) — prefer Fulton County sources for College Park core (out of this card's municipality list)."
  - "Character Area Comp Plan layer is mostly blank (~67k empty); only ~3.8k labeled — partial."
  - "ACERAGE field name is misspelled on source; values are doubles. Tax/sale value fields are strings."
  - "No emails/phones collected; no paid vendor (Regrid/Zoneomics/etc.) wired."
  - "Legacy internal host weba.co.clayton.ga.us:5443 / weba.claytoncountyga.gov:5443 appears in some webmap configs — prefer public https://gis.claytoncountyga.gov/ URLs."

