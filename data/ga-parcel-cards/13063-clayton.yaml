        notes: >
          Filter CVTTXCD='3'. Live city parcel count 6001 (2026-09-23). Forest Park ZONE codes
          include RS, GC, RT, RM, DM, LI, IC, PI, HI, GZ, UV — richer than other Clayton cities.
          County Forest Park Zoning Viewer experience
          (experience.arcgis.com/experience/8b16df8dd06b4ae28296ab11eb227d9a) is a filtered view of
          the same Tax Parcels; TYLER/Forest_Park_Georgia_Base_Map/MapServer/4 Tax Parcels count
          6001 is the city clip. No independent Forest Park zoning FeatureServer with different
          district polygons found — parcel ZONE is the public REST source.
        status: usable
      - role: parcels
        name: TYLER Forest Park Tax Parcels (city clip)
        restUrl: https://gis.claytoncountyga.gov/server/rest/services/TYLER/Forest_Park_Georgia_Base_Map/MapServer/4
        layerId: 4
        geometry: polygon
        auth: none
        acreageField: ACERAGE
        coverage: city-only
        fieldMap:
          PARCELID: parcelId
          ACERAGE: acreage
          OWNERNME: ownerName
          SITEADDRES: situsAddress
          ZONE: zoning
          APPRVAL: tax.marketValue
        notes: >
          Live count 6001 city-subset parcels. Prefer county TaxAssessor/Parcels/0 filtered by
          CVTTXCD for county-wide search; use this for Forest Park-scoped apps only.
        status: partial
    gaps:
      - "No Forest Park-owned independent zoning/FLU FeatureServer; FLU for city parcels not on PEZ Zoning2025 (unincorporated-only). City posts Zoning Map / Future Land Use Map as static maps/PDFs on forestparkga.gov."
      - "ForestPark_Draft_2023 AGOL layer is wards, not zoning districts."
