    level: city
    parentFips: "13063"
    joinToCountyParcels: "PARCELID attribute join (ZONE already on county TaxAssessor/Parcels); filter CVTTXCD='3' or TylerTaxParcels CVTTXDSCRP='FOREST PARK'; spatial intersect MunicipalBoundary NAME='FOREST PARK' also works"
    layers:
      - role: zoning
        name: TaxAssessor Tax Parcels ZONE (Forest Park extract)
        restUrl: https://gis.claytoncountyga.gov/server/rest/services/TaxAssessor/Parcels/MapServer/0
        layerId: 0
        geometry: polygon
        auth: none
        acreageField: ACERAGE
        coverage: city-only
        fieldMap:
          PARCELID: parcelId
          ZONE: zoning
          OVERLAY: zoningOverlay
