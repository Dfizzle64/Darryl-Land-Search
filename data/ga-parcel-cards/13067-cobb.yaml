state: GA
jurisdiction: Cobb County
fips: "13067"
level: county
markets: [Atlanta]

layers:
  # PRIMARY — county-wide nightly CAMA parcels (owner, mailing, situs, acres, FMV/ASV)
  - role: parcels
    name: taxassessorsdaily CobbParcels
    restUrl: https://gis.cobbcounty.gov/gisserver/rest/services/tax/taxassessorsdaily/MapServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: ACRES
    coverage: county-wide
    fieldMap:
      PIN: parcelId
      PARID: parcelIdAlt
      ACRES: acreage
      ACRE_DEEDED: acreageDeeded
      LAND_SQFT: landSqft
      OWNER_NAM1: ownerName
      OWNER_NAM2: ownerName2
      OWNER_ADDR: mailingAddress
      OWNER_CITY: mailingCity
      OWNER_STAT: mailingState
      OWNER_ZIP: mailingZip
      SITUS_ADDR: situsAddress
      FMV_TOTAL: tax.marketValue
      FMV_LAND: tax.landMarketValue
      FMV_BLDG: tax.improvementMarketValue
      ASV_TOTAL: tax.assessedValue
      ASV_LAND: tax.landAssessedValue
      ASV_BLDG: tax.improvementAssessedValue
      TAXDIST: taxDistrict
      CLASS: dorCode
    notes: >
      Preferred county-wide parcel+CAMA source for land search enrichment. Live count 279635
      (2026-09-23); ACRES 5–150 band ≈4859 (matches thin in-app ~4.7k footprint). Spatial
      reference Web Mercator (wkid 102100 / 3857) on this service; maxRecordCount 1000.
      Geo-verified WGS84 samples ~-84.51,34.07 (northeast Cobb / Lee Waters Rd) and
      ~-84.68,34.06 (Lake Allatoona) — Cobb County GA, Atlanta MSA NW.
      Rich nightly CAMA on polygons: owner, mailing, situs, ACRES, FMV_*/ASV_* (ASV≈40% of FMV
      on taxable samples — GA assessment), CLASS, TAXDIST. NO zoning / NO sale fields on this
      layer — join PropertySearch (Zoning/FLU/NAME) and ParcelSales table (role=sales) on PIN.
      Mirror with similar schema/count: cobbpublic/Parcels/MapServer/3 (count 283363) and
      cobbpublic/PropertySearch/MapServer/0 (geometry+jurisdiction/zoning/FLU, no tax values).
      Prefer this MapServer when a single-layer parcel+owner+tax source is needed.
      Enrichment vs thin feed: adds ownerName, mailing*, situs, tax.marketValue/assessedValue,
      dorCode (CLASS), taxDistrict — thin coverage likely geometry+acreage only.
    status: usable

  - role: parcels
    name: PropertySearch (jurisdiction + zoning + FLU attrs on polygons)
    restUrl: https://gis.cobbcounty.gov/gisserver/rest/services/cobbpublic/PropertySearch/MapServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      PIN: parcelId
      SITUS_ADDR: situsAddress
      ZIP_CODE: situsZip
      NAME: municipality
      Zoning: zoning
      Future_LandUse: flu
      TAX_DIST: taxDistrict
      CLASS: dorCode
      Land_Dist: landDistrict
      Land_Lot: landLot
    notes: >
      Live count 277710. Parcel polygons with joined NAME (city/unincorporated), Zoning, and
      Future_LandUse (coarse FLU_DESCR1 family: Residential/Commercial/…). NO owner/tax values —
      join taxassessorsdaily on PIN. Zoning IS NOT NULL ≈209275 (essentially all Unincorporated
      + Mableton; city parcels mostly null — prefer city zoning REST where available).
      NAME counts: Unincorporated 172200, Mableton 26399, Smyrna 23556, Marietta 22573,
      Kennesaw 12007, Acworth 9112, Powder Springs 7747, Austell 4086.
      Layer also exposes Comm_Phone / Comm_Email — DO NOT scrape or map (standing order).
      Useful enrichment join for municipality filter + unincorporated zoning/FLU attributes.
    status: partial

  - role: tax
    name: taxassessorsdaily CobbParcels (CAMA values on polygons)
    restUrl: https://gis.cobbcounty.gov/gisserver/rest/services/tax/taxassessorsdaily/MapServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: ACRES
    coverage: county-wide
    fieldMap:
      PIN: parcelId
      FMV_TOTAL: tax.marketValue
      FMV_LAND: tax.landMarketValue
      FMV_BLDG: tax.improvementMarketValue
      ASV_TOTAL: tax.assessedValue
      ASV_LAND: tax.landAssessedValue
      ASV_BLDG: tax.improvementAssessedValue
      TAXDIST: taxDistrict
      CLASS: dorCode
    notes: >
      Tax/CAMA values live on preferred parcel polygons (not a separate service).
      FMV_TOTAL>0 ≈278683; ASV_TOTAL>0 ≈273886. Sample ASV/FMV ≈0.40 (GA 40% assessment).
      No distinct tax.taxableValue / exemption breakdown on REST. Assessor HTML: qPublic AppID=1051.
      TAXDIST codes on this layer (e.g. 9, M, 6, 4, 3, 1, 5, 2) differ slightly from PropertySearch
      TAX_DIST (1=Acworth, 2=Austell, 3=Kennesaw, 4=Marietta, 5=Powder Springs, 6=Smyrna,
      9=Unincorporated/Mableton) — prefer PropertySearch NAME for municipality filter.
    status: usable

  - role: sales
    name: taxassessorsmapwm ParcelSales table
    restUrl: https://gis.cobbcounty.gov/gisserver/rest/services/tax/taxassessorsmapwm/MapServer/41
    layerId: 41
    geometry: none
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      PIN: parcelId
      PRICE: lastSale.price
      SALEDT: lastSale.date
      STEB: lastSale.qualified
      SALEVAL: lastSale.saleValCode
      SALETYPE: lastSale.saleType
      INSTRTYP: lastSale.instrumentType
      APRTOT: lastSale.appraisedTotal
      ASR: lastSale.assessmentSalesRatio
      NBHD: neighborhood
    notes: >
      Non-spatial multi-sale history table. Live count 938727; PRICE>0 ≈681526; PRICE>0 AND
      STEB='FMV' ≈390619 (2026-09-23). Join to parcels on PIN; take latest SALEDT per PIN as
      lastSale. Prefer STEB='FMV' as arms-length / fair-market signal for lastSale.qualified
      (other STEB codes are numeric reject/condition codes). SALEVAL domain includes 00, 08, LP,
      MC, FC, 17, RE, etc. — not a simple Q/U flag. SALETYPE 1/2/3 sparse. maxRecordCount 1000.
      No geometry — attribute join only. Major enrichment vs thin feed (sales absent on parcel layer).
    status: usable

  - role: zoning
    name: CobbZoningData Zoning Districts (unincorporated + Mableton footprint)
    restUrl: https://gis.cobbcounty.gov/gisserver/rest/services/comdev/CobbZoningData/MapServer/6
    layerId: 6
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      ZoningDistrict: zoning
      ZoningDistrictLabel: zoningLabel
      PetitionNumber: zoningPetition
      YearPetitionNumber: zoningPetitionYear
      StipulationsFlag: zoningStipulationsFlag
      VerticalZoning: zoningVertical
      LandDistrict: landDistrict
      LandLot: landLot
    notes: >
      Preferred county zoning POLYGON layer (Community Development). Live count 8468.
      SR NAD 1983 StatePlane Georgia West FIPS 1002 Feet (102667/2240); maxRecordCount 2000.
      Official for unincorporated Cobb; Mableton (new city) still largely on this county schema
      (PropertySearch Zoning filled for all 26399 Mableton parcels). City parcels (Marietta,
      Smyrna, Kennesaw, etc.) are mostly outside this layer — use city REST (see municipalities).
      Equivalent FeatureServer: cobbpublic/cobbzoningdatawm/FeatureServer/6 (same count 8468).
      Spatial-join to parcels (no PIN on this layer). Parcel attr Zoning on PropertySearch is
      alternate for unincorporated/Mableton. Lookup table ZZONINGINFORMATION
      (planningzoning/MapServer/20, 53 district defs + municode links) for district names.
      Zoning District Other layer 7 count 590 (overlays/other).
    status: usable

  - role: flu
    name: Future_Land_Use (county FLUM)
    restUrl: https://gis.cobbcounty.gov/gisserver/rest/services/comdev/Future_Land_Use/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: ACREAGE
    coverage: county-wide
    fieldMap:
      FLU_ABBR2: flu
      FLU_DESCR2: fluDescription
      FLU_DESCR1: fluCategory
      FLU_CODE1: fluCode1
      FLU_CODE2: fluCode2
      FLU_ABBR3: fluAbbr3
      ACREAGE: acreage
    notes: >
      County Future Land Use Map polygons. Live count 2849. Prefer FLU_ABBR2 (LDR, PRC, PI, NAC,
      RAC, MDR, CAC, VLDR, TCU, HDR, RR, IC, …) over coarse Future_LandUse string on PropertySearch.
      Spatial-join to parcels. Covers unincorporated + Mableton well; city FLU should prefer
      city layers (Marietta FLU field, Smyrna FLU_2040, Powder Springs Character Areas, Kennesaw FLU).
      Mirror MapServer: comdev/Future_Land_Use/MapServer/0; also planningzoning/MapServer/0.
    status: usable

  - role: other
    name: existingLanduse (parcel-tied existing land use)
    restUrl: https://gis.cobbcounty.gov/gisserver/rest/services/cobbpublic/existingLanduse/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: ACRE_CALC
    coverage: county-wide
    fieldMap:
      PIN: parcelId
      CODE: landUseCode
      DESCRIPTION: landUseDescription
      LBCS: lbcs
      CLASS: dorCode
      ACRE_CALC: acreage
    notes: >
      Live count 268316. PIN-joinable existing land use. CODE domain: RES≈160053, CITY≈100496
      (city stub — no detailed class), COM, CIV, PRC, TCU, MX, IND. Prefer for unincorporated
      land-use context; CITY-coded rows are not informative. Not FLU.
    status: partial

  - role: other
    name: openData Cobb_Cities / comdev City_Limit
    restUrl: https://gis.cobbcounty.gov/gisserver/rest/services/openData/Cobb_Cities/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      NAME: municipality
    notes: >
      Live count 7 city polygons: Austell, Kennesaw, Marietta, Acworth, Powder Springs, Smyrna,
      Mableton. Prefer comdev/City_Limit/FeatureServer/3 for CityCode (AU/KE/MA/AC/PS/SM/M/CC)
      plus Unincorporated (CityCode=CC) — count 8. City-poly↔parcel join = spatial intersect or
      PropertySearch NAME / taxassessorsdaily TAXDIST decode.
    status: usable

