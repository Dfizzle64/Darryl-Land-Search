gaps:
  - "taxassessorsdaily parcels have rich owner/tax but NO zoning and NO sales — must join PropertySearch (Zoning/FLU/NAME) and ParcelSales (/41) on PIN for full enrichment."
  - "County Zoning Districts (8468) + PropertySearch Zoning cover unincorporated + Mableton; Marietta/Smyrna/Kennesaw/Powder Springs have city REST; Acworth and Austell lack public city zoning/FLU REST (gap)."
  - "PropertySearch Future_LandUse is coarse category (Residential/Commercial/…); prefer comdev Future_Land_Use FLU_ABBR2 polygons or city FLU layers for plan codes."
  - "existingLanduse CODE='CITY' (~100k) is a stub for municipal parcels — not a real land-use class."
  - "ParcelSales STEB='FMV' is the practical qualified filter; no Q/U Sale_Quality field like Chatham. Multi-row history per PIN — take max(SALEDT)."
  - "No distinct tax.taxableValue; ASV is GA 40% assessed. Exempt parcels often ASV_TOTAL=0 with FMV>0."
  - "PropertySearch exposes Comm_Phone/Comm_Email — do not collect. No paid vendors."
  - "On-prem Marietta MapServers (ExternalViewer2/InternalViewer) not started; gis.smyrnaga.gov 503; cobbgis.org connection refused — use verified AGOL / gis.cobbcounty.gov endpoints."
  - "MabletonTownCenter_FLU count 0; named Powder Springs FLU/FeatureServer/0 Invalid URL — use alternates documented above."
  - "Austell spans Cobb+Douglas — this card is Cobb-side only."
  - "Rejected lookalikes: maps.townofsmyrna.org (Smyrna TN ~-86.49,36.02); maps.cob.org (City of Boulder CO Grp_Land); geohub.mariettaga.gov federated Sampson County NC Zoning and Orange County VA Zoning; enigma.accgov.com Parcel_Zoning_Types (Athens-Clarke, not Austell/Acworth)."
  - "qPublic AppID=1051 may CDN/bot-403 automated clients; public for humans. County still sells countywide parcel shapefile commercially — REST used here is free public query."
  - "Enrichment vs thin in-app (~4.7k in 5–150ac): thin likely geometry+acreage; this card adds owner/mailing/situs, FMV/ASV tax, CLASS, municipality NAME, ParcelSales history, county+city zoning, FLU joins."

