gaps:
  - "Owner name / mailing ADDRESS1/CITY/STATE/ZIP fields ABSENT on CoffeeBackgroundLayers/2 — owner REST gap; qPublic AppID=737 HTML for owner/mailing."
  - "SALE_VAL/SALELAND*/SALEIMP*>0 = 0 — no REST lastSale.price/date; qPublic AppID=737 Sales Search HTML only."
  - "MAVCURR>0 = 0 — no usable assessedValue on REST; prefer CURR_VAL market + qPublic HTML for assessed/taxable."
  - "No Euclidean zoning FeatureServer — parcel ZONINGCODE only; county zoning PDF on coffeecounty-ga.gov."
  - "No public FLU / character-area FeatureServer on SGRC Coffee folder."
  - "BackgroundLayers/2 maxRecordCount 1000 — page via resultOffset / spatial envelopes."
  - "TAXDISTRIC codes lack published REST name legend — soft map 01=unincorp / 02=Douglas / 03=Nicholls / 04=Broxton / 05=Ambrose / 06=Douglas-special; prefer Cities/4 spatial."
