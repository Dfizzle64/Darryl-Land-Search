gaps:
  - "No separate assessedValue/MAV on LandData REST — prefer Tax_Total_Value market; qPublic AppID=1261 for assessed/taxable when needed."
  - "Tax_SaleAmount is single last-sale only — multi-sale history via qPublic Sales Search HTML."
  - "Zoning PARCEL_ID/AKPAR often blank — spatial join to parcels required."
  - "AGOL Parcels_Columbia_County_GA is geometry-thin (PIN/Calc_Acre) — do not prefer over LandData/1003."
  - "Evans/Martinez are CDPs — CityBoundaries only Grovetown+Harlem; mailing CITY never municipality filter."
  - "LandData maxRecordCount 2000 — page via resultOffset / spatial envelopes."
  - "REJECTED wrong-geography: Columbia County WA TaxParcels (zq1Ay6bxXC1T1CBk Dayton WA); Columbia SC Richland lookalikes; paid Regrid/ATTOM."
  - "Skip PublicAccess/WaterDistribution / WaterConveyance / utilities; no AADT; no emails/phones."

