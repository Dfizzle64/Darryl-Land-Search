      mailing CITY='EVANS' is postal only.
    layers:
      - role: zoning
        name: County Zoning + Evans Town Center Overlay
        restUrl: https://gis.columbiacountyga.gov/host/rest/services/PublicAccess/Planning/FeatureServer/79
        layerId: 79
        geometry: polygon
        auth: none
        acreageField: ACRES
        coverage: city-only
