gaps:
  - "Preferred WinGapParcels TotalAcres filled on only 27695 / 65382 (5–150 = 8591). Prefer PPV acres (GIS; filled 64060) join on parcel_id, or derive Shape.STArea()/43560 (wkid 102667 feet) when deeded acres null."
  - "No public REST lastSale.price/date/qualified — WinGap/PPV/TaxParcels have no sale fields; Newnan Sale_Notes is free text only."
  - "No public REST tax.assessedValue/taxableValue county-wide — CurrentValue is FMV; Newnan City_Parcels AV is city-only assessed."
  - "County FLU REST gap — LandDevelopmentGuidanceSystem2020 is an LDGS scoring layer (Service/Major_Rd/Employment/Retail points), NOT future land use. Newnan Future_Land_Use is city-only."
  - "County Zoning (~92% area, 669 dissolved) is spatial-join; inside Newnan must prefer City_Parcels zoning. Senoia/Grantville/Moreland/Turin/Sharpsburg/Haralson/Palmetto/Chattahoochee Hills official city zoning REST gap."
  - "Addresses/SiteAddress CITY and PPV streetaddress City are postal — municipality filter = TaxDistrict / PPV municipality / Municipalities spatial only (SHARPSBURG postal ≈8886 vs incorporated ≈201)."
  - "Hub and Editable folders on coweta-gis-web.coweta.ga.us return Token Required (499) — public path is root MapServers + Hosted FeatureServers + AGOL AaPyNbrJpNGryRqh."
  - "qPublic AppID=704 LayerID=11412 may CDN/bot-403 automated clients; public for humans. Do not collect emails/phones."
  - "Rejected lookalikes: Coweta County OK (~-97.0,36.0); Haralson County GA (FIPS 13143) vs Town of Haralson in Coweta; Atlanta Regional Commission LandPro_2012 (Ug5xGQbHsD8zuZzM); Regrid/paid statewide extracts; token-locked Hub/Editable stubs; Newnan Utilities Landbase as 'city zoning' (it is county-wide CAMA extract)."
  - "Palmetto and Chattahoochee Hills are Fulton-primary cities with Coweta fringe — do not treat as full Coweta municipalities for zoning."
  - "Enrichment vs thin in-app: full county 65382 geometry+PIN+owner/mailing/situs parts+FMV+taxDist; GIS acres via PPV; county Zoning districts; Newnan city zoning+FLU+AV; other cities geography-only; sales/county-FLU/county-assessed remain gap/HTML."

