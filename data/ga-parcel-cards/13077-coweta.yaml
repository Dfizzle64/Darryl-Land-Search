    notes: >
      Preferred county-wide parcel GEOMETRY + CAMA source (on-prem MapServer). Live
      count 65382 (2026-09-23). SR NAD 1983 StatePlane Georgia West FIPS 1002 Feet
      (102667/2240); maxRecordCount default. Geo-verified WGS84 samples from twin
      TaxParcels ~-84.855,33.191 (LL 2059 / south-central), zoning samples
      ~-84.979,33.339 and ~-84.930,33.294 — Coweta County GA, Atlanta MSA southwest
      (NOT Coweta OK ~-97.0,36.0; any non-GA Coweta). OwnerName filled 65382;
      CurrentValue>0 ≈65381; TotalAcres>0 = 27695; TotalAcres 5–150 = 8591 (sparse
      deeded acres — derive GIS acres = Shape.STArea()/43560 when TotalAcres null/0).
      StreetAddress/City/State/Zip are MAILING (P.O. BOX / out-of-county samples);
      situs = HouseNumber + StreetName + StreetType (HouseNumber=0 common on vacant).
      TaxDistrict decode live (via PPV twin groupBy): COUNTY 01 (UNINCORPORATED)≈43749,
      NEWNAN 08 (ANNEX)≈8096, NEWNAN 02≈6734, SENOIA 09 (ANNEX)≈1853, GRANTVILLE 04≈1444,
