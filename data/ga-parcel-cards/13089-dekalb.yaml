  - role: parcels
    name: Tax_Parcels_Assessment_View Tax Parcels_ASMT
    restUrl: https://dcgis.dekalbcountyga.gov/mapping/rest/services/Tax_Parcels_Assessment_View/FeatureServer/2
    layerId: 2
    geometry: polygon
    auth: none
    acreageField: ACREAGE
    coverage: county-wide
    fieldMap:
      PARCELID: parcelId
      OWNERNME1: ownerName
      OWNERNME2: ownerName2
      PSTLADDRESS: mailingAddress
      PSTLCITY: mailingCity
      PSTLSTATE: mailingState
      PSTLZIP5: mailingZip
      SITEADDRESS: situsAddress
      CITY: situsCity
      ZIP: situsZip
      ACREAGE: acreage
      TOTAPR1: tax.marketValue
      CNTASSDVAL: tax.assessedValue
      LAND_VALUE: tax.landMarketValue
      BUILD_VALUE: tax.improvementMarketValue
      LNDVALUE: tax.landValueAlt
      ZONING: zoning
      LANDUSE: flu
      CVTTXCD: taxDistrict
      CVTTXDSCRP: municipality
      CLASSDSCRP: dorCode
      TAX_YEAR: tax.year
    notes: >
      Preferred county-wide parcel+CAMA source for enrichment. Live count 246146 (2026-09-23);
      ACREAGE 5–150 band = 3410 (matches thin in-app ~3.4k footprint). SR Web Mercator
      (102100/3857); maxRecordCount 2000. Geo-verified WGS84 samples ~-84.229,33.639 (Ellenwood /
      unincorporated south DeKalb, Amsler Rd) and city layers ~-84.26..-84.34, 33.64..33.94 — DeKalb
      County GA, Atlanta MSA east core (NOT DeKalb AL/IL/IN/TN).
      Rich CAMA on polygons: owner, mailing, SITEADDRESS situs string (also ADDRESS_NUMBER+FULL_STREET_NAME parts),
      ACREAGE, TOTAPR1 (FMV), CNTASSDVAL (GA ~40% assessed; live ratio ≈0.40), LAND_VALUE /
      BUILD_VALUE, ZONING, LANDUSE, CVTTXDSCRP municipality/tax district, TAX_YEAR≈2026.
      CNTTXBLVAL field exists but live >0 count = 0 — no tax.taxableValue. NO sale price/date on
      this or any county REST layer discovered (sales gap — HTML Property Appraisal / Tax
      Commissioner only).
      ZONING non-null ≈139783 — essentially UNINCORPORATED (≈137993/138256); city tax districts
      nearly all null on parcel attr — prefer city REST (municipalities). LANDUSE attr similarly
      unincorporated-heavy. CITY/ZIP are postal/CDP (e.g. Ellenwood) — municipality filter =
      CVTTXDSCRP or Municipal_Boundary spatial join (normalize ANNEX/TAD/CID variants).
      Mirrors (same count 246146): TaxParcels/FeatureServer/0 (has SITEADDRESS single situs string
      + ACREAGE/TOTAPR1/CNTASSDVAL/ZONING — good situs alternate), PropertyAppraisal/
      Parcels_IASWorld/FeatureServer/0, iasWorldParcels/MapServer/0, hosted Parcels/MapServer/0
      (STATEDAREA string; avoid for acreage). hosted Tax_Parcels/FeatureServer/0 count 245816
      lacks ACREAGE/TOTAPR1 — do not prefer.
      Enrichment vs thin feed (~3.4k): thin ≈ geometry+acreage in 5–150 band; this card adds full
      county 246146, owner/mailing/situs, FMV/ASV/land/improvement, municipality, unincorporated
      zoning/FLU attrs, plus city zoning/FLU joins.
    status: usable

