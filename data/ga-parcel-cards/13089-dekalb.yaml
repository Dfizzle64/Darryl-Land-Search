  - "County parcel ZONING + LANDUSE attrs cover unincorporated almost completely; city tax districts nearly all null — must join city REST (Decatur, Brookhaven, Dunwoody, Doraville, Tucker, Stonecrest) or mark gap (Chamblee zoning broken; Stone Mountain, Avondale Estates, Clarkston, Lithonia, Pine Lake)."
  - "Chamblee TaxParcelZoning MapServer broken (500) — FLU parcels usable; current zoning gap."
  - "Atlanta LotsWithZoning is citywide (Fulton+DeKalb); filter to DeKalb footprint — do not ingest full 151k as DeKalb."
  - "CITY / SITEADDRESS city tokens are postal/CDP (e.g. Ellenwood); municipality filter = CVTTXDSCRP or Municipal_Boundary spatial."
  - "CVTTXDSCRP includes ANNEX / TAD / CID variants — normalize when building municipality facets."
  - "County LandUse LANDUSEDESC often null; use LANDUSECODE. Character-area FLU for Brookhaven/Dunwoody is coarse."
  - "Assessment_View includes SITEADDRESS; TaxParcels mirror also carries SITEADDRESS."
  - "Do not collect emails/phones. No paid vendors. qPublic AppID=940 bot-403 from research box; prefer propertyappraisal.dekalbcountyga.gov / publicaccess.dekalbtax.org."
  - "Enrichment vs thin in-app (~3.4k): thin ≈ ACREAGE 5–150 band (3410); full county 246146 with owner/mailing/situs, TOTAPR1/CNTASSDVAL/LAND_VALUE/BUILD_VALUE, CVTTXDSCRP, unincorporated zoning/FLU, city zoning/FLU joins."
  - "Rejected lookalikes: maps.decaturil.gov Public/zoning (Decatur IL ~-88.98,39.82); City_Parcel_Zoning_Public AGOL Yx1h0qHJ9wIpQWuU (Ontario ~-79.21,43.13); other DeKalb counties AL/IL/IN/TN; gis.dekalbcounty.org TLS fail — official host dcgis.dekalbcountyga.gov."

