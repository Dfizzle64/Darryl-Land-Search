    layerId: 0
    geometry: polygon
    auth: none
    acreageField: CalcAcre
    coverage: county-wide
    fieldMap:
      ParcelNum: parcelId
      Name: ownerName
      Address: situsAddress
      StNumber: situsNumber
      StDirection: situsStreetDir
      StName: situsStreet
      STSuffix: situsStreetType
      SiteCity: situsCity
      SiteState: situsState
      SiteZip: situsZip
      MailAddress1: mailingAddress
      MailAddress2: mailingAddress2
      MailCity: mailingCity
      MailState: mailingState
      MailZip: mailingZip
      CalcAcre: acreage
      TotalAcerage: acreageDeed
      Jurisdiction: municipalityFlag
      District: taxDistrict
      Legal: legalDescription
      Deed: deedRef
      Plat: platRef
      YearBuiltInt: yearBuilt
      Zone_: zoningAttr
    notes: >
      Preferred COUNTY-WIDE parcel GEOMETRY + owner/situs/acres (City of Albany / Dougherty
      County AGOL org VKHi8CC6pMIyYUIs — owner jkendall8 "Dougherty County Land Parcels
      Dataset" Parcels_Public_View FeatureServer layer 0 "Parcels "). Live count 38007
      (2026-09-24). SR NAD 1983 StatePlane Georgia West FIPS 1002 Feet (102667/2240).
      maxRecordCount 2000 — page via resultOffset / spatial envelopes. Name filled ≈37567;
      CalcAcre>0 ≈37964; CalcAcre 5–150 ≈2134; Address filled ≈37970; MailCity filled ≈37562;
      MailAddress1 filled only ≈3250 (many mail streets blank — fall back to Address when
      MailAddress1 empty; MailCity/State/Zip still useful). Jurisdiction CITY≈28408 /
      COUNTY≈9589 — soft municipality flag, prefer spatial Albany city poly for filter;
      mailing CITY never sole municipality filter. No CURR_VAL/ASSES_VAL on this layer —
      join TaxMain_DataMap table on ParcelNum=PARCEL_NO for tax; sales via
      TaxData_SaleInfo_Parcel. Official human GIS: geohub.albanyga.gov + Albany-Dougherty
      GIS Web Browser albgis.maps.arcgis.com View appid=96a3a31e4a8c4dc6b59153644906936c.
      Assessor qPublic App=DoughertyCountyGA (dougherty.ga.us Board of Assessors;
      qpublic.net/ga/dougherty redirects to county). Internal ParcelMap on
      gisappserv.dougherty.ga.us:6443 not publicly resolvable from research box — prefer
      AGOL Parcels_Public_View. GEO-VERIFY GEORGIA: WGS84 samples ~-84.004,31.649 /
      ~-84.006,31.646 (Cordele Rd) / TaxData ~-84.131,31.566 — Dougherty County GA / Albany
      (Census TIGERweb GEOID 13095 CENTLAT +31.5334096 CENTLON -084.2162561). REJECT East
      Baton Rouge "Property Ownership Lookup Tool" experience 35130b09abe44b3e929ed52220e928b3
      (owner EBRGIS — wrong geography). REJECT Dougherty ND / MN lookalikes; paid
      Regrid/ATTOM/LeadCruncher. Skip utilities/AADT; no emails/phones collected.
    status: usable

  - role: tax
    name: TaxMain_DataMap WinGAP vETT_TaxMain (table join) + TaxData CURR_VAL
    restUrl: https://services6.arcgis.com/VKHi8CC6pMIyYUIs/arcgis/rest/services/TaxMain_DataMap/FeatureServer/0
    layerId: 0
    geometry: none
    auth: none
    acreageField: TOTALACRES
    coverage: county-wide
    fieldMap:
      PARCEL_NO: parcelId
      OWNER_NAME: ownerName
      CURR_VAL: tax.marketValue
      ASSES_VAL: tax.assessedValue
      PREV_VAL: tax.priorMarketValue
      LandValue: tax.landValue
      TOTALACRES: acreage
      ADDRESS: situsAddress
      HOUSE_NO: situsNumber
      STREET_NAM: situsStreet
      STREET_TYPE: situsStreetType
      CITY: situsCity
      PROP_ZIP: situsZip
      PostalAddress: mailingAddress
      PostalCity: mailingCity
      PostalState: mailingState
      PostalZip5: mailingZip
      ZONE_CODE: zoning
      TAXDISTRIC: taxDistrict
      PROPERTY_CLASS: dorCode
    notes: >
      Preferred tax/CAMA TABLE (no geometry) — WinGAP WINGAP_GIS.dbo.vETT_TaxMain on
      TaxMain_DataMap FeatureServer table 0 (owner mcraig_albgis). Live count 37836;
      CURR_VAL>0 ≈37820; ASSES_VAL>0 ≈37820; OWNER_NAME filled 37836. Join PARCEL_NO →
      Parcels_Public_View.ParcelNum for polygons. Companion TaxData_SaleInfo_Parcel also
