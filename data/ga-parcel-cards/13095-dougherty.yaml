      Assessor HTML deep-link KeyValue={ParcelNum}: Application.aspx?App=DoughertyCountyGA
      &Layer=Parcels&PageType=Report&KeyValue={ParcelNum}.
    status: usable

  - role: sales
    name: TaxData_SaleInfo_Parcel (sale polygons)
    restUrl: https://services6.arcgis.com/VKHi8CC6pMIyYUIs/arcgis/rest/services/TaxData_SaleInfo_Parcel/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: LNDACRES
    coverage: sample
    fieldMap:
      ParcelNum: parcelId
      PARCEL_NO: parcelIdAlt
      SALESPR: lastSale.price
      NET_SALESPR: lastSale.netPrice
      SALEDATE: lastSale.date
      CURR_VAL: tax.marketValue
      LNDACRES: acreage
      SALE_TYPE: lastSale.type
      RSN_DESCRIPT: lastSale.reason
      USEDAS_COD: dorCode
      DESCRIPT: landUseDescription
    notes: >
      Preferred public REST last-sale polygons (count 9037; SALESPR>0 =9037 — sales-analysis
      subset of county, not every parcel). SALEDATE epoch ms. Multi-sale history / full
      digest still via qPublic Sales Search HTML App=DoughertyCountyGA. Rejected paid
      Regrid/ATTOM sales extracts. Geo samples ~-84.13,31.57 Albany GA.
    status: usable

  - role: zoning
    name: Current_Zoning_Information — Zoning Districts (2026)
    restUrl: https://services6.arcgis.com/VKHi8CC6pMIyYUIs/arcgis/rest/services/Current_Zoning_Information/FeatureServer/1
    layerId: 1
    geometry: polygon
    auth: none
    acreageField: ACRES
    coverage: county-wide
    fieldMap:
      ZONE: zoning
      DISTRICT: zoningDistrictName
      OLDZONE: zoningPrior
      ZONE1: zoningAlt
      ACRES: acreage
      CASE_: zoningCase
      ORD_: zoningOrdinance
      STNUM: situsNumber
      STNAME: situsStreet
      STSUF: situsStreetType
    notes: >
      Preferred Euclidean zoning polygons (layer id 1 "Zoning Districts (2026)"; count 1876).
      ZONE domain includes AG, R-1/R-2/R-3/R-E/R-MHP, C-1..C-8, M-1/M-2, FH (+ conditional
      *c variants). DISTRICT human labels (Agricultural, Neighborhood Business, Single Family
      Residential, …). Spatial join onto Parcels_Public_View. Geo ~-84.0,31.65 Dougherty GA.
    status: usable

  - role: flu
    name: Land_Use_Layers — 2026 Future Land Use (FDM) + Character Areas
    restUrl: https://services3.arcgis.com/7ScJ8q0HhcQyXcHe/arcgis/rest/services/Land_Use_Layers/FeatureServer/2
    layerId: 2
    geometry: polygon
    auth: none
    acreageField: CALC_ACRE
    coverage: county-wide
    fieldMap:
      PARCEL_NUM: parcelId
      FDM: flu
      NAME: ownerName
      TOTAL_ACRE: acreageDeed
      CALC_ACRE: acreage
      STNUM: situsNumber
      STNAME: situsStreet
      STSUF: situsStreetType
    notes: >
      Preferred Future Land Use from 2026 Albany/Dougherty Comp Plan Update GIS Data (GMC)
      AGOL org 7ScJ8q0HhcQyXcHe Land_Use_Layers FeatureServer layer 2 "2026 Future Land Use"
      (count 37066). FDM sample "Agricultural/Forestry". Companion layer 1 "2026 Character
