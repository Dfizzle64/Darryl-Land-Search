    notes: >
      Preferred COUNTY-WIDE parcel GEOMETRY + WinGAP/CAMA (Southern Georgia Regional
      Commission SGRC arcgis — Echols/echols_parcels MapServer layer 0 "Parcel Boundaries").
      Live count 2200 (2026-09-24). Companion annotation layers /1 Owner Name + /2 Parcel
      Number (same polygons — prefer /0). SR NAD 1983 StatePlane Georgia West FIPS 1002
      Feet (wkid 102667 / latestWkid 2240). maxRecordCount 1000 — page via resultOffset /
      spatial envelopes. TOTALACRES 5–150 = 633; CURR_VAL>0 = 2160; LASTNAME filled = 2160;
      HOUSE_NO>0 = 1357; ZONINGCODE non-blank ≈4 (sparse); ZONING usable non-'000' = 0;
      MAVCURR>0 = 0 (assessed REST gap); SALE_VAL>0 = 0 / SALELAND1>0 = 0 (sales REST gap).
      FMVRES>0 = 1200. digclass: R≈1443, V≈391, A≈131, J≈113, E≈62, C≈19, I≈1 (+ blank≈40).
      TAXDISTRIC soft: 01≈majority / blank — Echols has no incorporated cities (Statenville
      unincorporated county seat; Census "Echols County consolidated government"). CITY /
      STATE / ZIP_1 are OWNER mailing (Valdosta / Lake Park / Stockton / Statenville / …)
      — never municipality filter. Compose situsAddress from HOUSE_NO + STDIRECT +
      STREET_NAM + STTYPE when HOUSE_NO>0. No qPub_Link field on this REST — deep-link
      KeyValue={PARCEL_NO} via qPublic App=EcholsCountyGA / AppID=765 LayerID=11801.
      Schema WATER/SEWER/GAS/ELECTRICTY/ROADSTREET/ROADCLASS — DO NOT collect (skip
      utilities+AADT). APPRAISER/APPRNAME — DO NOT collect as PII. alma Echols folder
      empty (Echols_Parcels 500 not found); prefer arcgis Echols/echols_parcels.
      Geo-verified WGS84 samples ~-82.944,30.861 / ~-83.006,30.825 (N Echols / Lake Park
