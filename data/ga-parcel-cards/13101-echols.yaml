  - "Parcel ZONINGCODE sparse (≈4); ZONING mostly '000' — no Euclidean zoning REST."
  - "No public FLU / character-area FeatureServer on SGRC Echols folder."
  - "echols_parcels maxRecordCount 1000 — page via resultOffset / spatial envelopes."
  - "No incorporated municipalities in Echols — Statenville unincorporated county seat; TAXDISTRIC soft '01'/blank only."
  - "Parcel mailing CITY/STATE/ZIP_1 nationwide ring (Valdosta/Lake Park/…) — never municipality filter."
  - "alma Echols folder empty (Echols_Parcels 500); prefer sgrcmaps.com/arcgis Echols/echols_parcels."
  - "EcholsCountyGA_WFS 404; qPublic Application.aspx Cloudflare/bot 403 automated; qpublic.net/ga/echols HTML path public for humans."
  - "sgrcmaps.com/Echols/ viewer 404 — human GIS via qPublic Maps AppID=765 LayerID=11801."
  - "Rejected lookalikes / non-preferred: paid Regrid/ATTOM/DynamoSpatial/ParcelVision; FL Jennings town in bbox; alma empty twin."
  - "Schema WATER/SEWER/GAS/ELECTRICTY/ROAD* + APPRAISER/APPRNAME — DO NOT collect (skip utilities+AADT + PII); no emails/phones."

