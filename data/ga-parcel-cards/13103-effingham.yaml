      SUBd_name: subdivision
      PropRecCar: appraiserDeepLink
      WPIN: webPin
    notes: >
      Preferred COUNTY-WIDE parcel GEOMETRY + CAMA landbase (official Effingham County GIS
      AGOL org 9scQWTgPOi3GxJRr / EffinghamCounty.maps.arcgis.com; owner Effingham_GIS;
      Interactive Web Map 2026 item 297c47df37ed4453bff2e43d10f83b36 parcels layer).
      Live count 34248 (2026-09-23). SR Web Mercator 102100/3857. TOTALACRES filled 34248;
      TOTALACRES 5–150 ≈6130 (preferred acreage filter); ACRES (shape) 5–150 ≈5777 — prefer
      TOTALACRES for app band. LASTNAME / PARCEL_NO / PropRecCar filled ≈34248; StreetAdd
      filled; SalesDate filled ≈33154; ZCODE nonempty ≈34230; esttax>0 ≈32748. NO SALEPRICE /
      CURR_VAL / FMV on this layer — join ParcelUpdate or FLUM_20240903_BOC_APPR_2 on
      PARCEL_NO for lastSale.price + tax.marketValue (see sales/tax layers). Zoning is
      PARCEL-ATTRIBUTED (ZCODE/zoningcode); Interactive Map "Zoning" group points at this
      same FeatureServer/0 — no separate Euclidean zoning polygon service found. ZCODE
      domain: AR-1≈11004, R-1≈9228, PD≈3356, AR-2≈3054, R-2≈1904, R-6≈1148, R-3≈880,
      R-5≈823, PUD≈648, R-4≈525, B-2≈415, I-1≈264, B-1≈179, B-3≈167, PD-R≈117, M-6≈109,
      DT≈97, plus OC/R-1-A/RR/C-1/LI/SPLIT/AR-3/C-2/CP/HI/C-3/R-8/I-G/M-H/PD-MR/M-U/FH/GC
      rare. TAXDISTRIC: 01≈25951 unincorporated (preferred county filter), 02≈1657 Guyton,
      03≈4505 Rincon, 04≈1530 Springfield, 05≈61 / 06≈108 / 07≈205 special pockets —
      prefer spatial County_Municipal_Boundaries for city membership (mailing city is NOT
      municipality; Bloomingdale/Savannah/Meldrim/Atlanta appear as postal). OverlayDis
      filled sparsely ≈221. PropRecCar deep-link:
      https://qpublic.schneidercorp.com/Application.aspx?AppID=666&LayerID=11348&PageTypeID=4&PageID=4716&KeyValue={PARCEL_NO}
      (App=EffinghamCountyGA name form also works). last_edi_1 max ≈2026-09-22 UTC;
      EDIT_DATE max ≈2024-10-30 UTC. Geo-verified WGS84 samples ~-81.383,32.103
      (PARCEL_NO 03320008 Old River Rd / Bloomingdale postal), ~-81.330,32.161 (Guyton
      area), ~-81.22,32.26 (Rincon), ~-81.26,32.33 (Springfield) — Effingham County GA NW
      of Savannah (~-81.3,32.4). REJECT Effingham County IL Magnasoft experience
      fb79291577184609b770e5d885eb50a5 / services.arcgis.com/4YineAQdtmx0tv46 and
      vj0V9Lal6oiz0YXp Features (~-88.8,39.2 Beecher City IL — wrong state); REJECT paid
      USLandGrid/Regrid/ATTOM; REJECT stale ARC LandPro as cadastral; REJECT SAGIS/Chatham
      ParcelDigest as Effingham parcels (adjacent Chatham only). Alternate thinner/older:
      ParcelUpdate (count 28867, has SALEPRICE+CURR_VAL+fmv*); Parcels2020; Parcel11819.
      Instant media app b7fb6067b5be476183e7c2a988f3e484; county GIS pages
