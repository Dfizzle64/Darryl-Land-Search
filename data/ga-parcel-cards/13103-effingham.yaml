gaps:
  - "Parcels2024 (preferred, 34248) has SalesDate but NO SALEPRICE / CURR_VAL / FMV — join ParcelUpdate (28867; SALEPRICE>0≈16137, CURR_VAL>0≈28685) or FLUM_20240903_BOC_APPR_2 (SALEPRICE>0≈14176, CURR_VAL>0≈24396) on PARCEL_NO; newer parcels may lack price/value join."
  - "No tax.assessedValue / taxableValue REST field — esttax on parcels; CURR_VAL market-style on ParcelUpdate/FLUM only; digest detail on qPublic HTML AppID=666."
  - "No separate Euclidean zoning polygon FeatureServer — zoning is parcel-attributed ZCODE on Parcels2024 (official map wiring); city PDFs authoritative inside Rincon/Guyton/Springfield when they diverge."
  - "Rincon / Guyton / Springfield have no public city zoning or FLU FeatureServers — PDF (Rincon UDO 2025 / Springfield Zoning Map Feb 2025) or county ZCODE+FLUM spatial."
  - "FLUM_20240903_BOC_APPR_2 count 24619 < Parcels2024 34248 — not every parcel has FLU polygon; spatial/PARCEL_NO join required."
  - "CorridorOverlayDistricts (2 polys) has blank CORRIDOR/OverlayDis attributes on public query — geometry-only partial."
  - "TAXDISTRIC / mailing-city confusion — city filter must use municipal polygons or TAXDISTRIC 02/03/04; never mailing city (Bloomingdale/Savannah/Meldrim/Atlanta postal spill)."
  - "No SchneiderCorp EffinghamCountyGA_WFS MapServer (404) — unlike Butts; parcels live on county AGOL only."
  - "qPublic / schneidercorp AppID=666 may return CDN/bot 403 to automated clients; public for humans."
  - "Rejected lookalikes / non-preferred: Effingham County IL Magnasoft Web Experience fb79291577184609b770e5d885eb50a5 (org 4YineAQdtmx0tv46) and vj0V9Lal6oiz0YXp Features/TaxParcels (~-88.8,39.2 Beecher City IL — wrong state); SAGIS/Chatham ParcelDigest (pub.sagis.org) adjacent-county only — do not wire as Effingham parcels; paid USLandGrid / Regrid / ATTOM / CoreLogic Effingham extracts; stale ARC LandPro as cadastral; third-party agol_tr2 Effingham_County_Parcels ownership subsets (BOE/BOC/Industrial Authority — not full CAMA landbase)."
  - "Enrichment vs thin in-app: official 34248 geometry+PARCEL_NO/PIN+owner/mailing/situs+TOTALACRES+SalesDate+esttax+ZCODE (all jurisdictions)+TAXDISTRIC+PropRecCar; FLUM 24619 EFF_REV2; Character 30; Municipal 3; Addresses 32255; SALEPRICE+CURR_VAL via join; city zoning/FLU REST remain gap/PDF."

