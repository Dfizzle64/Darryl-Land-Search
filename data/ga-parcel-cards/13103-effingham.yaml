      Inc_Muni / Post_Comm soft only. Largest municipality; NW of Savannah along SR 21.
    layers:
      - role: zoning
        name: null — county Parcels2024 ZCODE inside Rincon poly (no city FeatureServer)
        restUrl: null
        layerId: null
        geometry: none
