  - role: tax
    name: Parcels2024 esttax + ParcelUpdate/FLUM CURR_VAL join
    restUrl: https://services.arcgis.com/9scQWTgPOi3GxJRr/arcgis/rest/services/Parcels2024/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: TOTALACRES
    coverage: county-wide
    fieldMap:
      PARCEL_NO: parcelId
      PIN: parcelPin
      esttax: tax.estimatedTax
      HOMEEXEMPT: homesteadExempt
      TAXDISTRIC: taxDistrict
      DIGCLASS: dorCode
    notes: >
      Preferred parcels carry esttax only — no FairMarketValue / assessedValue /
      taxableValue on Parcels2024. Join ParcelUpdate (CURR_VAL, fmvres, fmvcom, fmvacc,
      esttax; count 28867; CURR_VAL>0 ≈28685) OR FLUM_20240903_BOC_APPR_2 (CURR_VAL>0
      ≈24396; also fmv*) on PARCEL_NO for tax.marketValue. GA 40% assessed not exposed as
      a separate REST field. Assessor HTML: qpublic.net/ga/effingham →
      qpublic.schneidercorp.com Application.aspx?App=EffinghamCountyGA&Layer=Parcels
      (AppID=666). CDN/bot Cloudflare 403 possible from automated clients; public for
      humans. Deep-link KeyValue={PARCEL_NO} via PropRecCar. Tax Commissioner separate
      from Assessor.
    status: partial

