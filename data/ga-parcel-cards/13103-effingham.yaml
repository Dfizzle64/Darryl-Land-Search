    notes: >
      Preferred parcels expose SalesDate (~33154 non-null) + deed/plat/reason — NO
      SALEPRICE. Join ParcelUpdate.SALEPRICE (SALEPRICE>0 ≈16137; also SalesDate) OR
      FLUM_20240903_BOC_APPR_2.SALEPRICE (SALEPRICE>0 ≈14176) on PARCEL_NO for
      lastSale.price. No Sale_Quality / qualified flag on REST; no multi-sale history
      array — prior sales via qPublic App=EffinghamCountyGA Sales Search HTML. ParcelUpdate
      is older/smaller (28867) than Parcels2024 (34248) — price join will miss newer
      parcels. Status partial until a single-layer price+date source matches preferred
      geometry count.
    status: partial

  - role: zoning
    name: Parcels2024 ZCODE / zoningcode (parcel-attributed — official Interactive Map Zoning)
    restUrl: https://services.arcgis.com/9scQWTgPOi3GxJRr/arcgis/rest/services/Parcels2024/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: TOTALACRES
    coverage: county-wide
    fieldMap:
