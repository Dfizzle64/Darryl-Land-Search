      ZCODE: zoning
      zoningcode: zoningAlt
      Z_TYPE: zoningType
      Zoning_Con: zoningConditional
      OverlayDis: zoningOverlay
      OverlayCod: zoningOverlayCode
      TAXDISTRIC: taxDistrict
    notes: >
      Official Interactive Web Map 2026 wires "Zoning" and "Conditional Use" to Parcels2024
      itself — parcel-attributed Euclidean codes for county + cities (no separate dissolved
      zoning FeatureServer found 2026-09-23). ZCODE≈zoningcode; nonempty ≈34230. Domain
      AR-1/AR-2/AR-3, R-1..R-6/R-8/R-1-A, PD/PD-R/PD-MR/PUD, B-1/B-2/B-3, C-1/C-2/C-3,
      I-1/I-G/LI/HI, DT/OC/RO/RR/M-6/M-H/M-U/CP/FH/GC/SPLIT. Inside Rincon/Guyton/Springfield
      prefer city ordinance/PDF maps when they diverge (standing order) — no city-owned
      public zoning FeatureServer recovered; county ZCODE is the public REST source.
      Corridor overlay polygons: CorridorOverlayDistricts FeatureServer/0 (2 polys;
      CORRIDOR/OverlayDis attrs blank on query — geometry usable, attribution thin/partial).
      Planning & Zoning: effinghamcounty.org/241 (unincorporated); OpenGov portal
      effinghamcountyga.portal.opengov.com.
    status: usable

