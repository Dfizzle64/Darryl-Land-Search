gaps:
  - "Preferred parcelsRO is geometry+PIN+sparse acres+county zoning only — owner/mailing/assessed require TaxParcels_public join on PARCEL_NO=PARCELID; situs prefer SAGES single_line_address."
  - "acres on parcelsRO/SAGES filled on only 6610 / 49104 (5–150 = 1070). Derive GIS acres from Shape__Area/43560 (wkid 102667 feet) when acres=0."
  - "No public REST tax.marketValue on TaxParcels_public (CNTASSDVAL is assessed; CNTTXBLVAL≈empty). TaxParcel_5e cnttxblval looks like FMV but owner-sparse and misaliased — do not treat as authoritative FMV."
  - "County-wide qualified multi-sale history REST gap. Sales_Analysis has only ≈2392 priced rows and null saletype/grantor; PTC SALEPRICE is city-only last sale with blank QUAL."
  - "Unincorporated FLU REST gap — LandManagement folder is token-required (499). City FLU exists for Fayetteville (layer 18) and Peachtree City Proposed_L only."
  - "County ZoningRO (20328) is unincorporated; parcelsRO Zoning='NA' ≈25078 inside cities — must join Fayetteville City_Zoning, PTC Zoning2021, Tyrone TAXDIST=3 Zoning. Brooks and Woolsey official city zoning REST gap."
  - "SAGES/Address Points City and CAD-style codes (FAY/PTC/TYR/BRK/SEN/JBO) are postal — SEN=Senoia (Coweta) and JBO=Jonesboro (Clayton) are not Fayette municipalities. Municipality = CVTTXCD or City Limits only."
  - "TaxParcels_public has PIN-duplicate rows (condo/building); take one row per PARCELID or keep BUILDING/UNIT. TaxDistribution table count 0."
  - "LandManagement, SagesServices, Collector, ParcelNotifications, Utilities, Water, Voting folders on gis.fayettecountyga.gov return Token Required (499) — not public."
