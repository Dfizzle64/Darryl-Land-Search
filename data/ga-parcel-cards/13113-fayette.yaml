      Preferred county-wide parcel GEOMETRY source (on-prem MapServer). Live count 49104
      (2026-09-23); FeatureServer mirror same count / same schema
      (Pictometry/parcelsRO/FeatureServer/0). SR NAD 1983 StatePlane Georgia West FIPS 1002
      Feet (102667/2240); maxRecordCount 2000. Geo-verified WGS84 samples ~-84.474,33.258
