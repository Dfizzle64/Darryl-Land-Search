      GA, Atlanta MSA south (NOT Fayette KY ~-84.5,38.0 Lexington; Fayette PA ~-79.7,39.9;
      Fayette IN; Fayetteville NC ~-78.9,35.1; Fayetteville AR ~-94.2,36.1; Gillette WY).
