notes: >
  JOIN TO COUNTY PARCELS: Preferred — spatial intersect with Fulton PMV MapServer/11.
  Optional attribute join: strip spaces from PMV ParcelID and match East Point PIN
  (REPLACE/normalize). MapServer SQL REPLACE may not be supported on PMV; normalize client-side.
