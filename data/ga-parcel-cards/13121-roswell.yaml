      SITEADDRES: situsAddress
      OWNERNME1: ownerName
      STATEDAREA: acreage
      CHAR_AREA_: flu
      LUCode_: dorCode
      LivUnits_: livableUnits
    notes: >
      Official Roswell Community Development public MapServer. Live count 36286 (2026-09-23).
      Parcel-attributed UDC zoning. PARCELID matches Fulton PMV/11 ParcelID format. Also mirrored
      on WebApps/UDCParcels/MapServer/0 and LGIM_ParcelPublishing/TaxParcels. maxRecordCount 250000.
      CHAR_AREA_ is character-area label on the parcel, not the FLU polygon layer.
