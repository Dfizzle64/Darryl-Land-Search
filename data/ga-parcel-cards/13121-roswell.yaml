    geometry: polygon
    auth: none
    acreageField: null
    coverage: city-only
    fieldMap:
      LANDUSECODE: flu
      LANDUSEDESC: fluDescription
    notes: >
      Coarse FLU / proposed land-use polygons. Live count 56. Same schema as Character Areas
      (CommunityDevelopmentPublic/MapServer/21, also 56 features). Spatial join only — no parcel id.
    status: usable

