      LayerID=19142 HTML (KeyValue={PIN} or {PARCEL_ID}; bot/CDN may 403 automated).
      Acreage: Shape__Area is StatePlane sq ft — convert acres = Shape__Area/43560 (no
      Deed_Acres field). Soft DIST_CITY (geo-checked): 01≈Brunswick (~6918; ~-81.49,31.16),
      02≈west mainland / Everett-Thalman (~1092; ~-81.64–81.69,31.16–31.39), 03≈mainland
      unincorporated majority (~26077), 04≈St Simons Island (~10733; ~-81.39,31.15),
