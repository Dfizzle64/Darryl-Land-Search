      spatial Boundaries/1 City of Brunswick + Addresses CITY for municipality. ZONE_1 top:
      FA≈8880, R6≈6704, PDG≈6539, R12≈4250, R9≈4222, GR≈2732, PDR≈2439, R20≈1971,
