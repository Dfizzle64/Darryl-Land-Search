gaps:
  - "County 2045 Future Development Map (GC_Planning/7) is only 16 coarse INTENSITY polygons — not parcel-level FLU. Use city character-area layers where available (Lawrenceville, Duluth, Peachtree Corners); other cities lack public FLU REST."
  - "No lastSale.qualified / deed-validity flag on Land Value Table sales; many SALE*AMT are 0 or 1 (non-market)."
  - "AGOL Property_and_Tax/FeatureServer/0 parcels are geometry+PIN only — must join Tax Master (/3) or prefer GC_Parcel/MapServer/6."
  - "Most municipalities (Suwanee, Norcross, Snellville, Buford, Sugar Hill, Lilburn, Dacula, Grayson, Berkeley Lake, Loganville, etc.) have no independent public zoning/FLU REST; rely on county Municipal Zoning JURISDICTION filter + spatial join."
  - "Planning folder and several GISDataBrowser service names (GC_Zoning, GC_FLU, GC_Sales) return Token Required — use the open GC_Parcel / GC_Planning / AGOL Property_and_Tax endpoints instead."
  - "Assessor HTML search is qPublic AppID=1282 (and legacy manatron URL); automated clients often get CDN/bot 403 — site is public for humans."
  - "Value fields (TOTVAL1/TAXTOT1/SALE*AMT) are strings; parse before numeric filters. No distinct tax.taxableValue."
  - "Buford/Loganville/Auburn/Braselton cross county lines — Gwinnett Municipal Zoning only covers the Gwinnett footprint."

