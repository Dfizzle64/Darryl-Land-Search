      HISTYR3: tax.histYear3
      HISTVAL3: tax.histValue3
      LAT: latitude
      LON: longitude
      ZIP: situsZip
    notes: >
      Preferred COUNTY-WIDE parcel GEOMETRY + WinGAP/REALPROP CAMA (Southern Georgia
      Regional Commission SGRC alma ArcGIS Server — Irwin/ParcelInformation MapServer
      layer 5 "Tax Parcels"). Live count 7066 (2026-09-24). Twin label layers 2/3/4
      (address/owner/parcel-number labels) — prefer layer 5 for polygons + full CAMA.
      SR NAD 1983 StatePlane Georgia West FIPS 1002 Feet (wkid 102667 / 2240).
      maxRecordCount 1000 — page via resultOffset / orderByFields=OBJECTID. CURR_VAL>0
      ≈6915; LASTNAME ≈6904; TOTALACRES 5–150 ≈2430; HOUSE_NO>0 ≈4296; ADDRESS2 ≈6806;
      ZONINGCODE ≈6856; FMVRES>0 ≈3338; MAVCURR>0 =0 (MAV* present but unused — do NOT
      rely on MAVCURR as assessed; prefer CURR_VAL market; assessed via qPublic HTML).
      SALE_VAL>0 =0; SALELAND1>0 =0 (sale REST gap). TAXDISTRIC soft geo-checked:
      01≈5354 (county/rural majority), 02≈1562 (Ocilla-leaning), null≈150 — prefer
      spatial Boundaries/1 Ocilla City Limits. DIGCLASS distinct: R/V/A/C/E/J/I/P/U.
      ZONINGCODE top on sample: AU/RR/R14/R8M/R8/GB/WLI… — prefer Euclidean
      Irwin/Zoning/MapServer/0 ZONE_CODE. Compose situs HOUSE_NO+STDIRECT+STREET_NAM+
      STTYPE when HOUSE_NO>0. CITY/STATE/ADDRESS2 are OWNER mailing (nationwide —
      Inlet Beach FL etc.) — never municipality filter. WATER/SEWER/GAS/ELECTRICTY/
      ROADSTREET present — SKIP per tranche-3. Schema may expose APPRAISER/APPRNAME —
      DO NOT collect as PII. Official assessor HTML: qPublic App=IrwinCountyGA
      (qpublic.net/ga/irwin). Deep-link KeyValue={PARCEL_NO}: Application.aspx?
      App=IrwinCountyGA&Layer=Parcels&PageType=Report&KeyValue={PARCEL_NO}
      (preserve spaces e.g. '0030   0001'). GEO-VERIFY GEORGIA: WGS84 samples
      ~-83.365,31.763 / ~-83.363,31.766 (Ford Rd / Lower Rebecca Rd north county);
      Ocilla city ~-83.25,31.59–31.61 — FIPS 13155 seat Ocilla / SGA (NOT IRWIN
      wildfire services; NOT Regrid paid). Rejected paid Regrid/ATTOM.
