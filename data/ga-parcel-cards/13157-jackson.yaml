gaps:
  - "No public REST lastSale.price/date/qualified — qPublic App=JacksonCountyGA / AppID=797 LayerID=11838 Sales Search HTML only (Cloudflare/bot 403 automated)."
  - "No single tax.marketValue / assessedValue / taxableValue REST field — compose FMVRES+FMVCOM+FMVACC; digest details on qPublic HTML."
  - "ZIP on parcels behaves as mailingZip (tracks CITY; out-of-state samples) — situs zip via Addresses.ZipCode spatial; no dedicated MAILZIP field name."
  - "TAXDISTRIC 00–19+25 lack published REST name legend — do not use as municipality filter; prefer City_Boundaries / zoning city fields / school jurisdiction."
  - "Mailing CITY is owner mailing (nationwide) — never municipality filter."
  - "Zoning TAX_ID join: some rows zero-pad map sheet ('0001    036') vs parcel tax_id ('001    …') — normalize or spatial intersect."
  - "City Euclidean REST usable via county zoning_* for Jefferson/Commerce/Hoschton/Pendergrass/Arcade/Nicholson/Talmo + ZONING_BRASELTON; Maysville stub-only gap."
  - "Maysville / Braselton multi-county — Jackson City_Boundaries footprint only on this card."
  - "Addresses JOIN_ID often 0; PostalCity/COMMUNITY postal (Arcade PostalCity=0; spill ATHENS/WINDER/STATHAM) — spatial City_Boundaries preferred."
  - "acre_calc thinner than TOTALACRES — prefer TOTALACRES for 5–150 filter (≈6676)."
  - "City zoning official PDFs (Jefferson Oct 2024; Hoschton Dec 2025; Braselton Oct 2025; county Feb 2026) remain certification source; REST is county GIS mirror."
  - "Commerce city AGOL has no zoning/FLU FeatureServer — DDA/utilities only."
  - "Rejected lookalikes / non-preferred: Jackson County MO (jcgis.jacksongov.org Cadastral/PastYearParcels SR 102698; Internal_Parcel_Viewer); Jackson MI (gis.mijackson.org ParcelViewer SR 2898); Jackson WI Hub zoning; Jefferson Parish LA trueautomation JeffersonPAMapSearchNoLabels CITY_ZONING SR 102660; Jefferson County GA / USLandGrid paid Jefferson extracts; ARC LandPro_2012 (Ug5xGQbHsD8zuZzM) stale regional land-cover as cadastral; Regrid/ATTOM/CoreLogic/USLandGrid paid Jackson parcel extracts; stale ARC LandPro as preferred parcels."
  - "Enrichment vs thin in-app: county 45046 geometry+tax_id+owner/mailing+situs house/street+TOTALACRES+FMV components+taxdist+dor; zoning 44199 w/ city Euclidean fields; FLU 47418; Character 46285; ZONINGLANDUSE 46658; City_Boundaries 9; Addresses 59688; NEGRC city/county FLU/CA; sales + Maysville Euclidean + assessed/taxable + TAXDIST legend remain gap/HTML/PDF."

