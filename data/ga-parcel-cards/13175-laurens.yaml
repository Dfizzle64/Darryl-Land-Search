      HHvUPZ2XuLOAJxjR; Laurens_County_Wide_View FeatureServer/25 "TaxParcels_25").
      Live count 30009 (2026-09-24). Schema THIN — Parcel_No + Calc_Acres + geometry
      (Realkey null-filled). No owner/mailing/situs/CURR_VAL/sale on this layer.
      Calc_Acres 5–150 ≈7023. maxRecordCount 2000 — page via resultOffset / envelopes.
      Twin TaxParcels_22/29 older snapshot — prefer /25. CountyBoundary/17 confirms
      CNTYIDFP=13175 NAME=Laurens RDC=Heart of Georgia-Altamaha seat circuit Dublin.
      GEO-VERIFY GEORGIA: WGS84 samples ~-83.223,32.585 / ~-83.222,32.585 /
      ~-83.216,32.580 — FIPS 13175 seat Dublin (~-82.90,32.54). REJECT Laurens County
      SC (laurenscountygis.org Baselayers/84 TMS… centroids ~-82.14,34.75 wkid 6570
      SC State Plane — wrong state). Join CAMA via qPublic App=LaurensCountyGA
      KeyValue={Parcel_No} (preserve spaces e.g. '002    001'). Rejected paid
      Regrid/ATTOM; skip ElectricUtilityAreas/ServiceUtilityLines + AADT; no emails/phones.
