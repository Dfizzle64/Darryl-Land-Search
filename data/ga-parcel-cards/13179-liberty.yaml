gaps:
  - "Lead URL gis.libertycountyga.gov/.../Parcels/MapServer/0 returns 404 Service not found — wire ParcelsService/FeatureServer/15 TaxParcel instead."
  - "Token Required (499) on Parcels/FeatureServer and TaxParcels/MapServer — blocked; open ParcelsService preferred."
  - "No public REST tax.marketValue / assessedValue / lastSale — qPublic LibertyCountyGA HTML only."
  - "No county-wide zoning or FLU FeatureServer; HinesvilleZoningDissolve CRC only (intermittent timeout)."
  - "TaxParcel lacks mailing address / WinGAP FMV fields — owner+situs+acres+tax district only."
  - "CRC Liberty/Parcels (28170) is thinner older mirror — prefer county TaxParcel 29504."
  - "Fort Stewart occupies large federal footprint — not a municipality; CRC PoliticalBoundaries Fort_Stewart context only."
  - "Rejected lookalikes / non-preferred: paid Regrid/ATTOM/DynamoSpatial; SAGIS Chatham; stale Parcels/MapServer lead URL; token-gated county twins."
  - "No emails/phones collected; no paid vendors."

