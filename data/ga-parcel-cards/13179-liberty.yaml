      PBA_NUM: parcelIdAlt
      PARCEL_NO2: parcelIdLegacy
      Realkey: ownerKey
      Owner_Name: ownerName
      Property_Address: situsAddress
      Tax_District: taxDistrict
      Legal_Description: legalDescription
      Acreage: acreage
      StatedArea: acreageStated
    notes: >
      Preferred COUNTY-WIDE parcel GEOMETRY + owner/situs/acres/tax-district landbase
      (Liberty County GIS gis.libertycountyga.gov ArcGIS Server ParcelsService FeatureServer
      layer TaxParcel id 15). Live count 29504 (2026-09-24). SR NAD 1983 StatePlane Georgia
      East FIPS 1001 Feet (wkid 102666 / latestWkid 2239). maxRecordCount 2000. Acreage
      5–150 ≈2274 (preferred acreage band). Owner_Name / Parcel_Number filled. Tax_District
      domain (live): HINESVILLE≈13506, COUNTY≈10295, WALTHOURVILLE≈1670, MIDWAY≈1126,
