      municipality attr; prefer spatial Municipality layer 24 for city membership (mailing
      not present on this layer). No CURR_VAL / FMV / SALEPRICE / mailing fields on REST —
      win CAMA values via qPublic HTML. Geo-verified WGS84 samples ~-81.501,31.707
      (Barrington Ferry Rd COUNTY), ~-81.481,31.717 (Briar Bay Rd), ~-81.60,31.81
      (Hinesville) — Liberty County GA coastal (~-81.5,31.8) SW of Savannah / Fort Stewart
      adjacency. LEAD URL https://gis.libertycountyga.gov/arcgis/rest/services/Parcels/MapServer/0
      returns 404 Service not found (2026-09-24) — do NOT wire; use ParcelsService/15.
      Token-required twins Parcels/FeatureServer and TaxParcels/MapServer (auth token) —
      blocked; prefer open ParcelsService. CRC Liberty/Parcels MapServer/0 (count 28170)
      is thinner public mirror (owner/address/Acres) — usable fallback, prefer county
      TaxParcel for currency (last_edited 2026). Rejected paid Regrid/ATTOM/DynamoSpatial;
      rejected SAGIS Chatham-only. Companion layers same FeatureServer: Subdivision/18,
      Lot/21, Municipality/24.
    status: usable

