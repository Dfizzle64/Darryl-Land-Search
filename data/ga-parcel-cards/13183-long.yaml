layers:
  - role: parcels
    name: Long/Property_Data Parcels (CRC / SEGRASS portal)
    restUrl: https://portal.segrass.org/crcarcgis/rest/services/Long/Property_Data/MapServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: GIS_Acres
    coverage: county-wide
    fieldMap:
      PARCEL_NO: parcelId
      GIS_Parcel_No: parcelIdCompact
      GIS_Acres: acreage
      Shape.STArea(): shapeArea
    notes: >
      Preferred COUNTY-WIDE parcel GEOMETRY (Coastal Regional Commission / SEGRASS portal
      portal.segrass.org Long/Property_Data MapServer layer Parcels id 0; WinGap-sourced
      per iteminfo). Live count 9636 (2026-09-24). SR NAD 1983 StatePlane Georgia East
      FIPS 1001 Feet variant (wkid 103027 / latestWkid 6445). maxRecordCount 2000 — page
      via resultOffset / spatial envelopes. GIS_Acres 5–150 ≈1669. Schema is THIN —
      PARCEL_NO + GIS_Parcel_No + GIS_Acres + geometry only (no owner/mailing/situs/
      CURR_VAL/sale on this layer). PIN format e.g. '086    001' (preserve spaces for
      qPublic KeyValue); compact GIS_Parcel_No e.g. '086001'. Older maps.crc.ga.gov
      Long/LongParcels MapServer now exposes ONLY Long Subdivisions/1 (parcels layer
      removed/500) — do NOT prefer; use segrass Property_Data/0. maps.crc LongZoning
      FeatureServer 500 error. Geo-verified WGS84 samples ~-81.605,31.570 / ~-81.606,31.581
      / ~-81.655,31.581 — Long County GA coastal (~-81.75,31.75) W of Liberty / Fort
      Stewart adjacency / Ludowici seat. Census TIGERweb GEOID 13183 CENTLAT +31.7525106
      CENTLON -081.7456158. Join CAMA via qPublic AppID=748 LayerID=11784 HTML
      (KeyValue={PARCEL_NO}). Rejected paid Regrid/ATTOM; skip utilities+AADT
      (LongWaterFacilities/LongSanitation on maps.crc — DO NOT collect); no emails/phones.
    status: usable

  - role: tax
    name: null — no CURR_VAL on Property_Data; qPublic AppID=748 HTML
    restUrl: null
    layerId: null
    geometry: none
    auth: none
    acreageField: null
    coverage: unknown
    fieldMap: {}
    notes: >
      No market/assessed/taxable REST on Property_Data/0. Assessor HTML
      qpublic.net/ga/long → AppID=748 LayerID=11784 (Cloudflare/bot 403 automated;
      public for humans; linked from longcountyga.gov/tax-assessor). Deep-link
      KeyValue={PARCEL_NO}:
      Application.aspx?AppID=748&LayerID=11784&PageTypeID=4&KeyValue={PARCEL_NO}
      (also App=LongCountyGA&Layer=Parcels&PageType=Report&KeyValue={PARCEL_NO}).
      Honest REST tax/owner gap. Tax Commissioner bills are separate AssuranceGov HTML
      (longproperty.assurancegov.com) — not preferred for CAMA.
    status: gap

  - role: sales
    name: null — no public REST sale history
    restUrl: null
    layerId: null
    geometry: none
    auth: none
    acreageField: null
    coverage: unknown
    fieldMap: {}
    notes: >
      No SALEPRICE/SALEDATE on Property_Data. Prefer qPublic Sales Search / Sales List /
      Yearly Sales HTML AppID=748. Rejected paid Regrid/ATTOM sales.
    status: gap

  - role: zoning
    name: Long/Landuse_Planning Zoning (parcel-attributed)
    restUrl: https://portal.segrass.org/crcarcgis/rest/services/Long/Landuse_Planning/MapServer/3
    layerId: 3
    geometry: polygon
    auth: none
    acreageField: GIS_Acres
    coverage: county-wide
    fieldMap:
      ParcelID: parcelId
      Zoning: zoning
      ZoningName: zoningName
      GIS_Acres: acreage
    notes: >
      Preferred county Euclidean/parcel-attributed zoning (count 8200). Join to
      Property_Data on ParcelID=PARCEL_NO. Live codes: RR≈2885, R-1≈1685, AF≈1484,
      R-2≈1091, Unknown≈662, MHP≈237, C-1≈69, C-2≈45, MFR≈17, CON≈14,
      Transportation≈9, I-2≈2. ZoningName e.g. Rural Residential / Agriculture Forestry.
      maps.crc Long/LongZoning FeatureServer+MapServer return 500 — prefer segrass
      Landuse_Planning/3. Companion Zoning App:
      segrass.maps.arcgis.com/apps/instant/sidebar/index.html?appid=583b381565c3487e9a95e3aff26eccd1.
    status: usable

  - role: flu
    name: Long/Landuse_Planning Landuse Existing + Character Areas 2024
    restUrl: https://portal.segrass.org/crcarcgis/rest/services/Long/Landuse_Planning/MapServer/1
    layerId: 1
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      Parcel: parcelId
      ELU: existingLandUse
      ELU_DCA: existingLandUseDca
      FLU: flu
      FLU_DCA: fluDca
      EXT_Zoning: zoningExisting
    notes: >
      Preferred existing land-use on parcel polygons (count 5970; fields ELU/FLU/ELU_DCA/
      FLU_DCA). Spatial/attribute join Parcel onto Property_Data PARCEL_NO.
      Companion Character Areas 2024 MapServer/4 (count 13; CharacterArea e.g. Commercial
      Redevelopment Corridor / Developing Traditional Neighborhood / Agricultural Area /
      Military Area / Industrial / Mixed Use / Open Space) — planning character, not
      Euclidean. Landuse Future/2 is sparse (count 8) — do NOT prefer over Existing/1.
      Comp Plan App: webappviewer id=a7902ae56df04502a72b1edb0b3c3bf4.
    status: usable

  - role: other
    name: Long/Jurisdiction_Boundaries City Limits (Ludowici)
    restUrl: https://portal.segrass.org/crcarcgis/rest/services/Long/Jurisdiction_Boundaries/MapServer/0
