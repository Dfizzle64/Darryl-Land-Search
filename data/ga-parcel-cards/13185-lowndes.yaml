      MAVACC: tax.assessedValueAccessory
      SALE_VAL: lastSale.price
      ZONINGCODE: zoning
      ZONING: zoningAlt
      TAXDISTRIC: taxDistrict
      DIGCLASS: dorCode
      DIGSTRAT: dorStrata
      LAND_TYPE: landType
      LEGAL_DESC: legalDescription
      SUBD_NAME: subdivision
      HOMEEXEMPT: homesteadExempt
      LANDGMD: georgiaMilitiaDistrict
      LANDLOT: landLot
      LANDDIST: landDistrict
      NEIGHBHOOD: neighborhood
      HISTYR1: tax.histYear1
      HISTVAL1: tax.histValue1
      HISTYR2: tax.histYear2
      HISTVAL2: tax.histValue2
      HISTYR3: tax.histYear3
      HISTVAL3: tax.histValue3
      LASTUPDATE: lastUpdate
      Shape__Area: shapeAreaSqFt
    notes: >
      Preferred COUNTY-WIDE parcel GEOMETRY + CAMA landbase (VALOR — Valdosta-Lowndes
      Regional GIS / Southern Georgia Regional Commission, valorgis.com ArcGIS Server 11.3).
      Live count 66316 (2026-09-23). Identical count twins: TaxParcels/MapServer/0,
      TaxParcels_CY/MapServer/0, Valor/Parcels/MapServer/0, ACC_TaxParcels/MapServer/0.
      Prefer FeatureServer/0 (supportsPagination=true, supportsStatistics=true,
      maxRecordCount 100000). SR NAD 1983 StatePlane Georgia West FIPS 1002 Feet
      (wkid 102667 / latestWkid 2240). TOTALACRES>0 ≈49847; TOTALACRES 5–150 ≈6774
      (preferred acreage band for multifamily screening); D_ACRES>0 =66316 (GIS calc
      always filled) and D_ACRES 5–150 ≈6253 — prefer TOTALACRES when non-null, else
      D_ACRES. LASTNAME filled ≈65784; PARCEL_NO filled =66316; HOUSE_NO>0 ≈59005;
      CURR_VAL>0 ≈65746; FMVRES|FMVCOM|FMVACC>0 ≈57073; ZONINGCODE non-blank ≈65011;
      ZONING field sparsely filled ≈842 (do NOT prefer over ZONINGCODE); SALE_VAL>0
      only ≈914 (prefer TaxOffice/property_sales year layers for sales; on-parcel
      SALE_VAL is thin). MAVCURR>0 =0 live (MAV* fields present but unused — do NOT
      rely on MAVCURR as assessed; prefer CURR_VAL as market and compose FMV components
      when needed; assessed/taxable via qPublic HTML). Compose situsAddress from
      HOUSE_NO + STDIRECT + STREET_NAM + STTYPE when HOUSE_NO>0. ZIP is essentially
      empty (filled ≈4) — mailingZip GAP on this layer; situs zip via spatial
      Valor/Addresses ZIPCODE or Valor/zipcode polygons. CITY/STATE/ADDRESS2 are owner
      mailing (nationwide — e.g. INDIANAPOLIS ≈13460 institutional mail, SPRINGFIELD MO,
      BOCA RATON, JACKSONVILLE) — never municipality filter. ADDRESS1 often co-owner /
      DBA line (filled ≈20145); street typically ADDRESS2 (≈65272). TAXDISTRIC soft map
      (geo-checked, no published REST legend): 01≈Valdosta (~21464, ~-83.28,30.80–30.87),
      02≈unincorporated (~32862), 03≈Dasher area (~512, ~-83.22,30.75), 05≈Remerton
      (~255, ~-83.28,30.83), 08≈Hahira (~1462, ~-83.37–83.40,30.99), 12≈Lake Park
      (~643, ~-83.18,30.69), 04/18/19/20≈special / mixed (~5820/354/1821/591 — soft only);
      prefer spatial MunicipalBoundaries NOTE_ or Addresses MAPZONE over TAXDISTRIC.
      DIGCLASS: R≈42147, C≈17298, A≈2252, V≈1853, E≈1660, blank≈532, J≈244, I≈213,
      U≈104. LAND_TYPE 1≈41503 / 3≈24233 / 0≈580 (ACC_TaxParcels symbology uses Land
      Type 3 rural). HISTYR*/HISTVAL* are assessment value-year history — NOT sales.
      LASTUPDATE max ≈2024-01-17 UTC (layer not daily-fresh). Official viewers:
      VALOR Live Map webappviewer b4fd4dbc09ea46c08e5a3144677c3595;
      experience bbd87fb43280497ba50a9cde6756b776. Assessor claims ~50932 parcels /
      509 sq mi on lowndescounty.com/210 — REST 66316 includes non-taxable / ROW /
      splits. Schema also exposes HOMEPHONE/WORKPHONE/CELLPHONE/EMAIL/SSN/SSN1 —
      DO NOT collect (standing order). Geo-verified WGS84 samples ~-83.397,31.001
      (Sonny Rogers / Hahira fringe), ~-83.266,30.891 (Valdosta N), ~-83.240,30.698
      (Lake Park / Loch Laurel), ~-83.212,31.024 (N Lowndes Hwy 122), county ~-83.28,30.83
      — Lowndes County GA / Valdosta MSA (NOT Lowndes County MS Columbus; NOT Lowndes
      County AL; NOT Valdosta lookalikes outside GA). Rejected ARC LandPro_2012; rejected
      Regrid/ATTOM/CoreLogic paid; rejected ACC_TaxParcels as preferred (same count but
      ACC-symbolized rural subset presentation — use TaxParcels FS for full CAMA).
    status: usable

