  - "Mailing ZIP essentially empty on TaxParcels (ZIP filled ≈4) — mailingZip GAP; situs zip via Addresses ZIPCODE spatial or zipcode polygons; sales layers expose ZIP_1."
  - "MAVCURR/MAV* assessed fields present but MAVCURR>0=0 live — no usable assessedValue on REST; use CURR_VAL market + qPublic HTML for assessed/taxable."
  - "On-parcel SALE_VAL>0 only ≈914; multi-sale REST property_sales stops at 2021 (layers 2009–2021) — 2022+ sales gap / qPublic HTML only (Schneider bot 403)."
  - "HISTYR*/HISTVAL* are assessment value years — NOT sales."
  - "character_areas FDM_Plan_D ≈2006 vintage; 2021 Comp Plan PDF + DRAFT 2026 Comp Plan Update may supersede — certify FLU against adopted PDFs."
