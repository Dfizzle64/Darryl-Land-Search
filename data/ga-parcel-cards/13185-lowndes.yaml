  - "Lake Park / Dasher / Remerton: no city-hosted zoning FeatureServer; Hahira folder utilities-only; Valdosta uses joint VALOR Zoning_Detailed + Nov 2022 PDF."
  - "Naylor and Ray City appear in Addresses CITY / zip polys but are not incorporated Lowndes municipalities (Naylor CDP; Ray City is Berrien County)."
