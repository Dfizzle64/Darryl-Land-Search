  - "No city-only CAMA FeatureServers — always county TaxParcels + spatial city poly."
  - "qPublic Schneider App=LowndesCountyGA Application.aspx Cloudflare/bot 403 automated; qpublic.net/ga/lowndes search HTML 200."
