        notes: >
          City Euclidean zoning (count 3051). CITY_ZON top: R-1≈1051, R-1A≈555, R-1B≈471,
          R-2≈380, B-1≈281, B-2≈198, I-1≈69, S≈34, P≈12. Prefer spatial Thomson limits ∩
          Thomson Zoning; county ZONE_ / parcel Zoning as secondary.
        status: usable
      - role: flu
        name: Planning CharacterAreasThomson
        restUrl: https://gis.thomson-mcduffie.net/portal/sharing/servers/1ad128cbaa1f4537bc4ce0cefc41ffe0/rest/services/Planning/MapServer/11
        layerId: 11
        geometry: polygon
        auth: none
        acreageField: null
        coverage: city-only
        fieldMap:
          Name: flu
        notes: >
          Thomson character areas (count 20) — Downtown Thomson / Traditional Neighborhood
          Stable|Declining / Medical District / Commercial Corridor / Regional Commercial /
          Suburban Residential.
        status: usable
      - role: parcels
        name: null — use county Tax Parcels filtered to Thomson
        restUrl: null
        layerId: null
        geometry: none
        auth: none
        acreageField: null
        coverage: city-only
        fieldMap: {}
        notes: >
          No Thomson-only CAMA FeatureServer — county Public/10 + spatial BaseMap/8 /
          Tax_Distri=2. Owner on REST; tax/sale still qPublic AppID=712 HTML.
        status: gap
    gaps:
      - "No City-of-Thomson separate parcel/CAMA REST — county Tax Parcels + spatial Thomson limits."
      - "Tax/sale HTML-only (qPublic) even inside city; no Mail_Zip on county REST."
    status: usable

  - name: Dearing
    level: city
    parentFips: "13189"
    joinToCountyParcels: >
      Spatial BaseMap/9 Dearing City Limits (~-82.38,33.41) OR soft Tax_Distri='3' (~316;
      ParcelNo often 0D…). Mail_City='DEARING' alone insufficient.
    layers:
      - role: zoning
        name: Planning/MapServer Dearing Zoning
        restUrl: https://gis.thomson-mcduffie.net/portal/sharing/servers/1ad128cbaa1f4537bc4ce0cefc41ffe0/rest/services/Planning/MapServer/4
        layerId: 4
        geometry: polygon
        auth: none
        acreageField: null
        coverage: city-only
        fieldMap:
          ZoneCode: zoning
        notes: Dearing city Euclidean ZoneCode polygons + spatial city limits.
        status: usable
      - role: flu
        name: Planning CharacterAreasDearing
        restUrl: https://gis.thomson-mcduffie.net/portal/sharing/servers/1ad128cbaa1f4537bc4ce0cefc41ffe0/rest/services/Planning/MapServer/10
        layerId: 10
        geometry: polygon
        auth: none
        acreageField: null
        coverage: city-only
        fieldMap:
          Name: flu
        notes: Dearing character-area polygons when published.
        status: partial
      - role: parcels
        name: null — county Tax Parcels + Tax_Distri=3 / spatial Dearing
        restUrl: null
        layerId: null
        geometry: none
        auth: none
        acreageField: null
        coverage: city-only
        fieldMap: {}
        notes: County Public/10 + soft Tax_Distri=3 / BaseMap/9.
        status: gap
    gaps:
      - "No Dearing-owned parcel CAMA REST — county layers + Tax_Distri=3 / spatial limits."
    status: partial

gaps:
  - "No curr_val / mav* / assessed / SALE_* on Public Tax Parcels REST — tax/owner detail beyond Name+mail + sale via qPublic AppID=712 LayerID=11417 HTML only."
  - "No Mail_Zip field on Tax Parcels — mailing zip gap on REST."
  - "Public/MapServer maxRecordCount 1000 — page via resultOffset / envelopes; direct /arcgis/rest Token Required (499) — use portal proxy URL."
  - "Parcel Zoning spellings inconsistent (R2 vs R-2 vs 1R) — prefer Planning County Zoning ZONE_ Euclidean."
  - "Tax_Distri soft only — prefer spatial Thomson/Dearing city limits; mailing CITY never sole municipality filter."
  - "Schema Appraiser / created_user / last_edited_user — DO NOT collect as PII."
  - "Skip Planning Sewer/Water Service Area + utilities+AADT per tranche-3."
  - "qPublic Application.aspx Cloudflare/bot 403 automated; qpublic.net/ga/mcduffie + AppID=712 public for humans."
  - "Rejected paid Regrid/ATTOM/USLandGrid; no emails/phones."

