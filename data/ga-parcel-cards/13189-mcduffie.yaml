state: GA
jurisdiction: McDuffie County
fips: "13189"
level: county
markets: [Augusta]

layers:
  # PRIMARY — county-wide parcel polygons + owner/mailing/situs/zoning/deed acres (NO curr_val/sale on REST)
  - role: parcels
    name: Public/MapServer Tax Parcels (Thomson-McDuffie Enterprise portal proxy)
    restUrl: https://gis.thomson-mcduffie.net/portal/sharing/servers/e75fa80580074db48b7b3e468993d96b/rest/services/Public/MapServer/10
    layerId: 10
    geometry: polygon
    auth: none
    acreageField: Deed_Acres
    coverage: county-wide
    fieldMap:
      ParcelNo: parcelId
      Realkey: ownerKey
      Name: ownerName
      Mail_Addre: mailingAddressAlt
      Mail_Add_1: mailingAddress
      Mail_Add_2: mailingAddress2
      Mail_City: mailingCity
      Mail_State: mailingState
      House_No: situsNumber
      Street_Nam: situsStreet
      Street_Typ: situsStreetType
      Legal: legalDescription
      Tax_Distri: taxDistrict
      Zoning: zoning
      Homestead: homesteadExempt
      Land_Type: landType
      Dig_Class: dorCode
      Dig_Strat: dorStrata
      Deed_Acres: acreage
      Subdivisio: subdivision
      Neighborho: neighborhood
      Shape.area: shapeArea
    notes: >
      Preferred COUNTY-WIDE parcel GEOMETRY + CAMA-lite (Thomson-McDuffie ArcGIS Enterprise
      portal proxy Public/MapServer/10 Tax Parcels; webmap Public item
      3777fae25e414b29a8fdfbffc02855d7; PublicGIS WAB app
      1391fae3272443b7a5e69d6a63b8b403). Live count 12579 (2026-09-24). maxRecordCount 1000 —
      page via resultOffset / spatial envelopes. Direct
      gis.thomson-mcduffie.net/arcgis/rest/services/Public/MapServer returns Token Required
      (499) — use portal/sharing/servers/... proxy (auth none for public). Name filled ≈12515;
      Mail_Add_1 usable ≈11446 (coalesce: prefer Mail_Add_1 over Mail_Addre; treat literal
      'NULL' string as blank); House_No>0 ≈9275; Deed_Acres 5–150 = 2641. NO Mail_Zip /
      curr_val / mav* / sale_* / SALE_DATE on this layer — tax/sale via qPublic AppID=712
      LayerID=11417 HTML. Compose situs from House_No+Street_Nam+Street_Typ when House_No>0.
      Prefer Deed_Acres for acreage band; Shape.area is StatePlane sq ft (wkid 102666 / 2239
      Georgia East) — GIS acres ≈ Shape.area/43560. Parcel-attributed Zoning top: R2≈5461 /
      R1≈3484 / 1R≈923 / 2R≈335 / R-1B≈298 / R-1A≈260 / B2≈226 / B1≈226 / C2≈195 / T1≈106 —
      prefer Euclidean Planning/MapServer County Zoning ZONE_ when available. Dig_Class:
      R≈9858, V≈1094, C≈646, E≈427, A≈329, J≈73, I≈57. Tax_Distri soft geo-checked:
      1≈8745 unincorp majority (~-82.61,33.61 Vic Moore NW), 2≈3009 Thomson (~-82.49,33.46;
      ParcelNo often 0T…), 3≈316 Dearing (~-82.39,33.42; ParcelNo often 0D…) — prefer spatial
      BaseMap Thomson City Limits / Dearing City Limits. Schema Appraiser / created_user /
      last_edited_user — DO NOT collect as PII. Skip Planning Water/Sewer Service Area +
      utilities/AADT per tranche-3. Companion layer 9 Tax Parcels Numbers = same schema
      (labels) — prefer /10. Official assessor: qPublic App=McDuffieCountyGA / AppID=712
      LayerID=11417 (qpublic.net/ga/mcduffie; thomson-mcduffie.gov Tax Assessor Search Records
      → PageTypeID=2&PageID=4888). KeyValue={ParcelNo} e.g. '00010002' / '0T310014'. GEO-VERIFY
      GEORGIA: WGS84 samples ~-82.611,33.614 / ~-82.494,33.461 (Thomson) / ~-82.387,33.419
      (Dearing) — Census TIGERweb GEOID 13189 CENTLAT +33.4827626 CENTLON -082.4813128
      (Augusta MSA / CSRA). REJECT paid Regrid/ATTOM/USLandGrid; no emails/phones.
    status: usable

  - role: tax
    name: null — no CURR_VAL/FMV/assessed on public REST; qPublic HTML only
    restUrl: null
    layerId: null
    geometry: none
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap: {}
    notes: >
      Public/MapServer/10 has no market/assessed/taxable value fields. Tax/CAMA values via
      qPublic App=McDuffieCountyGA / AppID=712 LayerID=11417 HTML only. Deep-link
      KeyValue={ParcelNo}: Application.aspx?AppID=712&LayerID=11417&PageTypeID=4&KeyValue={ParcelNo}.
      Search PageTypeID=2&PageID=4888. Rejected paid vendor tax extracts.
    status: gap

  - role: sales
    name: null — no public REST sale history
    restUrl: null
    layerId: null
    geometry: none
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap: {}
    notes: >
      No SALE_VAL/SALEDATE on Public Tax Parcels. Prefer qPublic Sales Search / Sales List
      HTML App=McDuffieCountyGA / AppID=712. Rejected paid Regrid/ATTOM sales.
    status: gap

  - role: zoning
    name: Planning/MapServer County Zoning (Euclidean) + parcel Zoning
    restUrl: https://gis.thomson-mcduffie.net/portal/sharing/servers/1ad128cbaa1f4537bc4ce0cefc41ffe0/rest/services/Planning/MapServer/3
    layerId: 3
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      ZONE_: zoning
    notes: >
      Preferred Euclidean county zoning polygons (count 9189). ZONE_ top: R-2≈5423, R-1≈3372,
      C-2≈171, T-1≈106, I-2≈91, I-1≈13, C-1≈8, R-3≈5. Parcel-attributed Zoning on Tax Parcels/10
      is usable secondary (mixed R2/R-2/1R spellings). Companion Thomson Zoning/2 (CITY_ZON)
      and Dearing Zoning/4 (ZoneCode) for city extracts. Skip Sewer/Water Service Area layers
      0–1 per tranche-3.
    status: usable

  - role: flu
    name: Planning/MapServer CharacterAreasMcDuffie
    restUrl: https://gis.thomson-mcduffie.net/portal/sharing/servers/1ad128cbaa1f4537bc4ce0cefc41ffe0/rest/services/Planning/MapServer/12
    layerId: 12
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      Name: flu
    notes: >
      Comp-plan character areas (count 26) — Lakeshore / Production / Suburban Reserve /
      Usry Pond Preserve / Fort Gordon Buffer / Countryside / Traditional Kaolin Mining /
      Urban Reserve / Medical District / Wrightsboro Village / Three Points Interchange /
      McDuffie County Tourism Gateway. Companion CharacterAreasThomson/11 (Downtown Thomson /
      Traditional Neighborhood / Commercial Corridor / Regional Commercial / Suburban
      Residential…) and CharacterAreasDearing/10. Planning character only — not Euclidean
      zoning substitute.
    status: usable

  - role: other
    name: Public/MapServer E911 Addresses (situs points)
    restUrl: https://gis.thomson-mcduffie.net/portal/sharing/servers/e75fa80580074db48b7b3e468993d96b/rest/services/Public/MapServer/0
    layerId: 0
    geometry: point
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      GISAddress: situsAddress
      City: situsCity
      Zip: situsZip
      GIS_ST_Nam: situsStreet
      Customer: addressCustomerLabel
    notes: >
      E911 address points — join spatially to Tax Parcels (no ParcelNo on this layer). City /
      Zip usable for place filter alongside Tax_Distri / city limits. Schema Customer may hold
      occupant labels — treat carefully; do not harvest phones/emails. Prefer parcel House_No+
      Street_* when present.
    status: partial

  - role: other
    name: BaseMap Thomson + Dearing City Limits
    restUrl: https://gis.thomson-mcduffie.net/portal/sharing/servers/4415670611184522938f298b9e23c1fb/rest/services/BaseMap/MapServer/8
    layerId: 8
    geometry: polygon
    auth: none
    acreageField: ACRES
    coverage: city-only
    fieldMap:
      CITY: cityName
      ACRES: acreage
      SQMILES: municipalityAreaSqMi
    notes: >
      Layer 8 Thomson City Limits (CITY='City of Thomson'; centroid ~-82.494,33.471). Layer 9
      Dearing City Limits (~-82.384,33.414). Preferred spatial municipality filters. Soft
      Tax_Distri='2' Thomson / '3' Dearing as attribute fallback only. Layer 10 County Boundary.
      Skip WATER/SEWER attribute flags as utilities context.
    status: usable

