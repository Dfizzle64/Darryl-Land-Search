    parentFips: "13189"
    joinToCountyParcels: >
      Spatial BaseMap/8 Thomson City Limits (~-82.49,33.47) OR soft Tax_Distri='2' (~3009;
      ParcelNo often 0T…; ~-82.49,33.46). Mailing Mail_City='THOMSON' is NOT authoritative
      (~7742 includes countywide mail-to-Thomson).
    layers:
      - role: zoning
        name: Planning/MapServer Thomson Zoning
        restUrl: https://gis.thomson-mcduffie.net/portal/sharing/servers/1ad128cbaa1f4537bc4ce0cefc41ffe0/rest/services/Planning/MapServer/2
        layerId: 2
        geometry: polygon
        auth: none
        acreageField: null
        coverage: city-only
        fieldMap:
