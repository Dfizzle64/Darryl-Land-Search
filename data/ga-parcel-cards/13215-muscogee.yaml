    status: usable

municipalities:
  - name: Columbus (consolidated Columbus–Muscogee)
    level: city
    parentFips: "13215"
    joinToCountyParcels: >
      Columbus Consolidated Government = Muscogee County (city-county consolidation).
      Entire CurrentYearCAMA_Internal/1 IS the consolidated jurisdiction. Spatial
      Base/MapServer/4 City Limits NAME='City of Columbus' ≈ countywide. Do NOT treat
      Property_CityCode MIDLAND/FORTSON/UPATOI as separate municipalities — postal/
      community labels only.
    layers:
      - role: parcels
        name: Same as county CurrentYearCAMA_Internal/1
        restUrl: https://ccggisprod.columbusga.org/server/rest/services/TaxAssessors/CurrentYearCAMA_Internal/MapServer/1
        layerId: 1
        geometry: polygon
        auth: none
        acreageField: DeededAcreage
        coverage: city-only
        fieldMap:
          TaxPIN: parcelId
          Owner_Name: ownerName
          DeededAcreage: acreage
          Zoning: zoning
        notes: >
          No separate city CAMA — consolidated county layer is the parcel source.
          Standing city-over-county order satisfied by same REST.
        status: usable
      - role: zoning
        name: Planning/Base Zoning (consolidated)
        restUrl: https://ccggisprod.columbusga.org/server/rest/services/Planning/Base/MapServer/0
        layerId: 0
        geometry: polygon
        auth: none
        acreageField: null
        coverage: city-only
        fieldMap:
          ZoneCode: zoning
          Zone: zoningName
        notes: Consolidated Euclidean zoning IS local zoning — CCG Zoning App experience a9b935d318634f6a8eb8f2def70b5cd9.
        status: usable
      - role: flu
        name: Planning/Base Future Land Use
        restUrl: https://ccggisprod.columbusga.org/server/rest/services/Planning/Base/MapServer/2
        layerId: 2
        geometry: polygon
        auth: none
        acreageField: null
        coverage: city-only
        fieldMap:
          FutureLandUseCode: flu
          FutureLandUse: fluName
        notes: Consolidated FLU on TaxPIN polygons.
        status: usable
    gaps:
      - "Tax/sale values HTML-only (publicaccess.columbusga.gov) even inside city — no REST CURR_VAL/sale."
      - "MIDLAND/FORTSON/UPATOI are Property_CityCode labels only — not incorporated cities."
    status: usable

gaps:
  - "No market/assessed/taxable or SALE_* on CurrentYearCAMA_Internal REST — tax/sale via publicaccess.columbusga.gov iasWorld HTML (mode=parid TaxPIN)."
  - "Service title CurrentYearCAMA_Internal is public (auth none) — do not treat as blocked; still no value fields."
  - "TaxParcels_2026/301 and CurrentYear thin layers are TaxPIN+acres — prefer CAMA/1 for owner/situs/zoning."
  - "maxRecordCount 2000 on CAMA/zoning — page via resultOffset / envelopes."
  - "REJECT gis.columbus.gov Applications/CSIR_Public (Columbus OH / wrong geography)."
  - "Property_CityCode MIDLAND/FORTSON/UPATOI soft only — never municipality filter; use City Limits/4."
  - "Skip Utilities folders + AADT per tranche-3; schema editor usernames — DO NOT collect as PII."
  - "Rejected paid Regrid/ATTOM/USLandGrid; no emails/phones."

