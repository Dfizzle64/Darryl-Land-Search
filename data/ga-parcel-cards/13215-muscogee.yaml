  - role: other
    name: TaxAssessors/Base TaxParcels_2026 (thin geometry)
    restUrl: https://ccggisprod.columbusga.org/server/rest/services/TaxAssessors/Base/MapServer/301
    layerId: 301
    geometry: polygon
    auth: none
    acreageField: GISAcreage
    coverage: county-wide
    fieldMap:
      TaxPIN: parcelId
      GISAcreage: acreage
      ParcelType: parcelType
    notes: >
      Thin cadastral polygons Tax Year 2026 (count ≈71785; TaxPIN + GISAcreage +
      ParcelType). Prefer CurrentYearCAMA_Internal/1 when owner/situs/zoning needed;
      use /301 when newest geometry year label required. Auth none; maxRecordCount 2000.
