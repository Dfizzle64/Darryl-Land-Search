    status: gap

  - role: zoning
    name: Planning/Base MapServer Zoning (Euclidean) + parcel Zoning
    restUrl: https://ccggisprod.columbusga.org/server/rest/services/Planning/Base/MapServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      TaxPIN: parcelId
      ZoneCode: zoning
      Zone: zoningName
      Description: zoningDescription
      Ordinance: zoningOrdinance
      OldZoneCode: zoningPrior
    notes: >
      Preferred Euclidean zoning polygons (count ≈70849; TaxPIN-keyed). ZoneCode top:
      SFR3≈22558 / SFR2≈21946 / RMF1≈7236 / RE1≈3864 / GC≈3445 / SFR1≈2807 / RMF2≈2144
      / SFR4≈1394 / NC≈1282 / LMI≈1107 / RO≈1055 / HIST≈467 / PMUD≈386 / PUD≈323.
      Parcel-attributed Zoning on CAMA/1 is usable secondary. Official Zoning Map Portal
      experience.arcgis.com/experience/a9b935d318634f6a8eb8f2def70b5cd9. Skip overlay
      districts as Euclidean substitute; skip utilities+AADT.
    status: usable

