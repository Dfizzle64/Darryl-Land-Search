  - role: other
    name: Base/MapServer City Limits (Columbus consolidated)
    restUrl: https://ccggisprod.columbusga.org/server/rest/services/Base/MapServer/4
    layerId: 4
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
