      Owner_Name: ownerName
      CoOwner_Name: ownerName2
      Owner_Number: mailingNumber
      Owner_SubNumber: mailingSubNumber
      Owner_Direction1: mailingStreetDir
      Owner_StreetName: mailingStreet
      Owner_StreetType: mailingStreetType
      Owner_Direction2: mailingStreetDir2
      Owner_Apartment: mailingUnit
      Owner_City: mailingCity
      Owner_State: mailingState
      Owner_ZIP: mailingZip
      Property_Number: situsNumber
      Property_SubNumber: situsSubNumber
      Property_Direction1: situsStreetDir
      Property_StreetName: situsStreet
      Property_StreetType: situsStreetType
      Property_Direction2: situsStreetDir2
      Property_Apartment: situsUnit
      Property_CityCode: situsCity
      Property_Class: dorCode
      LandUseCode: landUseCode
      Neighborhood: neighborhood
      Zoning: zoning
      TaxDistrict: taxDistrict
      SubdivisionName: subdivision
      LegalDescription: legalDescription
      GISAcreage: acreageGis
      DeededAcreage: acreage
      DeedBook: deedBook
      DeedPage: deedPage
      Shape.STArea(): shapeArea
    notes: >
      Preferred CONSOLIDATED Columbus–Muscogee parcel GEOMETRY + CAMA-lite (Columbus
      Consolidated Government ccggisprod.columbusga.org; service name
      CurrentYearCAMA_Internal is PUBLICLY queryable auth=none despite "Internal").
      Live count ≈70372 (2026-09-24). maxRecordCount 2000 — page via resultOffset /
      envelopes. SR StatePlane Georgia West FIPS 1002 Feet. Owner_Name filled ≈69878;
      DeededAcreage 5–150 ≈1309; GISAcreage 5–150 ≈1957 — prefer DeededAcreage for
      acreage band. Compose situs from Property_Number+Direction1+StreetName+StreetType;
      Property_CityCode top COLUMBUS/MIDLAND/FORTSON/UPATOI are postal/community labels
      inside consolidated city-county — NOT separate municipalities. Parcel Zoning
      secondary to Planning Euclidean ZoneCode. NO market/assessed/taxable/sale fields —
      values via publicaccess.columbusga.gov HTML (iasWorld mode=parid TaxPIN). Companion
      thin TaxAssessors/Base TaxParcels_2026/301 (count ≈71785; TaxPIN+GISAcreage).
      REJECT gis.columbus.gov CSIR_Public (Columbus OH — wrong state). Geo-verify GA:
      WGS84 samples ~-84.987,32.452 / ~-84.974,32.411 / Midland ~-84.91,32.60 — Census
      TIGERweb GEOID 13215 CENTLAT +32.5099571 CENTLON -084.8770366. Skip
      created_user/last_edited_user PII; skip utilities+AADT; rejected paid
      Regrid/ATTOM; no emails/phones.
    status: usable

  - role: tax
    name: null — no CURR_VAL/FMV/assessed on public REST; publicaccess HTML
    restUrl: null
    layerId: null
    geometry: none
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap: {}
    notes: >
      CurrentYearCAMA_Internal/1 has owner+acres+zoning but no market/assessed/taxable
