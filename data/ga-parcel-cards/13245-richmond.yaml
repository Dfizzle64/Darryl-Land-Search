    notes: >
      Preferred CONSOLIDATED Augusta–Richmond parcel GEOMETRY + CAMA (Augusta GA /
      Richmond County FIPS 13245; gismap.augustaga.gov). Live count ≈84855 (2026-09-24).
      maxRecordCount 100000. SR NAD 1983 StatePlane Georgia East FIPS 1001 Feet (wkid
