      GRANTEE is buyer at sale (not necessarily current own1). Prefer /465 for rolling current
      year; use /404 for multi-year history. Also qPublic Sales Search AppID=678. Rejected
      paid Regrid/ATTOM sales.
    status: usable

  - role: zoning
