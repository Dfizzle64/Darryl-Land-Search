      R-1 / R-1A–E / R-2 / R-3A–C / R-MH / A / B-1 / B-2 / LI / HI / P-1 / PUD / POPD /
      CITY / FORT. Twin Map_LayersTS Zoning/333 same schema (maxRecordCount 2000). Parcel
