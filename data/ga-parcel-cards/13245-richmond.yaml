      GeoHub geohub-augustagis.opendata.arcgis.com ; augustaga.gov/815/GIS. Assessor
      qPublic AppID=678 LayerID=11365 PageID=4758 (qpublic.net/ga/richmond →
      augustarichmondtaxassessor.com). Deep-link KeyValue={pin}:
      Application.aspx?AppID=678&LayerID=11365&PageTypeID=4&KeyValue={pin} (also
      App=RichmondCountyGA&Layer=Parcels&PageType=Report&KeyValue={pin}). GEO-VERIFY
