  - "Rejected lookalikes / non-preferred: mhackman_UofMD ga_spalding_shp (Regrid/ll_* schema; owner/mail/situs present but landval/parval/saleprice/zoning blank — paid-vendor provenance, do not prefer); USLandGrid/Regrid/ATTOM paid parcel extracts; ARC LandPro_2012 (Ug5xGQbHsD8zuZzM / ryanbarrett) stale regional land-cover; Spalding_ROE_Status_Parcels (ian.wilson_r2tinc — 84-parcel project subset with Phone/Email PII — do not harvest); Knoxville TN KGIS City Control Points (wrong Griffin); fdsustartup SpaldingCounty hydrant composite as cadastral CAMA; any non-GA Spalding / Griffin IN; token/paid orthos Pictometry EagleView mosaics on county org."
  - "Enrichment vs thin in-app: official 33700 geometry+PARCEL_ID+JURISDICTION+GIS acres; county Euclidean zoning (unincorporated+Orchard Hill); Buildings situs; Griffin + Orchard Hill limits; SWU impervious PIN; Griffin zoning/FLU + county FLU + owner/tax/sale remain gap/HTML/PDF."

