      curr_val/prev_val/flbaseval/fmv* + zoningcode + digclass + taxdistric + qPub_Link.
      totalacres 5–150 ≈2168; curr_val>0 ≈6625. zoningcode domain: A-1≈2775 / R-1≈2555 /
      CITY≈1186 / I-1≈66 / C-1≈43. taxdistric soft (1≈5362 county / 2≈594 Talbotton /
