      Preferred COUNTY-WIDE parcel GEOMETRY + CAMA (Thomas County GIS CMAP host
      thomascountymaps.org ArcGIS Server; parcels_addresses MapServer/4 "Parcels";
      twin labels layer /3 same schema/count). Live count 24832 (2026-09-24).
      SR NAD 1983 StatePlane Georgia West FIPS 1002 Feet (wkid 102667 / latestWkid
      2240). maxRecordCount 1000 — page via resultOffset / envelopes. No public
      FeatureServer twin (FS 500). CURR_VAL>0 = 24723; TOTALACRES>0 = 24614;
      TOTALACRES 5–150 = 3863; LASTNAME filled = 24636; HOUSE_NO>0 = 21637;
      SALE_VAL>0 = 0 (sale REST gap — use qPublic Sales Search HTML). Compose
      situsAddress from HOUSE_NO + STREET_NAM + STTYPE when HOUSE_NO>0; CITY/STATE/
