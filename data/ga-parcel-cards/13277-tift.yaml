      (Tift County - App; wires Tift_Parcels + Tift_Addresses); qPublic map tab. Twin
      Tifton/Parcels city folder exists — prefer county Tift_Parcels for coverage.
      GEO-VERIFY GEORGIA Tift FIPS 13277 seat Tifton (~-83.51,31.45): WGS84 samples
      ~-83.603,31.525 (NW county Hickory Springs) / ~-83.637,31.547 (Gibson Rd) /
