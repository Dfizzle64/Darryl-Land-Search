      / latestWkid 2240). maxRecordCount default — page via resultOffset / envelopes.
      NO acreage / CURR_VAL / SALE / zoning / tax-district attributes on this layer —
      acreage+tax+sale via qPublic App=TiftCountyGA HTML; land-use class + TAXDISTRIC
      via companion Tift_LandUse/0 (join ParcelNum not on LandUse — spatial intersect);
      Euclidean zoning via Tift_Zoning/0. QPLINK deep-links qpublic.schneidercorp.com
