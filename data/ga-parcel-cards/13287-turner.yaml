      maxRecordCount 1000 — page via resultOffset / envelopes. Parcel_No format e.g.
      '001    001' (preserve spaces; qPub_Link URL-encodes). Owner often in lastname only
      (entity/full-name packed); firstname sparse. Build situs from house_no + stdirect +
      street_nam + sttype when house_no>0. mavcurr mostly 0 — prefer curr_val as
      tax.marketValue; assessed/taxable via qPublic HTML. digclass tax landbase:
      R≈3071 / V≈1425 / C≈422 / A≈305 / E≈267 / J≈167 / I≈30 / U≈15 / P≈8. Opaque parcel
      zoning codes 001≈2183 / 004≈1715 / 007≈1328 / 002≈363 / 005≈71 / 003≈17 / 006≈15 —
      NOT Euclidean; prefer TurnerZoning/8 ZOTXT for Ashburn Euclidean. Soft TAXDISTRIC
      (geo-checked): 01≈unincorp (~3200, sample ~-83.80,31.80 NW), 02≈Ashburn (~1982,
      ~-83.67,31.71), 03≈Sycamore (~350, ~-83.64,31.67), 04≈Rebecca (~178, ~-83.49,31.81)
