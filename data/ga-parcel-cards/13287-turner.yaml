      Shape.STLength(): shapeLength
    notes: >
      Preferred COUNTY-WIDE parcel GEOMETRY + owner/mailing/situs/tax (Southern Georgia
      Regional Commission SGRC alma — Turner/TurnerParcels MapServer/0 "Parcels"). Live
      count 5714 (2026-09-24). lastname filled ≈5710; curr_val>0 ≈5710; Draw_Acres 5–150
      =1804; zoning opaque filled ≈5692; SALELAND1>0 only ≈21 (thin sale REST). SR NAD
