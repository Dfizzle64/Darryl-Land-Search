      Do NOT filter by parcel owner mailing city. County mask:
      Twiggs_CountyBoundary FeatureServer/5 NAME=Twiggs (~-83.500,32.617). Allentown
      (shared Twiggs/Wilkinson) NOT published on this Municipal_Boundaries layer —
      honest city gap. Companion Commission Districts/0 TwiggsCCSB-2022 — reference only.
    status: usable

