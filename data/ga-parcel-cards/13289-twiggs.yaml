    restUrl: https://services1.arcgis.com/Ug5xGQbHsD8zuZzM/arcgis/rest/services/Twiggs_County_Parcels/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: TOTALACRES_1
    coverage: county-wide
    fieldMap:
      PARCEL_NO: parcelId
      TOTALACRES_1: acreage
      TOTALACRES: acreageText
      LASTNAME: ownerName
      ADDRESS: situsAddress
      STREET_NAM: situsStreet
      CITY: mailingCity
      STATE: mailingState
      ZIPCODE: mailingZip
      CURR_VAL: tax.marketValue
      Shape__Area: shapeArea
      Shape__Length: shapeLength
    notes: >
      Preferred COUNTY-WIDE parcel GEOMETRY + owner/situs/tax (Middle Georgia Regional
      Commission MGRC org Ug5xGQbHsD8zuZzM — Twiggs_County_Parcels item
      2441fbcfbefc48f5af6bf47325eca275 FeatureServer/0; owner nwilliams_MGRC; snippet
      "Data received from Tax Assessor's office Aug 2024"). Live count 7069
      (2026-09-24). LASTNAME filled ≈7027; CURR_VAL>0 ≈7024; TOTALACRES_1 5–150 =2100.
      Schema THIN but has owner+tax: PARCEL_NO / TOTALACRES(+_1) / STREET_NAM /
      CURR_VAL / LASTNAME / CITY / STATE / ADDRESS / ZIPCODE + geometry. NO mailing
      street separate from situs ADDRESS; CITY/STATE/ZIPCODE treated as mailing when
      present. NO mav*/assessed / SALE_* / zoning / qPub_Link on this layer. SR Web
      Mercator (wkid 102100 / 3857). maxRecordCount 2000 — page via resultOffset /
      envelopes. PARCEL_NO format e.g. 'DV01   001' / 'T121   019' / 'JV01   001'
      (preserve spaces for KeyValue). Join Euclidean zoning via
      Twiggs_County_Zoning_Districts/0 MAPID = PARCEL_NO (parcel-scale zoning polys
      confirmed join T121   019). Companion TwiggsParcels_Jan2026 FeatureServer/16
      (jpaino_MGRC; count 6832) is geometry+CALCACRE/DEEDACRES/PARCELID only — thinner
      on owner/tax; prefer Twiggs_County_Parcels for CAMA attributes. GEO-VERIFY
      GEORGIA Twiggs FIPS 13289 seat Jeffersonville (~-83.35,32.69): WGS84 samples
      ~-83.258,32.617 (Hwy 80 / Danville area) / ~-83.345,32.686 (Jeffersonville) /
      county boundary centroid ~-83.500,32.617. REJECT paid Regrid/ATTOM/USLandGrid;
      no emails/phones. Skip Broadband*/CableModem/ADSL/Fiber/utilities + AADT per
      tranche-3. Assessor HTML qPublic App=TwiggsCountyGA / AppID=684 LayerID=11374.
    status: usable

  - role: tax
    name: Twiggs_County_Parcels CURR_VAL (on parcels layer)
    restUrl: https://services1.arcgis.com/Ug5xGQbHsD8zuZzM/arcgis/rest/services/Twiggs_County_Parcels/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      CURR_VAL: tax.marketValue
    notes: >
      Market value REST usable (CURR_VAL>0 ≈7024/7069). No mav*/assessed/taxable REST
      on Twiggs_County_Parcels — assessed/taxable digest via qPublic AppID=684
      LayerID=11374 HTML (Cloudflare/bot 403 automated; public for humans). Deep-link:
      Application.aspx?AppID=684&LayerID=11374&PageTypeID=4&KeyValue={PARCEL_NO}
      (also App=TwiggsCountyGA&Layer=Parcels&PageType=Report&KeyValue=). Tax
