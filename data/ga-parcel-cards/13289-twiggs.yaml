      MAPID: parcelId
      Acres: acreage
    notes: >
      Preferred county Euclidean / district zoning polygons (count 7355; owner
      nwilliams_MGRC). ZONING top: R-AG≈2504 / R-1≈2446 / AG≈1385 / null≈947 /
      GC≈48 / GI≈24 / R-2≈1. ZONINGTYPE: County≈6408 / City≈947. MAPID aligns to
      PARCEL_NO (parcel-scale polys — attribute join preferred over spatial-only).
      Official viewer: experience.arcgis.com/experience/e11d694d30bb48c095d9e33529d842e3
      (Twiggs County Zoning Web Map). Also wired in Twiggs County Zoning web map
      item 0e201a8857e4498f949e6e95523f617f. Null ZONING rows (~947) often
      ZONINGTYPE=City — city-context polygons may lack code; certify vs ordinance.
    status: usable

  - role: flu
    name: null — no public FLU / Character Areas REST
    restUrl: null
    layerId: null
    geometry: none
    auth: none
    acreageField: null
    coverage: unknown
    fieldMap: {}
    notes: >
      No Twiggs Comp-Plan Future Land Use / Character Areas FeatureServer on MGRC
