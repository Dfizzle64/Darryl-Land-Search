      STATEFP=13 COUNTYFP=309 RDC=Heart of Georgia-Altamaha geo-verified. Census TIGERweb
      GEOID 13309 CENTLAT +32.1170030 CENTLON -082.7245432. Join CAMA via qPublic
      App=WheelerCountyGA / AppID=777 LayerID=11813 HTML (KeyValue={Parcel_No}).
