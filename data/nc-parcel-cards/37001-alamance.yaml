    - PARTNERSHIP
    - HOLDINGS
    - PROPERTIES
    - CORP/CORPORATION
    prefixes:
    - CITY OF
    - COUNTY OF
    - STATE OF
    - TOWN OF
    sqlApproxWhere: (UPPER(OWNAM1) LIKE '% LLC%' OR UPPER(OWNAM1) LIKE '% INC%' OR UPPER(OWNAM1) LIKE '% LP%' OR UPPER(OWNAM1) LIKE '% LLP%' OR UPPER(OWNAM1) LIKE '% LTD%' OR UPPER(OWNAM1) LIKE '% TRUST%' OR UPPER(OWNAM1) LIKE '% CHURCH%' OR UPPER(OWNAM1) LIKE '% COMPANY%' OR UPPER(OWNAM1) LIKE '% PARTNERSHIP%' OR UPPER(OWNAM1) LIKE '% HOLDINGS%' OR UPPER(OWNAM1) LIKE '% PROPERTIES%' OR UPPER(OWNAM1) LIKE '% CORP%' OR UPPER(OWNAM1) LIKE '%,LLC%' OR UPPER(OWNAM1) LIKE '%,INC%' OR UPPER(OWNAM1) LIKE 'CITY OF %' OR UPPER(OWNAM1) LIKE 'COUNTY OF %' OR UPPER(OWNAM1) LIKE 'STATE OF %' OR UPPER(OWNAM1) LIKE 'TOWN OF %')
    liveEntityCountAll: 12001
    liveEntityCount5to150ac: 1633
    countNote: The live count uses the SQL approximation (LIKE '% TOKEN%' on the primary owner field, which also catches TRUSTEE/INCOME-style prefixes), so it runs slightly high, together with the acreage filter above.
