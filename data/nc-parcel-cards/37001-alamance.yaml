gaps:
  - No public countywide BASE zoning FeatureServer/MapServer for unincorporated Alamance — CountyGISMap/GISWebsite layers omit zoning; Planning issues zoning verification letters but no REST dig published
  - BurlingtonGIS folder on apps.alamance-nc.com requires token (499) — use public ReGIS maps.regisnc.org instead
  - Haw River, Gibsonville, Green Level, Swepsonville, Ossipee, Village of Alamance — no public municipal zoning/FLU REST found (city-first gap)
  - Watershed Combined/86 ZONINGTYPE is overlay (WCA/BOW) only — not a substitute for base districts
  - Mebane zoning + FLUM CRS 3857 vs county/ReGIS 2264 — reproject before spatial join
  - Mebane spans Alamance + Orange — spatial-filter to Alamance parcels
  - County FLU REST gap (Small Area Plan is NCDOT SAP regions North/Snow Camp/Rock Creek/Southeast — not FLU place types)
  - NC OneMap lacks AMSLAM-quality sale price; use county parcels for lastSale.price
  - No phones/emails collected; no paid vendors; utilities and AADT out of scope

