      liveStationCount: 291
      stationsWithAADT2022: 146
    newer2025:
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1
      valueField: AADT_2025 (integer; also AADT_2024, AADT_2002-2025)
      countyFilter: County='Alexander'
      countyFilterNote: Title case County name (2022 layer uses uppercase COUNTY)
      queryUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Alexander%27&outFields=LocationID%2CRouteID%2CLocated_On%2CCounty%2CAADT_2024%2CAADT_2025&returnGeometry=true&outSR=4326&f=json
      countUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Alexander%27&returnCountOnly=true&f=json
      liveStationCount: 286
      stationsWithAADT2025: 161
      stationsWithAADT2024: 169
      dataLastEdit: '2026-09-23'
    also:
      stations2024Service: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT__2024_AADT_Stations_published_September_2025/FeatureServer/0
      segments2025: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/0
    recommendation: 'Newer year IS on REST: prefer NCDOT_2025 layer 1 (AADT_2025, falling back to AADT_2024 then AADT_2022 when the newest is null). The 2022 layer is kept as the documented baseline.'
  tax:
    fields:
    - MARKET_VALUE
    - ASSESED_VALUE
    allTaxFieldsOnLayer:
    - MARKET_VALUE
    - ASSESED_VALUE
    - LAND_VALUE
    - STRUCTURE_VALUE
    - OTHER_VALUE
    liveNonZero:
      MARKET_VALUE: 25423
      ASSESED_VALUE: 25423
    status: ok
  sale:
    priceFields:
    - SALES_PRICE
    dateFields:
    - DATE_SOLD
    livePriceNonZero:
      SALES_PRICE: 6412
    liveDateNonNull:
      DATE_SOLD: 25419
    status: ok
  ownerEntity:
    ownerFields:
    - OWNER_NAME1
    - OWNER_NAME2
    - OWNER_NAME3
    primaryOwnerField: OWNER_NAME1
    rule: 'Uppercase and trim the owner name(s), then flag as entity if it matches the regex (apply to every owner field; any hit = entity). Note: TRUSTEE does not match the TRUST word rule, and a surname such as CHURCH at the start of the name is a known false positive.'
    regex: \b(LLC|L\.L\.C\.?|INC\.?|CORP(ORATION)?|LP|L\.P\.|LLP|LTD|TRUST|CHURCH|COMPANY|PARTNERSHIP|HOLDINGS|PROPERTIES)\b|^(CITY|COUNTY|STATE|TOWN) OF\b
    tokens:
    - LLC
    - INC
    - LP
    - LLP
    - LTD
    - TRUST
    - CHURCH
    - COMPANY
    - PARTNERSHIP
    - HOLDINGS
    - PROPERTIES
    - CORP/CORPORATION
    prefixes:
    - CITY OF
    - COUNTY OF
    - STATE OF
    - TOWN OF
    sqlApproxWhere: (UPPER(OWNER_NAME1) LIKE '% LLC%' OR UPPER(OWNER_NAME1) LIKE '% INC%' OR UPPER(OWNER_NAME1) LIKE '% LP%' OR UPPER(OWNER_NAME1) LIKE '% LLP%' OR UPPER(OWNER_NAME1) LIKE '% LTD%' OR UPPER(OWNER_NAME1) LIKE '% TRUST%' OR UPPER(OWNER_NAME1) LIKE '% CHURCH%' OR UPPER(OWNER_NAME1) LIKE '% COMPANY%' OR UPPER(OWNER_NAME1) LIKE '% PARTNERSHIP%' OR UPPER(OWNER_NAME1) LIKE '% HOLDINGS%' OR UPPER(OWNER_NAME1) LIKE '% PROPERTIES%' OR UPPER(OWNER_NAME1) LIKE '% CORP%' OR UPPER(OWNER_NAME1) LIKE '%,LLC%' OR UPPER(OWNER_NAME1) LIKE '%,INC%' OR UPPER(OWNER_NAME1) LIKE 'CITY OF %' OR UPPER(OWNER_NAME1) LIKE 'COUNTY OF %' OR UPPER(OWNER_NAME1) LIKE 'STATE OF %' OR UPPER(OWNER_NAME1) LIKE 'TOWN OF %')
    liveEntityCountAll: 1686
    liveEntityCount5to150ac: 406
    countNote: The live count uses the SQL approximation (LIKE '% TOKEN%' on the primary owner field, which also catches TRUSTEE/INCOME-style prefixes) together with the acreage filter above.
