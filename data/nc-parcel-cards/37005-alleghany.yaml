gaps:
- Sale price REST gap — WebGIS and OneMap lack sale price; use Bitek Sales Date &
  Price search UI and/or AppraisalCard sales section
- Sparta zoning REST gap — traditional zoning exists (ordinance + LUP PDF map) but
  no public FeatureServer
- Unincorporated zoning REST gap — county Open District (non-Euclidean LDP) — no cadastral
  zone polygons
- WebGIS parcels lack tax/mailing/situs — join OneMap cntyfips='005' on PIN=parno
  for tax + addresses
- FLU is coarse Land Classifications (19 polys) — not fine parcel FLUM; LDP/Sparta
  LUP PDFs behind site bot-protection from datacenter egress
- Utilities / AADT / emails / phones / paid vendors intentionally excluded
