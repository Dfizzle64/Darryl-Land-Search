gaps:
  - Peachland and Polkton zoning MapServer layers empty (count 0); Peachland ZIP only
  - McFarlan / White Store / Lanesboro — no public zoning REST (PDF maps)
  - Municipal FLU is LandUsePlan='MUN' stub; no town FLU FeatureServers
  - CountyZoning='Mun.' requires spatial join to town layers (~6835 parcels)
  - ZoningLayers where=1=1 attribute query quirk — use objectIds batches
  - Last-sale only; no multi-transfer sales FeatureServer
  - Address points lack PIN join key
  - OneMap Anson situs/sale sparse; stub out-of-county PINs
  - MaxRecordCount 1000 on county layers — paginate
  - NCGS 132-10 commercial resale limits on downloads
  - No independent city GIS hosts; no paid vendor data; no phones/emails

