gaps:
- FLU REST gap — Comp Plan 2022 PDF only; no county FLU FeatureServer
- Unincorporated Ashe has no countywide zoning REST (ordinance-based land-use only); cities-first Jefferson/WJ (+ WJ ETJ)
- Lansing zoning REST gap — town limits only
- OneMap saledate empty for cntyfips='009'; no sale price on OneMap — use TaxParcel SalePrice
- Web_Map_2026/16 lacks TotalCalculatedAcres — prefer OpenData TaxParcel
- County website HTML (ashecountygov.com) often 403 from datacenter egress — REST + maps + AppraisalCard verified live
- Utilities / AADT / emails / phones / paid vendors intentionally excluded
