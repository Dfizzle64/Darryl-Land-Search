gaps:
  - No zoning attribute on primary Property layer — spatial join by municipality required
  - County Zoning FS/5 is unincorporated only — never treat as countywide
  - Biltmore Forest zoning REST missing (PDF only)
  - No dedicated public FLU REST for Weaverville, Black Mountain, Woodfin, Montreat, Biltmore Forest
  - County FLU limited to GEC coarse categories + 2013 Comp Plan map/PDF
  - Asheville FLU only 24 coarse commtype polygons
  - NC OneMap gisacres all 0 for Buncombe — do not use for 5–150 acreage filter
  - SalePrice reliability uncertain (stamp-like/low samples) — validate via Spatialest
  - Tax/value fields are strings — cast to number
  - Situs must be composed from HouseNumber/Street* (Address is mailing)
  - MaxRecordCount 2000 on county opendata — paginate
  - No paid vendor data; no phones/emails collected
