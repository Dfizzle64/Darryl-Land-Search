# ---- PASS 2 full-suite upgrade (rural OZ), verifiedAt 2026-09-28; mirrors the json pass2 key ----
pass2:
  label: PASS 2 full-suite upgrade (rural OZ) 2026-09-28
  verifiedAt: '2026-09-28'
  verifiedBy: North Carolina Public Info Researcher
  parcelLayer: https://gis.buncombecounty.org/arcgis/rest/services/opendata/FeatureServer/1
  parcelIdField: PIN
  acreageFilter: Acreage >= 5 AND Acreage <= 150
  acres5to150Live: 10526
  parcelCountLive: 135323
  aadt:
    primary2022:
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0
      valueField: AADT_2022 (string; trim, blank = no count)
      countyFilter: COUNTY='BUNCOMBE'
      queryUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27BUNCOMBE%27&outFields=LocationID%2CROUTE%2CLOCATION%2CCOUNTY%2CAADT_2022&returnGeometry=true&outSR=4326&f=json
      countUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27BUNCOMBE%27&returnCountOnly=true&f=json
      liveStationCount: 879
      stationsWithAADT2022: 823
    newer2025:
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1
      valueField: AADT_2025 (integer; also AADT_2024, AADT_2002-2025)
      countyFilter: County='Buncombe'
      countyFilterNote: Title case County name (2022 layer uses uppercase COUNTY)
      queryUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Buncombe%27&outFields=LocationID%2CRouteID%2CLocated_On%2CCounty%2CAADT_2024%2CAADT_2025&returnGeometry=true&outSR=4326&f=json
      countUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Buncombe%27&returnCountOnly=true&f=json
      liveStationCount: 878
      stationsWithAADT2025: 155
      stationsWithAADT2024: 673
      dataLastEdit: '2026-09-23'
    also:
      stations2024Service: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT__2024_AADT_Stations_published_September_2025/FeatureServer/0
      segments2025: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/0
    recommendation: 'Newer year IS on REST: prefer NCDOT_2025 layer 1 (AADT_2025, falling back to AADT_2024 then AADT_2022 when the newest is null). The 2022 layer is kept as the documented baseline.'
  tax:
    fields:
    - TotalMarketValue
    - TaxValue
    allTaxFieldsOnLayer:
    - TotalMarketValue
    - AppraisedValue
    - TaxValue
    - LandValue
    - BuildingValue
    liveNonZero:
      TotalMarketValue: 130873
      TaxValue: 130872
    status: ok
    note: 'Value fields are strings: use CAST(field AS FLOAT) > 0.'
  sale:
    priceFields:
    - SalePrice
    dateFields:
    - DeedDate
    livePriceNonZero:
      SalePrice: 28302
    liveDateNonNull:
      DeedDate: 135323
    status: ok
    note: SalePrice and DeedDate are strings; CAST SalePrice AS FLOAT.
  ownerEntity:
    ownerFields:
    - Owner
    primaryOwnerField: Owner
    rule: 'Uppercase and trim the owner name(s), then flag as entity if it matches the regex (apply to every owner field; any hit = entity). Note: TRUSTEE does not match the TRUST word rule, and a surname such as CHURCH at the start of the name is a known false positive.'
    regex: \b(LLC|L\.L\.C\.?|INC\.?|CORP(ORATION)?|LP|L\.P\.|LLP|LTD|TRUST|CHURCH|COMPANY|PARTNERSHIP|HOLDINGS|PROPERTIES)\b|^(CITY|COUNTY|STATE|TOWN) OF\b
    tokens:
    - LLC
    - INC
    - LP
    - LLP
    - LTD
    - TRUST
    - CHURCH
    - COMPANY
    - PARTNERSHIP
    - HOLDINGS
    - PROPERTIES
    - CORP/CORPORATION
    prefixes:
    - CITY OF
    - COUNTY OF
    - STATE OF
    - TOWN OF
    sqlApproxWhere: (UPPER(Owner) LIKE '% LLC%' OR UPPER(Owner) LIKE '% INC%' OR UPPER(Owner) LIKE '% LP%' OR UPPER(Owner) LIKE '% LLP%' OR UPPER(Owner) LIKE '% LTD%' OR UPPER(Owner) LIKE '% TRUST%' OR UPPER(Owner) LIKE '% CHURCH%' OR UPPER(Owner) LIKE '% COMPANY%' OR UPPER(Owner) LIKE '% PARTNERSHIP%' OR UPPER(Owner) LIKE '% HOLDINGS%' OR UPPER(Owner) LIKE '% PROPERTIES%' OR UPPER(Owner) LIKE '% CORP%' OR UPPER(Owner) LIKE '%,LLC%' OR UPPER(Owner) LIKE '%,INC%' OR UPPER(Owner) LIKE 'CITY OF %' OR UPPER(Owner) LIKE 'COUNTY OF %' OR UPPER(Owner) LIKE 'STATE OF %' OR UPPER(Owner) LIKE 'TOWN OF %')
    liveEntityCountAll: 31255
    liveEntityCount5to150ac: 3102
    countNote: The live count uses the SQL approximation (LIKE '% TOKEN%' on the primary owner field, which also catches TRUSTEE/INCOME-style prefixes) together with the acreage filter above.
  paDeepLink:
    template: https://prc-buncombe.spatialest.com/#/property/{PIN}
    testedParcelId: '878064941500000'
    testedUrl: https://prc-buncombe.spatialest.com/#/property/878064941500000
    httpStatus: 200
    contentType: text/html; charset=UTF-8
    contentVerified: false
    note: 'Spatialest SPA (hash route): 200 shell, parcel content cannot be checked server-side.'
  gisViewer:
    url: https://gis.buncombenc.gov/buncomap/
    httpStatus: 200
    pageTitle: Buncombe County GIS
    note: Card URL https://gis.buncombenc.gov/buncomap_new/ now returns 404 (http too); use /buncomap/ (200, ArcGIS JS viewer).
    previousUrl404: https://gis.buncombenc.gov/buncomap_new/
  gaps:
  - jurisdictionGisUrl buncomap_new 404, replaced with /buncomap/
