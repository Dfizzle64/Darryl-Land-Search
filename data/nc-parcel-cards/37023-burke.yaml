gaps:
  - taxweb.burkenc.org HTTPS TLS fails — use HTTP for CamaPWA deep-links
  - ProdParcelViewFC MapServer-only; VIEWER/AGOL FS omit sale price and land/bldg split
  - Rutherford College zoning only 7 polygons (incomplete)
  - No independent Valdese/Hildebran/Drexel/etc. city ArcGIS (county Aux is public wire)
  - OneMap saledate empty for Burke; no OneMap sale price
  - Utilities and AADT excluded by design

