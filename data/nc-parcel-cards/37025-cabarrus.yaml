      featureQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Cabarrus%27&outFields=LocationID%2CRouteID%2CLocated_On%2CCrossroad%2CAADT_2023%2CAADT_2024%2CAADT_2025&outSR=4326&f=geojson&resultOffset=0&resultRecordCount=1000
      liveStationCount: 636
      stationsWithAADT2025: 30
      stationsWithAADT2024: 595
      segmentsLayer: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/0 (AADT, AADT_Year=2025, AADTT truck volumes; polyline, statewide — spatial filter by county envelope)
      also: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT__2024_AADT_Stations_published_September_2025/FeatureServer/0 (2024 stations, published Sep 2025; County title-case; AADT_2023/AADT_2024 strings)
    recommendation: Keep AADT_2022 wiring (#59) as-is; optionally switch to 2025 stations layer and take latest non-null of AADT_2025→AADT_2024→AADT_2023 per station. Note County value case differs (2022 layer UPPER, 2025 layer Title).
  primaryParcelLayer:
    restUrl: https://location.cabarruscounty.us/arcgisservices/rest/services/OpenData/Tax_Parcels/MapServer/1
    acreageField: CALCULATED_ACREAGE
    range5to150Where: CALCULATED_ACREAGE>=5 AND CALCULATED_ACREAGE<=150
    liveTotalParcels: 107661
    liveParcels5to150: 7144
  taxValues:
    status: ok
    fields:
      LandValue: tax.landValue
      BuildingValue: tax.improvementValue
      MarketValue: tax.marketValue
      AssessedValue: tax.assessedValue
    liveNonZeroCounty:
      LandValue: 98023
      BuildingValue: 83815
      MarketValue: 98211
      AssessedValue: 98211
    liveNonZero5to150:
      AssessedValue: 6791
    notes: LandValue/BuildingValue/MarketValue/AssessedValue are STRING integers (e.g. '13149960') — cast to number.
    publicFallback: https://tax.cabarruscounty.us/BasicSearch.aspx
  saleHistory:
    status: ok
    priceFields:
    - SalePrice
    dateFields:
    - SaleYear
    - SaleMonth
    livePriceGt0County:
      SalePrice: 65422
    livePriceGt0_5to150:
      SalePrice: 3135
    liveDateNonNullCounty:
      SaleYear: 93246
      SaleMonth: 93246
    notes: 'No full sale date: SaleYear + SaleMonth integers only; SalePrice double (0 = non-arms-length/no price); QualifiedCode.'
  ownerEntity:
    ownerFields:
    - AcctName1
    - AcctName2
    primaryOwnerField: AcctName1
    rule:
      apply: Uppercase + trim AcctName1 (optionally also AcctName2)
      regex: (?i)(\bL\.?\s?L\.?\s?C\b|\bINC\b|\bCORP|\bL\.?\s?P\b|\bLLP\b|\bLLLP\b|\bLTD\b|TRUST|CHURCH|MINISTR|\bCOMPANY\b|PARTNERSHIP|PRTNRSHP|HOLDINGS|PROPERTIES|INVESTMENT|ASSOCIATION|\bHOA\b|FOUNDATION|AUTHORITY|\bDEVELOPMENT|BOARD OF EDUCATION|^(CITY|COUNTY|STATE|TOWN|VILLAGE) OF\b|^UNITED STATES|^NORTH CAROLINA\b|\bCOUNTY$)
      sqlLikeTokens:
      - '% LLC%'
      - '%,LLC%'
      - '% L L C%'
      - '% INC'
      - '% INC %'
      - '% INC.%'
      - '%,INC%'
      - '% CORP%'
      - '%CORPORATION%'
      - '% LP'
      - '% LP %'
      - '% L P'
      - '% LLP%'
      - '% LTD%'
      - '%TRUST%'
      - '%CHURCH%'
      - '%MINISTR%'
      - '% COMPANY%'
      - '%PARTNERSHIP%'
      - '%HOLDINGS%'
      - '%PROPERTIES%'
      - '%INVESTMENT%'
      - '%ASSOCIATION%'
      - '%FOUNDATION%'
      - '%AUTHORITY%'
      - CITY OF %
      - COUNTY OF %
      - STATE OF %
      - TOWN OF %
      - '% COUNTY'
      - '%BOARD OF EDUCATION%'
      - UNITED STATES%
      - NORTH CAROLINA %
      - '% DEVELOPMENT%'
      caveats: TRUST/TRUSTEE also flags family/revocable living trusts (still non-individual title holders); "% COUNTY" suffix catches e.g. "PERSON COUNTY"; bare "CO" and "ESTATE" intentionally excluded (too many false positives). Some owner strings carry trailing spaces (Wake) or mixed case (Yadkin) — normalize first.
    liveEntityCount5to150: 2082
    liveOwnerNonNull5to150: 7106
    entityQuery: where=CALCULATED_ACREAGE>=5 AND CALCULATED_ACREAGE<=150 AND (AcctName1 LIKE '% LLC%' OR AcctName1 LIKE '%,LLC%' OR AcctName1 LIKE '% L L C%' OR AcctName1 LIKE '% INC' OR AcctName1 LIKE '% INC %' OR AcctName1 LIKE '% INC.%' OR AcctName1 LIKE '%,INC%' OR AcctName1 LIKE '% CORP%' OR AcctName1 LIKE '%CORPORATION%' OR AcctName1 LIKE '% LP' OR AcctName1 LIKE '% LP %' OR AcctName1 LIKE '% L P' OR AcctName1 LIKE '% LLP%' OR AcctName1 LIKE '% LTD%' OR AcctName1 LIKE '%TRUST%' OR AcctName1 LIKE '%CHURCH%' OR AcctName1 LIKE '%MINISTR%' OR AcctName1 LIKE '% COMPANY%' OR AcctName1 LIKE '%PARTNERSHIP%' OR AcctName1 LIKE '%HOLDINGS%' OR AcctName1 LIKE '%PROPERTIES%' OR AcctName1 LIKE '%INVESTMENT%' OR AcctName1 LIKE '%ASSOCIATION%' OR AcctName1 LIKE '%FOUNDATION%' OR AcctName1 LIKE '%AUTHORITY%' OR AcctName1 LIKE 'CITY OF %' OR AcctName1 LIKE 'COUNTY OF %' OR AcctName1 LIKE 'STATE OF %' OR AcctName1 LIKE 'TOWN OF %' OR AcctName1 LIKE '% COUNTY' OR AcctName1 LIKE '%BOARD OF EDUCATION%' OR AcctName1 LIKE 'UNITED STATES%' OR AcctName1 LIKE 'NORTH CAROLINA %' OR AcctName1 LIKE '% DEVELOPMENT%')
