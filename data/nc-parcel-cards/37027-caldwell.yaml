gaps:
  - No public last-sale price or date on county REST parcel layers (AppraisalCard PDF has SALES DATA)
  - Rhodhiss Zoning layer miswired (do not use for city-first)
  - County and Lenoir FLU are PDF-only (no county FLU FeatureServer)
  - No independent city ArcGIS for Lenoir/Hudson/Granite Falls/Gamewell/Sawmills/etc.
  - OneMap saledate empty for cntyfips='027'
  - Utilities / AADT / emails / phones / paid vendors excluded by design

