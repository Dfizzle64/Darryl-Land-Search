      AV_FMV_IMP: 11541
    status: ok
  sale:
    priceFields: []
    dateFields: []
    livePriceNonZero: {}
    liveDateNonNull: {}
    status: gap
    note: No sale price/date on REST (P_BOOK/P_PAGE deed refs only; NC OneMap saledatetx empty). ITSPublicCS AppraisalCard PDF has Sales grid (Sale Date / Sale Price).
  ownerEntity:
    ownerFields:
    - N_NAME
    - N_NAME2
    primaryOwnerField: N_NAME
    rule: 'Uppercase and trim the owner name(s), then flag as entity if it matches the regex (apply to every owner field; any hit = entity). Note: TRUSTEE does not match the TRUST word rule, and a surname such as CHURCH at the start of the name is a known false positive.'
    regex: \b(LLC|L\.L\.C\.?|INC\.?|CORP(ORATION)?|LP|L\.P\.|LLP|LTD|TRUST|CHURCH|COMPANY|PARTNERSHIP|HOLDINGS|PROPERTIES)\b|^(CITY|COUNTY|STATE|TOWN) OF\b
    tokens:
    - LLC
    - INC
    - LP
    - LLP
    - LTD
    - TRUST
    - CHURCH
    - COMPANY
    - PARTNERSHIP
    - HOLDINGS
    - PROPERTIES
    - CORP/CORPORATION
    prefixes:
    - CITY OF
    - COUNTY OF
    - STATE OF
    - TOWN OF
    sqlApproxWhere: (UPPER(N_NAME) LIKE '% LLC%' OR UPPER(N_NAME) LIKE '% INC%' OR UPPER(N_NAME) LIKE '% LP%' OR UPPER(N_NAME) LIKE '% LLP%' OR UPPER(N_NAME) LIKE '% LTD%' OR UPPER(N_NAME) LIKE '% TRUST%' OR UPPER(N_NAME) LIKE '% CHURCH%' OR UPPER(N_NAME) LIKE '% COMPANY%' OR UPPER(N_NAME) LIKE '% PARTNERSHIP%' OR UPPER(N_NAME) LIKE '% HOLDINGS%' OR UPPER(N_NAME) LIKE '% PROPERTIES%' OR UPPER(N_NAME) LIKE '% CORP%' OR UPPER(N_NAME) LIKE '%,LLC%' OR UPPER(N_NAME) LIKE '%,INC%' OR UPPER(N_NAME) LIKE 'CITY OF %' OR UPPER(N_NAME) LIKE 'COUNTY OF %' OR UPPER(N_NAME) LIKE 'STATE OF %' OR UPPER(N_NAME) LIKE 'TOWN OF %')
    liveEntityCountAll: 1481
    liveEntityCount5to150ac: 588
    countNote: The live count uses the SQL approximation (LIKE '% TOKEN%' on the primary owner field, which also catches TRUSTEE/INCOME-style prefixes) together with the acreage filter above.
