  - name: Conover
    zoningRestUrl: https://arcgis2.catawbacountync.gov/arcgis/rest/services/energov/energov_permit_ctr/FeatureServer/60
    zoningField: Zoning
    zoningAllFilter: "District='Conover'"
    join: spatial Zoning_All District='Conover' (621) to county parcels
    notes: No independent city ArcGIS host found
  - name: Claremont
    zoningRestUrl: https://arcgis2.catawbacountync.gov/arcgis/rest/services/energov/energov_permit_ctr/FeatureServer/60
    zoningField: Zoning
    zoningAllFilter: "District='Claremont'"
    join: spatial Zoning_All District='Claremont' (161) to county parcels
  - name: Maiden
    zoningRestUrl: https://arcgis2.catawbacountync.gov/arcgis/rest/services/energov/energov_permit_ctr/FeatureServer/60
    zoningField: Zoning
    zoningAllFilter: "District='Maiden'"
    join: spatial Zoning_All District='Maiden' (334) to county parcels
