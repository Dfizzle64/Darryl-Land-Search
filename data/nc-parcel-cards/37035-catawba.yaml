# ---- PASS2 full-suite upgrade (rural OZ) — verifiedAt 2026-09-28 ----
pass2:
  label: PASS2 full-suite upgrade — rural OZ counties (tax / sale / owner-entity / PA link / GIS link / AADT)
  verifiedAt: '2026-09-28'
  verifiedBy: North Carolina Public Info Researcher
  aadtScreening:
    source: NCDOT Traffic Survey Group (public AGOL)
    layer: NCDOT_AADT_Stations FeatureServer/0 (documented in enrichment/NC/ncdot-aadt-statewide-dig-2026-09-24.yaml)
    restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0
    countyField: COUNTY
    countyValue: CATAWBA
    valueField: AADT_2022
    valueType: string (trim; blank = no count that year)
    countQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27CATAWBA%27&returnCountOnly=true&f=json
    featureQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27CATAWBA%27&outFields=LocationID%2CROUTE%2CLOCATION%2CAADT_2021%2CAADT_2022&outSR=4326&f=geojson&resultOffset=0&resultRecordCount=1000
    liveStationCount: 800
    stationsWithAADT2022: 49
    newerYearAvailable:
      available: true
      layer: NCDOT_2025_AADTandTrafficSegments_gdb FeatureServer/1 (NCDOT_2025_AADT_Stations; dataLastEdit 2026-09-23)
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1
      countyField: County
      countyValue: Catawba
      valueField: AADT_2025
      valueType: integer (null = no count)
      countQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Catawba%27&returnCountOnly=true&f=json
      featureQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Catawba%27&outFields=LocationID%2CRouteID%2CLocated_On%2CCrossroad%2CAADT_2023%2CAADT_2024%2CAADT_2025&outSR=4326&f=geojson&resultOffset=0&resultRecordCount=1000
      liveStationCount: 793
      stationsWithAADT2025: 772
      stationsWithAADT2024: 0
      segmentsLayer: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/0 (AADT, AADT_Year=2025, AADTT truck volumes; polyline, statewide — spatial filter by county envelope)
      also: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT__2024_AADT_Stations_published_September_2025/FeatureServer/0 (2024 stations, published Sep 2025; County title-case; AADT_2023/AADT_2024 strings)
    recommendation: Keep AADT_2022 wiring (#59) as-is; optionally switch to 2025 stations layer and take latest non-null of AADT_2025→AADT_2024→AADT_2023 per station. Note County value case differs (2022 layer UPPER, 2025 layer Title).
  primaryParcelLayer:
    restUrl: https://arcgis2.catawbacountync.gov/arcgis/rest/services/energov/energov_permit_ctr/FeatureServer/0
    acreageField: Caculated_Acreage
    range5to150Where: Caculated_Acreage>=5 AND Caculated_Acreage<=150
    liveTotalParcels: 94864
    liveParcels5to150: 8502
  taxValues:
    status: ok
    fields:
      Land_Value: tax.marketValue
      Total_Buildings_Value: tax.marketValue
      Total_Value: tax.marketValue
    liveNonZeroCounty:
      Land_Value: 91012
      Total_Buildings_Value: 69875
      Total_Value: 91271
    liveNonZero5to150:
      Total_Value: 8387
    notes: 'Tax values are STRING currency (e.g. ''$177,700''; Total_Value may carry suffix ''/ Use Total Value: $31,000'' for PUV parcels) — strip $ and commas, take first number. CSV fallback: https://gis.catawbacountync.gov/DataWarehouse/csv/catco_pa.csv'
    publicFallback: https://gis.catawbacountync.gov/parcel/?pinc={PIN}
  saleHistory:
    status: ok
    priceFields:
    - Sale_Amount
    dateFields:
    - Sale_Date
    livePriceGt0County:
      Sale_Amount: 48177
    livePriceGt0_5to150:
      Sale_Amount: 3098
    liveDateNonNullCounty:
      Sale_Date: 48177
    notes: Sale_Amount STRING currency ('$203,500'); Sale_Date STRING MM/DD/YY — parse 2-digit year (<=26 → 20xx). Last sale only; no multi-transfer history on REST.
  ownerEntity:
    ownerFields:
    - Name
    - Name2
    primaryOwnerField: Name
    rule:
      apply: Uppercase + trim Name (optionally also Name2)
      regex: (?i)(\bL\.?\s?L\.?\s?C\b|\bINC\b|\bCORP|\bL\.?\s?P\b|\bLLP\b|\bLLLP\b|\bLTD\b|TRUST|CHURCH|MINISTR|\bCOMPANY\b|PARTNERSHIP|PRTNRSHP|HOLDINGS|PROPERTIES|INVESTMENT|ASSOCIATION|\bHOA\b|FOUNDATION|AUTHORITY|\bDEVELOPMENT|BOARD OF EDUCATION|^(CITY|COUNTY|STATE|TOWN|VILLAGE) OF\b|^UNITED STATES|^NORTH CAROLINA\b|\bCOUNTY$)
      sqlLikeTokens:
      - '% LLC%'
      - '%,LLC%'
      - '% L L C%'
      - '% INC'
      - '% INC %'
      - '% INC.%'
      - '%,INC%'
      - '% CORP%'
      - '%CORPORATION%'
      - '% LP'
      - '% LP %'
      - '% L P'
      - '% LLP%'
      - '% LTD%'
      - '%TRUST%'
      - '%CHURCH%'
      - '%MINISTR%'
      - '% COMPANY%'
      - '%PARTNERSHIP%'
      - '%HOLDINGS%'
      - '%PROPERTIES%'
      - '%INVESTMENT%'
      - '%ASSOCIATION%'
      - '%FOUNDATION%'
      - '%AUTHORITY%'
      - CITY OF %
      - COUNTY OF %
      - STATE OF %
      - TOWN OF %
      - '% COUNTY'
      - '%BOARD OF EDUCATION%'
      - UNITED STATES%
      - NORTH CAROLINA %
      - '% DEVELOPMENT%'
      caveats: TRUST/TRUSTEE also flags family/revocable living trusts (still non-individual title holders); "% COUNTY" suffix catches e.g. "PERSON COUNTY"; bare "CO" and "ESTATE" intentionally excluded (too many false positives). Some owner strings carry trailing spaces (Wake) or mixed case (Yadkin) — normalize first.
    liveEntityCount5to150: 2127
    liveOwnerNonNull5to150: 8502
    entityQuery: where=Caculated_Acreage>=5 AND Caculated_Acreage<=150 AND (Name LIKE '% LLC%' OR Name LIKE '%,LLC%' OR Name LIKE '% L L C%' OR Name LIKE '% INC' OR Name LIKE '% INC %' OR Name LIKE '% INC.%' OR Name LIKE '%,INC%' OR Name LIKE '% CORP%' OR Name LIKE '%CORPORATION%' OR Name LIKE '% LP' OR Name LIKE '% LP %' OR Name LIKE '% L P' OR Name LIKE '% LLP%' OR Name LIKE '% LTD%' OR Name LIKE '%TRUST%' OR Name LIKE '%CHURCH%' OR Name LIKE '%MINISTR%' OR Name LIKE '% COMPANY%' OR Name LIKE '%PARTNERSHIP%' OR Name LIKE '%HOLDINGS%' OR Name LIKE '%PROPERTIES%' OR Name LIKE '%INVESTMENT%' OR Name LIKE '%ASSOCIATION%' OR Name LIKE '%FOUNDATION%' OR Name LIKE '%AUTHORITY%' OR Name LIKE 'CITY OF %' OR Name LIKE 'COUNTY OF %' OR Name LIKE 'STATE OF %' OR Name LIKE 'TOWN OF %' OR Name LIKE '% COUNTY' OR Name LIKE '%BOARD OF EDUCATION%' OR Name LIKE 'UNITED STATES%' OR Name LIKE 'NORTH CAROLINA %' OR Name LIKE '% DEVELOPMENT%')
  paDeepLink:
    template: https://gis.catawbacountync.gov/parcel/?pinc={PIN}
    testedUrl: https://gis.catawbacountync.gov/parcel/?pinc=279006488235
    httpStatus: 200
    notes: 'HTTP 200; JS app (Catawba GIS Real Estate Maps) renders parcel client-side, so parcel content not server-verifiable. Alt report: https://gis.catawbacountync.gov/nomap/?pinc={PIN} (200). Tax bill: https://taxbill.catawbacountync.gov/ITSPublicCT/RealEstateSearch'
  jurisdictionGisViewer:
    url: https://gis.catawbacountync.gov/parcel/
    httpStatus: 200
    notes: Catawba County GIS Real Estate Maps
  gaps:
  - AADT_2022 blank at 751 of 800 stations on the 2022 layer (NCDOT counts on a cycle) — prefer 2025 layer / latest non-blank year
  - No multi-transfer sale history on primary layer (last sale only)
