# PRIMARY — wire first for county-wide site search (CAMA + polygons)
layers:
  - role: parcels
    name: energov_permit_ctr Parcels (CAMA + zoning attrs)
    restUrl: https://arcgis2.catawbacountync.gov/arcgis/rest/services/energov/energov_permit_ctr/FeatureServer/0
    alternateUrls:
      - https://arcgis2.catawbacountync.gov/arcgis/rest/services/energov/energov_permit_ctr/MapServer/0
      - https://arcgis2.catawbacountync.gov/arcgis/rest/services/energov/ugly_map/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: Caculated_Acreage
    coverage: county-wide
    fieldMap:
      PIN: parcelId
      Parcel_ID: parcelId
      LRK: parcelIdAccount
      Caculated_Acreage: acreage
      Name: ownerName
      Name2: ownerName
      Address: mailingAddress
      Address2: mailingAddress
      City: mailingAddress
      State: mailingAddress
      Zip: mailingAddress
      Building_Number: situsAddress
      Street_Name: situsAddress
      Parcel_Zip: situsZip
      Sale_Date: lastSale.date
      Sale_Amount: lastSale.price
      Land_Value: tax.marketValue
      Total_Buildings_Value: tax.marketValue
      Total_Value: tax.marketValue
      Zoning: zoning
      Zoning2: zoning
      Zoning3: zoning
      Zoning_District: other
      Zoning_Overlay: other
      Small_Area_Plan: flu
      LEO_HideName: other
    notes: >
      PRIMARY verified 2026-09-24: count 94864; Caculated_Acreage BETWEEN 5 AND 150 → 8502;
      Sale_Amount non-empty/non-zero in range → 3098. CRS 102719/2264. MaxRecordCount 1000.
      Field name is misspelled Caculated_Acreage (no "l"). Sale_Amount/Land_Value/Total_* are
      currency STRINGS (strip $ and commas). Parcel Zoning* is jurisdiction-joined stub —
      prefer Zoning_All polygon spatial join by District for clean city-first codes.
      LEO_HideName='Y' on ~223 parcels (owner redacted). Same schema on ugly_map/0.
    status: usable

  - role: parcels
    name: Real_Estate_Basemap Parcels (geometry + acreage)
    restUrl: https://arcgis2.catawbacountync.gov/arcgis/rest/services/Basemaps/Real_Estate_Basemap/MapServer/2
    alternateUrls:
      - https://arcgis2.catawbacountync.gov/arcgis/rest/services/Basemaps/Real_Estate_Basemap_Map/FeatureServer/2
      - https://arcgis2.catawbacountync.gov/arcgis/rest/services/Catawba_Basic_MIL1/MapServer/2
    layerId: 2
    geometry: polygon
    auth: none
    acreageField: CALCAC
    coverage: county-wide
    fieldMap:
      PIN: parcelId
      ACCOUNT: parcelIdAccount
      CALCAC: acreage
      ASSEDAC: acreage
      DEEDAC: acreage
      SURVEYAC: acreage
    notes: >
      Geometry-first parcels (no owner/sale/tax on layer). Count 94268; CALCAC 5–150 → 8494.
      MaxRecordCount 2000. Join PIN/ACCOUNT to energov or cc_owner_all for CAMA.
    status: partial

  - role: parcels
    name: Catawba_Basic cc_owner_all (CAMA table)
    restUrl: https://arcgis2.catawbacountync.gov/arcgis/rest/services/Catawba_Basic_MIL1/MapServer/19
    layerId: 19
    geometry: none
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      pinc: parcelId
      lrk: parcelIdAccount
      owner: ownerName
      owner2: ownerName
      address: mailingAddress
      address2: mailingAddress
      city: mailingAddress
      state: mailingAddress
      zip: mailingAddress
      sale_date: lastSale.date
      sale_amount: lastSale.price
      land_value: tax.marketValue
      bldg_value: tax.marketValue
      total_value: tax.marketValue
      taxaccount: other
    notes: >
      Attribute table (no geometry). Count 95119; sale_amount>0 → 73173. Typed integers for
      values/sale. Join pinc→PIN on Real_Estate/Catawba_Basic parcels. address_all table (15)
      has situs + calcac.
    status: usable

  - role: parcels
    name: NC OneMap Parcels (polys)
    restUrl: https://services.nconemap.gov/secure/rest/services/NC1Map_Parcels/FeatureServer/1
    alternateUrls:
      - https://services.gis.nc.gov/secure/rest/services/NC1Map_Parcels/FeatureServer/1
    layerId: 1
    geometry: polygon
    auth: none
    acreageField: gisacres
    coverage: county-wide
    fieldMap:
      parno: parcelId
      ownname: ownerName
      mailadd: mailingAddress
      mcity: mailingAddress
      mstate: mailingAddress
      mzip: mailingAddress
      siteadd: situsAddress
      scity: situsCity
      gisacres: acreage
      saledate: lastSale.date
      saledatetx: lastSale.date
      parval: tax.marketValue
      landval: tax.marketValue
      improvval: tax.marketValue
      cntyfips: other
    notes: >
      Statewide fallback. Filter cntyfips='035' (count 93505; gisacres 5–150 → 8502).
      No sale price. MaxRecordCount 5000. Join parno to county PIN.
    status: usable

  # --- Municipal / county zoning (city-first; spatial join to parcels) ---
  - role: zoning
    name: Zoning_All (county host — all jurisdictions)
    restUrl: https://arcgis2.catawbacountync.gov/arcgis/rest/services/energov/energov_permit_ctr/FeatureServer/60
    alternateUrls:
      - https://arcgis2.catawbacountync.gov/arcgis/rest/services/energov/ugly_map/FeatureServer/7
      - https://arcgis2.catawbacountync.gov/arcgis/rest/services/energov/energov_map/MapServer/66
    layerId: 60
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      Zoning: zoning
      GenZoning: zoning
      District: other
    notes: >
      Combined zoning for all cities + County. Count 5838. Filter District IN
      ('Hickory','Newton','Conover','Claremont','Maiden','Catawba','Brookford','Long View','County').
      Per-District counts (2026-09-24): Hickory 1736, Newton 796, Conover 621, Long View 276,
      Maiden 334, County 1719, Claremont 161, Catawba 126, Brookford 69. MaxRecordCount 1000.
      Prefer city-native Hickory Zoning inside Hickory limits.
    status: usable

  - role: zoning
    name: County Zoning (unincorporated)
    restUrl: https://arcgis2.catawbacountync.gov/arcgis/rest/services/energov/energov_permit_ctr/FeatureServer/59
    layerId: 59
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      ZONING: zoning
      GENZONING: zoning
      District: other
    notes: "Unincorporated County only. Count 1714. District default 'County'."
    status: usable

  - role: zoning
    name: Hickory Zoning (city native)
    restUrl: https://arcgis.hickorync.gov/server/rest/services/Zoning_Overlays/Hickory_Zoning/MapServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: null
    coverage: city-only
    fieldMap:
      Zoning: zoning
      Description: zoning
      General_Zoning: zoning
    notes: >
      City of Hickory native REST (CRS 102719/2264). Count 1740. Prefer over county
      Zoning_All District='Hickory' inside city limits. Overlays on Hickory_Overlays MapServer.
    status: usable

  - role: flu
    name: Hickory Future Land Use (city native)
    restUrl: https://arcgis.hickorync.gov/server/rest/services/Zoning_Overlays/Hickory_Future_Land_Use/MapServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: null
    coverage: city-only
    fieldMap:
      FLU: flu
    notes: >
      Hickory FLU polygons. Count 142. Codes include Low/Medium/High Density Residential,
      Neighborhood Mixed Use, Commercial Corridor, Industrial, Park, Public/Institutional, etc.
    status: usable

  - role: flu
    name: Small Area Districts / SAP (county planning areas)
    restUrl: https://arcgis2.catawbacountync.gov/arcgis/rest/services/energov/ugly_map/FeatureServer/27
    alternateUrls:
      - https://arcgis2.catawbacountync.gov/arcgis/rest/services/energov/energov_map/MapServer/43
    layerId: 27
    geometry: polygon
    auth: none
    acreageField: Acres
    coverage: county-wide
    fieldMap:
      NAME: flu
      Acres: acreage
    notes: >
      County Small Area Plan districts (community-based planning areas) — NOT full FLU
      land-use polygons. Count 23 (duplicate NAME rows). Names: ST STEPHENS/OXFORD,
      SHERRILLS FORD, MOUNTAIN VIEW, STARTOWN, PLATEAU, BALLS CREEK, CATAWBA.
      Parcel attr Small_Area_Plan also on energov Parcels. Policy maps often PDF.
    status: partial

  - role: other
    name: Cities (municipal limits)
    restUrl: https://arcgis2.catawbacountync.gov/arcgis/rest/services/catawba/Basemap/FeatureServer/5
    alternateUrls:
      - https://arcgis2.catawbacountync.gov/arcgis/rest/services/Basemaps/Real_Estate_Basemap/MapServer/12
    layerId: 5
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      CITY_NAME: other
    notes: >
      Jurisdiction polygons to choose zoning District. Distinct: BROOKFORD, CATAWBA,
      CLAREMONT, CONOVER, HICKORY, LONG VIEW, MAIDEN, NEWTON. ETJ on layer 6 / Real_Estate/13.
    status: usable

  - role: other
    name: Hickory Zoning Overlays
    restUrl: https://arcgis.hickorync.gov/server/rest/services/Zoning_Overlays/Hickory_Overlays/MapServer
    layerId: null
    geometry: polygon
    auth: none
    acreageField: null
    coverage: city-only
    fieldMap: {}
    notes: >
      Overlay stack: Zoning Petitions, Special Use Permits, 127 Overlay, Historic,
      Revitalization, High Rise Sign, Neighborhood Preservation, Henry River, Airport.
      Not base zoning — use after Hickory_Zoning.
    status: partial

municipalities:
  - name: Unincorporated Catawba
    zoningRestUrl: https://arcgis2.catawbacountync.gov/arcgis/rest/services/energov/energov_permit_ctr/FeatureServer/59
    zoningAllFilter: "District='County'"
    zoningField: ZONING
    join: spatial to energov Parcels/0 (CRS 2264); or filter Zoning_All District='County'
  - name: Hickory
    zoningRestUrl: https://arcgis2.catawbacountync.gov/arcgis/rest/services/energov/energov_permit_ctr/FeatureServer/60
    cityNativeZoningRestUrl: https://arcgis.hickorync.gov/server/rest/services/Zoning_Overlays/Hickory_Zoning/MapServer/0
    cityNativeFluRestUrl: https://arcgis.hickorync.gov/server/rest/services/Zoning_Overlays/Hickory_Future_Land_Use/MapServer/0
    zoningField: Zoning
    zoningAllFilter: "District='Hickory'"
    join: "prefer city-native Hickory_Zoning (1740) ∩ county parcels 2264; else Zoning_All District='Hickory' (1736)"
  - name: Newton
    zoningRestUrl: https://arcgis2.catawbacountync.gov/arcgis/rest/services/energov/energov_permit_ctr/FeatureServer/60
    zoningField: Zoning
    zoningAllFilter: "District='Newton'"
    join: spatial Zoning_All District='Newton' (796) to county parcels
