  - name: Catawba
    zoningRestUrl: https://arcgis2.catawbacountync.gov/arcgis/rest/services/energov/energov_permit_ctr/FeatureServer/60
    zoningField: Zoning
    zoningAllFilter: "District='Catawba'"
    join: spatial Zoning_All District='Catawba' (126) to county parcels
  - name: Brookford
    zoningRestUrl: https://arcgis2.catawbacountync.gov/arcgis/rest/services/energov/energov_permit_ctr/FeatureServer/60
    zoningField: Zoning
    zoningAllFilter: "District='Brookford'"
    join: spatial Zoning_All District='Brookford' (69) to county parcels
  - name: Long View
    zoningRestUrl: https://arcgis2.catawbacountync.gov/arcgis/rest/services/energov/energov_permit_ctr/FeatureServer/60
    zoningField: Zoning
    zoningAllFilter: "District='Long View'"
    join: spatial Zoning_All District='Long View' (276) to county parcels
    notes: "District spelling includes space: 'Long View'"

gaps:
  - No city-native ArcGIS for Newton / Conover / Claremont / Maiden / Catawba / Brookford / Long View — county Zoning_All District filter only
  - County FLU is Small Area Plan districts + parcel Small_Area_Plan text — not parcel-level future land-use polygons outside Hickory
  - Sale_Amount / tax values on energov are currency strings; Sale Validity only on CSV warehouse (not REST)
  - Real_Estate_Basemap parcels lack CAMA attrs — must join energov or cc_owner_all
  - MaxRecordCount 1000 on energov FeatureServer — paginate for full extract
  - LEO_HideName redacts some owners (~223)
  - Owner phones/emails not collected (public REST has none)
  - Utilities / AADT excluded by card rules

