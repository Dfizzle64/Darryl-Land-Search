gaps:
  - No sale PRICE on parcel polygons — join Cadastral/Chatham_PropertySales table (parcel_Number) for price/date/qualified
  - Zoning district layers are merged polygons (Pittsboro 24 / Siler City 22 / County 555) — parcel zoning attr is denser for routing; spatial join still preferred for official district geometry
  - County Future Land Use Framework is thematic multi-layer group, not a single countywide FLU-code coverage
  - No dedicated public city GIS hosts for Pittsboro / Siler City / Goldston — county LandUsePlanning layers ARE the city zoning REST
  - Cary / Apex tips only on county host — prefer Wake cards for those city cores
  - Apex Zoning only 2 annexation polygons (partial)
  - FeatureServer SOE not installed on gisservices — query MapServer endpoints
  - Comper (nc-chatham-citizen.comper.info) is a commercial appraisal tool — excluded (no paid vendors)
  - Do not dig utilities / AADT / phones / emails
