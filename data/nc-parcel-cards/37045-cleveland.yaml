  - name: Unincorporated Cleveland
    zoningRestUrl: https://gis.clevelandcounty.com/arcgis/rest/services/Planning/Zoning/FeatureServer/0
    zoningField: ZoneType
    join: spatial to Basemap Parcels/2 (CRS 2264); exclude city zoning footprints first
  - name: Shelby
    zoningRestUrl: https://gis.clevelandcounty.com/arcgis/rest/services/Planning/Zoning/FeatureServer/6
    zoningField: ZoneType
    join: spatial Shelby Zoning (1371) ∩ county parcels; prefer over county Zoning/0 inside city/ETJ
    notes: No public city-native ArcGIS; cityofshelby.com GIS page links staff-only Hub
  - name: Kings Mountain
    zoningRestUrl: https://gis.clevelandcounty.com/arcgis/rest/services/Planning/Zoning/FeatureServer/5
    zoningField: ZoneType
    join: spatial KM Zoning (7888) ∩ Cleveland parcels; Gaston-side KM → Gaston card (37071)
    notes: Straddles Cleveland/Gaston — Cleveland card covers Cleveland FIPS only
  - name: Boiling Springs
    zoningRestUrl: https://gis.clevelandcounty.com/arcgis/rest/services/Planning/Zoning/FeatureServer/9
    fluRestUrl: https://www.webgis.net/arcgis/rest/services/NC/Cleveland/MapServer/30
    zoningField: ZoneType
    fluField: Future
    join: spatial BS Zoning (241) + BS Land Use Plan (70)
  - name: Grover
    zoningRestUrl: https://gis.clevelandcounty.com/arcgis/rest/services/Planning/Zoning/FeatureServer/0
    zoningField: ZoneType
    join: no town-specific ZoneType layer — use county Zoning/0 + Jurisdiction NAME='GROVER'
    notes: Zoning district REST gap for Grover
  - name: Small towns (Casar, Fallston, Kingstown, Lattimore, Patterson Springs, Polkville, Waco)
    zoningRestUrl: https://gis.clevelandcounty.com/arcgis/rest/services/Planning/Zoning/FeatureServer/40
    zoningField: ZoneType_Code
    join: layer 40 stubs are N/A — fall back to county Zoning/0
    notes: status gap for district codes
  - name: Belwood / Earl / Lawndale / Mooresboro
    zoningRestUrl: https://gis.clevelandcounty.com/arcgis/rest/services/Planning/Zoning/FeatureServer/0
    zoningField: ZoneType
    join: Jurisdiction footprint only; no town ZoneType layer published
  - name: Belmont tip
    zoningRestUrl: null
    join: n/a — Belmont is Gaston County (37071), not Cleveland; no Belmont polygon in Cleveland Jurisdiction
    notes: User tip clarified as out-of-county

gaps:
  - No last-sale price/date on primary parcel REST — join Vacant/Improved Lot Sales by COUNTY_PID (partial sale sets, not full history)
  - NC OneMap gisacres is 0 for Cleveland (cntyfips='045') — acreage filters must use county GIS_Calculated_Acres
  - Basemap parcel count 70189 vs Tax Parcel Area 60300 vs OneMap 59964 — prefer Basemap for CAMA; reconcile IDs carefully
  - Small-town zoning district codes missing (Town Jurisdiction stubs N/A; Grover/Belwood/Earl/Lawndale/Mooresboro no ZoneType layer)
  - No public Shelby or Kings Mountain native FLU FeatureServer — only county Original_LandUsePlan + Boiling Springs Future
  - Zoning_AGOL FeatureServer/1 is ordinance-edit scratch (count 1) — not production zoning
  - No independent public city ArcGIS for Shelby/KM/Boiling Springs — county Planning/Zoning host is authoritative
  - WebGIS viewer querystring (?pid= / ?PIN=) loads map shell; reliable PA deep-link is PropertyCard.php?pid=
  - Owner phones/emails not collected (public REST has none)
  - Utilities / AADT excluded by card rules

