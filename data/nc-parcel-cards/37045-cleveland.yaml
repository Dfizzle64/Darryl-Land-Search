# PRIMARY — wire first for county-wide site search (CAMA + polygons)
layers:
  - role: parcels
    name: Basemap Parcels (CAMA + polygons)
    restUrl: https://gis.clevelandcounty.com/arcgis/rest/services/Basemap/Basemap/FeatureServer/2
    alternateUrls:
      - https://gis.clevelandcounty.com/arcgis/rest/services/Basemap/Basemap/MapServer/2
      - https://gis.clevelandcounty.com/arcgis/rest/services/Basemap/Parcels/MapServer/0
    layerId: 2
    geometry: polygon
    auth: none
    acreageField: GIS_Calculated_Acres
    coverage: county-wide
    fieldMap:
      GIS_PIN: parcelId
      GIS_PID: parcelIdAccount
      COUNTY_PID: parcelIdAccount
      LOCATE_PID: parcelIdAccount
      GIS_Calculated_Acres: acreage
      GIS_Deeded_Acres: acreage
      COUNTY_ACRES: acreage
      COUNTY_OWNER_1: ownerName
      COUNTY_OWNER_2: ownerName
      GIS_Owner1: ownerName
      GIS_Owner2: ownerName
      COUNTY_MAILING_ADDRESS: mailingAddress
      COUNTY_CITY: mailingAddress
      COUNTY_STATE: mailingAddress
      COUNTY_ZIP: mailingAddress
      COUNTY_ADDRESS: situsAddress
      LOCATE_ADDRESS: situsAddress
      COUNTY_LAND_VALUE: tax.marketValue
      COUNTY_BUILDING_VALUE: tax.marketValue
      COUNTY_TOTAL_VALUE: tax.marketValue
      COUNTY_NBRHD: other
      COUNTY_T_DIST: other
      COUNTY_TAX_YEAR: other
      GIS_DeedBook_Page: other
    notes: >
      PRIMARY verified 2026-09-24: count 70189; GIS_Calculated_Acres BETWEEN 5 AND 150 → 14154;
      COUNTY_TOTAL_VALUE>0 → 69677; COUNTY_OWNER_1 not null → 69689. CRS 102719/2264.
      MaxRecordCount 2000. Prefer COUNTY_* CAMA fields over GIS_Owner* when both present.
      No last-sale price/date on parcel layer — join Tax/Vacant_ImprovedLot_Sales by Parcel_Number=COUNTY_PID.
      Same attrs on Basemap/Parcels/MapServer/0 (ParcelsAtt). Geo-check sample centroid ≈ -81.43, 35.25 (Cleveland).
    status: usable

  - role: parcels
    name: Tax Parcel Area (geometry + GIS owner/PIN)
    restUrl: https://gis.clevelandcounty.com/arcgis/rest/services/Tax/Tax/FeatureServer/1
