    geometry: polygon
    auth: none
    acreageField: GIS_Calculated_Acres
    coverage: county-wide
    fieldMap:
      GIS_PIN: parcelId
      GIS_PID: parcelIdAccount
      GIS_Calculated_Acres: acreage
      GIS_Deeded_Acres: acreage
      GIS_Owner1: ownerName
      GIS_Owner2: ownerName
    notes: >
      Count 60300 — closer to NC OneMap (~59964) than Basemap/2 (70189). Lacks COUNTY_* tax/mailing
      CAMA attrs; prefer Basemap/Basemap/FeatureServer/2 for land-search attributes.
    status: partial

  - role: parcels
    name: NC OneMap Parcels (polys)
    restUrl: https://services.nconemap.gov/secure/rest/services/NC1Map_Parcels/FeatureServer/1
