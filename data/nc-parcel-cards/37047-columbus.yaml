gaps:
  - No county ArcGIS FeatureServer for parcels/zoning — OneMap + taxdata + MangoMap
  - OneMap gisacres broken — use Shape__Area/43560
  - OneMap parval incomplete — prefer taxdata GTOTVL
  - No sale price on OneMap — use taxdata GSLAMT
  - FLU FeatureServer gap — CLUP PDF only
  - No separate city zoning/FLU FeatureServers
  - MangoMap identify/GeoJSON only (no bulk ArcGIS REST)
  - Utilities / AADT / emails / phones / paid vendors out of scope

