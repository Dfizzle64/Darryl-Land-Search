      GACRE 5–150 → 12238; GSLAMT>0 19025; GTOTVL>0 53478; TVLAND>0 51495;
      GPURL on every row. Join GPIN=parno. Prefer GACRE + GTOTVL + GSLAMT over OneMap.
      GCICOD: blank unincorp 40172, WH 4047, SW 2691, WA 2026, CH 1660, FB 973,
