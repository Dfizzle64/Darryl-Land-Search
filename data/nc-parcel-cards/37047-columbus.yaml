      count 51709; Shape__Area 5–150 ac → 12081; ownname/siteadd/altparno ~51091;
      landval>0 51080; improvval>0 24914; parval>0 only 18709 (prefer taxdata GTOTVL).
      CRITICAL: gisacres broken for Columbus — derive acres as Shape__Area/43560
      (CRS 102719/2264). Join parno=GPIN; altparno=GSEQ for PRC deep-link.
      No sale price. MaxRecordCount 5000. Sample centroid ~-78.767, 34.397.
