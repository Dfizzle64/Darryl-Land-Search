      Filter cntyfips='051'. Verified count 140513. parno often blank; gisacres near-zero —
      prefer recareano or county ACREAGE. Spatial join to Tax/Parcels for PIN. No sale price.
      Alternate host services.gis.nc.gov. MaxRecordCount 5000.
    status: usable

