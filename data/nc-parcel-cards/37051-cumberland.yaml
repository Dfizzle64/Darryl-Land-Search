      PRIMARY FLU. Count 738. Land_Use top Suburban Density Residential/Commercial/Low Density/
      Open Space/Medium Density/Farmland/Rural Density/Industrial/High Density/O&I.
      Plan areas: Northeast, North Central, South Central, Hope Mills Area, Spring Lake Area,
      Eastover, Southeast, Stedman, Vander, Bethany. Alternate CCFutureLandUseAll/0 count 870.
    status: usable

  - role: flu
    name: CCFutureLandUseAll (2024 merge)
