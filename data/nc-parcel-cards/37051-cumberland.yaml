    notes: >
      Multi-part: Fayetteville, Hope Mills, Spring Lake, Eastover, Wade, Stedman, Falcon,
      Godwin, Linden. Gate city-first zoning joins.
    status: usable

  - role: other
    name: MMLayers AddressPts
    restUrl: https://gis.co.cumberland.nc.us/server/rest/services/Tax/MMLayers/MapServer/0
    layerId: 0
    geometry: point
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap: {}
