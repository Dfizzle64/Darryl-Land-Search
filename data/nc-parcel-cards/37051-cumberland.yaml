      Mirror MMLayers/17 FayZoning. Prefer over parcel Zoning stub inside city.
    status: usable

  - role: zoning
    name: Cumberland County Zoning (county + towns Jurisdiction)
    restUrl: https://gis.co.cumberland.nc.us/server/rest/services/Planning/CCZoning/MapServer/1
    layerId: 1
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
