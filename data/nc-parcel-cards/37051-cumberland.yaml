      PRIMARY wire-first verified 2026-09-24: count 140670 rows (multi-bldg CAMA — dedupe by
      PIN/REID/FEATURE_KEY); ACREAGE 5–150 → 8665; TOTAL_BLDG_VALUE_ASSESSED=0/null in band → 4496;
      PKG_SALE_PRICE>0 in band → 887. CRS 102719/2264. MaxRecordCount 2000 — paginate.
      Geo-check REID 0414581081000 / PIN 0414-58-1081 ≈ -78.949, 34.981 (Hope Mills).
      FeatureServer SOE not enabled. MMLayers/7 Parcels mirror.
    status: usable

  - role: parcels
    name: NC OneMap Parcels (fallback)
    restUrl: https://services.nconemap.gov/secure/rest/services/NC1Map_Parcels/FeatureServer/1
    layerId: 1
    geometry: polygon
    auth: none
    acreageField: recareano
    coverage: county-wide
    fieldMap:
      parno: parcelId
      ownname: ownerName
      mailadd: mailingAddress.street
