  tax:
    fields:
    - TOTAL_PROP_VALUE
    - TOTAL_LAND_VALUE_ASSESSED
    liveNonZero:
      TOTAL_PROP_VALUE: 134909
      TOTAL_LAND_VALUE_ASSESSED: 139847
