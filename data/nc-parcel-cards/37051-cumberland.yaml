      Count 138449. Situs join when LOCATION_ADDR thin. Also E911/Addresses folder.
    status: usable

gaps:
  - Tax/Parcels FeatureServer SOE not enabled — MapServer only
  - OneMap parno often blank; gisacres broken — use recareano or county ACREAGE; spatial join for PIN
  - Multi-building duplicate polygon rows on Tax/Parcels — dedupe by PIN/REID/FEATURE_KEY
  - No separate Fayetteville city FLU FeatureServer — county area-plan FLU only
  - ITSPublicDL shared host is Duplin-branded — do not wire for Cumberland
  - camapwa PropertySummary requires REID or PARCELPK — PIN querystring alone empty
  - Sale enrichment via ParcelSales category layers; not full multi-transfer API

