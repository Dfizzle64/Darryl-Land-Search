      Jurisdiction: municipality
      CAMA_CODE: camaCode
      CondU: conditionalUse
      CASE_NO: caseNumber
    notes: >
      Count 2523. Cities-first via Jurisdiction: Hope Mills 189, Spring Lake 137, Eastover 101,
      Wade 40, Stedman 28, Linden 24, Falcon 23, Godwin 17; blank+COUNTY ~1964 unincorporated.
      Top Zone_Class RR/C(P)/R40A/R6A/R10/R40/C3/A1. Mirror MMLayers/16 CC_Zoning.
    status: usable

  - role: zoning
