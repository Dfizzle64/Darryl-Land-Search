    notes: >
      Filter cntyfips='055'. Count 40483; gisacres 5–150 → 902; parval>0 → 40079;
      saledate present. Prefer county gis_polygons for zoning + CAMA. Alt host services.gis.nc.gov.
    status: usable

  - role: sales
    name: sales_layer (GeoServer WFS join on id)
    restUrl: https://gs.darecountync.gov/geoserver/Production/wfs
    typeName: Production:sales_layer
    geometry: polygon
    auth: none
    coverage: county-wide
