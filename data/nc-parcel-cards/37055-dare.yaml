      taxdistnam: municipality
      taxdist: taxDistrict
      id: salesJoinId
      puse: useCode
      buildtype: buildingType
      yearbt: yearBuilt
      livingunit: livingUnits
    notes: >
      PRIMARY wire-first verified 2026-09-24: count 47870; calcacre 5–150 → 2222;
      totval>0 → 47624; bldgval 0/null in band → 943. CRS 102100/3857. MaxRecordCount 2000.
      Values stored as strings — cast on ingest. Sale price NOT on this layer (join sales_layer.id
      or sales_points.parcel or Land Transfer HTML). WFS twin Production:gis_polygons count 47902.
      Geo-check Duck parcel 010219044 / pin 986805294956 ≈ -75.740,36.152;
      Hatteras pin 959518405776 ≈ -75.669,35.217.
    status: usable

  - role: parcels
    name: NC OneMap Parcels (fallback)
    restUrl: https://services.nconemap.gov/secure/rest/services/NC1Map_Parcels/FeatureServer/1
    layerId: 1
    geometry: polygon
    auth: none
    acreageField: gisacres
    coverage: county-wide
    fieldMap:
      parno: parcelId
      altparno: parcelIdAlt
      ownname: ownerName
      mailadd: mailingAddress.street
      mcity: mailingAddress.city
      mstate: mailingAddress.state
      mzip: mailingAddress.zip
      siteadd: situsAddress
      scity: situsCity
      gisacres: acreage
      parval: tax.marketValue
      landval: tax.landValue
      improvval: tax.improvementValue
      saledate: lastSale.date
