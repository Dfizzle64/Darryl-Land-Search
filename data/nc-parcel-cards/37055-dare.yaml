# ---- PASS 2 full-suite upgrade (rural OZ), verifiedAt 2026-09-28; mirrors the json pass2 key ----
pass2:
  label: PASS 2 full-suite upgrade (rural OZ) 2026-09-28
  verifiedAt: '2026-09-28'
  verifiedBy: North Carolina Public Info Researcher
  parcelLayer: https://services1.arcgis.com/ozZJ6IIlcOT869Kx/arcgis/rest/services/gis_polygons/FeatureServer/0
  parcelIdField: parcel
  acreageFilter: calcacre >= 5 AND calcacre <= 150
  acres5to150Live: 2222
  parcelCountLive: 47870
  aadt:
    primary2022:
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0
      valueField: AADT_2022 (string; trim, blank = no count)
      countyFilter: COUNTY='DARE'
      queryUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27DARE%27&outFields=LocationID%2CROUTE%2CLOCATION%2CCOUNTY%2CAADT_2022&returnGeometry=true&outSR=4326&f=json
      countUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27DARE%27&returnCountOnly=true&f=json
      liveStationCount: 132
      stationsWithAADT2022: 33
    newer2025:
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1
      valueField: AADT_2025 (integer; also AADT_2024, AADT_2002-2025)
      countyFilter: County='Dare'
      countyFilterNote: Title case County name (2022 layer uses uppercase COUNTY)
      queryUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Dare%27&outFields=LocationID%2CRouteID%2CLocated_On%2CCounty%2CAADT_2024%2CAADT_2025&returnGeometry=true&outSR=4326&f=json
      countUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Dare%27&returnCountOnly=true&f=json
      liveStationCount: 107
      stationsWithAADT2025: 81
      stationsWithAADT2024: 66
      dataLastEdit: '2026-09-23'
    also:
      stations2024Service: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT__2024_AADT_Stations_published_September_2025/FeatureServer/0
      segments2025: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/0
    recommendation: 'Newer year IS on REST: prefer NCDOT_2025 layer 1 (AADT_2025, falling back to AADT_2024 then AADT_2022 when the newest is null). The 2022 layer is kept as the documented baseline.'
  tax:
    fields:
    - totval
    - landval
    allTaxFieldsOnLayer:
    - totval
    - landval
    - bldgval
    - miscval
    - taxdist
    liveNonZero:
      totval: 47624
      landval: 46938
    status: ok
    note: 'Value fields are strings: use CAST(field AS FLOAT) > 0.'
  sale:
    priceFields: []
    dateFields: []
    livePriceNonZero: {}
    liveDateNonNull: {}
    status: partial
    note: 'Date: NC OneMap saledate non-null 40,483 of 40,483 for cntyfips=''055'' (live 2026-09-28; join parcel). Price not on REST; public on Dare PA (property.spatialest.com/nc/dare or tax.darecountync.gov/landtransfer/parcel.php?parcel={parcel}).'
  ownerEntity:
    ownerFields:
    - owner1
    - owner2
    primaryOwnerField: owner1
    rule: 'Uppercase and trim the owner name(s), then flag as entity if it matches the regex (apply to every owner field; any hit = entity). Note: TRUSTEE does not match the TRUST word rule, and a surname such as CHURCH at the start of the name is a known false positive.'
    regex: \b(LLC|L\.L\.C\.?|INC\.?|CORP(ORATION)?|LP|L\.P\.|LLP|LTD|TRUST|CHURCH|COMPANY|PARTNERSHIP|HOLDINGS|PROPERTIES)\b|^(CITY|COUNTY|STATE|TOWN) OF\b
    tokens:
    - LLC
    - INC
    - LP
    - LLP
    - LTD
    - TRUST
    - CHURCH
    - COMPANY
    - PARTNERSHIP
    - HOLDINGS
    - PROPERTIES
    - CORP/CORPORATION
    prefixes:
    - CITY OF
    - COUNTY OF
    - STATE OF
    - TOWN OF
    sqlApproxWhere: (UPPER(owner1) LIKE '% LLC%' OR UPPER(owner1) LIKE '% INC%' OR UPPER(owner1) LIKE '% LP%' OR UPPER(owner1) LIKE '% LLP%' OR UPPER(owner1) LIKE '% LTD%' OR UPPER(owner1) LIKE '% TRUST%' OR UPPER(owner1) LIKE '% CHURCH%' OR UPPER(owner1) LIKE '% COMPANY%' OR UPPER(owner1) LIKE '% PARTNERSHIP%' OR UPPER(owner1) LIKE '% HOLDINGS%' OR UPPER(owner1) LIKE '% PROPERTIES%' OR UPPER(owner1) LIKE '% CORP%' OR UPPER(owner1) LIKE '%,LLC%' OR UPPER(owner1) LIKE '%,INC%' OR UPPER(owner1) LIKE 'CITY OF %' OR UPPER(owner1) LIKE 'COUNTY OF %' OR UPPER(owner1) LIKE 'STATE OF %' OR UPPER(owner1) LIKE 'TOWN OF %')
    liveEntityCountAll: 7504
    liveEntityCount5to150ac: 477
    countNote: The live count uses the SQL approximation (LIKE '% TOKEN%' on the primary owner field, which also catches TRUSTEE/INCOME-style prefixes) together with the acreage filter above.
  paDeepLink:
    template: https://tax.darecountync.gov/taxbill_view.php?parcel={parcel}
    testedParcelId: 005059000
    testedUrl: https://tax.darecountync.gov/taxbill_view.php?parcel=005059000
    httpStatus: 200
    contentType: text/html; charset=UTF-8
    contentVerified: true
    note: 'Uses tax.darecountync.gov taxbill_view.php (server-rendered, id verified). Spatialest #/property/{parcel} is an SPA alternate.'
  gisViewer:
    url: https://maps.darecountync.gov/
    httpStatus: 200
    pageTitle: Dare County Parcel Data
  gaps:
  - sale partial
