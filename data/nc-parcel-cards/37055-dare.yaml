gaps:
  - No public FLU FeatureServer (CAMA LUP / town LUP PDF-edocs only; landClass is NLCD not FLU)
  - City zoning polygons are GeoServer WFS/WMS only (no AGOL FeatureServer); parcel.zoning attribute covers all
  - Sale price missing on parcel FeatureServer — join sales_layer.id / sales_points.parcel or Land Transfer HTML
  - AGOL gis_polygons count 47870 vs WFS 47902 drift
  - darenc.gov intermittent 403 from some fetch providers

