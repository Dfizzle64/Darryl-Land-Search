    geometry: polygon
    auth: none
    acreageField: calcacre
    coverage: county-wide
    fieldMap:
      parcel: parcelId
      pin: parcelIdAlt
      pin14: parcelIdPin14
      calcacre: acreage
      docacre: acreageDeed
      owner1: ownerName
      owner2: ownerName2
      mailaddr1: mailingAddress.street
      mailaddr2: mailingAddress.street2
      mailcity: mailingAddress.city
      mailstate: mailingAddress.state
      mailzip: mailingAddress.zip
      stnum: situsHouse
      stdir: situsDir
      stname: situsStreet
