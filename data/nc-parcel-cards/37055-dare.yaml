      recorddt: lastSale.date
      saleval: lastSale.qualified
      saletype: lastSale.improvedOrVacant
      saleyear: lastSale.year
      sfla: lastSale.sfla
    notes: >
      Count 7622; all tasaleprice>0; band join hits 352. Join sales_layer.id = gis_polygons.id.
      No AGOL FeatureServer. saleval Q = qualified; saletype I/V.
    status: usable

