      sl1dt: lastSale.day
      sl1mo: lastSale.month
      sl1year: lastSale.year
      sl1type: lastSale.type
    notes: >
      Count 43978; sl1price>0 → 30840; band with price → 1171. Join on parcel.
    status: usable

