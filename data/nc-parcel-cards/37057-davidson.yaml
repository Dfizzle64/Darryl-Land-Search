    liveOwnerNonNull5to150: 12102
    entityQuery: where=LegalLandType='AC' AND LegalLandUnits>=5 AND LegalLandUnits<=150 AND (Name1 LIKE '% LLC%' OR Name1 LIKE '%,LLC%' OR Name1 LIKE '% L L C%' OR Name1 LIKE '% INC' OR Name1 LIKE '% INC %' OR Name1 LIKE '% INC.%' OR Name1 LIKE '%,INC%' OR Name1 LIKE '% CORP%' OR Name1 LIKE '%CORPORATION%' OR Name1 LIKE '% LP' OR Name1 LIKE '% LP %' OR Name1 LIKE '% L P' OR Name1 LIKE '% LLP%' OR Name1 LIKE '% LTD%' OR Name1 LIKE '%TRUST%' OR Name1 LIKE '%CHURCH%' OR Name1 LIKE '%MINISTR%' OR Name1 LIKE '% COMPANY%' OR Name1 LIKE '%PARTNERSHIP%' OR Name1 LIKE '%HOLDINGS%' OR Name1 LIKE '%PROPERTIES%' OR Name1 LIKE '%INVESTMENT%' OR Name1 LIKE '%ASSOCIATION%' OR Name1 LIKE '%FOUNDATION%' OR Name1 LIKE '%AUTHORITY%' OR Name1 LIKE 'CITY OF %' OR Name1 LIKE 'COUNTY OF %' OR Name1 LIKE 'STATE OF %' OR Name1 LIKE 'TOWN OF %' OR Name1 LIKE '% COUNTY' OR Name1 LIKE '%BOARD OF EDUCATION%' OR Name1 LIKE 'UNITED STATES%' OR Name1 LIKE 'NORTH CAROLINA %' OR Name1 LIKE '% DEVELOPMENT%')
