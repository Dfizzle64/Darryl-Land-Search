gaps:
  - No SalePrice on public ArcGIS REST (ITS Basic Search Sales Date & Price is HTML-only)
  - OneMap Davie saledate empty (count 0); no statewide sale price
  - Bermuda Run and Cooleemee — no dedicated public FLU FeatureServer
  - Zoning MapServer query not supported — use FeatureServer/0
  - Address points lack PIN join key
  - Rare NCPIN stubs (ROAD / short / null) — filter
  - MortgageHolder / MortgageLoanNumber on Parcels/7 — do not collect
  - Last-sale year/month only; no multi-transfer price history FeatureServer
  - MaxRecordCount 2000 on county layers — paginate
  - No independent municipal ArcGIS hosts; no paid vendor data; no phones/emails

