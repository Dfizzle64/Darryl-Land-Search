gaps:
  - No independent city ArcGIS FeatureServers — county-host layers + Rocky Mount ViewPro only
  - Rocky Mount Edgecombe tip (144) incomplete vs Nash-side Avineon_WebTemplate/72 (2972) — use Nash card inside Nash limits
  - Whitakers city_limits without Edgecombe zoning layer — prefer Nash Avineon_WebTemplate/75
  - FLU gap — Land Use Districts only UA/UB (2); no detailed FLUM REST
  - Parcel zone attribute noisy/partial (~36%) — prefer spatial join to zoning layers
  - Address Points lack PIN — spatial join only; prefer location / OneMap siteadd
  - Keystone PA detail prefers POST pKEY={linkpin}; bare GET may show empty shell; search PIN ####-##-####-##
  - Last-sale only on parcel; no multi-transfer history layer
  - Sharpsburg / Whitakers / Rocky Mount span adjacent counties — clip to Edgecombe
  - MaxRecordCount 1000 — paginate; ParcelFabric/Hosted token-required (499); no phones/emails; no AADT/utilities; no paid vendors
