    - COMPANY
    - PARTNERSHIP
    - HOLDINGS
    - PROPERTIES
    - CORP/CORPORATION
    prefixes:
    - CITY OF
    - COUNTY OF
    - STATE OF
    - TOWN OF
    sqlApproxWhere: (UPPER(CURRENTOWNERNAME1) LIKE '% LLC%' OR UPPER(CURRENTOWNERNAME1) LIKE '% INC%' OR UPPER(CURRENTOWNERNAME1) LIKE '% LP%' OR UPPER(CURRENTOWNERNAME1) LIKE '% LLP%' OR UPPER(CURRENTOWNERNAME1) LIKE '% LTD%' OR UPPER(CURRENTOWNERNAME1) LIKE '% TRUST%' OR UPPER(CURRENTOWNERNAME1) LIKE '% CHURCH%' OR UPPER(CURRENTOWNERNAME1) LIKE '% COMPANY%' OR UPPER(CURRENTOWNERNAME1) LIKE '% PARTNERSHIP%' OR UPPER(CURRENTOWNERNAME1) LIKE '% HOLDINGS%' OR UPPER(CURRENTOWNERNAME1) LIKE '% PROPERTIES%' OR UPPER(CURRENTOWNERNAME1) LIKE '% CORP%' OR UPPER(CURRENTOWNERNAME1) LIKE '%,LLC%' OR UPPER(CURRENTOWNERNAME1) LIKE '%,INC%' OR UPPER(CURRENTOWNERNAME1) LIKE 'CITY OF %' OR UPPER(CURRENTOWNERNAME1) LIKE 'COUNTY OF %' OR UPPER(CURRENTOWNERNAME1) LIKE 'STATE OF %' OR UPPER(CURRENTOWNERNAME1) LIKE 'TOWN OF %')
    liveEntityCountAll: 34014
    liveEntityCount5to150ac: 2540
    countNote: The live count uses the SQL approximation (LIKE '% TOKEN%' on the primary owner field, which also catches TRUSTEE/INCOME-style prefixes), so it runs slightly high, together with the acreage filter above.
