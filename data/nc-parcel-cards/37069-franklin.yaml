gaps:
  - No public FLU polygon REST (county Comp Plan / town CLUP/CLUTP are PDF-only)
  - Louisburg / Franklinton / Bunn lack public zoning FeatureServers — use parcel ZONING attr + City Limits; Youngsville has AGOL FS; Wake Forest tip uses Wake Zoning/25
  - Centerville dissolved — no citylimits; CTVF tax district (~1675) only
  - Web View Parcels ACRES is string (numeric SQL filters fail) — use TaxZoning ACRES or COMPACRES
  - TOT22 market field null on REST — use APRLAND+APRBLDG
  - ADR* situs parts often empty — join Address Points
  - Hosted/Planning_Opengov FeatureServer token-required (blocked)
  - NCSU Youngsville_File_MS SSL certificate expired (blocked 2026-09-24)
  - Roktech franklin_GM4 viewer (maps.roktech.net) linked from towns — no public REST root found
  - franklincountymaps.net layer queries return 403 without browser User-Agent
  - TaxZoning pagination unsupported on some queries — page by OBJECTID/envelope
  - No multi-transfer sales history beyond last deed + annual qualified-sales layers
  - No paid vendor data; no phones/emails; no AADT/utilities dig
