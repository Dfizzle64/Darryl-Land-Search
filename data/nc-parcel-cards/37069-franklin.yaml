  verifiedBy: North Carolina Public Info Researcher
  parcelLayer: https://www.franklincountymaps.net/arcgis/rest/services/OperationalLayers/MapServer/0
  parcelIdField: PARID
  acreageFilter: ACRES cast to number, 5–150 (client-side; field is string)
  acres5to150Live: 8310
  parcelCountLive: 50019
  aadt:
    primary2022:
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0
      valueField: AADT_2022 (string; trim, blank = no count)
