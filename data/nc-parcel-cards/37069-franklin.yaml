    geometry: polygon
    auth: none
    acreageField: ACRES
    coverage: county-wide
    fieldMap:
      PARID: parcelId
      PIN: parcelIdPin
      ALTID: parcelIdAlt
      ACRES: acreage
      OWN1: ownerName
      OWN2: ownerName2
      ADDR1: mailingAddress.street
      ADDR2: mailingAddress.street2
      CITYNAME: mailingAddress.city
      STATECODE: mailingAddress.state
      ZIP1: mailingAddress.zip
      ADRNO: situs.number
      ADRDIR: situs.prefix
      ADRSTR: situs.street
      ADRSUF: situs.streetType
      APRLAND: tax.landValue
      APRBLDG: tax.improvementValue
      OBYVAL: tax.obxfValue
      TOT22: tax.marketValueLegacy
      SALEDT: lastSale.date
      PRICE: lastSale.price
      DeedBook: lastSale.deedBook
      DeedPage: lastSale.deedPage
      ZONING: zoning
      CLASS: dorCode
      TAXDIST: taxDistrict
      SUBDIV: subdivision
      LEGAL1: legalDescription
    notes: >
      PRIMARY wire-first verified 2026-09-24: count 50019; PRICE>0 → 29721;
      APRBLDG=0/null → 13912. CRS 102719/2264. MaxRecordCount 2000 — paginate.
      Rich CAMA on polygon: owner, mailing, land/bldg assessed, last sale, zoning attr,
      PIN/PARID. ACRES is STRING — numeric BETWEEN filters fail; use TaxZoning/42
      (numeric ACRES) or tax/51 COMPACRES for 5–150 filters, or client-side cast.
      TOT22 entirely null on REST — derive market ≈ APRLAND+APRBLDG. CITYNAME is
      mailing city (not munis). ADR* situs parts often empty — join Address Points by PIN.
      Geo-verify sample centroids ~-78.19/36.23 and ~-78.15/36.11 (Franklin). 
      Layer metadata/query needs browser User-Agent (403 without).
    status: usable

