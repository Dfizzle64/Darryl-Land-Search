gaps:
  - Stem — no dedicated public zoning FeatureServer; GC_ZONING only has STEM PLANNING AND ZONING AREA stub
  - Parcel layer Zoning attribute is empty on live REST — always spatial-join district layers
  - No independent municipal ArcGIS hosts for Oxford/Butner/Creedmoor/Stem/Stovall — city zoning published on county AGOL
  - City-specific FLU FeatureServers not found — county Granville_FLU/11 is the public FLU surface
  - ITSPublic ViewParcel property card is AJAX/POST — durable GET deep-links are RealEstateSearch/Parcel/{Parcel} and TaxBillSearch/Parcel/{Parcel}
  - Web maps mislabel Parcels as Granville_Service/9 (actually Townships) — use layer 8
  - MaxRecordCount 1000 on county AGOL layers — paginate
  - NC OneMap lacks SalePrice — prefer county parcels for lastSale.price
  - No phones/emails collected; no paid vendors; utilities and AADT out of scope

