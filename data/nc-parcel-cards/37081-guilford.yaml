gaps:
  - Summerfield / Oak Ridge / Stokesdale / Jamestown / Pleasant Garden / Sedalia / Whitsett / Gibsonville lack dedicated public city FeatureServers — use Combined_Zoning (and GISDV Zoning for Whitsett/Stokesdale/Pleasant Garden/Sedalia)
  - Summerfield publishes PDF zoning map only (no town REST); county Combined SUMMERFIELD 242
  - Combined_Zoning WHITSETT only 1 polygon — prefer GISDV Zoning WHITSETT 43
  - Burlington tip / Archdale tip / Kernersville tip are edge fragments; prefer Alamance/Randolph/Forsyth city cards for core of those cities
  - No multi-transfer sales history REST comparable to Forsyth SalesApp — only last PKG/LAND sale on parcel + commercial Sales_gdb
  - Greensboro zoning/FLU CRS is 3857 — reproject to 2264 for parcel overlay
  - GISDV Zoning excludes GSO/HP/Summerfield/Oak Ridge/Jamestown — do not use as sole countywide zoning
  - FLUM typo category "Industrial Inovation" is source spelling
  - No paid vendor data; no phones/emails collected; no AADT/utilities dig
