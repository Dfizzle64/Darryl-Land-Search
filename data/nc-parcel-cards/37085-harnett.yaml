gaps:
  - No dedicated public city FeatureServers for Dunn, Lillington, Angier, Coats — county ZoningDistricts is the public muni zoning REST (filter Jurisdiction)
  - Angier ZoningDistricts only 97 polygons vs ~5.2k Angier-jurisdiction parcels — prefer parcel Zoning attribute; Wake Angier layer is Wake-edge only
  - Erwin AGOL town zoning is 2005 vintage (28 polys) — prefer county ZoningDistricts Erwin=106
  - No city FLU FeatureServers — county Future LandUse uses Municipal/ETJ placeholder inside towns
  - Trakit/Trakit MapServer/1 advertises LinktoPropertyCard / FutureLandUse but live queries return 400 — do not wire
  - Tax/Parcels is MapServer only (FeatureServer SOE missing) — query MapServer/0
  - REID field often "Retired" — do not use as join key
  - No multi-transfer sales history comparable to Forsyth SalesApp — last sale on parcel + Sales / QualifiedSales subsets
  - Zoning Source URL field QA-noisy (bulk Municode URLs) — route by Jurisdiction not Source
  - Broadway / Benson / Fuquay Varina tips are edge fragments — prefer Lee / Johnston / Wake cards for those city cores
  - No paid vendor data; no phones/emails collected; no AADT/utilities dig
