# ---- PASS 2 full-suite upgrade (rural OZ), verifiedAt 2026-09-28; mirrors the json pass2 key ----
pass2:
  label: PASS 2 full-suite upgrade (rural OZ) 2026-09-28
  verifiedAt: '2026-09-28'
  verifiedBy: North Carolina Public Info Researcher
  parcelLayer: https://maps.haywoodcountync.gov/arcgis/rest/services/SmartGov/SmartGovTaxView/FeatureServer/0
  parcelIdField: ALPHA
  acreageFilter: Calc_Acres >= 5 AND Calc_Acres <= 150
  acres5to150Live: 5765
  parcelCountLive: 51574
  aadt:
    primary2022:
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0
      valueField: AADT_2022 (string; trim, blank = no count)
      countyFilter: COUNTY='HAYWOOD'
      queryUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27HAYWOOD%27&outFields=LocationID%2CROUTE%2CLOCATION%2CCOUNTY%2CAADT_2022&returnGeometry=true&outSR=4326&f=json
      countUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27HAYWOOD%27&returnCountOnly=true&f=json
      liveStationCount: 344
      stationsWithAADT2022: 305
    newer2025:
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1
      valueField: AADT_2025 (integer; also AADT_2024, AADT_2002-2025)
      countyFilter: County='Haywood'
      countyFilterNote: Title case County name (2022 layer uses uppercase COUNTY)
      queryUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Haywood%27&outFields=LocationID%2CRouteID%2CLocated_On%2CCounty%2CAADT_2024%2CAADT_2025&returnGeometry=true&outSR=4326&f=json
      countUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Haywood%27&returnCountOnly=true&f=json
      liveStationCount: 343
      stationsWithAADT2025: 45
      stationsWithAADT2024: 278
      dataLastEdit: '2026-09-23'
    also:
      stations2024Service: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT__2024_AADT_Stations_published_September_2025/FeatureServer/0
      segments2025: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/0
    recommendation: 'Newer year IS on REST: prefer NCDOT_2025 layer 1 (AADT_2025, falling back to AADT_2024 then AADT_2022 when the newest is null). The 2022 layer is kept as the documented baseline.'
  tax:
    fields:
    - Mkt_Value
    - Assd_Value
    allTaxFieldsOnLayer:
    - Mkt_Value
    - Assd_Value
    - Land_Value
    - Bldg_Value
    - Defer_Value
    liveNonZero:
      Mkt_Value: 44838
      Assd_Value: 44838
    status: ok
  sale:
    priceFields:
    - Sale_Price
    dateFields:
    - Sale_Date
    livePriceNonZero:
      Sale_Price: 26040
    liveDateNonNull:
      Sale_Date: 45326
    status: ok
  ownerEntity:
    ownerFields:
    - Owner_1
    - Owner_2
    primaryOwnerField: Owner_1
    rule: 'Uppercase and trim the owner name(s), then flag as entity if it matches the regex (apply to every owner field; any hit = entity). Note: TRUSTEE does not match the TRUST word rule, and a surname such as CHURCH at the start of the name is a known false positive.'
    regex: \b(LLC|L\.L\.C\.?|INC\.?|CORP(ORATION)?|LP|L\.P\.|LLP|LTD|TRUST|CHURCH|COMPANY|PARTNERSHIP|HOLDINGS|PROPERTIES)\b|^(CITY|COUNTY|STATE|TOWN) OF\b
    tokens:
    - LLC
    - INC
    - LP
    - LLP
    - LTD
    - TRUST
    - CHURCH
    - COMPANY
    - PARTNERSHIP
    - HOLDINGS
    - PROPERTIES
    - CORP/CORPORATION
    prefixes:
    - CITY OF
    - COUNTY OF
    - STATE OF
    - TOWN OF
    sqlApproxWhere: (UPPER(Owner_1) LIKE '% LLC%' OR UPPER(Owner_1) LIKE '% INC%' OR UPPER(Owner_1) LIKE '% LP%' OR UPPER(Owner_1) LIKE '% LLP%' OR UPPER(Owner_1) LIKE '% LTD%' OR UPPER(Owner_1) LIKE '% TRUST%' OR UPPER(Owner_1) LIKE '% CHURCH%' OR UPPER(Owner_1) LIKE '% COMPANY%' OR UPPER(Owner_1) LIKE '% PARTNERSHIP%' OR UPPER(Owner_1) LIKE '% HOLDINGS%' OR UPPER(Owner_1) LIKE '% PROPERTIES%' OR UPPER(Owner_1) LIKE '% CORP%' OR UPPER(Owner_1) LIKE '%,LLC%' OR UPPER(Owner_1) LIKE '%,INC%' OR UPPER(Owner_1) LIKE 'CITY OF %' OR UPPER(Owner_1) LIKE 'COUNTY OF %' OR UPPER(Owner_1) LIKE 'STATE OF %' OR UPPER(Owner_1) LIKE 'TOWN OF %')
    liveEntityCountAll: 5369
    liveEntityCount5to150ac: 748
    countNote: The live count uses the SQL approximation (LIKE '% TOKEN%' on the primary owner field, which also catches TRUSTEE/INCOME-style prefixes) together with the acreage filter above.
  paDeepLink:
    template: https://taxes.haywoodcountync.gov/ITSPublic/AppraisalCard.aspx?id={ALPHA}
    testedParcelId: '7695442942'
    testedUrl: https://taxes.haywoodcountync.gov/ITSPublic/AppraisalCard.aspx?id=7695442942
    httpStatus: 200
    contentType: application/pdf
    contentVerified: true
    note: Owner and parcel id verified in the response.
  gisViewer:
    url: https://maps.haywoodcountync.gov/gisweb/default.htm
    httpStatus: 200
    pageTitle: Haywood County GIS
  gaps: []
