      LAUREL PARK (~1859), FLAT ROCK VH/BR/GR (~821/1781/214 tax subtypes),
      SALUDA tip (~16), null≈unincorporated (~50896).
      Mirror: Primary_GISWeb_Layers MapServer/19 (and /39).
