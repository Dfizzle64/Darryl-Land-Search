    notes: >
      PRIMARY wire-first verified 2026-09-23: count 71350;
      CALCULATED_ACRES 5–150 → 6272; ACREAGE 5–150 → 6272;
      HEATED_AREA null/0 in 5–150 → 3511. CRS 102100/3857.
      MaxRecordCount 2000 — paginate. Rich CAMA: owner, mail, situs,
      land/bldg/total values, package + land sale price/date, Zoning_aggregated.
      CRITICAL: Zoning_aggregated is often stub "Cities" inside municipalities —
      do NOT treat as authoritative city zoning; join muni zoning polygons.
