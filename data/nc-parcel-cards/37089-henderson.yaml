gaps:
  - Parcel Zoning_aggregated stub "Cities" inside munis — must spatial-join city zoning layers (Hendersonville AGOL or Primary layers 79–83)
  - No dedicated public FLU REST for Fletcher, Mills River, Flat Rock, Laurel Park — use county Future Land Use Map (2024) as fallback inside those towns (verify locally)
  - No multi-transfer sales FeatureServer; only latest PKG_/LAND_ sale on parcels (+ optional TXT download)
  - OneMap acre 5–150 count (8137) differs from county CALCULATED_ACRES (6272) — prefer county acres for site filter
  - Flat Rock parcel CITY codes VH/BR/GR are opaque tax subtypes — route via ETJ or municipal boundary, not CITY alone
  - Saluda tip (~16 parcels) is mostly Polk County; Henderson Saluda zoning not inventoried separately
  - HendersonCountyLandUse is existing-use / prediction, not Comp Plan FLU
  - No paid vendor data; no phones/emails collected
