gaps:
- Harrellsville has no base zoning FeatureServer (Planning_Jurisdictions explicitly
  NO ZONING)
- No public FLU FeatureServer — CAMA LUP Jan 2011 PDF + Ahoskie Draft Comp Plan FLU
  PDF only; LandUse/0 is current cover not FLU
- OneMap saledate date field null for cntyfips='091' — prefer county PKG_SALE_DATE
  / LAND_SALE_DATE; OneMap saledatetx often placeholder 12/30/1899
- Parcel CITY is tax-city district; PHYADDR_CITY is postal city (includes Aulander/Woodland/Colerain
  outside county munis) — situs municipality requires Municipalities/ETJ spatial join
- Como zoning is coarse (5 district polys)
- ETJ FS only publishes Ahoskie + Murfreesboro (other towns use parcel ETJ attr)
- AGOL Tax_Parcels FeatureServer URL from older webmap config is Invalid URL (400)
  — use gis.hertfordcounty.org TaxParcels/MapServer/2
- Utilities / AADT / emails / phones / paid vendors intentionally out of scope
