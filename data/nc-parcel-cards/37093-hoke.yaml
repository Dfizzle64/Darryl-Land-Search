    notes: >
      PRIMARY wire-first verified 2026-09-24: count 29570; TOTAL_ACRE 5–150 → 3190;
      CAL_ACRES 5–150 → 3170; OWNER_NAME 29475; COST_TOTAL>0 29469; DEED_DATE>0 29465;
