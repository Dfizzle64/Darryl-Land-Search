      2026-09-28 live check: every query on maps.hokecounty.org (Parcels/0, OperationalLayers/6, Overlays/4) returns HTTP 400 'Unable to complete operation. Bad login user'. That is a server-side DB-connection fault, not a token wall. Layer f=json still loads.
