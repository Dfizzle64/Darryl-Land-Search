gaps:
  - "2026-09-28: county REST maps.hokecounty.org queries are failing ('Bad login user'), which takes out Parcels/0, OperationalLayers/6 and Overlays/4 zoning. Parcels switched to county AGOL June2025/FeatureServer/1 (geometry + TWN_PIN + TOTAL_ACRE only). Owner/tax/deed are unavailable until the county server recovers (OneMap CAMA is empty for Hoke)."
  - Sale price not on public ArcGIS REST (deed date/book/page only; COST_TOTAL is assessed/cost)
  - FLU FeatureServer gap — Land Use Plan PDF + 2025 update site only
  - OneMap CAMA empty for Hoke (ownname/siteadd/parval/saledate/gisacres) — geometry fallback only
  - Raeford city zoning district codes not on REST (ZONE='RAEFORD' catch-all stub)
  - Parcels FeatureServer not enabled — MapServer only; MaxRecordCount 1000
  - OperationalLayers/6 Parcels mirror queries sometimes fail — use Parcels/0
  - NCPTS SPA may use internal id; verified PA is Tax Card Viewer/PDF by TWN_PIN
  - Utilities / AADT / emails / phones / paid vendors out of scope

