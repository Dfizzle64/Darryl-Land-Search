    notes: >
      Rural-OZ Pass 1 (2026-09-28) PRIMARY geometry source. The county server queries are failing. This is the Hoke County GIS public AGOL layer (owner ddudley_HokeCountyNC; data last edited 2025-06-27). No token needed. Count 30121. TWN_PIN is populated on all 30121. TOTAL_ACRE 5–150 → 3743. Sample TWN_PIN 494540001006 ≈ -79.139, 34.986 (Raeford). Fields: PIN, TOWNSHIP, TWN_PIN, LABEL, CALCULATED, TOTAL_ACRE. NO owner/mailing/tax/deed. OneMap CAMA is also empty for Hoke, so owner/tax is a gap until county Parcels/0 recovers. Alternates: June2025Map_WFL1/1 (same data), TESTOCTOBER2_WFL1/1 (30184, CALCULATED_ACRES).
