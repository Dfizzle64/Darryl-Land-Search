gaps:
  - "Municipal zoning/FLU are first-class — do not use county Zoning/0 or Horizon alone inside cities."
  - "Only Mooresville has verified independent GIS + public FCLU REST; Statesville LDP 2045 FLU is PDF-only this pass."
  - "Troutman / Harmony / Love Valley / Davidson (Iredell tip) lack town FLU FeatureServers."
  - "No multi-year sale history table (last sale on TaxSQL + Sales_2024 year extract only)."
  - "Market field is not tax.marketValue ($); assessed Land_Value/Bldg_Value/Total_Value only."
  - "Situs city/ZIP incomplete; mailing CITY may be out-of-county."
  - "No stable taxweb deep-link; use MapGeo ?query={PIN} + BasicSearch."
  - "PIN trailing .000 normalization; MaxRecordCount 2000 pagination required."
  - "Owner phones/emails not on public REST — do not scrape."

