# ---- PASS 2 full-suite upgrade (rural OZ), verifiedAt 2026-09-28; mirrors the json pass2 key ----
pass2:
  label: PASS 2 full-suite upgrade (rural OZ) 2026-09-28
  verifiedAt: '2026-09-28'
  verifiedBy: North Carolina Public Info Researcher
  parcelLayer: https://gis.jacksonnc.org/jcgis/rest/services/Tax_Admin/Parcels/FeatureServer/0
  parcelIdField: PIN
  acreageFilter: CAST(AssessedAcres AS FLOAT) >= 5 AND CAST(AssessedAcres AS FLOAT) <= 150
  acres5to150Live: 6754
  parcelCountLive: 41439
  aadt:
    primary2022:
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0
      valueField: AADT_2022 (string; trim, blank = no count)
      countyFilter: COUNTY='JACKSON'
      queryUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27JACKSON%27&outFields=LocationID%2CROUTE%2CLOCATION%2CCOUNTY%2CAADT_2022&returnGeometry=true&outSR=4326&f=json
      countUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27JACKSON%27&returnCountOnly=true&f=json
      liveStationCount: 269
      stationsWithAADT2022: 157
    newer2025:
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1
      valueField: AADT_2025 (integer; also AADT_2024, AADT_2002-2025)
      countyFilter: County='Jackson'
      countyFilterNote: Title case County name (2022 layer uses uppercase COUNTY)
      queryUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Jackson%27&outFields=LocationID%2CRouteID%2CLocated_On%2CCounty%2CAADT_2024%2CAADT_2025&returnGeometry=true&outSR=4326&f=json
      countUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Jackson%27&returnCountOnly=true&f=json
      liveStationCount: 269
      stationsWithAADT2025: 181
      stationsWithAADT2024: 160
      dataLastEdit: '2026-09-23'
    also:
      stations2024Service: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT__2024_AADT_Stations_published_September_2025/FeatureServer/0
      segments2025: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/0
    recommendation: 'Newer year IS on REST: prefer NCDOT_2025 layer 1 (AADT_2025, falling back to AADT_2024 then AADT_2022 when the newest is null). The 2022 layer is kept as the documented baseline.'
  tax:
    fields:
    - TaxableValue
    - TotLandValue
    allTaxFieldsOnLayer:
    - TotLandValue
    - TotBldgValue
    - TaxableValue
    liveNonZero:
      TaxableValue: 39730
      TotLandValue: 40676
    status: ok
  sale:
    priceFields:
    - SalePrice
    dateFields:
    - SaleDate
    livePriceNonZero:
      SalePrice: 22013
    liveDateNonNull:
      SaleDate: 41126
    status: ok
  ownerEntity:
    ownerFields:
    - CurrentOwner1
    - CurrentOwner2
    primaryOwnerField: CurrentOwner1
    rule: 'Uppercase and trim the owner name(s), then flag as entity if it matches the regex (apply to every owner field; any hit = entity). Note: TRUSTEE does not match the TRUST word rule, and a surname such as CHURCH at the start of the name is a known false positive.'
    regex: \b(LLC|L\.L\.C\.?|INC\.?|CORP(ORATION)?|LP|L\.P\.|LLP|LTD|TRUST|CHURCH|COMPANY|PARTNERSHIP|HOLDINGS|PROPERTIES)\b|^(CITY|COUNTY|STATE|TOWN) OF\b
    tokens:
    - LLC
    - INC
    - LP
    - LLP
    - LTD
    - TRUST
    - CHURCH
    - COMPANY
    - PARTNERSHIP
    - HOLDINGS
    - PROPERTIES
    - CORP/CORPORATION
    prefixes:
    - CITY OF
    - COUNTY OF
    - STATE OF
    - TOWN OF
    sqlApproxWhere: (UPPER(CurrentOwner1) LIKE '% LLC%' OR UPPER(CurrentOwner1) LIKE '% INC%' OR UPPER(CurrentOwner1) LIKE '% LP%' OR UPPER(CurrentOwner1) LIKE '% LLP%' OR UPPER(CurrentOwner1) LIKE '% LTD%' OR UPPER(CurrentOwner1) LIKE '% TRUST%' OR UPPER(CurrentOwner1) LIKE '% CHURCH%' OR UPPER(CurrentOwner1) LIKE '% COMPANY%' OR UPPER(CurrentOwner1) LIKE '% PARTNERSHIP%' OR UPPER(CurrentOwner1) LIKE '% HOLDINGS%' OR UPPER(CurrentOwner1) LIKE '% PROPERTIES%' OR UPPER(CurrentOwner1) LIKE '% CORP%' OR UPPER(CurrentOwner1) LIKE '%,LLC%' OR UPPER(CurrentOwner1) LIKE '%,INC%' OR UPPER(CurrentOwner1) LIKE 'CITY OF %' OR UPPER(CurrentOwner1) LIKE 'COUNTY OF %' OR UPPER(CurrentOwner1) LIKE 'STATE OF %' OR UPPER(CurrentOwner1) LIKE 'TOWN OF %')
    liveEntityCountAll: 11590
    liveEntityCount5to150ac: 1879
    countNote: The live count uses the SQL approximation (LIKE '% TOKEN%' on the primary owner field, which also catches TRUSTEE/INCOME-style prefixes) together with the acreage filter above.
  paDeepLink:
    template: https://gis.jacksonnc.org/PRC/PRC/{No_Dash}.pdf
    testedParcelId: '7650426623'
    testedUrl: https://gis.jacksonnc.org/PRC/PRC/7650426623.pdf
    httpStatus: 200
    contentType: application/pdf
    contentVerified: true
    note: Owner and parcel id verified in the response.
  gisViewer:
    url: https://gis.jacksonnc.org/rpv/
    httpStatus: 200
    pageTitle: ArcGIS Web Application
  acreageNote: The acreage field is a string, so filters need CAST(... AS FLOAT).
  gaps: []
