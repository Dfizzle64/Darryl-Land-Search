gaps:
  - No countywide FLU FeatureServer — Cashiers/Cullowhee/US-441 SAP + zoning-map PDFs only
  - Unincorporated zoning REST gap outside Cullowhee CPA, Cashiers CD, US-441 corridor, Scotts Creek WQPD
  - Highlands tip in Cities_Poly but zoning not on Jackson REST (Macon County)
  - AssessedAcres is string — CAST required for numeric filters
  - OneMap saledate/price weak — prefer county SaleDate/SalePrice
  - Spatialest nc/jackson 404
  - Utilities / AADT / emails / phones / paid vendors intentionally excluded

