    testedParcelId: 05I05020L
    testedUrl: https://www.bttaxpayerportal.com/ITSPublicJO/TaxBillSearch/Parcel/05I05020L
    httpStatus: 200
    contentType: text/html
    contentVerified: true
    note: Parcel id found in the response body.
  gisViewer:
