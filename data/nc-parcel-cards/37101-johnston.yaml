      saledate: lastSale.date
      saledatetx: lastSale.dateText
      parval: tax.marketValue
      landval: tax.landValue
      improvval: tax.improvementValue
      cntyfips: countyFips
    notes: >
      Verified 2026-09-24: cntyfips='101' count 125583; gisacres 5–150 → 14291.
      parno ≈ county PIN (not TAG) — resolve TAG via county parcels. Has situs
      (siteadd) on polygons (advantage vs county). No sale price. MaxRecordCount 5000.
      Alternate host services.gis.nc.gov.
    status: usable

  - role: zoning
    name: County Zoning (unincorporated)
    restUrl: https://cityworks.johnstonnc.com/server/rest/services/Planning/Land_Use/FeatureServer/7
    layerId: 7
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      ZONING: zoning
      CASE_NO: zoningCase
      DATE_OF_EDIT: zoningDate
    notes: >
      Verified count 2168. CRS 2264. Unincorporated districts (AR, RR, GB, I-1/I-2,
      NB, O-I, CB, PUD, MHPD, CLD, *-CZ, *-SUD, …). Spatial join to parcels.
      Pair with IHI overlay + Municipal Transition (shapefile-only gap).
    status: usable

  - role: zoning
    name: Town Zoning (aggregate — all munis)
    restUrl: https://cityworks.johnstonnc.com/server/rest/services/Planning/Land_Use/FeatureServer/9
    layerId: 9
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      ZONING: zoning
      CASE_NO: zoningCase
      DATE_OF_EDIT: zoningDate
    notes: >
      Verified count 4042; ~115 distinct codes. NO municipality attribute —
      spatial-filter with city_limits (layer 6) or address Inc_Muni/ETJ.
      County-host muni folders (Smithfield/3, WilsonsMills/4, Clayton/2) republish
      this same countywide layer (count 4042, matching extent) — NOT city-clipped.
      Prefer Clayton Clariti for Clayton city limits.
    status: usable

  - role: zoning
    name: Clayton Zoning (Clariti — FIRST-CLASS local)
    restUrl: https://cw2.townofclaytonnc.org/gis/rest/services/Clariti/Clariti/FeatureServer/7
    layerId: 7
    geometry: polygon
    auth: none
    acreageField: Acreage
    coverage: city-only
    fieldMap:
      Abreviation: zoning
      Zoning: zoningLabel
      Acreage: acreage
      Ordinance: zoningOrdinance
      Effective_Date: zoningDate
      Permit_Number: zoningPermit
      Project_Name: zoningProject
    notes: >
      Verified count 1349. CRS 103122/6543 (NC State Plane — reproject vs county
      2264 if needed). Prefer inside Clayton limits over county town_zoning.
      Codes: RLD/RMD/RHD/RLL, CRM, NCM, OFI, HID/LID, MXD, DTNC, PUB, PD-*, CZ*.
      Alternate: Planning/Zoning/MapServer/0 count 1384 (same schema family).
    status: usable

  - role: flu
    name: Clayton Future Land Use (Clariti — FIRST-CLASS local)
    restUrl: https://cw2.townofclaytonnc.org/gis/rest/services/Clariti/Clariti/FeatureServer/9
    layerId: 9
    geometry: polygon
    auth: none
    acreageField: null
    coverage: city-only
    fieldMap:
      FLU: flu
      Last_Change: fluUpdated
    notes: >
      Verified count 71. CRS 6543. Values: Downtown, Downtown Core, Downtown
      Neighborhood, Employment Center, High/Medium/Low Density Residential,
      Recreation and Open Space, Rural Residential. Alternate:
      Planning/Future_Land_Use/MapServer/1 (same count 71). Overlay layer 8 / MS/0
      (count 20) is FLU overlay only.
    status: usable

  - role: zoning
    name: IHI Overlay Districts
    restUrl: https://cityworks.johnstonnc.com/server/rest/services/Planning/Land_Use/FeatureServer/8
    layerId: 8
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      ZONING: zoningOverlay
      DISTRICT: zoningOverlayDistrict
      LANDUSE: landUseNote
      TAG: overlayId
      NOTES: zoningNotes
    notes: Verified count 54. Interstate Highway Interchange overlay — adds rules to base zoning. ZONING typically IHI.
    status: usable

  - role: other
    name: City Limits (muni router)
    restUrl: https://cityworks.johnstonnc.com/server/rest/services/Planning/Land_Use/FeatureServer/6
    layerId: 6
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      NAME: municipality
      Inc_Muni: municipalityAlt
      TAXCODE: taxCode
    notes: >
      Verified count 335 polygons. Distinct NAME: Archer Lodge, Benson, Clayton,
      Four Oaks, Kenly, Micro, Pine Level, Princeton, Selma, Smithfield,
      Wilson's Mills. Use to clip town_zoning / assign muni to parcels.
    status: usable

  - role: other
    name: ETJ / Town Planning Boundaries
    restUrl: https://cityworks.johnstonnc.com/server/rest/services/Planning/Land_Use/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      ETJ_NAME: planningJurisdiction
    notes: >
      Verified count 10. ETJ_NAME: Benson, Clayton, Four Oaks, Kenly, Micro,
      Pine Level, Princeton, Selma, Smithfield, Wilsons Mills. (No Archer Lodge ETJ row.)
    status: usable

gaps:
  - No situs on county parcel polygons — join Address Points on TAG (or OneMap siteadd/scity)
  - No countywide FLU FeatureServer — only Clayton public FLU; other munis FLU = gap (PDF/plan only if any)
  - Municipal Transition Districts shapefile download only (no public REST found) — overlay gap vs county zoning
  - town_zoning has no municipality field — spatial join to city_limits required
  - County-host Clayton/Selma/Smithfield/WilsonsMills folders largely republish countywide layers (not city-clipped); only Clayton Clariti is true local GIS
  - No independent public ArcGIS REST found for Archer Lodge, Benson, Four Oaks, Kenly, Micro, Pine Level, Princeton
  - Last-sale only (SALES_DATE/SALES_PRICE) — no multi-transfer sales FeatureServer; Brady Sales.aspx is HTML search
  - Brady property card ViewParcel is POST-only — no durable GET deep-link for full card; TaxBillSearch/Parcel/{TAG} works for tax bills
  - MaxRecordCount 2000 (most layers) / 5000 (TAX ParcelMap, OneMap) — paginate
  - Do not scrape phones/emails from Brady portal or MapClick
  - AADT / utilities intentionally omitted from this card

