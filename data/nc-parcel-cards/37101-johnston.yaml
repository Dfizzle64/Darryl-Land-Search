    name: TAX ParcelMap Parcels (PRIMARY)
    restUrl: https://cityworks.johnstonnc.com/server/rest/services/TAX/ParcelMap/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: CALC_ACREAGE
    coverage: county-wide
    fieldMap:
      TAG: parcelId
      PIN: parcelIdPin
      ACCOUNT_NUMBER: parcelIdAccount
      MAPSHEET: mapsheet
      CALC_ACREAGE: acreage
      ASSESSED_ACREAGE: acreageAssessed
      Name1: ownerName
      Name2: ownerName2
      Address1: mailingAddress.street
      Address2: mailingAddress.street2
      City: mailingAddress.city
      State: mailingAddress.state
      ZipCode: mailingAddress.zip
      SALES_DATE: lastSale.date
      SALES_PRICE: lastSale.price
      QualifiedCode: lastSale.qualified
      MARKET_VALUE: tax.marketValue
      LAND_VALUE: tax.landValue
      BUILDING_VALUE: tax.improvementValue
      OTHER_VALUE: tax.otherValue
      TOTAL_VALUE: tax.assessedValue
      ParcelSpecialLandValue: tax.specialLandValue
      LAND_CLASSIFICATION: dorCode
      USE_CODE: landUseDesc
      TAX_EXEMPT_CODE: taxExempt
      DeedBook: deedBook
      DeedPage: deedPage
      TOWNSHIP: township
      Neighborhood: neighborhood
    notes: >
      PRIMARY verified 2026-09-24: count 126846; CALC_ACREAGE 5–150 → 14287;
      ASSESSED_ACREAGE 5–150 → 14243; BUILDING_VALUE=0 in CALC 5–150 → 9042.
      CRS 102719/2264. Prefer TAG (tax number; ~1 null) over PIN (~470 null) /
      ACCOUNT_NUMBER. Address1–ZipCode are MAILING only — no situs on polygons.
      MaxRecordCount 5000 (best of three mirrors). Epoch ms dates. Mirrors:
      Public_Layers/PublicLayers/MapServer/1 and Planning/Land_Use/FeatureServer/3
      (same count/schema; MaxRecordCount 2000).
    status: usable

  - role: parcels
    name: PublicLayers Parcels (mirror)
    restUrl: https://cityworks.johnstonnc.com/server/rest/services/Public_Layers/PublicLayers/MapServer/1
    layerId: 1
    geometry: polygon
    auth: none
    acreageField: CALC_ACREAGE
    coverage: county-wide
    fieldMap:
      TAG: parcelId
      PIN: parcelIdPin
      CALC_ACREAGE: acreage
      Name1: ownerName
      Address1: mailingAddress.street
      City: mailingAddress.city
      State: mailingAddress.state
      ZipCode: mailingAddress.zip
      SALES_DATE: lastSale.date
      SALES_PRICE: lastSale.price
      MARKET_VALUE: tax.marketValue
      TOTAL_VALUE: tax.assessedValue
    notes: >
      Verified count 126846; same CAMA family as TAX/ParcelMap. MaxRecordCount 2000.
      Prefer TAX/ParcelMap FeatureServer for higher page size.
    status: usable

  - role: parcels
    name: Planning Land_Use Parcels (mirror)
    restUrl: https://cityworks.johnstonnc.com/server/rest/services/Planning/Land_Use/FeatureServer/3
    layerId: 3
    geometry: polygon
    auth: none
    acreageField: CALC_ACREAGE
    coverage: county-wide
    fieldMap:
      TAG: parcelId
      PIN: parcelIdPin
      CALC_ACREAGE: acreage
      Name1: ownerName
      SALES_DATE: lastSale.date
      SALES_PRICE: lastSale.price
      MARKET_VALUE: tax.marketValue
    notes: Same schema/count 126846; bundled with zoning layers on Land_Use service. MaxRecordCount 2000.
    status: usable

  - role: other
    name: Address Points (situs join on TAG)
    restUrl: https://cityworks.johnstonnc.com/server/rest/services/Public_Layers/PublicLayers/MapServer/0
    layerId: 0
    geometry: point
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      TAG: parcelId
      FULL_ADDRESS: situsAddress
      ST_NUMBER: situsAddress.number
      ST_PREFIXDIR: situsAddress.prefix
      ST_NAME: situsAddress.street
      ST_TYPE: situsAddress.streetType
      ST_SUFFIXDIR: situsAddress.suffix
      UNIT: situsAddress.unit
      COMMUNITY: situsCommunity
      ZIPCODE: situsZip
      Inc_Muni: municipality
      ETJ: planningJurisdiction
      MSAG_Comm: situsCity
      APID: addressId
    notes: >
      Verified count 124576. Join to parcels on TAG (many-to-one). Primary situs
      path for county — parcel polygons lack site address. Mirror:
      Planning/Land_Use/FeatureServer/2 (same count/schema). ZIPCODE often 0 —
      prefer MSAG_Comm / Inc_Muni for place context; OneMap siteadd as alternate.
    status: usable

  - role: parcels
    name: NC OneMap Parcels (polys)
    restUrl: https://services.nconemap.gov/secure/rest/services/NC1Map_Parcels/FeatureServer/1
