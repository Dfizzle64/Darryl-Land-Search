    status: usable

  - role: other
    name: Appraisal Landuse (CAMA LUC subset)
    restUrl: https://lee-arcgis.leecountync.gov/ARCGIS/rest/services/Appraisal/APPRAISAL/MapServer/20
    layerId: 20
    geometry: polygon
    auth: none
    acreageField: null
