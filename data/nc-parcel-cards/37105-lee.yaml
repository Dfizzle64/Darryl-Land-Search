  - role: other
    name: City limits + ETJ
    restUrl: https://lee-arcgis.leecountync.gov/arcgis/rest/services/Jurisdictions/JURISDICTIONS/MapServer/4
    layerId: 4
    geometry: polygon
    auth: none
    acreageField: null
    coverage: city-only
    fieldMap: {}
    notes: >
      Sanford limits MS/4 (38); Sanford ETJ MS/5 (25); Broadway MS/2 (1); Broadway ETJ MS/3 (1);
