    geometry: polygon
    auth: none
    acreageField: ACRES
    coverage: county-wide
    fieldMap:
      PARID: parcelId
      PIN: parcelIdDisplay
      ACRES: acreage
      Owner1: ownerName
      Owner2: ownerName2
      MailADRNO: mailingAddress.number
      MailADRADD: mailingAddress.numberSuffix
      MailADRDIR: mailingAddress.streetDir
      MailADRSTR: mailingAddress.street
      MailADRSUF: mailingAddress.streetType
      MailCity: mailingAddress.city
      MailState: mailingAddress.state
      MailZip: mailingAddress.zip
      PropAddr: situsAddress
      ADRNO: situs.number
      ADRADD: situs.numberSuffix
      ADRDIR: situs.streetDir
      ADRSTR: situs.street
      ADRSUF: situs.streetType
      ADRPRE: situs.prefix
      SaleDate: lastSale.date
      BOOK: lastSale.deedBook
      PAGE: lastSale.deedPage
      APRTOT: tax.marketValue
      APRLAND: tax.landValue
      APRBLDG: tax.improvementValue
      TAXDIST: taxDistrict
      TaxCard: appraiserSearchUrl
      LEGAL1: legalDescription
      SUBDIV: subdivision
    notes: >
      PRIMARY wire-first verified 2026-09-24: count 35438;
      ACRES 5–150 → 4932; APRBLDG=0/null in 5–150 → 2139; SaleDate NOT NULL in range → 4725.
      CRS source 102719/2264; service often 3857. MaxRecordCount 1000 — paginate. MapServer only.
      Rich CAMA on polygons: situs, mailing parts, land/bldg split, SaleDate, TaxCard deep-link.
      NO SalePrice / Zoning on primary — join Sales layers / Zoning shapefile.
      TAXDIST top: CSF 14997 (Sanford), FLS 3983, FTW 3707, FCT 3132, FBW 2492, FDR 2071,
      FWP 1918, FNV 1144, CBW 769 (Broadway), FWS 479, CBD 311, FCW 274.
      Geo-check PARID 965783891900 ≈ -79.141, 35.602 (Lee). Filter ROW/blank PARID stubs.
    status: usable

  - role: parcels
    name: NC OneMap Parcels (polys)
    restUrl: https://services.nconemap.gov/secure/rest/services/NC1Map_Parcels/FeatureServer/1
    layerId: 1
    geometry: polygon
    auth: none
    acreageField: gisacres
    coverage: county-wide
    fieldMap:
      parno: parcelId
      ownname: ownerName
      mailadd: mailingAddress.street
      mcity: mailingAddress.city
      mstate: mailingAddress.state
      mzip: mailingAddress.zip
      siteadd: situsAddress
      scity: situsCity
      gisacres: acreage
      saledate: lastSale.date
      saledatetx: lastSale.dateText
      parval: tax.marketValue
      landval: tax.landValue
      improvval: tax.improvementValue
      cntyfips: countyFips
    notes: >
      Verified 2026-09-24: cntyfips='105' count 35303; gisacres 5–150 → 4919;
      improvval=0/null in range → 2144. Geo-check centroids in Lee (~35.48–35.62 N, 79.0–79.25 W).
      parno tracks PARID (no dashes). Fallback when county host flaky/503.
      MaxRecordCount 5000. Alternate host services.gis.nc.gov. No sale price.
    status: usable

  - role: zoning
    name: Zoning shapefile CurrentZon (PRIMARY — download)
    restUrl: null
    downloadUrl: https://drive.google.com/file/d/1S4-VsEgcHJ6LVWa89TcW-HCX0mGTLeVD/view?usp=sharing
    metadataUrl: https://leecountync.gov/Document%20Center/Department/Gis%20Strategic%20Services/Gis%20layer/zoning.pdf
    layerId: null
    geometry: polygon
    auth: none
    acreageField: ACRES
    coverage: county-wide
    fieldMap:
      CurrentZon: zoning
      Zoning_06_: zoningLegacy2006
      Zoning_Pre: zoningPrevious
      SANandETJ: sanfordEtjFlag
      LINK_CURR: zoningDescriptionUrl
      LINK_PROP: zoningProposedDescriptionUrl
      ORDINANCE: zoningOrdinance
      CONDITIONA: zoningConditional
      SPECIALUSE: zoningSpecialUse
      ACRES: acreage
      PIN: parcelIdDisplay
    notes: >
      PRIMARY zoning polygons. Verified download 2026-09-24: 26807 polys; ACRES 5–150 → 4795;
      SANandETJ='Y' → 12222 (Sanford+ETJ). CurrentZon top: RA 8416, UN-6 4818, RR 3392,
      RN-20 3202, RA/MH 1401, SN-9 952, SN-12 876, C-2 781, LI 692, R-20 522, OI 403, CZ 308,
      CBD 254, HC 208, HI 113 (+ CU/MH variants). CRS 2264.
      BaseLayers Zoning REST layer IDs (historically 6–11) return Layer not found — shapefile only
      until county republishes zoning MapServer. Cities-first: SANandETJ='Y' for Sanford/ETJ.
    status: usable

