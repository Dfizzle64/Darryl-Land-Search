    auth: none
    acreageField: ACRES
    coverage: county-wide
    fieldMap:
      PlaceType: flu
      Plan: fluPlan
      TypeLink: fluDescriptionUrl
      PIN: parcelIdDisplay
      ACRES: acreage
    notes: >
      PRIMARY FLU / place-type polygons (Plan SanLee for Sanford–Broadway–Lee).
      Verified count 31538. Mirror JURISDICTIONS/MapServer/17 PlaceTypes.
      Join by PIN to parcels or spatial join in 2264. Queries may 503 under load — retry.
      Prefer over WithersRavenel Sanford PowerBI LU (consultant ERU copy of PlaceType).
    status: usable

  - role: flu
    name: JURISDICTIONS PlaceTypes mirror
    restUrl: https://lee-arcgis.leecountync.gov/arcgis/rest/services/Jurisdictions/JURISDICTIONS/MapServer/17
    layerId: 17
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      PlaceType: flu
      Plan: fluPlan
      TypeLink: fluDescriptionUrl
