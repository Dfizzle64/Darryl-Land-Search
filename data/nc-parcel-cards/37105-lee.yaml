      Taxable: tax.taxableValue
      Deferred_A: tax.deferredValue
      PARID: parcelId
      PIN: parcelIdDisplay
    notes: >
      Count 1787 — mostly use-value/deferred subset. Not comprehensive FLU.
      Prefer Place_Types for plan FLU; primary parcels for market values.
    status: partial

gaps:
  - No countywide zoning MapServer/FeatureServer (BaseLayers Zoning REST removed; shapefile PRIMARY)
  - No SalePrice on primary parcel layer — join Sales/Sales PRICE
  - Place_Types and ZONING_CITYPLAT queries intermittently 503
  - ZONING_PROPOSED service timed out during research
  - ZoningHub Sanford is SaaS viewer only (no public REST)
  - No separate Sanford or Broadway ArcGIS hosts
  - MaxRecordCount 1000 on county layers — paginate
  - ROW/blank PARID stubs on parcel layer
  - No AADT/utilities/emails/phones/paid vendors in this card

