      Partial REST only — count 1461 commercial/industrial UDO joined to parcels.
      Prefer Zoning shapefile CurrentZon for countywide. Queries intermittently 503.
    status: partial

  - role: sales
    name: Sales/Sales ALLSALES* (price + zoning attr)
    restUrl: https://lee-arcgis.leecountync.gov/ARCGIS/rest/services/Sales/Sales/MapServer/9
    layerId: 9
    geometry: polygon
    auth: none
    acreageField: ACRES
