gaps:
  - La Grange zoning REST gap — Official Zoning Map PDF only; ConnectGIS 504
  - Kinston / countywide FLU REST gap — Comp Plan PDF; only Pink Hill Future_LU on REST
  - County_Zoning only 8 coarse polys — not fine unincorporated district fabric
  - Proposed_Z is parcel-class proposed — clarify adoption; not a substitute for city district maps
  - OpenGov parcel ZONE ~34% populated — prefer spatial join to city zoning layers
  - AddrPts lack PIN — spatial join; prefer PhysStrAdd
  - Last-sale only on parcel; no multi-transfer history FeatureServer
  - Grifton straddles Pitt — prefer Pitt zoning host; clip Lenoir tip
  - Alternate nJbIFHiSnaX0z0hS mirror older/partial — prefer LenoirCoGIS bDx73HOFAO3oSeDq
  - Wrong-org Norwalk CT HfsHDBmkGwb1UtID — never use; Caldwell City of Lenoir is different FIPS
  - No phones/emails; no AADT/utilities; no paid vendors
