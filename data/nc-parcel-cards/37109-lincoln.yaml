  ownerEntity:
    ownerFields:
    - NAME1
    - NAME2
    primaryOwnerField: NAME1
    rule:
      apply: Uppercase + trim NAME1 (optionally also NAME2)
      regex: (?i)(\bL\.?\s?L\.?\s?C\b|\bINC\b|\bCORP|\bL\.?\s?P\b|\bLLP\b|\bLLLP\b|\bLTD\b|TRUST|CHURCH|MINISTR|\bCOMPANY\b|PARTNERSHIP|PRTNRSHP|HOLDINGS|PROPERTIES|INVESTMENT|ASSOCIATION|\bHOA\b|FOUNDATION|AUTHORITY|\bDEVELOPMENT|BOARD OF EDUCATION|^(CITY|COUNTY|STATE|TOWN|VILLAGE) OF\b|^UNITED STATES|^NORTH CAROLINA\b|\bCOUNTY$)
      sqlLikeTokens:
      - '% LLC%'
      - '%,LLC%'
      - '% L L C%'
      - '% INC'
      - '% INC %'
      - '% INC.%'
      - '%,INC%'
      - '% CORP%'
      - '%CORPORATION%'
      - '% LP'
      - '% LP %'
      - '% L P'
      - '% LLP%'
      - '% LTD%'
      - '%TRUST%'
      - '%CHURCH%'
      - '%MINISTR%'
      - '% COMPANY%'
      - '%PARTNERSHIP%'
      - '%HOLDINGS%'
      - '%PROPERTIES%'
      - '%INVESTMENT%'
      - '%ASSOCIATION%'
      - '%FOUNDATION%'
      - '%AUTHORITY%'
      - CITY OF %
      - COUNTY OF %
      - STATE OF %
      - TOWN OF %
      - '% COUNTY'
      - '%BOARD OF EDUCATION%'
      - UNITED STATES%
      - NORTH CAROLINA %
      - '% DEVELOPMENT%'
      caveats: TRUST/TRUSTEE also flags family/revocable living trusts (still non-individual title holders); "% COUNTY" suffix catches e.g. "PERSON COUNTY"; bare "CO" and "ESTATE" intentionally excluded (too many false positives). Some owner strings carry trailing spaces (Wake) or mixed case (Yadkin) — normalize first.
    liveEntityCount5to150: 958
    liveOwnerNonNull5to150: 6537
    entityQuery: where=MAPPEDACRE>=5 AND MAPPEDACRE<=150 AND (NAME1 LIKE '% LLC%' OR NAME1 LIKE '%,LLC%' OR NAME1 LIKE '% L L C%' OR NAME1 LIKE '% INC' OR NAME1 LIKE '% INC %' OR NAME1 LIKE '% INC.%' OR NAME1 LIKE '%,INC%' OR NAME1 LIKE '% CORP%' OR NAME1 LIKE '%CORPORATION%' OR NAME1 LIKE '% LP' OR NAME1 LIKE '% LP %' OR NAME1 LIKE '% L P' OR NAME1 LIKE '% LLP%' OR NAME1 LIKE '% LTD%' OR NAME1 LIKE '%TRUST%' OR NAME1 LIKE '%CHURCH%' OR NAME1 LIKE '%MINISTR%' OR NAME1 LIKE '% COMPANY%' OR NAME1 LIKE '%PARTNERSHIP%' OR NAME1 LIKE '%HOLDINGS%' OR NAME1 LIKE '%PROPERTIES%' OR NAME1 LIKE '%INVESTMENT%' OR NAME1 LIKE '%ASSOCIATION%' OR NAME1 LIKE '%FOUNDATION%' OR NAME1 LIKE '%AUTHORITY%' OR NAME1 LIKE 'CITY OF %' OR NAME1 LIKE 'COUNTY OF %' OR NAME1 LIKE 'STATE OF %' OR NAME1 LIKE 'TOWN OF %' OR NAME1 LIKE '% COUNTY' OR NAME1 LIKE '%BOARD OF EDUCATION%' OR NAME1 LIKE 'UNITED STATES%' OR NAME1 LIKE 'NORTH CAROLINA %' OR NAME1 LIKE '% DEVELOPMENT%')
