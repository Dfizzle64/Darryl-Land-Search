    fluField: LUP_2022
    join: spatial to OperationalSP/Parcels/6 (CRS 2264); includes Denver CDP & rural tax districts
  - name: City of Lincolnton
    zoningRestUrl: https://arcgisserver.lincolncountync.gov/arcgis/rest/services/Server_OperationalSP/MapServer/23
    zoningField: ZONECODE
    fluRestUrl: https://arcgisserver.lincolncountync.gov/arcgis/rest/services/Server_OperationalSP/MapServer/38
    fluField: LANDUSECODE
    join: "city-only zoning/FLU + county parcels (spatial, 2264); ETJ on Municipal Boundaries"
    cityPortal: https://www.lincolntonnc.org/
  - name: Town of Maiden
    zoningRestUrl: https://arcgisserver.lincolncountync.gov/arcgis/rest/services/RevalLayers/MapServer/59
    zoningField: ZONECODE
    zoningFilter: "JURISDICTION='MAIDEN'"
    status: gap
    notes: >
      Only 1 zoning polygon / 9 ZoningReport rows on Lincoln REST. Most of Maiden is
      Catawba County — resolve full zoning/FLU via Catawba GIS. No Maiden FLU REST on Lincoln.
    join: spatial filter tiny Lincoln footprint against county parcels

gaps:
  - Maiden zoning/FLU nearly absent on Lincoln REST (town mostly Catawba)
  - Parcel ZONING field is multi-code/overlay-prefixed — prefer ZONECODE polygons or ZoningReport
  - No independent City of Lincolnton ArcGIS host — layers via county server only
  - Denver/East Lincoln/Alexis are districts/CDPs not incorporated zoning jurisdictions
  - OneMap has sale date but no sale price
  - Owner phones/emails not collected from public viewers
  - MaxRecordCount 1000–2500 — pagination required

