pass2:
  label: PASS 2 full-suite upgrade (rural OZ) 2026-09-28
  verifiedAt: '2026-09-28'
  verifiedBy: North Carolina Public Info Researcher
  parcelLayer: https://gis.maconnc.org/arcgis/rest/services/JustParcels/MapServer/0
  parcelIdField: PIN
  acreageFilter: ACREAGE >= 5 AND ACREAGE <= 150
  acres5to150Live: 6332
