      stationsWithAADT2024: 118
      dataLastEdit: '2026-09-23'
    also:
      stations2024Service: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT__2024_AADT_Stations_published_September_2025/FeatureServer/0
      segments2025: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/0
    recommendation: 'Newer year IS on REST: prefer NCDOT_2025 layer 1 (AADT_2025, falling back to AADT_2024 then AADT_2022 when the newest is null). The 2022 layer is kept as the documented baseline.'
  tax:
    fields: []
    allTaxFieldsOnLayer: []
    liveNonZero: {}
    status: gap
    fallback:
      source: NC OneMap parcels (join altparno/parno to PIN)
      restUrl: https://services.nconemap.gov/secure/rest/services/NC1Map_Parcels/FeatureServer/1
      where: cntyfips='115' AND parval>0
      liveCount: 19810
      fields:
      - parval
      - landval
      - improvval
      pa: NCPTS Madison PropertySummary (appraised values)
  sale:
    priceFields: []
    dateFields: []
    livePriceNonZero: {}
    liveDateNonNull: {}
    status: gap
    note: No sale price/date on county REST or NC OneMap (saledate null). NCPTS Madison PropertySummary carries Package/Land Sale.
  ownerEntity:
    ownerFields:
    - OWNER
    primaryOwnerField: OWNER
    rule: 'Uppercase and trim the owner name(s), then flag as entity if it matches the regex (apply to every owner field; any hit = entity). Note: TRUSTEE does not match the TRUST word rule, and a surname such as CHURCH at the start of the name is a known false positive.'
    regex: \b(LLC|L\.L\.C\.?|INC\.?|CORP(ORATION)?|LP|L\.P\.|LLP|LTD|TRUST|CHURCH|COMPANY|PARTNERSHIP|HOLDINGS|PROPERTIES)\b|^(CITY|COUNTY|STATE|TOWN) OF\b
    tokens:
    - LLC
    - INC
    - LP
    - LLP
    - LTD
    - TRUST
    - CHURCH
    - COMPANY
    - PARTNERSHIP
    - HOLDINGS
    - PROPERTIES
    - CORP/CORPORATION
    prefixes:
    - CITY OF
    - COUNTY OF
    - STATE OF
    - TOWN OF
    sqlApproxWhere: (UPPER(OWNER) LIKE '% LLC%' OR UPPER(OWNER) LIKE '% INC%' OR UPPER(OWNER) LIKE '% LP%' OR UPPER(OWNER) LIKE '% LLP%' OR UPPER(OWNER) LIKE '% LTD%' OR UPPER(OWNER) LIKE '% TRUST%' OR UPPER(OWNER) LIKE '% CHURCH%' OR UPPER(OWNER) LIKE '% COMPANY%' OR UPPER(OWNER) LIKE '% PARTNERSHIP%' OR UPPER(OWNER) LIKE '% HOLDINGS%' OR UPPER(OWNER) LIKE '% PROPERTIES%' OR UPPER(OWNER) LIKE '% CORP%' OR UPPER(OWNER) LIKE '%,LLC%' OR UPPER(OWNER) LIKE '%,INC%' OR UPPER(OWNER) LIKE 'CITY OF %' OR UPPER(OWNER) LIKE 'COUNTY OF %' OR UPPER(OWNER) LIKE 'STATE OF %' OR UPPER(OWNER) LIKE 'TOWN OF %')
    liveEntityCountAll: 3414
    liveEntityCount5to150ac: 986
    countNote: The live count uses the SQL approximation (LIKE '% TOKEN%' on the primary owner field, which also catches TRUSTEE/INCOME-style prefixes) together with the acreage filter above.
  paDeepLink:
