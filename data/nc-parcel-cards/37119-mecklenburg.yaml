    acreageField: gisacres
    acres5to150Live: 33566
    sampleCentroidWgs84:
    - -80.6302
    - 35.2286
    note: TaxParcel_camadata/MapServer/0 answers counts and attributes but returns geometry=null on every query (json and geojson), so polygons do not load. The same service's FeatureServer/0 returns rings with identical fields and counts. Card primary switched to FeatureServer/0; MapServer/0 kept as an alternate. Row count 448,582 is CAMA rows; clean polygon count on Tax/ParcelsViewer/MapServer/0 is 397,384 (condo/multi-row parcels).
  parcelLayer: https://meckgis.mecklenburgcountync.gov/server/rest/services/TaxParcel_camadata/FeatureServer/0
