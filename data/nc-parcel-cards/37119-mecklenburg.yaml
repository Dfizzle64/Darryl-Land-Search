      Verified count 12092. Working/revision layer; use adopted Charlotte Future 2040 layer
      for production unless draft revisions are explicitly desired.
    status: partial

  - role: flu
    name: Future Land Use (area plans overlay)
    restUrl: https://meckags.mecklenburgcountync.gov/server/rest/services/StormWater/FloodOverlaysTransparent/MapServer/1
    layerId: 1
    geometry: polygon
    auth: none
    acreageField: null
    coverage: sample
    fieldMap:
      PropLuseTx: flu
      PropLuseCd: fluCode
      GenLuse: fluGeneral
      LuDesc: fluDescription
      PlanName: fluPlan
    notes: >
      Verified count 80313. Older neighborhood/area-plan FLU; use as secondary to adopted
      2040 Place Types and do not treat it as current Charlotte policy alone.
    status: partial

gaps:
  - No single countywide zoning FeatureServer; union Charlotte zoning with towns zoning, or use ParcelsZoningZipcode for parcel-level codes.
  - Charlotte 2040 Place Types do not cover all Mecklenburg towns; town FLU may be missing or only in local plans.
  - True unincorporated-only zoning polygons are not cleanly separated in the towns layer; verified munic values are towns only.
  - Area-plan Future Land Use overlay is legacy/incomplete versus current policy.
  - Owner phones/emails are not in public REST and are intentionally not collected.
  - TaxParcel_camadata vacorimprov vacant filter returned 0 in a spot check; validate enum values and prefer land-use codes, building value, or sales vacant flag.
  - NC OneMap parno versus county nc_pin/pid join needs careful validation.
  - County layers commonly have MaxRecordCount 2000 (OneMap 5000); paginate with resultOffset/resultRecordCount.
  - No paid vendor data used or required.

