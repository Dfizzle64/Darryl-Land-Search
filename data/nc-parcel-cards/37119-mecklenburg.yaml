  verifiedBy: North Carolina Public Info Researcher
  pass1:
    status: fixed
    parcelPolygonLayer: https://meckgis.mecklenburgcountync.gov/server/rest/services/TaxParcel_camadata/FeatureServer/0
    polygonCountLive: 448582
    parcelIdField: nc_pin
