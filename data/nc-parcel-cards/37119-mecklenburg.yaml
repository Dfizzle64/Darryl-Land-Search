# Wire first: use the primary county parcel layer, then attach parcel zoning,
# sales history, municipal zoning, and FLU in that order.
layers:
  - role: parcels
    name: TaxParcel_camadata (PRIMARY)
    restUrl: https://meckgis.mecklenburgcountync.gov/server/rest/services/TaxParcel_camadata/FeatureServer/0
    # 2026-09-28: MapServer/0 returns null geometry on query; FeatureServer/0 returns polygons (MapServer kept as alternate below)
    alternateUrlsPass1Fix: [https://meckgis.mecklenburgcountync.gov/server/rest/services/TaxParcel_camadata/MapServer/0]
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: gisacres
    coverage: county-wide
    fieldMap:
      nc_pin: parcelId
      pid: parcelIdPolaris
      parcelid: parcelIdSalesJoin
      gisacres: acreage
      legalacres: acreageLegal
      totalac: acreageTotal
      ownrlstnme: ownerName.last
      ownrfrstnme: ownerName.first
      ownr2lstnme: ownerName2.last
      ownr2frstnme: ownerName2.first
      mailaddr1: mailingAddress.street
      mailaddr2: mailingAddress.street2
      zipcode: mailingAddress.zip
      state: mailingAddress.state
      address: situsAddress
      streetnumber: situsAddress.number
      streetname: situsAddress.street
      loccity: situsCity
      saledate: lastSale.date
      saleprice: lastSale.price
      totlandval: tax.landValue
      totalbldgval: tax.improvementValue
      totalvalue: tax.assessedValue
      totmarkval: tax.marketValue
      landuse_description: landUseDesc
      lusecode: dorCode
      vacorimprov: vacantOrImproved
      resunits: residentialUnits
      yearbuilt: yearBuilt
    notes: >
      PRIMARY county polygon and attribute source. Verified count 448526; gisacres
      5–150 returned approximately 33567 parcels. CRS 102719/2264. No zoning field;
      join ParcelsZoningZipcode or spatially join municipal zoning. MaxRecordCount 2000;
      paginate. Keep nc_pin as the preferred county join key and pid for POLARIS.
    status: usable

  - role: parcels
    name: Tax/ParcelsViewer Parcels
    restUrl: https://meckags.mecklenburgcountync.gov/server/rest/services/Tax/ParcelsViewer/MapServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: gisacres
    coverage: county-wide
    fieldMap:
      nc_pin: parcelId
      pid: parcelIdPolaris
      gisacres: acreage
      map_book: mapBook
      map_page: mapPage
      map_block: mapBlock
      lot_num: lotNumber
    notes: Geometry-focused county alternate. Verified count 397300; no owner, tax, sale, or zoning fields.
    status: usable

  - role: parcels
    name: CountyData/Parcels (Charlotte host alternate)
    restUrl: https://gis.charlottenc.gov/arcgis/rest/services/CountyData/Parcels/MapServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      NC_PIN: parcelId
      PID: parcelIdPolaris
      MAP_BOOK: mapBook
      MAP_PAGE: mapPage
    notes: Verified count 397300. Thin attributes and WKID 102100/3857; prefer county State Plane layers.
    status: partial

  - role: parcels
    name: PLN/AllParcelData (Charlotte host alternate)
    restUrl: https://gis.charlottenc.gov/arcgis/rest/services/PLN/AllParcelData/MapServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: legalacres
    coverage: county-wide
    fieldMap:
      parcelid: parcelId
      propertyid: parcelIdAlt
      owner1lastname: ownerName.last
      owner1firstname: ownerName.first
      owner2lastname: ownerName2.last
      owner2firstname: ownerName2.first
      billingaddress: mailingAddress.street
      billingaddress2: mailingAddress.street2
      zipcode: mailingAddress.zip
      state: mailingAddress.state
      location_address: situsAddress
      streetnumber: situsAddress.number
      streetname: situsAddress.street
      locationcity: situsCity
      saleprice: lastSale.price
      saledate: lastSale.date
      totallandvalue: tax.landValue
      totalbuildingvalue: tax.improvementValue
      totalvalue: tax.assessedValue
      totalmarketvalue: tax.marketValue
      legalacres: acreage
      landsize: acreageAlt
    notes: Verified count 429007. Parallel rich CAMA source; prefer TaxParcel_camadata as county canonical.
    status: usable

  - role: zoning
    name: ParcelsZoningZipcode (parcel-level zoning join)
    restUrl: https://meckgis.mecklenburgcountync.gov/server/rest/services/ParcelsZoningZipcode/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: gisacres
    coverage: county-wide
    fieldMap:
      nc_pin: parcelId
      pid: parcelIdPolaris
      gisacres: acreage
      zone_class: zoning
      zip: situsZip
      po_name: postOfficeName
    notes: >
      Fastest parcel-level zoning attachment without spatial overlay. Verified count 454837;
      sample zone_class was N1-A. Combine with Charlotte/towns zoning polygons when overlays,
      petitions, or jurisdiction detail are needed.
    status: usable

  - role: zoning
    name: City of Charlotte Zoning
    restUrl: https://meckgis.mecklenburgcountync.gov/server/rest/services/CityofCharlotteZoning/MapServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: null
    coverage: city-only
    fieldMap:
      zoneclass: zoning
      ZoneClass: zoning
      zonedes: zoningLabel
      ZoneDes: zoningLabel
      overlay: zoningOverlay
      Overlay: zoningOverlay
      zonepetition: zoningPetition
      rezonedate: zoningDate
      hyperlink: zoningUrl
    notes: >
      Verified count 5689. Charlotte plus planning area only. City-host alternate is
      https://gis.charlottenc.gov/arcgis/rest/services/PLN/Zoning/MapServer/0.
    status: usable

  - role: zoning
    name: Unincorporated County and Towns Zoning
    restUrl: https://meckgis.mecklenburgcountync.gov/server/rest/services/UnincorporatedCountyandTownsZoning/MapServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: null
    coverage: city-only
    fieldMap:
      zone_des: zoning
      munic: municipality
    notes: >
      Verified count 977. Distinct munic values are CORNELIUS, DAVIDSON, HUNTERSVILL,
      MATTHEWS, MINT HILL, PINEVILLE, and STALLINGS. Despite the service name, verified
