  - role: sales
    name: TaxParcelSales (sale history)
    restUrl: https://meckgis.mecklenburgcountync.gov/server/rest/services/TaxParcelSales/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      parcelid: parcelIdSalesJoin
      saledate: lastSale.date
      saleprice: lastSale.price
      grantor: sale.grantor
      grantee: sale.grantee
      salesvalidity: lastSale.qualified
      soldasvacantflag: soldAsVacant
      landuse: landUseDesc
      deeddescription: deedDescription
      legalreference: legalReference
    notes: >
      Verified count 1598048. True multi-transfer history; join on parcelid, not always nc_pin.
      Filter salesvalidity for usable comps. Geometry is parcel footprint per sale record.
    status: usable

  - role: parcels
    name: NC OneMap Parcels (polys) — statewide fallback
    restUrl: https://services.nconemap.gov/secure/rest/services/NC1Map_Parcels/FeatureServer/1
    layerId: 1
    geometry: polygon
    auth: none
    acreageField: gisacres
    coverage: county-wide
    fieldMap:
      parno: parcelId
      ownname: ownerName
      mailadd: mailingAddress.street
      mcity: mailingAddress.city
      mstate: mailingAddress.state
      mzip: mailingAddress.zip
      siteadd: situsAddress
      scity: situsCity
      gisacres: acreage
      saledate: lastSale.date
      saledatetx: lastSale.dateText
      parval: tax.marketValue
      landval: tax.landValue
      improvval: tax.improvementValue
      parusecode: dorCode
      parusedesc: landUseDesc
      cntyfips: countyFips
      cntyname: countyName
    notes: >
      Filter cntyfips='119'. Verified Mecklenburg count 442287; sample returned owner,
      site, mailing, values, and sale fields. MaxRecordCount 5000. Alternate host is
      https://services.gis.nc.gov/secure/rest/services/NC1Map_Parcels/FeatureServer/1.
      May lag local CAMA; use only as fallback.
    status: usable

  - role: flu
    name: Charlotte Future 2040 Policy Map (adopted Place Types)
    restUrl: https://services.arcgis.com/9Nl857LBlQVyzq54/arcgis/rest/services/Charlotte_Future_2040_Policy_Map/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: null
    coverage: city-only
    fieldMap:
      PlaceTypeFullTxt: flu
      PlaceTypeCde: fluCode
      AdoptionType: fluAdoptionType
      AdoptionDate: fluAdopted
      CommunityPlanningArea: planningArea
    notes: >
      Verified count 5640. Preferred current FLU for Charlotte Place Types; spatial-join to
      parcels. Does not cover all Mecklenburg towns.
    status: usable

  - role: flu
    name: Revised Charlotte Future 2040 Policy Map (working/revision)
    restUrl: https://services.arcgis.com/9Nl857LBlQVyzq54/arcgis/rest/services/Revised_Charlotte_Future_2040_Policy_Map/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: null
    coverage: city-only
    fieldMap:
      AdoptedPlaceTypeCde: fluAdoptedCode
      AdoptedTypeFullTxt: fluAdopted
