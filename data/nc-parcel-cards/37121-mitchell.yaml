  ownerEntity:
    ownerFields:
    - Owner1
    - Owner2
    primaryOwnerField: Owner1
    rule: 'Uppercase and trim the owner name(s), then flag as entity if it matches the regex (apply to every owner field; any hit = entity). Note: TRUSTEE does not match the TRUST word rule, and a surname such as CHURCH at the start of the name is a known false positive.'
    regex: \b(LLC|L\.L\.C\.?|INC\.?|CORP(ORATION)?|LP|L\.P\.|LLP|LTD|TRUST|CHURCH|COMPANY|PARTNERSHIP|HOLDINGS|PROPERTIES)\b|^(CITY|COUNTY|STATE|TOWN) OF\b
    tokens:
    - LLC
    - INC
    - LP
    - LLP
    - LTD
    - TRUST
    - CHURCH
    - COMPANY
    - PARTNERSHIP
    - HOLDINGS
    - PROPERTIES
    - CORP/CORPORATION
    prefixes:
    - CITY OF
    - COUNTY OF
    - STATE OF
    - TOWN OF
    sqlApproxWhere: (UPPER(Owner1) LIKE '% LLC%' OR UPPER(Owner1) LIKE '% INC%' OR UPPER(Owner1) LIKE '% LP%' OR UPPER(Owner1) LIKE '% LLP%' OR UPPER(Owner1) LIKE '% LTD%' OR UPPER(Owner1) LIKE '% TRUST%' OR UPPER(Owner1) LIKE '% CHURCH%' OR UPPER(Owner1) LIKE '% COMPANY%' OR UPPER(Owner1) LIKE '% PARTNERSHIP%' OR UPPER(Owner1) LIKE '% HOLDINGS%' OR UPPER(Owner1) LIKE '% PROPERTIES%' OR UPPER(Owner1) LIKE '% CORP%' OR UPPER(Owner1) LIKE '%,LLC%' OR UPPER(Owner1) LIKE '%,INC%' OR UPPER(Owner1) LIKE 'CITY OF %' OR UPPER(Owner1) LIKE 'COUNTY OF %' OR UPPER(Owner1) LIKE 'STATE OF %' OR UPPER(Owner1) LIKE 'TOWN OF %')
    liveEntityCountAll: 3391
    liveEntityCount5to150ac: 753
    countNote: The live count uses the SQL approximation (LIKE '% TOKEN%' on the primary owner field, which also catches TRUSTEE/INCOME-style prefixes) together with the acreage filter above.
