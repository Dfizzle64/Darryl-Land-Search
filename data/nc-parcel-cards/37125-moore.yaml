    newer2025:
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1
      valueField: AADT_2025 (integer; also AADT_2024, AADT_2002-2025)
      countyFilter: County='Moore'
      countyFilterNote: Title case County name (2022 layer uses uppercase COUNTY)
      queryUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Moore%27&outFields=LocationID%2CRouteID%2CLocated_On%2CCounty%2CAADT_2024%2CAADT_2025&returnGeometry=true&outSR=4326&f=json
      countUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Moore%27&returnCountOnly=true&f=json
      liveStationCount: 637
      stationsWithAADT2025: 174
      stationsWithAADT2024: 356
      dataLastEdit: '2026-09-23'
    also:
      stations2024Service: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT__2024_AADT_Stations_published_September_2025/FeatureServer/0
      segments2025: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/0
    recommendation: 'Newer year IS on REST: prefer NCDOT_2025 layer 1 (AADT_2025, falling back to AADT_2024 then AADT_2022 when the newest is null). The 2022 layer is kept as the documented baseline.'
  tax:
    fields:
    - TOTAL_VAL
    - LANDVALUE
    allTaxFieldsOnLayer:
    - TOTAL_VAL
    - LANDVALUE
    - BUILD_VAL
    - TAXJURIS
    liveNonZero:
      TOTAL_VAL: 76682
      LANDVALUE: 76662
    status: ok
  sale:
    priceFields:
    - RECENT_SALE_PRICE
    - STAMP_VAL
    dateFields:
    - VALID_SALESDT
    - TRANSDATE
    livePriceNonZero:
      RECENT_SALE_PRICE: 29172
      STAMP_VAL: 37383
    liveDateNonNull:
      VALID_SALESDT: 22382
      TRANSDATE: 76730
    status: ok
    note: RECENT_SALE_PRICE / VALID_SALESDT are qualified-sale fields; TRANSDATE is the last transfer date on nearly every row.
  ownerEntity:
    ownerFields:
    - NAME
    - NAME2
    primaryOwnerField: NAME
    rule: 'Uppercase and trim the owner name(s), then flag as entity if it matches the regex (apply to every owner field; any hit = entity). Note: TRUSTEE does not match the TRUST word rule, and a surname such as CHURCH at the start of the name is a known false positive.'
    regex: \b(LLC|L\.L\.C\.?|INC\.?|CORP(ORATION)?|LP|L\.P\.|LLP|LTD|TRUST|CHURCH|COMPANY|PARTNERSHIP|HOLDINGS|PROPERTIES)\b|^(CITY|COUNTY|STATE|TOWN) OF\b
    tokens:
    - LLC
    - INC
    - LP
    - LLP
    - LTD
    - TRUST
    - CHURCH
    - COMPANY
    - PARTNERSHIP
    - HOLDINGS
    - PROPERTIES
    - CORP/CORPORATION
    prefixes:
    - CITY OF
    - COUNTY OF
    - STATE OF
    - TOWN OF
    sqlApproxWhere: (UPPER(NAME) LIKE '% LLC%' OR UPPER(NAME) LIKE '% INC%' OR UPPER(NAME) LIKE '% LP%' OR UPPER(NAME) LIKE '% LLP%' OR UPPER(NAME) LIKE '% LTD%' OR UPPER(NAME) LIKE '% TRUST%' OR UPPER(NAME) LIKE '% CHURCH%' OR UPPER(NAME) LIKE '% COMPANY%' OR UPPER(NAME) LIKE '% PARTNERSHIP%' OR UPPER(NAME) LIKE '% HOLDINGS%' OR UPPER(NAME) LIKE '% PROPERTIES%' OR UPPER(NAME) LIKE '% CORP%' OR UPPER(NAME) LIKE '%,LLC%' OR UPPER(NAME) LIKE '%,INC%' OR UPPER(NAME) LIKE 'CITY OF %' OR UPPER(NAME) LIKE 'COUNTY OF %' OR UPPER(NAME) LIKE 'STATE OF %' OR UPPER(NAME) LIKE 'TOWN OF %')
    liveEntityCountAll: 12398
    liveEntityCount5to150ac: 1990
    countNote: The live count uses the SQL approximation (LIKE '% TOKEN%' on the primary owner field, which also catches TRUSTEE/INCOME-style prefixes) together with the acreage filter above.
