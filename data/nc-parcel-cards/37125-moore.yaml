gaps:
  - Parcel situs not on Tax_Layers — join Address points or OneMap siteadd.
  - "OpenData/taxparcels and OpenData/zoning require token (499) — not publicly wireable; use Tax_Layers + Planning_*."
  - ITSPublicMO RealEstateSearch returns config 500 at verify — use AppraisalCard PDF + TaxBillSearch + NCPTS.
  - iCare legacy portal showed maintenance at verify — do not rely as primary PA.
  - City-specific FLU FeatureServers not verified for Southern Pines / Pinehurst / Aberdeen / Carthage — county FLU only.
  - County ZCODE includes muni-name placeholder polygons — ignore; use City Zoning JR filter.
  - Sale history is last-sale on parcels plus Valid_Sales_By_Year layers — not full deed chain.
  - Candor edge only — prefer Montgomery County card for Candor proper.

