gaps:
  - No independent Rocky Mount or town ArcGIS FeatureServers — county-host Avineon layers + ViewPro viewer only
  - Combined County Zoning / OpenGov layers are mostly NASH COUNTY codes plus muni stubs without ZONE_CODE — always prefer per-muni layers 65–75 / 72 inside city limits
  - No city FLU FeatureServers — county LDP Municipal Growth placeholder; Rocky Mount plan PDF / ViewPro
  - PHYS_ADDR null on ~18% — join Address Points on PARID or OneMap siteadd
  - ETJ missing several munis; field ZONE_ only
  - Last-sale only; Sales/48 is a subset not multi-transfer history
  - Tax datalet requires TAX_PARID (not 12-digit PIN); portal may show intermittent maintenance banner
  - Elm City city_limits tip is Wilson County core — prefer Wilson card
  - Sharpsburg / Whitakers / Rocky Mount span adjacent counties — clip to Nash for this card
  - MaxRecordCount 2000 — paginate; no phones/emails; no AADT/utilities; no paid vendors
