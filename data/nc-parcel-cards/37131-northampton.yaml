gaps:
- No county-hosted ArcGIS Server root — AGD AGOL (services3…/nJbIFHiSnaX0z0hS) + OneMap
  + UCPCOG Rich Square
- County Official Zoning Map — ordinance PDF only; no public countywide zoning FeatureServer
  (legacy MapJournal webmap inaccessible)
- Jackson / Gaston / Conway / Seaboard / Woodland / Severn / Lasker / Garysburg —
  zoning REST gaps
- County FLU — Comp Plan PDF only; no countywide FLUM FeatureServer (Rich Square Land_Use
  only)
- OneMap has saledate but no sale price — prefer NorthamptonService/8 Sale_Price
- AGD Parcel_Address situs ~53% fill — prefer OneMap siteadd when joining
- AGD print apps.agdmaps.com/print/nc/northampton 404 — use PRC PDF + webappviewer
- Do not use gis.northamptoncounty.org / northampton.maps.arcgis.com (Pennsylvania)
- Rich Square WFL1 layers 0–3 are water/sewer utilities — excluded per card rules
- Last-sale only on parcel (multi-year sales zip offline spreadsheet, not REST history)
- MaxRecordCount 1000 on NorthamptonService — paginate; no phones/emails; no AADT/utilities;
  no paid vendors
license: Northampton County NC public GIS via AGD Maps; Town of Rich Square / UCPCOG
