# ---- PASS2 full-suite upgrade (rural OZ) — verifiedAt 2026-09-28 ----
pass2:
  label: PASS2 full-suite upgrade — rural OZ counties (tax / sale / owner-entity / PA link / GIS link / AADT)
  verifiedAt: '2026-09-28'
  verifiedBy: North Carolina Public Info Researcher
  aadtScreening:
    source: NCDOT Traffic Survey Group (public AGOL)
    layer: NCDOT_AADT_Stations FeatureServer/0 (documented in enrichment/NC/ncdot-aadt-statewide-dig-2026-09-24.yaml)
    restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0
    countyField: COUNTY
    countyValue: ONSLOW
    valueField: AADT_2022
    valueType: string (trim; blank = no count that year)
    countQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27ONSLOW%27&returnCountOnly=true&f=json
    featureQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27ONSLOW%27&outFields=LocationID%2CROUTE%2CLOCATION%2CAADT_2021%2CAADT_2022&outSR=4326&f=geojson&resultOffset=0&resultRecordCount=1000
    liveStationCount: 423
    stationsWithAADT2022: 232
    newerYearAvailable:
      available: true
      layer: NCDOT_2025_AADTandTrafficSegments_gdb FeatureServer/1 (NCDOT_2025_AADT_Stations; dataLastEdit 2026-09-23)
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1
      countyField: County
      countyValue: Onslow
      valueField: AADT_2025
      valueType: integer (null = no count)
      countQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Onslow%27&returnCountOnly=true&f=json
      featureQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Onslow%27&outFields=LocationID%2CRouteID%2CLocated_On%2CCrossroad%2CAADT_2023%2CAADT_2024%2CAADT_2025&outSR=4326&f=geojson&resultOffset=0&resultRecordCount=1000
      liveStationCount: 426
      stationsWithAADT2025: 205
      stationsWithAADT2024: 275
      segmentsLayer: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/0 (AADT, AADT_Year=2025, AADTT truck volumes; polyline, statewide — spatial filter by county envelope)
      also: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT__2024_AADT_Stations_published_September_2025/FeatureServer/0 (2024 stations, published Sep 2025; County title-case; AADT_2023/AADT_2024 strings)
    recommendation: Keep AADT_2022 wiring (#59) as-is; optionally switch to 2025 stations layer and take latest non-null of AADT_2025→AADT_2024→AADT_2023 per station. Note County value case differs (2022 layer UPPER, 2025 layer Title).
  primaryParcelLayer:
    restUrl: https://maps.onslowcountync.gov/arcgis/rest/services/WEB_PUBLICATIONS/County_Map_Layers/MapServer/0
    acreageField: GISACRES
    range5to150Where: GISACRES>=5 AND GISACRES<=150
    liveTotalParcels: 96843
    liveParcels5to150: 6771
  taxValues:
    status: ok
    fields:
      FINALFULLLANDVALUE: tax.landValue
      FINALFULLBUILDINGVALUE: tax.improvementValue
      TAXMARKETVALUE: tax.marketValue
      TOTALTAXABLEVALUE: tax.taxableValue
    liveNonZeroCounty:
      FINALFULLLANDVALUE: 93576
      FINALFULLBUILDINGVALUE: 76784
      TAXMARKETVALUE: 95821
      TOTALTAXABLEVALUE: 95823
    liveNonZero5to150:
      TOTALTAXABLEVALUE: 6748
    notes: Double fields; TAXMARKETVALUE market, TOTALTAXABLEVALUE taxable.
    publicFallback: https://tax.onslowcountync.gov/ITSPublicON/TaxBillSearch/Parcel/{PARID}
  saleHistory:
    status: ok
    priceFields:
    - SALEPRICE
    dateFields:
    - SALEDATE
    livePriceGt0County:
      SALEPRICE: 61965
    livePriceGt0_5to150:
      SALEPRICE: 2662
    liveDateNonNullCounty:
      SALEDATE: 96527
    notes: SALEDATE STRING DD-MON-YY (e.g. 28-FEB-25); SALEPRICE double; SALECODE qualified code.
  ownerEntity:
    ownerFields:
    - OWNER1
    - OWNER2
    primaryOwnerField: OWNER1
    rule:
      apply: Uppercase + trim OWNER1 (optionally also OWNER2)
      regex: (?i)(\bL\.?\s?L\.?\s?C\b|\bINC\b|\bCORP|\bL\.?\s?P\b|\bLLP\b|\bLLLP\b|\bLTD\b|TRUST|CHURCH|MINISTR|\bCOMPANY\b|PARTNERSHIP|PRTNRSHP|HOLDINGS|PROPERTIES|INVESTMENT|ASSOCIATION|\bHOA\b|FOUNDATION|AUTHORITY|\bDEVELOPMENT|BOARD OF EDUCATION|^(CITY|COUNTY|STATE|TOWN|VILLAGE) OF\b|^UNITED STATES|^NORTH CAROLINA\b|\bCOUNTY$)
      sqlLikeTokens:
      - '% LLC%'
      - '%,LLC%'
      - '% L L C%'
      - '% INC'
      - '% INC %'
      - '% INC.%'
      - '%,INC%'
      - '% CORP%'
      - '%CORPORATION%'
      - '% LP'
      - '% LP %'
      - '% L P'
      - '% LLP%'
      - '% LTD%'
      - '%TRUST%'
      - '%CHURCH%'
      - '%MINISTR%'
      - '% COMPANY%'
      - '%PARTNERSHIP%'
      - '%HOLDINGS%'
      - '%PROPERTIES%'
      - '%INVESTMENT%'
      - '%ASSOCIATION%'
      - '%FOUNDATION%'
      - '%AUTHORITY%'
      - CITY OF %
      - COUNTY OF %
      - STATE OF %
      - TOWN OF %
      - '% COUNTY'
      - '%BOARD OF EDUCATION%'
      - UNITED STATES%
      - NORTH CAROLINA %
      - '% DEVELOPMENT%'
      caveats: TRUST/TRUSTEE also flags family/revocable living trusts (still non-individual title holders); "% COUNTY" suffix catches e.g. "PERSON COUNTY"; bare "CO" and "ESTATE" intentionally excluded (too many false positives). Some owner strings carry trailing spaces (Wake) or mixed case (Yadkin) — normalize first.
    liveEntityCount5to150: 1589
    liveOwnerNonNull5to150: 6771
    entityQuery: where=GISACRES>=5 AND GISACRES<=150 AND (OWNER1 LIKE '% LLC%' OR OWNER1 LIKE '%,LLC%' OR OWNER1 LIKE '% L L C%' OR OWNER1 LIKE '% INC' OR OWNER1 LIKE '% INC %' OR OWNER1 LIKE '% INC.%' OR OWNER1 LIKE '%,INC%' OR OWNER1 LIKE '% CORP%' OR OWNER1 LIKE '%CORPORATION%' OR OWNER1 LIKE '% LP' OR OWNER1 LIKE '% LP %' OR OWNER1 LIKE '% L P' OR OWNER1 LIKE '% LLP%' OR OWNER1 LIKE '% LTD%' OR OWNER1 LIKE '%TRUST%' OR OWNER1 LIKE '%CHURCH%' OR OWNER1 LIKE '%MINISTR%' OR OWNER1 LIKE '% COMPANY%' OR OWNER1 LIKE '%PARTNERSHIP%' OR OWNER1 LIKE '%HOLDINGS%' OR OWNER1 LIKE '%PROPERTIES%' OR OWNER1 LIKE '%INVESTMENT%' OR OWNER1 LIKE '%ASSOCIATION%' OR OWNER1 LIKE '%FOUNDATION%' OR OWNER1 LIKE '%AUTHORITY%' OR OWNER1 LIKE 'CITY OF %' OR OWNER1 LIKE 'COUNTY OF %' OR OWNER1 LIKE 'STATE OF %' OR OWNER1 LIKE 'TOWN OF %' OR OWNER1 LIKE '% COUNTY' OR OWNER1 LIKE '%BOARD OF EDUCATION%' OR OWNER1 LIKE 'UNITED STATES%' OR OWNER1 LIKE 'NORTH CAROLINA %' OR OWNER1 LIKE '% DEVELOPMENT%')
  paDeepLink:
