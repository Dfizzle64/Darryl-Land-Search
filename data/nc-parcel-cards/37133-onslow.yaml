gaps:
  - No public GET AppraisalCard/Datalet deep-link (AppraisalCard.aspx → 500/404); ViewParcel is POST-only after search
  - Jacksonville city FLU REST gap — city uses county Horizon 2040 / Future Land Use; jacksonvillenc.gov Online Mapping is UI not separate FS
  - Municipal FLU for Holly Ridge / Richlands appear as placeholder districts on county FLU layer — no separate town FLU FS
  - Surf City spans Onslow/Pender — dual-county filter required
  - Camp Lejeune / military lands largely non-participating on FLU; zoning DATA=CAMP LEJEUNE sparse
  - CAMA ZONING attribute useful stub but prefer polygon spatial join
  - OneMap has no sale price; prefer county SALEPRICE
  - Last-sale only on parcel layer (no multi-transfer sales FS)
  - Utilities / AADT out of scope for this card

