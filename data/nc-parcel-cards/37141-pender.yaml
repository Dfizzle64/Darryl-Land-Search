  - Tax values missing on LayersPro and OperationalLayers2026 Parcels — use Energov/1
  - Atkinson has no public zoning FeatureServer (ordinance/UDO only)
  - Municipal FLU REST thin — Imagine 2050 uses Municipal/ETJ for incorporated areas
  - CAMA ZONE attribute incomplete/mixed — prefer spatial zoning joins
  - Situs often null on vacant tracts — join E911 or OneMap
  - Last-sale only; no multi-transfer sales layer
  - LayersMapIASLink parcel count lags Energov
  - Open data Hub API unauthorized/private
  - Surf City town GIS StoryMaps-first; wire via county host zoning
  - Wallace mostly Duplin — edge only in this card
