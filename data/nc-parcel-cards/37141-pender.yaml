pass2:
  label: PASS2 full-suite upgrade — rural OZ counties (tax / sale / owner-entity / PA link / GIS link / AADT)
  verifiedAt: '2026-09-28'
  verifiedBy: North Carolina Public Info Researcher
  aadtScreening:
    source: NCDOT Traffic Survey Group (public AGOL)
    layer: NCDOT_AADT_Stations FeatureServer/0 (documented in enrichment/NC/ncdot-aadt-statewide-dig-2026-09-24.yaml)
    restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0
    countyField: COUNTY
    countyValue: PENDER
    valueField: AADT_2022
    valueType: string (trim; blank = no count that year)
    countQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27PENDER%27&returnCountOnly=true&f=json
    featureQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27PENDER%27&outFields=LocationID%2CROUTE%2CLOCATION%2CAADT_2021%2CAADT_2022&outSR=4326&f=geojson&resultOffset=0&resultRecordCount=1000
    liveStationCount: 339
    stationsWithAADT2022: 111
    newerYearAvailable:
      available: true
      layer: NCDOT_2025_AADTandTrafficSegments_gdb FeatureServer/1 (NCDOT_2025_AADT_Stations; dataLastEdit 2026-09-23)
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1
      countyField: County
      countyValue: Pender
      valueField: AADT_2025
      valueType: integer (null = no count)
      countQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Pender%27&returnCountOnly=true&f=json
      featureQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Pender%27&outFields=LocationID%2CRouteID%2CLocated_On%2CCrossroad%2CAADT_2023%2CAADT_2024%2CAADT_2025&outSR=4326&f=geojson&resultOffset=0&resultRecordCount=1000
      liveStationCount: 335
      stationsWithAADT2025: 238
      stationsWithAADT2024: 212
      segmentsLayer: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/0 (AADT, AADT_Year=2025, AADTT truck volumes; polyline, statewide — spatial filter by county envelope)
      also: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT__2024_AADT_Stations_published_September_2025/FeatureServer/0 (2024 stations, published Sep 2025; County title-case; AADT_2023/AADT_2024 strings)
    recommendation: Keep AADT_2022 wiring (#59) as-is; optionally switch to 2025 stations layer and take latest non-null of AADT_2025→AADT_2024→AADT_2023 per station. Note County value case differs (2022 layer UPPER, 2025 layer Title).
  primaryParcelLayer:
    restUrl: https://gis.pendercountync.gov/arcgis/rest/services/Energov/MapServer/1
    acreageField: CALCACRES
    range5to150Where: CALCACRES>=5 AND CALCACRES<=150
    liveTotalParcels: 55487
    liveParcels5to150: 7466
  taxValues:
    status: ok
    fields:
      LAND_VALUE: tax.landValue
      BUILDING_VALUE: tax.improvementValue
      TOTAL_VALUE: tax.marketValue
    liveNonZeroCounty:
      LAND_VALUE: 53600
      BUILDING_VALUE: 34796
      TOTAL_VALUE: 54613
    liveNonZero5to150:
      TOTAL_VALUE: 7373
    notes: Double fields LAND_VALUE/BUILDING_VALUE/TOTAL_VALUE/DEFERRED_VALUE.
    publicFallback: https://tax.pendercountync.gov/Datalets/Datalet.aspx?UseSearch=no&mode=&pin={PIN_NO_DASHES}
  saleHistory:
    status: ok
    priceFields:
    - SALE_PRICE
    dateFields:
    - DATE
    livePriceGt0County:
      SALE_PRICE: 28657
    livePriceGt0_5to150:
      SALE_PRICE: 2554
    liveDateNonNullCounty:
      DATE: 46666
    notes: DATE esriDate; SALE_PRICE double. Last sale only.
  ownerEntity:
    ownerFields:
    - NAME
    primaryOwnerField: NAME
    rule:
      apply: Uppercase + trim NAME
      regex: (?i)(\bL\.?\s?L\.?\s?C\b|\bINC\b|\bCORP|\bL\.?\s?P\b|\bLLP\b|\bLLLP\b|\bLTD\b|TRUST|CHURCH|MINISTR|\bCOMPANY\b|PARTNERSHIP|PRTNRSHP|HOLDINGS|PROPERTIES|INVESTMENT|ASSOCIATION|\bHOA\b|FOUNDATION|AUTHORITY|\bDEVELOPMENT|BOARD OF EDUCATION|^(CITY|COUNTY|STATE|TOWN|VILLAGE) OF\b|^UNITED STATES|^NORTH CAROLINA\b|\bCOUNTY$)
      sqlLikeTokens:
      - '% LLC%'
      - '%,LLC%'
      - '% L L C%'
      - '% INC'
      - '% INC %'
      - '% INC.%'
      - '%,INC%'
      - '% CORP%'
      - '%CORPORATION%'
      - '% LP'
      - '% LP %'
      - '% L P'
      - '% LLP%'
      - '% LTD%'
      - '%TRUST%'
      - '%CHURCH%'
      - '%MINISTR%'
      - '% COMPANY%'
      - '%PARTNERSHIP%'
      - '%HOLDINGS%'
      - '%PROPERTIES%'
      - '%INVESTMENT%'
      - '%ASSOCIATION%'
      - '%FOUNDATION%'
      - '%AUTHORITY%'
      - CITY OF %
      - COUNTY OF %
      - STATE OF %
      - TOWN OF %
      - '% COUNTY'
      - '%BOARD OF EDUCATION%'
      - UNITED STATES%
      - NORTH CAROLINA %
      - '% DEVELOPMENT%'
      caveats: TRUST/TRUSTEE also flags family/revocable living trusts (still non-individual title holders); "% COUNTY" suffix catches e.g. "PERSON COUNTY"; bare "CO" and "ESTATE" intentionally excluded (too many false positives). Some owner strings carry trailing spaces (Wake) or mixed case (Yadkin) — normalize first.
    liveEntityCount5to150: 1777
    liveOwnerNonNull5to150: null
    entityQuery: where=CALCACRES>=5 AND CALCACRES<=150 AND (NAME LIKE any sqlLikeTokens) [run via external fetch]
