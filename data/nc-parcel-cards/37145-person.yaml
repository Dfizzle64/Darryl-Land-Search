# ---- PASS2 full-suite upgrade (rural OZ) — verifiedAt 2026-09-28 ----
pass2:
  label: PASS2 full-suite upgrade — rural OZ counties (tax / sale / owner-entity / PA link / GIS link / AADT)
  verifiedAt: '2026-09-28'
  verifiedBy: North Carolina Public Info Researcher
  aadtScreening:
    source: NCDOT Traffic Survey Group (public AGOL)
    layer: NCDOT_AADT_Stations FeatureServer/0 (documented in enrichment/NC/ncdot-aadt-statewide-dig-2026-09-24.yaml)
    restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0
    countyField: COUNTY
    countyValue: PERSON
    valueField: AADT_2022
    valueType: string (trim; blank = no count that year)
    countQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27PERSON%27&returnCountOnly=true&f=json
    featureQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27PERSON%27&outFields=LocationID%2CROUTE%2CLOCATION%2CAADT_2021%2CAADT_2022&outSR=4326&f=geojson&resultOffset=0&resultRecordCount=1000
    liveStationCount: 335
    stationsWithAADT2022: 129
    newerYearAvailable:
      available: true
      layer: NCDOT_2025_AADTandTrafficSegments_gdb FeatureServer/1 (NCDOT_2025_AADT_Stations; dataLastEdit 2026-09-23)
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1
      countyField: County
      countyValue: Person
      valueField: AADT_2025
      valueType: integer (null = no count)
      countQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Person%27&returnCountOnly=true&f=json
      featureQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Person%27&outFields=LocationID%2CRouteID%2CLocated_On%2CCrossroad%2CAADT_2023%2CAADT_2024%2CAADT_2025&outSR=4326&f=geojson&resultOffset=0&resultRecordCount=1000
      liveStationCount: 335
      stationsWithAADT2025: 205
      stationsWithAADT2024: 195
      segmentsLayer: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/0 (AADT, AADT_Year=2025, AADTT truck volumes; polyline, statewide — spatial filter by county envelope)
      also: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT__2024_AADT_Stations_published_September_2025/FeatureServer/0 (2024 stations, published Sep 2025; County title-case; AADT_2023/AADT_2024 strings)
    recommendation: Keep AADT_2022 wiring (#59) as-is; optionally switch to 2025 stations layer and take latest non-null of AADT_2025→AADT_2024→AADT_2023 per station. Note County value case differs (2022 layer UPPER, 2025 layer Title).
  primaryParcelLayer:
    restUrl: https://gis.personcountync.gov/arcgis/rest/services/Tax/BitekParcelInfo/FeatureServer/1
    acreageField: Calculated_Area_in_Acres
    range5to150Where: Calculated_Area_in_Acres>=5 AND Calculated_Area_in_Acres<=150
    liveTotalParcels: 28456
    liveParcels5to150: 6018
  taxValues:
    status: ok
    fields:
      Land_Value: tax.landValue
      Current_Structure_Value: tax.improvementValue
      Current_Assessed_Value: tax.assessedValue
    liveNonZeroCounty:
      Land_Value: 28040
      Current_Structure_Value: 18027
      Current_Assessed_Value: 28040
    liveNonZero5to150:
      Current_Assessed_Value: 5822
    notes: Double fields; Current_Assessed_Value ≈ land+structure+other.
    publicFallback: https://lrcpwa.ncptscloud.com/person/parcel-detail/{Record_Number}
  saleHistory:
    status: ok
    priceFields:
    - Sale_Price
    dateFields:
    - Sale_Date
    livePriceGt0County:
      Sale_Price: 16364
    livePriceGt0_5to150:
      Sale_Price: 2935
    liveDateNonNullCounty:
      Sale_Date: 27219
    notes: Sale_Date STRING MM/DD/YYYY; Sale_Price double; Sales_Code 'Q' ≈ qualified. Last sale only.
  ownerEntity:
    ownerFields:
    - Primary_Owner
    - Secondary_Owner
    primaryOwnerField: Primary_Owner
    rule:
      apply: Uppercase + trim Primary_Owner (optionally also Secondary_Owner)
      regex: (?i)(\bL\.?\s?L\.?\s?C\b|\bINC\b|\bCORP|\bL\.?\s?P\b|\bLLP\b|\bLLLP\b|\bLTD\b|TRUST|CHURCH|MINISTR|\bCOMPANY\b|PARTNERSHIP|PRTNRSHP|HOLDINGS|PROPERTIES|INVESTMENT|ASSOCIATION|\bHOA\b|FOUNDATION|AUTHORITY|\bDEVELOPMENT|BOARD OF EDUCATION|^(CITY|COUNTY|STATE|TOWN|VILLAGE) OF\b|^UNITED STATES|^NORTH CAROLINA\b|\bCOUNTY$)
      sqlLikeTokens:
      - '% LLC%'
      - '%,LLC%'
      - '% L L C%'
      - '% INC'
      - '% INC %'
      - '% INC.%'
      - '%,INC%'
      - '% CORP%'
      - '%CORPORATION%'
      - '% LP'
      - '% LP %'
      - '% L P'
      - '% LLP%'
      - '% LTD%'
      - '%TRUST%'
      - '%CHURCH%'
      - '%MINISTR%'
      - '% COMPANY%'
      - '%PARTNERSHIP%'
      - '%HOLDINGS%'
      - '%PROPERTIES%'
      - '%INVESTMENT%'
      - '%ASSOCIATION%'
      - '%FOUNDATION%'
      - '%AUTHORITY%'
      - CITY OF %
      - COUNTY OF %
      - STATE OF %
      - TOWN OF %
      - '% COUNTY'
      - '%BOARD OF EDUCATION%'
      - UNITED STATES%
      - NORTH CAROLINA %
      - '% DEVELOPMENT%'
      caveats: TRUST/TRUSTEE also flags family/revocable living trusts (still non-individual title holders); "% COUNTY" suffix catches e.g. "PERSON COUNTY"; bare "CO" and "ESTATE" intentionally excluded (too many false positives). Some owner strings carry trailing spaces (Wake) or mixed case (Yadkin) — normalize first.
    liveEntityCount5to150: 868
    liveOwnerNonNull5to150: 5929
    entityQuery: where=Calculated_Area_in_Acres>=5 AND Calculated_Area_in_Acres<=150 AND (Primary_Owner LIKE '% LLC%' OR Primary_Owner LIKE '%,LLC%' OR Primary_Owner LIKE '% L L C%' OR Primary_Owner LIKE '% INC' OR Primary_Owner LIKE '% INC %' OR Primary_Owner LIKE '% INC.%' OR Primary_Owner LIKE '%,INC%' OR Primary_Owner LIKE '% CORP%' OR Primary_Owner LIKE '%CORPORATION%' OR Primary_Owner LIKE '% LP' OR Primary_Owner LIKE '% LP %' OR Primary_Owner LIKE '% L P' OR Primary_Owner LIKE '% LLP%' OR Primary_Owner LIKE '% LTD%' OR Primary_Owner LIKE '%TRUST%' OR Primary_Owner LIKE '%CHURCH%' OR Primary_Owner LIKE '%MINISTR%' OR Primary_Owner LIKE '% COMPANY%' OR Primary_Owner LIKE '%PARTNERSHIP%' OR Primary_Owner LIKE '%HOLDINGS%' OR Primary_Owner LIKE '%PROPERTIES%' OR Primary_Owner LIKE '%INVESTMENT%' OR Primary_Owner LIKE '%ASSOCIATION%' OR Primary_Owner LIKE '%FOUNDATION%' OR Primary_Owner LIKE '%AUTHORITY%' OR Primary_Owner LIKE 'CITY OF %' OR Primary_Owner LIKE 'COUNTY OF %' OR Primary_Owner LIKE 'STATE OF %' OR Primary_Owner LIKE 'TOWN OF %' OR Primary_Owner LIKE '% COUNTY' OR Primary_Owner LIKE '%BOARD OF EDUCATION%' OR Primary_Owner LIKE 'UNITED STATES%' OR Primary_Owner LIKE 'NORTH CAROLINA %' OR Primary_Owner LIKE '% DEVELOPMENT%')
  paDeepLink:
