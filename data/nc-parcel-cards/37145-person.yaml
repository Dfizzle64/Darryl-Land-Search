gaps:
  - Only incorporated municipality is Roxboro — no other city FeatureServers (Timberlake/Semora/etc. are CDPs)
  - No dedicated Roxboro city GIS host — county PlanZone/Zoning/1 IS city-first zoning
  - FLUM is coarse (12 countywide polys) — not parcel-grain; no separate city FLU FS
  - ~211 parcels with null Tax_District_Description; ~211 lack Record_Number — prefer PIN
  - No multi-transfer sales history REST — last sale fields on parcel only
  - Sales_Code legend not fully published on REST (Q appears to be qualified) — treat as opaque code
  - OneMap scity blank for Person extract — use siteadd / county Site_Address
  - County FeatureServer CRS is 3857 (not NC StatePlane 2264) — reproject for OneMap overlays
  - personcountync.gov website often 403 to automated fetchers — use gis.personcountync.gov REST/viewer
  - No paid vendor data; no phones/emails collected; no AADT/utilities dig
