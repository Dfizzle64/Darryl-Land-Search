gaps:
  - Sale price not on public REST (SaleDate only) — PA AppraisalCard PDF for price QA
  - Municipal zoning REST gap for Rockingham, Hamlet, Ellerbe, Hoffman, Norman, Dobbins Heights
  - FLU PDF-only — no FeatureServer
  - Parcel polygon layer lacks situs — join AddressPoints PARCELNUM=PIN
  - OneMap siteadd empty; saledate epoch null — use saledatetx / county SaleDate
  - Legacy gis3.richmondnc.com TLS unreliable from some research networks
  - NCPTS richmond tenant IsValidTenant=false — do not wire as primary PA
  - RealEstateSearch/Parcel/{PIN} GET returns 404 — use AppraisalCard.aspx?id={PIN}
  - Utilities / AADT / emails / phones / paid vendors excluded by design

