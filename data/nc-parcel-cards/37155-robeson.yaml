gaps:
- Sale price not on public ArcGIS REST (AGOL/RokMaps/OneMap) — HTML ustaxdata only
- ROKMAPS MapServer/15 CAMA fields present in schema but NULL publicly — use AGOL for attributes
- OneMap gisacres broken (all 0) — use recareano or Shape__Area/43560
- FLU FeatureServer gap — Comprehensive Plan PDF only
- AGOL parcel count (76928) lags RokMaps/OneMap (~80k) — geometry currency vs CAMA tradeoff
- Shannon / Rennert / McDonald / Raynham / Marietta — thin or no ZONE_CODE prefixes
- Orrum / Proctorville zoning stubs UNKNOWN only
- No separate Lumberton/town independent zoning FeatureServers beyond county ZONE_CODE layer
- Utilities / AADT / emails / phones / paid vendors out of scope
