  notes: 'PRIMARY wire-first CAMA verified 2026-09-24 (county AGOL owner tanisha.ryans_robeson). Count
    76928; MAPACRE 5–150 → 14307; DEEDACRE 5–150 → 14300; DEEDEDACRE 5–150 → 14387; CALCULATED 5–150 →
    13449; OWNAM1/PIN_NUMBER/OWNERID/PHYSTRADR all 76928; LNDASVCUR>0 76887; IMPASVCUR>0 45376; IMP=0/null
    in 5–150 → 8282; DATESOLD populated 76928 (YYYYMMDD integer, often first-of-year). NO SALEAMT field
    on this FeatureServer — sale price REST gap (use ustaxdata HTML Sold Amount / robesonsales.cfm). CRS
    102100/3857. MaxRecordCount 1000 — paginate. Market total ≈ LNDASVCUR+IMPASVCUR. PA key MAPNO (=OneMap
    altparno). Geo-check PIN 929603877500 ≈ -79.030, 34.475 (Proctorville); 925355398900 ≈ -79.148, 34.397
    (Fairmont). CITYCODE: blank unincorp 68593, LUMB 2902, PEMB 1249, MAXT 973, FAIR 738, STPL 564, ROWL
    542, REDS 456, SHAN 312, ORRM 215, PARK 203, LBRG 144, RENN 26, PROC 9, MARE 2.'
