      IMP_FMV: 63751
      TOT_VAL: 82653
    liveNonZero5to150:
      TOT_VAL: 10294
    notes: Double fields LANDFMV/IMP_FMV/TOT_VAL (+LANDLUV use value).
    publicFallback: https://tax.rowancountync.gov/Datalets/Datalet.aspx?UseSearch=no&mode=&pin={PARCEL_ID}
  saleHistory:
    status: ok
    priceFields:
    - SALE_AMT
    dateFields:
    - DATESOLD
    livePriceGt0County:
      SALE_AMT: 44058
    livePriceGt0_5to150:
      SALE_AMT: 3806
    liveDateNonNullCounty:
      DATESOLD: 79297
    notes: DATESOLD esriDate; SALE_AMT double; QUALCODE qualified. Last sale only.
  ownerEntity:
    ownerFields:
    - OWNNAME
    - OWN2
    primaryOwnerField: OWNNAME
    rule:
      apply: Uppercase + trim OWNNAME (optionally also OWN2)
      regex: (?i)(\bL\.?\s?L\.?\s?C\b|\bINC\b|\bCORP|\bL\.?\s?P\b|\bLLP\b|\bLLLP\b|\bLTD\b|TRUST|CHURCH|MINISTR|\bCOMPANY\b|PARTNERSHIP|PRTNRSHP|HOLDINGS|PROPERTIES|INVESTMENT|ASSOCIATION|\bHOA\b|FOUNDATION|AUTHORITY|\bDEVELOPMENT|BOARD OF EDUCATION|^(CITY|COUNTY|STATE|TOWN|VILLAGE) OF\b|^UNITED STATES|^NORTH CAROLINA\b|\bCOUNTY$)
      sqlLikeTokens:
      - '% LLC%'
      - '%,LLC%'
      - '% L L C%'
      - '% INC'
      - '% INC %'
      - '% INC.%'
      - '%,INC%'
      - '% CORP%'
      - '%CORPORATION%'
      - '% LP'
      - '% LP %'
      - '% L P'
      - '% LLP%'
      - '% LTD%'
      - '%TRUST%'
      - '%CHURCH%'
      - '%MINISTR%'
      - '% COMPANY%'
      - '%PARTNERSHIP%'
      - '%HOLDINGS%'
      - '%PROPERTIES%'
      - '%INVESTMENT%'
      - '%ASSOCIATION%'
      - '%FOUNDATION%'
      - '%AUTHORITY%'
      - CITY OF %
      - COUNTY OF %
      - STATE OF %
      - TOWN OF %
      - '% COUNTY'
      - '%BOARD OF EDUCATION%'
      - UNITED STATES%
      - NORTH CAROLINA %
      - '% DEVELOPMENT%'
      caveats: TRUST/TRUSTEE also flags family/revocable living trusts (still non-individual title holders); "% COUNTY" suffix catches e.g. "PERSON COUNTY"; bare "CO" and "ESTATE" intentionally excluded (too many false positives). Some owner strings carry trailing spaces (Wake) or mixed case (Yadkin) — normalize first.
    liveEntityCount5to150: 1707
    liveOwnerNonNull5to150: 10376
    entityQuery: where=CALCACRE>=5 AND CALCACRE<=150 AND (OWNNAME LIKE '% LLC%' OR OWNNAME LIKE '%,LLC%' OR OWNNAME LIKE '% L L C%' OR OWNNAME LIKE '% INC' OR OWNNAME LIKE '% INC %' OR OWNNAME LIKE '% INC.%' OR OWNNAME LIKE '%,INC%' OR OWNNAME LIKE '% CORP%' OR OWNNAME LIKE '%CORPORATION%' OR OWNNAME LIKE '% LP' OR OWNNAME LIKE '% LP %' OR OWNNAME LIKE '% L P' OR OWNNAME LIKE '% LLP%' OR OWNNAME LIKE '% LTD%' OR OWNNAME LIKE '%TRUST%' OR OWNNAME LIKE '%CHURCH%' OR OWNNAME LIKE '%MINISTR%' OR OWNNAME LIKE '% COMPANY%' OR OWNNAME LIKE '%PARTNERSHIP%' OR OWNNAME LIKE '%HOLDINGS%' OR OWNNAME LIKE '%PROPERTIES%' OR OWNNAME LIKE '%INVESTMENT%' OR OWNNAME LIKE '%ASSOCIATION%' OR OWNNAME LIKE '%FOUNDATION%' OR OWNNAME LIKE '%AUTHORITY%' OR OWNNAME LIKE 'CITY OF %' OR OWNNAME LIKE 'COUNTY OF %' OR OWNNAME LIKE 'STATE OF %' OR OWNNAME LIKE 'TOWN OF %' OR OWNNAME LIKE '% COUNTY' OR OWNNAME LIKE '%BOARD OF EDUCATION%' OR OWNNAME LIKE 'UNITED STATES%' OR OWNNAME LIKE 'NORTH CAROLINA %' OR OWNNAME LIKE '% DEVELOPMENT%')
  paDeepLink:
