      countUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27SAMPSON%27&returnCountOnly=true&f=json
      liveStationCount: 669
      stationsWithAADT2022: 250
    newer2025:
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1
      valueField: AADT_2025 (integer; also AADT_2024, AADT_2002-2025)
      countyFilter: County='Sampson'
      countyFilterNote: Title case County name (2022 layer uses uppercase COUNTY)
      queryUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Sampson%27&outFields=LocationID,Located_On,Crossroad,County,AADT_2025,AADT_2024,Latitude,Longitude&returnGeometry=true&outSR=4326&f=json
      countUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Sampson%27&returnCountOnly=true&f=json
      liveStationCount: 677
      stationsWithAADT2025: 423
      stationsWithAADT2024: 385
      dataLastEdit: '2026-09-23'
    also:
      stations2024Service: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT__2024_AADT_Stations_published_September_2025/FeatureServer/0
      stations2024CountyFilter: County='Sampson'
      stations2024LiveCount: 670
      stations2024WithAADT2024: 670
      stations2024Note: AADT_2024 string field populated on every station in this release
      segments2025: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/0
    recommendation: 'Newer year IS on REST: prefer NCDOT_2025 layer 1 (AADT_2025, falling back to AADT_2024 then AADT_2022 when the newest is null). The 2022 layer is kept as the documented baseline.'
  tax:
    fields:
    - ASSESSED_V
    - TOTAL_TAX_
    liveNonZero:
      ASSESSED_V: 49885
      TOTAL_TAX_: 48212
    status: ok
  sale:
    priceFields:
    - SALE_PRICE
    dateFields:
    - DATE_RECOR
    livePriceNonZero:
      SALE_PRICE: 21542
    liveDateNonNull:
      DATE_RECOR: 47206
    status: ok
  ownerEntity:
    ownerFields:
    - CURRENT_OW
    rule: Concatenate owner fields, uppercase and trim, then flag as entity if the convention regex matches (batch convention; TRUSTEE does not match TRUST; LIFE ESTATE / ESTATE are not flagged). regexExtended is an optional wider net (CO, TR/TRS/TRUSTEE, MINISTRIES, ASSOCIATION, BANK, SCHOOL, DEPT/DEPARTMENT, BOARD, any 'X OF' government form, leading NORTH CAROLINA/NC).
    regex: \b(LLC|INC|CORP|LP|LLP|LTD|TRUST|CHURCH|COMPANY|PARTNERSHIP|HOLDINGS|PROPERTIES)\b|^(CITY|COUNTY|STATE|TOWN) OF\b
    regexExtended: \b(LLC|L\s?L\s?C|INC|INCORPORATED|CORP|CORPORATION|COMPANY|CO|LP|L\s?P|LLP|LLLP|LTD|LIMITED|PARTNERSHIP|PARTNERS|PTNRS|TRUST|TRUSTEE|TRUSTEES|TR|TRS|TRSTE|REVOCABLE|IRREVOCABLE|CHURCH|MINISTRIES|MINISTRY|BAPTIST|METHODIST|PRESBYTERIAN|CONGREGATION|DIOCESE|ASSOCIATION|ASSN|ASSOC|HOA|FOUNDATION|HOLDINGS|PROPERTIES|INVESTMENTS|INVESTORS|DEVELOPMENT|DEVELOPERS|ENTERPRISES|BANK|UNIVERSITY|COLLEGE|SCHOOL|SCHOOLS|AUTHORITY|COMMISSION|DEPT|DEPARTMENT|BOARD|COMMISSIONERS|GOVERNMENT|FEDERAL|UNITED STATES|USA|NCDOT|DOT)\b|\b(CITY|TOWN|COUNTY|STATE|VILLAGE)\s+OF\b|\bOF\s+(EDUCATION|TRANSPORTATION)\b|^(NORTH CAROLINA|NC|N C|STATE OF NC)\b
    prefixes:
    - CITY OF
    - COUNTY OF
    - STATE OF
    - TOWN OF
    liveEntityCount5to150ac: 2501
    liveEntityCount5to150acExtended: 2784
    countNote: Counts computed 2026-09-28 by pulling owner fields for every parcel in the 5–150 ac filter (objectId paging) and applying the Python regex client-side.
    sampleMatches:
    - HERRING BUILDERS, INC.
    - WISECO & ASSOCIATES, LLC
    - TMC BENSON, LLC
    - STONEY RUN PENTECOSTAL FWB CHURCH, INC.
