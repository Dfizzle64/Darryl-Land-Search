gaps:
  - Detailed zoning REST only for Clinton — other towns ETJ stubs / Autryville coarse only
  - No municipal FLU FeatureServer
  - Truncated 10-char field names on Parcels
  - APPRAISED often pipe-delimited segment text — prefer ASSESSED_V/TOTAL_TAX_
  - TAX_CODE is fire/tax district not municipality
  - "~776 blank CURRENT_OW"
  - No multi-transfer sales history REST; no sale qualification code
  - OneMap scity blank; improvval sparse for Sampson
  - sampsoncountync.gov often 403 to automated fetchers
  - sampsonlandrecords.com intermittent maintenance banner
  - Address_Points lack PIN
  - No paid vendor data; no phones/emails scraped; no AADT/utilities dig

