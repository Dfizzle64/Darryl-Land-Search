  verifiedBy: North Carolina Public Info Researcher
  parcelLayer: https://services3.arcgis.com/fM4kjZmPOS4ay2Ff/arcgis/rest/services/Parcels/FeatureServer/0
  parcelIdField: PIN
  acreageFilter: CALC_ACRES >= 5 AND CALC_ACRES <= 150
  acres5to150Live: 14195
  parcelCountLive: 50665
  aadt:
    primary2022:
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0
      valueField: AADT_2022 (string; trim, blank = no count)
