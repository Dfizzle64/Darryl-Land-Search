      Combined zoning for all cities/towns + County. Count 895 (OpenGov2 mirror 888).
      Filter Jurisdiction2 IN ('Albemarle','Norwood','Locust','Oakboro','Stanfield',
      'Richfield','New London','Red Cross','Badin','Misenheimer','County') or
