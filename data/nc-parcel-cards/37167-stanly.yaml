gaps:
  - No city-native ArcGIS for Albemarle / Locust / Norwood / Badin / Oakboro / New London / Richfield / Stanfield / Red Cross / Misenheimer — county Zoning Jurisdiction2 filter only
  - Locust Cabarrus OpenData zoning is historic/sparse (8 polys); Stanly Jurisdiction2='Locust' is authoritative for Stanly-side
  - FLU layer is FLUM attrs on parcel-like polygons (not pure FLU district polygons); MaxRecordCount 1000
  - Address points lack PIN — spatial join required; prefer PhyStreetAddr on parcels
  - Sales layer ParcelID = TAXRECORD family, not 12-digit PIN
  - Token-required services Stanly_County_Data / StanlyCoParcels (services9 ocwpKIugozBfaD6n) — skip
  - Owner phones/emails not collected (public REST has none)
  - Utilities / AADT / paid vendors excluded by card rules

