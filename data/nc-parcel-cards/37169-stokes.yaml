  - Interactive GIS viewer URL unpublished (stokescountygis.com homepage stub; no webappviewer id)
  - No FeatureServer SOE on county ArcGIS Server — MapServer query only; MaxRecordCount 2000
  - Walnut Cove and Danbury — no independent public ArcGIS REST for zoning/FLU
  - King local parcels lack sale-price fields
  - PACKAGE_SALE_PRICE sparse (~10143 / 32127); many parcels deed-date only
  - OneMap has no sale price; may lag county CAMA
  - King Forsyth-edge limits/parcels — clip to Stokes FIPS 37169 when needed
  - No phones/emails collected; no paid vendor data

