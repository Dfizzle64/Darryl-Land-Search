    publicFallback: https://lrcpwa.ncptscloud.com/stokes/parcel-detail/{PARCEL_PK}
  saleHistory:
    status: ok
    priceFields:
    - PACKAGE_SALE_PRICE
    - LAND_SALE_PRICE
    dateFields:
    - PACKAGE_SALE_DATE
    - DEED_DATE
    livePriceGt0County:
      PACKAGE_SALE_PRICE: 10147
      LAND_SALE_PRICE: 5260
    livePriceGt0_5to150:
      PACKAGE_SALE_PRICE: 1628
    liveDateNonNullCounty:
      PACKAGE_SALE_DATE: 12722
      DEED_DATE: 31934
    notes: PACKAGE_SALE_DATE esriDate is sparse (12,722); DEED_DATE is near-complete (31,934) — use DEED_DATE as fallback date. PACKAGE_SALE_PRICE primary; LAND_SALE_PRICE secondary.
  ownerEntity:
    ownerFields:
    - PROPERTY_OWNER_1
    - PROPERTY_OWNER_2
    primaryOwnerField: PROPERTY_OWNER_1
    rule:
      apply: Uppercase + trim PROPERTY_OWNER_1 (optionally also PROPERTY_OWNER_2)
      regex: (?i)(\bL\.?\s?L\.?\s?C\b|\bINC\b|\bCORP|\bL\.?\s?P\b|\bLLP\b|\bLLLP\b|\bLTD\b|TRUST|CHURCH|MINISTR|\bCOMPANY\b|PARTNERSHIP|PRTNRSHP|HOLDINGS|PROPERTIES|INVESTMENT|ASSOCIATION|\bHOA\b|FOUNDATION|AUTHORITY|\bDEVELOPMENT|BOARD OF EDUCATION|^(CITY|COUNTY|STATE|TOWN|VILLAGE) OF\b|^UNITED STATES|^NORTH CAROLINA\b|\bCOUNTY$)
      sqlLikeTokens:
      - '% LLC%'
      - '%,LLC%'
      - '% L L C%'
      - '% INC'
      - '% INC %'
      - '% INC.%'
      - '%,INC%'
      - '% CORP%'
      - '%CORPORATION%'
      - '% LP'
      - '% LP %'
      - '% L P'
      - '% LLP%'
      - '% LTD%'
      - '%TRUST%'
      - '%CHURCH%'
      - '%MINISTR%'
      - '% COMPANY%'
      - '%PARTNERSHIP%'
      - '%HOLDINGS%'
      - '%PROPERTIES%'
      - '%INVESTMENT%'
      - '%ASSOCIATION%'
      - '%FOUNDATION%'
      - '%AUTHORITY%'
      - CITY OF %
      - COUNTY OF %
      - STATE OF %
      - TOWN OF %
      - '% COUNTY'
      - '%BOARD OF EDUCATION%'
      - UNITED STATES%
      - NORTH CAROLINA %
      - '% DEVELOPMENT%'
      caveats: TRUST/TRUSTEE also flags family/revocable living trusts (still non-individual title holders); "% COUNTY" suffix catches e.g. "PERSON COUNTY"; bare "CO" and "ESTATE" intentionally excluded (too many false positives). Some owner strings carry trailing spaces (Wake) or mixed case (Yadkin) — normalize first.
    liveEntityCount5to150: 786
    liveOwnerNonNull5to150: 8801
    entityQuery: where=CALCULATED_ACREAGE>=5 AND CALCULATED_ACREAGE<=150 AND (PROPERTY_OWNER_1 LIKE '% LLC%' OR PROPERTY_OWNER_1 LIKE '%,LLC%' OR PROPERTY_OWNER_1 LIKE '% L L C%' OR PROPERTY_OWNER_1 LIKE '% INC' OR PROPERTY_OWNER_1 LIKE '% INC %' OR PROPERTY_OWNER_1 LIKE '% INC.%' OR PROPERTY_OWNER_1 LIKE '%,INC%' OR PROPERTY_OWNER_1 LIKE '% CORP%' OR PROPERTY_OWNER_1 LIKE '%CORPORATION%' OR PROPERTY_OWNER_1 LIKE '% LP' OR PROPERTY_OWNER_1 LIKE '% LP %' OR PROPERTY_OWNER_1 LIKE '% L P' OR PROPERTY_OWNER_1 LIKE '% LLP%' OR PROPERTY_OWNER_1 LIKE '% LTD%' OR PROPERTY_OWNER_1 LIKE '%TRUST%' OR PROPERTY_OWNER_1 LIKE '%CHURCH%' OR PROPERTY_OWNER_1 LIKE '%MINISTR%' OR PROPERTY_OWNER_1 LIKE '% COMPANY%' OR PROPERTY_OWNER_1 LIKE '%PARTNERSHIP%' OR PROPERTY_OWNER_1 LIKE '%HOLDINGS%' OR PROPERTY_OWNER_1 LIKE '%PROPERTIES%' OR PROPERTY_OWNER_1 LIKE '%INVESTMENT%' OR PROPERTY_OWNER_1 LIKE '%ASSOCIATION%' OR PROPERTY_OWNER_1 LIKE '%FOUNDATION%' OR PROPERTY_OWNER_1 LIKE '%AUTHORITY%' OR PROPERTY_OWNER_1 LIKE 'CITY OF %' OR PROPERTY_OWNER_1 LIKE 'COUNTY OF %' OR PROPERTY_OWNER_1 LIKE 'STATE OF %' OR PROPERTY_OWNER_1 LIKE 'TOWN OF %' OR PROPERTY_OWNER_1 LIKE '% COUNTY' OR PROPERTY_OWNER_1 LIKE '%BOARD OF EDUCATION%' OR PROPERTY_OWNER_1 LIKE 'UNITED STATES%' OR PROPERTY_OWNER_1 LIKE 'NORTH CAROLINA %' OR PROPERTY_OWNER_1 LIKE '% DEVELOPMENT%')
