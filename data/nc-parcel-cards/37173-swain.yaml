gaps:
  - Sale price REST gap — public on ITSPublicSW AppraisalCard PDF only; AGOL Deed_Date has date without price
  - Zoning district REST gap — Bryson City limits only; UDO/first zoning in development; unincorporated unzoned
  - FLU REST gap — 1994 Land Use Plan PDF + NCDOT CTP only
  - OneMap parno empty — join via altparno
  - County MS tax/acre fields are strings — CAST for numeric filters
  - TaxBillSearch/RealEstateSearch /Parcel/{id} deep-links 404 — use AppraisalCard ?id=
  - Spatialest /nc/swain shell not used as PA deep-link
  - Utilities / AADT / emails / phones / paid vendors excluded

