  - role: flu
    name: Future Land Use
    restUrl: null
    geometry: none
    auth: none
    coverage: none
    fieldMap: {}
    notes: >
      No FLU FeatureServer. 1994 Swain County Land Use Plan PDF
      https://www.swaincountync.gov/download/1994-swain-county-land-use-plan/?wpdmdl=6948 ;
      NCDOT CTP ≠ FLU.
