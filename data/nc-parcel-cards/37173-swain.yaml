# ---- PASS 2 full-suite upgrade (rural OZ), verifiedAt 2026-09-28; mirrors the json pass2 key ----
pass2:
  label: PASS 2 full-suite upgrade (rural OZ) 2026-09-28
  verifiedAt: '2026-09-28'
  verifiedBy: North Carolina Public Info Researcher
  parcelLayer: https://maps.swaincountync.gov/server/rest/services/OperationalLayers/MapServer/4
  parcelIdField: PARCEL_ID
  acreageFilter: CAST(LegalLandUnits AS FLOAT) >= 5 AND CAST(LegalLandUnits AS FLOAT) <= 150 AND LegalLandType='AC'
  acres5to150Live: 2521
  parcelCountLive: 12704
  aadt:
    primary2022:
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0
      valueField: AADT_2022 (string; trim, blank = no count)
      countyFilter: COUNTY='SWAIN'
      queryUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27SWAIN%27&outFields=LocationID%2CROUTE%2CLOCATION%2CCOUNTY%2CAADT_2022&returnGeometry=true&outSR=4326&f=json
      countUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27SWAIN%27&returnCountOnly=true&f=json
      liveStationCount: 142
      stationsWithAADT2022: 83
    newer2025:
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1
      valueField: AADT_2025 (integer; also AADT_2024, AADT_2002-2025)
      countyFilter: County='Swain'
      countyFilterNote: Title case County name (2022 layer uses uppercase COUNTY)
      queryUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Swain%27&outFields=LocationID%2CRouteID%2CLocated_On%2CCounty%2CAADT_2024%2CAADT_2025&returnGeometry=true&outSR=4326&f=json
      countUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Swain%27&returnCountOnly=true&f=json
      liveStationCount: 143
      stationsWithAADT2025: 93
      stationsWithAADT2024: 81
      dataLastEdit: '2026-09-23'
    also:
      stations2024Service: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT__2024_AADT_Stations_published_September_2025/FeatureServer/0
      segments2025: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/0
    recommendation: 'Newer year IS on REST: prefer NCDOT_2025 layer 1 (AADT_2025, falling back to AADT_2024 then AADT_2022 when the newest is null). The 2022 layer is kept as the documented baseline.'
  tax:
    fields:
    - TotalAssessedValue
    - TotalMarketValue
    allTaxFieldsOnLayer:
    - ParcelLandValue
    - ParcelBuildingValue
    - ParcelObxfValue
    - TotalMarketValue
    - TotalAssessedValue
    - ParcelDeferredValue
    - AssessedValue
    liveNonZero:
      TotalAssessedValue: 12655
      TotalMarketValue: 12655
    status: ok
    note: 'Value fields are strings: use CAST(field AS FLOAT) > 0.'
  sale:
    priceFields: []
    dateFields: []
    livePriceNonZero: {}
    liveDateNonNull: {}
    status: partial
    note: No sale fields on OperationalLayers/4. AGOL Swain_County_Parcels/0 Deed_Date non-null = 12,316 of 13,551 (live 2026-09-28); price only on ITSPublicSW AppraisalCard PDF.
  ownerEntity:
    ownerFields:
    - Name1
    - Name2
    primaryOwnerField: Name1
    rule: 'Uppercase and trim the owner name(s), then flag as entity if it matches the regex (apply to every owner field; any hit = entity). Note: TRUSTEE does not match the TRUST word rule, and a surname such as CHURCH at the start of the name is a known false positive.'
    regex: \b(LLC|L\.L\.C\.?|INC\.?|CORP(ORATION)?|LP|L\.P\.|LLP|LTD|TRUST|CHURCH|COMPANY|PARTNERSHIP|HOLDINGS|PROPERTIES)\b|^(CITY|COUNTY|STATE|TOWN) OF\b
    tokens:
    - LLC
    - INC
    - LP
    - LLP
    - LTD
    - TRUST
    - CHURCH
    - COMPANY
    - PARTNERSHIP
    - HOLDINGS
    - PROPERTIES
    - CORP/CORPORATION
    prefixes:
    - CITY OF
    - COUNTY OF
    - STATE OF
    - TOWN OF
    sqlApproxWhere: (UPPER(Name1) LIKE '% LLC%' OR UPPER(Name1) LIKE '% INC%' OR UPPER(Name1) LIKE '% LP%' OR UPPER(Name1) LIKE '% LLP%' OR UPPER(Name1) LIKE '% LTD%' OR UPPER(Name1) LIKE '% TRUST%' OR UPPER(Name1) LIKE '% CHURCH%' OR UPPER(Name1) LIKE '% COMPANY%' OR UPPER(Name1) LIKE '% PARTNERSHIP%' OR UPPER(Name1) LIKE '% HOLDINGS%' OR UPPER(Name1) LIKE '% PROPERTIES%' OR UPPER(Name1) LIKE '% CORP%' OR UPPER(Name1) LIKE '%,LLC%' OR UPPER(Name1) LIKE '%,INC%' OR UPPER(Name1) LIKE 'CITY OF %' OR UPPER(Name1) LIKE 'COUNTY OF %' OR UPPER(Name1) LIKE 'STATE OF %' OR UPPER(Name1) LIKE 'TOWN OF %')
    liveEntityCountAll: 2176
    liveEntityCount5to150ac: 462
    countNote: The live count uses the SQL approximation (LIKE '% TOKEN%' on the primary owner field, which also catches TRUSTEE/INCOME-style prefixes) together with the acreage filter above.
  paDeepLink:
    template: https://www.bttaxpayerportal.com/ITSPublicSW/AppraisalCard.aspx?id={PARCEL_ID}
    testedParcelId: '563600311047'
    testedUrl: https://www.bttaxpayerportal.com/ITSPublicSW/AppraisalCard.aspx?id=563600311047
    httpStatus: 200
    contentType: application/pdf
    contentVerified: true
    note: Owner and parcel id verified in the response.
  gisViewer:
    url: https://maps.swaincountync.gov/gis/
    httpStatus: 200
    pageTitle: Swain County, North Carolina GIS
  acreageNote: The acreage field is a string, so filters need CAST(... AS FLOAT). Swain also filters LegalLandType='AC'.
  parcelIdNote: Use PARCEL_ID (12-digit, undashed). PIN is empty on every row.
  gaps:
  - sale partial
