# ---- PASS2 full-suite upgrade (rural OZ) — verifiedAt 2026-09-28 ----
pass2:
  label: PASS2 full-suite upgrade — rural OZ counties (tax / sale / owner-entity / PA link / GIS link / AADT)
  verifiedAt: '2026-09-28'
  verifiedBy: North Carolina Public Info Researcher
  aadtScreening:
    source: NCDOT Traffic Survey Group (public AGOL)
    layer: NCDOT_AADT_Stations FeatureServer/0 (documented in enrichment/NC/ncdot-aadt-statewide-dig-2026-09-24.yaml)
    restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0
    countyField: COUNTY
    countyValue: UNION
    valueField: AADT_2022
    valueType: string (trim; blank = no count that year)
    countQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27UNION%27&returnCountOnly=true&f=json
    featureQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27UNION%27&outFields=LocationID%2CROUTE%2CLOCATION%2CAADT_2021%2CAADT_2022&outSR=4326&f=geojson&resultOffset=0&resultRecordCount=1000
    liveStationCount: 755
    stationsWithAADT2022: 354
    newerYearAvailable:
      available: true
      layer: NCDOT_2025_AADTandTrafficSegments_gdb FeatureServer/1 (NCDOT_2025_AADT_Stations; dataLastEdit 2026-09-23)
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1
      countyField: County
      countyValue: Union
      valueField: AADT_2025
      valueType: integer (null = no count)
      countQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Union%27&returnCountOnly=true&f=json
      featureQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Union%27&outFields=LocationID%2CRouteID%2CLocated_On%2CCrossroad%2CAADT_2023%2CAADT_2024%2CAADT_2025&outSR=4326&f=geojson&resultOffset=0&resultRecordCount=1000
      liveStationCount: 771
      stationsWithAADT2025: 364
      stationsWithAADT2024: 477
      segmentsLayer: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/0 (AADT, AADT_Year=2025, AADTT truck volumes; polyline, statewide — spatial filter by county envelope)
      also: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT__2024_AADT_Stations_published_September_2025/FeatureServer/0 (2024 stations, published Sep 2025; County title-case; AADT_2023/AADT_2024 strings)
    recommendation: Keep AADT_2022 wiring (#59) as-is; optionally switch to 2025 stations layer and take latest non-null of AADT_2025→AADT_2024→AADT_2023 per station. Note County value case differs (2022 layer UPPER, 2025 layer Title).
  primaryParcelLayer:
    restUrl: https://atlas.unioncountync.gov/server/rest/services/OperationalLayers/MapServer/215
    acreageField: mapped_acres
    range5to150Where: mapped_acres>=5 AND mapped_acres<=150
    liveTotalParcels: 118043
    liveParcels5to150: 13149
  taxValues:
    status: ok
    fields:
      TOTVAL: tax.assessedValue
      FMV_TOTAL: tax.marketValue
    liveNonZeroCounty:
      TOTVAL: 111686
      FMV_TOTAL: 111686
    liveNonZero5to150:
      FMV_TOTAL: 12212
    notes: Double fields TOTVAL (assessed) / FMV_TOTAL (market); no land/bldg split on this layer.
    publicFallback: https://unionnc.devnetwedge.com/parcel/view/{PID}
  saleHistory:
    status: ok
    priceFields:
    - s1_SALESAMT
    dateFields:
    - s1_SALEDATE
    livePriceGt0County:
      s1_SALESAMT: 69834
    livePriceGt0_5to150:
      s1_SALESAMT: 4678
    liveDateNonNullCounty:
      s1_SALEDATE: 105139
    notes: s1_SALEDATE esriDate; s1_SALESAMT double; s1_DEEDQUAL_CODEDESC.
  ownerEntity:
    ownerFields:
    - CURR_NAME1
    - CURR_NAME2
    primaryOwnerField: CURR_NAME1
    rule:
      apply: Uppercase + trim CURR_NAME1 (optionally also CURR_NAME2)
      regex: (?i)(\bL\.?\s?L\.?\s?C\b|\bINC\b|\bCORP|\bL\.?\s?P\b|\bLLP\b|\bLLLP\b|\bLTD\b|TRUST|CHURCH|MINISTR|\bCOMPANY\b|PARTNERSHIP|PRTNRSHP|HOLDINGS|PROPERTIES|INVESTMENT|ASSOCIATION|\bHOA\b|FOUNDATION|AUTHORITY|\bDEVELOPMENT|BOARD OF EDUCATION|^(CITY|COUNTY|STATE|TOWN|VILLAGE) OF\b|^UNITED STATES|^NORTH CAROLINA\b|\bCOUNTY$)
      sqlLikeTokens:
      - '% LLC%'
      - '%,LLC%'
      - '% L L C%'
      - '% INC'
      - '% INC %'
      - '% INC.%'
      - '%,INC%'
      - '% CORP%'
      - '%CORPORATION%'
      - '% LP'
      - '% LP %'
      - '% L P'
      - '% LLP%'
      - '% LTD%'
      - '%TRUST%'
      - '%CHURCH%'
      - '%MINISTR%'
      - '% COMPANY%'
      - '%PARTNERSHIP%'
      - '%HOLDINGS%'
      - '%PROPERTIES%'
      - '%INVESTMENT%'
      - '%ASSOCIATION%'
      - '%FOUNDATION%'
      - '%AUTHORITY%'
      - CITY OF %
      - COUNTY OF %
      - STATE OF %
      - TOWN OF %
      - '% COUNTY'
      - '%BOARD OF EDUCATION%'
      - UNITED STATES%
      - NORTH CAROLINA %
      - '% DEVELOPMENT%'
      caveats: TRUST/TRUSTEE also flags family/revocable living trusts (still non-individual title holders); "% COUNTY" suffix catches e.g. "PERSON COUNTY"; bare "CO" and "ESTATE" intentionally excluded (too many false positives). Some owner strings carry trailing spaces (Wake) or mixed case (Yadkin) — normalize first.
    liveEntityCount5to150: 3387
    liveOwnerNonNull5to150: 13149
    entityQuery: where=mapped_acres>=5 AND mapped_acres<=150 AND (CURR_NAME1 LIKE '% LLC%' OR CURR_NAME1 LIKE '%,LLC%' OR CURR_NAME1 LIKE '% L L C%' OR CURR_NAME1 LIKE '% INC' OR CURR_NAME1 LIKE '% INC %' OR CURR_NAME1 LIKE '% INC.%' OR CURR_NAME1 LIKE '%,INC%' OR CURR_NAME1 LIKE '% CORP%' OR CURR_NAME1 LIKE '%CORPORATION%' OR CURR_NAME1 LIKE '% LP' OR CURR_NAME1 LIKE '% LP %' OR CURR_NAME1 LIKE '% L P' OR CURR_NAME1 LIKE '% LLP%' OR CURR_NAME1 LIKE '% LTD%' OR CURR_NAME1 LIKE '%TRUST%' OR CURR_NAME1 LIKE '%CHURCH%' OR CURR_NAME1 LIKE '%MINISTR%' OR CURR_NAME1 LIKE '% COMPANY%' OR CURR_NAME1 LIKE '%PARTNERSHIP%' OR CURR_NAME1 LIKE '%HOLDINGS%' OR CURR_NAME1 LIKE '%PROPERTIES%' OR CURR_NAME1 LIKE '%INVESTMENT%' OR CURR_NAME1 LIKE '%ASSOCIATION%' OR CURR_NAME1 LIKE '%FOUNDATION%' OR CURR_NAME1 LIKE '%AUTHORITY%' OR CURR_NAME1 LIKE 'CITY OF %' OR CURR_NAME1 LIKE 'COUNTY OF %' OR CURR_NAME1 LIKE 'STATE OF %' OR CURR_NAME1 LIKE 'TOWN OF %' OR CURR_NAME1 LIKE '% COUNTY' OR CURR_NAME1 LIKE '%BOARD OF EDUCATION%' OR CURR_NAME1 LIKE 'UNITED STATES%' OR CURR_NAME1 LIKE 'NORTH CAROLINA %' OR CURR_NAME1 LIKE '% DEVELOPMENT%')
  paDeepLink:
