gaps:
  - No single countywide zoning FeatureServer — route by ParcelCentroids.ZoningAdmin and union municipal layers (cities are first-class).
  - ParcelCentroids CountyZoning=CITY for ~78k municipal parcels — town layers mandatory.
  - No countywide Future Land Use REST (2050 plan docs; GIS FLU fragmentary).
  - FMV_LAND/FMV_IMPRV zeroed on Parcels/215 samples — totals only.
  - Hemby Bridge has no dedicated zoning layer.
  - CRS mismatch OperationalLayers 3857 vs UNION_COUNTY_LAYERS/Stallings FS 2264.
  - Legacy GoMAPS (gis.unioncountync.gov) is 404.
  - AGOL Parcels/62 is a partial ~41k clip.
  - Owner phones/emails not in public REST (do not scrape).
  - MaxRecordCount typically 2000 — pagination required.

