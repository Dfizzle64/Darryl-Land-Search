gaps:
  - No sale price/date on county or OneMap REST polygons — join ustaxdata HTML account card via OWNID+PIN (or deed bk/pg → ROD)
  - No public FLU polygon REST (Land Use Plan PDF 2010 only)
  - Middleburg and Kittrell have no dedicated public zoning FeatureServer — use county Vance_County_Zoning + Municipal/ETJ boundaries
  - NCPTS API (/api/getParcelDetails) returned 500 for Vance tenant on 2026-09-24; SPA parcel-detail/{numericId} loads; prefer ustaxdata for verified sale/PA card
  - YEAR_BUILT almost entirely 0/null on REST (~185 >0)
  - County ASSESSMENT is single total (no land/improve split on Envirolink); use OneMap landval/improvval for split
  - Envirolink MaxRecordCount 1000 — paginate
  - No paid vendor data; no phones/emails; no AADT/utilities dig
