      countUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Vance%27&returnCountOnly=true&f=json
      liveStationCount: 378
      stationsWithAADT2025: 229
      stationsWithAADT2024: 227
      dataLastEdit: '2026-09-23'
    also:
      stations2024Service: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT__2024_AADT_Stations_published_September_2025/FeatureServer/0
      stations2024CountyFilter: County='Vance'
