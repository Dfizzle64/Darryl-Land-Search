gaps:
  - No countywide FLU FeatureServer — municipal FLU only; Rolesville and Zebulon FLU missing on public REST
  - Zoning split by municipality (county MapServer helps; FeatureServer omits Raleigh layer 23)
  - Morrisville zoning only 32 polygons — coverage risk
  - Wake Forest LandUse coarse (4 categories); Garner character typology only 8 polygons
  - Knightdale FLU in WKID 3857 — reproject or PIN-join
  - Last-sale only (no multi-transfer sales history FeatureServer found)
  - Tax values are assessed (TOTAL_VALUE_ASSD); no separate market field on parcels
  - Do not scrape phones/emails from iMAPS or Real Estate pages
  - MaxRecordCount 2000 (county) / 5000 (OneMap) — paginate
