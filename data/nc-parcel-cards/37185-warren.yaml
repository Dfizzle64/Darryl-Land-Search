  - role: other
    name: Subdivisions
    restUrl: https://arcgis4.roktech.net/arcgis/rest/services/Warren/RokMap/MapServer/7
    layerId: 7
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
