      Verified count 227. Optional context; not required for parcel/zoning wire.
    status: usable

gaps:
  - No public FLU polygon REST — Comp Plan 2022 + Appendix are PDF-only (DocumentCenter/View/5281, /5279)
  - No independent municipal zoning FeatureServers for Warrenton / Norlina / Macon — use county Zoning/6 + Town Limits/8
  - Littleton mostly Halifax; Warren tip only (~19 parcels / AR zoning)
  - NC OneMap gisacres entirely 0 for Warren — use recareano; OneMap has no sale price and empty saledate
  - OneMap improvval can lag county BLDG_VAL (e.g. sample 2914119156)
  - Layers 3 and 4 are scale-dependent duplicates of the same CAMA set — prefer /4
  - MaxRecordCount 1000 on RokMap — paginate
  - ITSPublic RealEstateSearch path not configured for Warren (HTTP 500); use NCPTS parcel-detail + AppraisalCard / TaxBillSearch
  - AppraisalCard.aspx is a thin ASP shell (JS loads card) — deep-link still keyed by NEWPIN
  - warren.webtaxpay.com / secure.webtaxpay.com behind bot challenge — not a REST source
  - No multi-transfer sales history beyond last deed on parcel polygons
  - No paid vendor data; no phones/emails; no AADT/utilities dig

