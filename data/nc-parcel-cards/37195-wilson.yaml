gaps:
  - Elm City — no public town zoning FeatureServer found; use County Zoning + Municipal Boundaries Name='ELM CITY' / CityCodeDesc='Elm City'
  - Kenly / Bailey / Macclesfield / Middlesex / Walstonburg / Rocky Mount / Fountain / Fremont tips appear in CityCodeDesc but zoning lives primarily in Johnston/Nash/Edgecombe/Wayne cards
  - County FLU Plan 2045 is only 6 coarse polygons — not parcel-grain; town FLU beyond City of Wilson not published as public REST
  - No multi-decade sales history beyond last sale on parcel + Three_Year_Sales (~7.6k)
  - DateSold is YYYYMMDD integer — cast for date filters; SaleDate epoch available
  - Some CityCodeDesc blank for unincorporated (~17.2k) plus null (~610)
  - No paid vendor data; no phones/emails collected; no AADT/utilities dig

