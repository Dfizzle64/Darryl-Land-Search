gaps:
  - No public Future Land Use REST (biggest schema gap; PDF FLUM/Comp Plan only)
  - MapServer Land Use layer is cropland/land-cover not planning FLU
  - Situs city/zip missing on parcel polygons (STREET_ADDRESS only)
  - No TOTAL market/assessed column on parcels (sum land+bldg FMV)
  - County zoning NCPIN join unusable (~3 non-null); spatial join required
  - OneMap saledate empty for Yadkin; OneMap has no sale price
  - No independent municipal ArcGIS hosts (town zoning on county MapServer only)
  - Yadkinville ZONE free-text labels sometimes inconsistent with ZONE_CODE
  - MaxRecordCount 1000 on county MapServer — paginate
  - No AADT / utilities / emails / phones / paid vendors collected (out of scope)

