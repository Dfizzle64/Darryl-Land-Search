# ---- PASS2 full-suite upgrade (rural OZ) — verifiedAt 2026-09-28 ----
pass2:
  label: PASS2 full-suite upgrade — rural OZ counties (tax / sale / owner-entity / PA link / GIS link / AADT)
  verifiedAt: '2026-09-28'
  verifiedBy: North Carolina Public Info Researcher
  aadtScreening:
    source: NCDOT Traffic Survey Group (public AGOL)
    layer: NCDOT_AADT_Stations FeatureServer/0 (documented in enrichment/NC/ncdot-aadt-statewide-dig-2026-09-24.yaml)
    restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0
    countyField: COUNTY
    countyValue: YADKIN
    valueField: AADT_2022
    valueType: string (trim; blank = no count that year)
    countQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27YADKIN%27&returnCountOnly=true&f=json
    featureQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/ArcGIS/rest/services/NCDOT_AADT_Stations/FeatureServer/0/query?where=COUNTY%3D%27YADKIN%27&outFields=LocationID%2CROUTE%2CLOCATION%2CAADT_2021%2CAADT_2022&outSR=4326&f=geojson&resultOffset=0&resultRecordCount=1000
    liveStationCount: 345
    stationsWithAADT2022: 163
    newerYearAvailable:
      available: true
      layer: NCDOT_2025_AADTandTrafficSegments_gdb FeatureServer/1 (NCDOT_2025_AADT_Stations; dataLastEdit 2026-09-23)
      restUrl: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1
      countyField: County
      countyValue: Yadkin
      valueField: AADT_2025
      valueType: integer (null = no count)
      countQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Yadkin%27&returnCountOnly=true&f=json
      featureQuery: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/1/query?where=County%3D%27Yadkin%27&outFields=LocationID%2CRouteID%2CLocated_On%2CCrossroad%2CAADT_2023%2CAADT_2024%2CAADT_2025&outSR=4326&f=geojson&resultOffset=0&resultRecordCount=1000
      liveStationCount: 343
      stationsWithAADT2025: 221
      stationsWithAADT2024: 210
      segmentsLayer: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_2025_AADTandTrafficSegments_gdb/FeatureServer/0 (AADT, AADT_Year=2025, AADTT truck volumes; polyline, statewide — spatial filter by county envelope)
      also: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT__2024_AADT_Stations_published_September_2025/FeatureServer/0 (2024 stations, published Sep 2025; County title-case; AADT_2023/AADT_2024 strings)
    recommendation: Keep AADT_2022 wiring (#59) as-is; optionally switch to 2025 stations layer and take latest non-null of AADT_2025→AADT_2024→AADT_2023 per station. Note County value case differs (2022 layer UPPER, 2025 layer Title).
  primaryParcelLayer:
    restUrl: https://gis.yadkincountync.gov/arcgis/rest/services/CountyGISmap/MapServer/1
    acreageField: TOTAL_ACRES
    range5to150Where: TOTAL_ACRES>=5 AND TOTAL_ACRES<=150
    liveTotalParcels: 28364
    liveParcels5to150: 8175
  taxValues:
    status: ok
    fields:
      LAND_FMV_CURRENT: tax.landMarketValue
      BLDG_FMV_CURRENT: tax.improvementMarketValue
      LAND_ASV_CURRENT: tax.landAssessedValue
    liveNonZeroCounty:
      LAND_FMV_CURRENT: 28295
      BLDG_FMV_CURRENT: 18382
      LAND_ASV_CURRENT: 28295
    liveNonZero5to150:
      LAND_ASV_CURRENT: 8156
    notes: LAND_FMV_CURRENT/LAND_ASV_CURRENT integer, BLDG_FMV_CURRENT double. No single total field — sum land+bldg.
    publicFallback: https://www.bttaxpayerportal.com/ITSPublicYK/AppraisalCard.aspx?id={PARCEL_NO}/2027
  saleHistory:
    status: ok
    priceFields:
    - SALES_AMT
    dateFields:
    - DEED_DATE
    livePriceGt0County:
      SALES_AMT: 12488
    livePriceGt0_5to150:
      SALES_AMT: 2962
    liveDateNonNullCounty:
      DEED_DATE: 28120
    notes: DEED_DATE esriDate; SALES_AMT integer; QUALIFIED_CODE.
  ownerEntity:
    ownerFields:
    - NAME1
    - NAME2
    primaryOwnerField: NAME1
    rule:
      apply: Uppercase + trim NAME1 (optionally also NAME2)
      regex: (?i)(\bL\.?\s?L\.?\s?C\b|\bINC\b|\bCORP|\bL\.?\s?P\b|\bLLP\b|\bLLLP\b|\bLTD\b|TRUST|CHURCH|MINISTR|\bCOMPANY\b|PARTNERSHIP|PRTNRSHP|HOLDINGS|PROPERTIES|INVESTMENT|ASSOCIATION|\bHOA\b|FOUNDATION|AUTHORITY|\bDEVELOPMENT|BOARD OF EDUCATION|^(CITY|COUNTY|STATE|TOWN|VILLAGE) OF\b|^UNITED STATES|^NORTH CAROLINA\b|\bCOUNTY$)
      sqlLikeTokens:
      - '% LLC%'
      - '%,LLC%'
      - '% L L C%'
      - '% INC'
      - '% INC %'
      - '% INC.%'
      - '%,INC%'
      - '% CORP%'
      - '%CORPORATION%'
      - '% LP'
      - '% LP %'
      - '% L P'
      - '% LLP%'
      - '% LTD%'
      - '%TRUST%'
      - '%CHURCH%'
      - '%MINISTR%'
      - '% COMPANY%'
      - '%PARTNERSHIP%'
      - '%HOLDINGS%'
      - '%PROPERTIES%'
      - '%INVESTMENT%'
      - '%ASSOCIATION%'
      - '%FOUNDATION%'
      - '%AUTHORITY%'
      - CITY OF %
      - COUNTY OF %
      - STATE OF %
      - TOWN OF %
      - '% COUNTY'
      - '%BOARD OF EDUCATION%'
      - UNITED STATES%
      - NORTH CAROLINA %
      - '% DEVELOPMENT%'
      caveats: TRUST/TRUSTEE also flags family/revocable living trusts (still non-individual title holders); "% COUNTY" suffix catches e.g. "PERSON COUNTY"; bare "CO" and "ESTATE" intentionally excluded (too many false positives). Some owner strings carry trailing spaces (Wake) or mixed case (Yadkin) — normalize first.
    liveEntityCount5to150: 859
    liveOwnerNonNull5to150: 8175
    entityQuery: where=TOTAL_ACRES>=5 AND TOTAL_ACRES<=150 AND (NAME1 LIKE '% LLC%' OR NAME1 LIKE '%,LLC%' OR NAME1 LIKE '% L L C%' OR NAME1 LIKE '% INC' OR NAME1 LIKE '% INC %' OR NAME1 LIKE '% INC.%' OR NAME1 LIKE '%,INC%' OR NAME1 LIKE '% CORP%' OR NAME1 LIKE '%CORPORATION%' OR NAME1 LIKE '% LP' OR NAME1 LIKE '% LP %' OR NAME1 LIKE '% L P' OR NAME1 LIKE '% LLP%' OR NAME1 LIKE '% LTD%' OR NAME1 LIKE '%TRUST%' OR NAME1 LIKE '%CHURCH%' OR NAME1 LIKE '%MINISTR%' OR NAME1 LIKE '% COMPANY%' OR NAME1 LIKE '%PARTNERSHIP%' OR NAME1 LIKE '%HOLDINGS%' OR NAME1 LIKE '%PROPERTIES%' OR NAME1 LIKE '%INVESTMENT%' OR NAME1 LIKE '%ASSOCIATION%' OR NAME1 LIKE '%FOUNDATION%' OR NAME1 LIKE '%AUTHORITY%' OR NAME1 LIKE 'CITY OF %' OR NAME1 LIKE 'COUNTY OF %' OR NAME1 LIKE 'STATE OF %' OR NAME1 LIKE 'TOWN OF %' OR NAME1 LIKE '% COUNTY' OR NAME1 LIKE '%BOARD OF EDUCATION%' OR NAME1 LIKE 'UNITED STATES%' OR NAME1 LIKE 'NORTH CAROLINA %' OR NAME1 LIKE '% DEVELOPMENT%')
  paDeepLink:
    template: https://www.bttaxpayerportal.com/ITSPublicYK/AppraisalCard.aspx?id={PARCEL_NO}/2027
    testedUrl: https://www.bttaxpayerportal.com/ITSPublicYK/AppraisalCard.aspx?id=112756/2027
    httpStatus: 200
    notes: HTTP 200 returns application/pdf appraisal card; pdftotext confirms owner + parcel 112756. Tax year segment must track current year (2027 in portal now). Alt NCPTS https://lrcpwa.ncptscloud.com/yadkin/parcel-detail/{PIN} (200 shell).
  jurisdictionGisViewer:
    url: https://gis.yadkincountync.gov/
    httpStatus: 200
    notes: Yadkin County GIS
  gaps:
  - AADT_2022 blank at 182 of 345 stations on the 2022 layer (NCDOT counts on a cycle) — prefer 2025 layer / latest non-blank year
  - No multi-transfer sale history on primary layer (last sale only)
