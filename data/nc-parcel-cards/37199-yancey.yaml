gaps:
- No dedicated SALE_PRICE on REST — STAMPS is NC deed-excise proxy (≈ consideration/500) and can lag DEED_DATE; prefer IAS Sales History Price
- FLU REST gap — Burnsville CLUP 2021 PDF only; no county FLU FeatureServer
- Unincorporated Yancey has no countywide zoning REST (cities-first Burnsville only)
- OneMap parval/saledate empty for cntyfips='199'; no sale price on OneMap — use county TaxParcels + IAS
- OperationalLayers/6 lacks CALCULATED_ACREAGE — prefer Op2025 TaxParcels/0
- IAS PA id requires PIN + 2-digit Card suffix (01 typical; 00 some vacant; 02+ multi-card); bare PIN fails
- Utilities / AADT / emails / phones / paid vendors intentionally excluded
license: Yancey County GIS / Tax Administration; Town of Burnsville; Tyler CLT / IAS. Not survey quality. Commercial resale subject to NCGS 132-10.
