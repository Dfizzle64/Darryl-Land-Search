pass2:
  verifiedAt: '2026-09-28'
  verifiedBy: South Carolina Public Info Researcher
  tax:
    status: partial
    reason: County-wide market/land/building values on RFA layer 18 (no assessed); full assessed+market only on North
      Augusta layer (west county, 39,005 of 101,173).
    sources:
    - https://services9.arcgis.com/RvqSyw3diI7dTKo5/arcgis/rest/services/Lexington_Richland_Web_Map_WFL1/FeatureServer/18
      (where County='Aiken County')
    - https://maps.northaugustasc.gov/arcgisserver/rest/services/Parcel_Service/FeatureServer/0
    fieldMap:
      M_Value: tax.marketValue (RFA, 98,689/101,173 >0)
      L_Value: tax.landValue (RFA)
      B_Value: tax.buildingValue (RFA; often null)
      TotalMarketValue: tax.marketValue (NA)
      TotalAppraisedValue: tax.appraisedValue (NA)
      AssessedValue: tax.assessedValue (NA)
      LandValue: tax.landValue (NA)
      ImprovementValue: tax.improvementValue (NA)
  sale:
    status: partial
    reason: Sale fields only on North Augusta layer (west county); RFA layer has no sale fields. East/central county
      sales via qPublic report.
    source: https://maps.northaugustasc.gov/arcgisserver/rest/services/Parcel_Service/FeatureServer/0
    fieldMap:
      SaleDate: lastSale.date
      SalePrice: lastSale.price
      SaleBookPage: lastSale.bookPage
      SaleBuyer: lastSale.buyer
      SaleSeller: lastSale.seller
    format: SaleDate esri Date (epoch ms, midnight UTC, e.g. 1372377600000 = 2013-06-28); SalePrice Double (0.0 =
      non-arms-length/unknown); SaleBookPage "4468/812". No qualified flag.
  owner:
    status: usable
    mailingStatus: partial
    reason: Owner name county-wide on RFA Ownership (100,824/101,173); mailing address only on North Augusta layer
      (west county).
    fieldMap:
      Ownership: ownerName (RFA)
      OwnerName: ownerName (NA)
      OwnerMailingAddress: mailingAddress.street (NA)
      OwnerMailingCity: mailingAddress.city (NA)
      OwnerMailingState: mailingAddress.state (NA)
      OwnerMailingZip: mailingAddress.zip (NA)
  paLink:
    status: usable
    pattern: https://qpublic.schneidercorp.com/Application.aspx?AppID=844&LayerID=15264&PageTypeID=4&PageID=6879&KeyValue={parcelId}
    testedParcelId: 022-15-15-004
    idTransform: 'KeyValue = dashed TMS ###-##-##-### = RFA T_Map_Number as-is, = NA PARCEL_ASR as-is; NA PARCEL_NO
      uses spaces -> replace spaces with dashes.'
    reason: Report page (PageTypeID=4, PageID=6879) confirmed via search-indexed Beacon report for 022-15-15-004 (owner/sales/valuation
      2023-2025); multiple third-party links use same pattern. Card previously had PageTypeID=2/PageID=6877 (search
      page) - corrected. Direct fetch from box is Cloudflare 403 (browser works).
  publicGis:
    status: partial
    reason: aikencounty.maps.arcgis.com is not a real AGOL org (portals/self returns no org) - replaced. Aiken County
      links only the qPublic map/search as its public viewer; county Maps page hosts PDFs. No county ArcGIS web viewer
      found.
  gaps:
  - No county-wide assessed value or sale fields in public REST (RFA has market only; NA layer west county only).
  - qPublic Cloudflare-gates non-browser clients; deep link is for humans, not bulk.
