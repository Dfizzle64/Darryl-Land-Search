layers:
  - role: parcels
    name: SC RFA Statewide_Parcels filtered to Aiken County
    restUrl: https://services9.arcgis.com/RvqSyw3diI7dTKo5/arcgis/rest/services/Lexington_Richland_Web_Map_WFL1/FeatureServer/18
    layerId: 18
    where: County='Aiken County'
    geometry: polygon
    auth: none
    acreageField: Acreage
    coverage: county-wide
    count: 101173
    parcelIdField: T_Map_Number
    fieldMap:
      T_Map_Number: parcelId
      County: countyName (filter)
      Acreage: acreage
      Ownership: ownerName
      L_Value: tax.landValue
      M_Value: tax.marketValue
      B_Value: tax.buildingValue
      Land_Use: landUse
      Zoning: zoning
      Centroid_Latitude: centroidLat
      Centroid_Longitude: centroidLon
      GeoID: placeGeoId
    notes: 'Verified 2026-09-28: SC Revenue and Fiscal Affairs Office (RFA, state agency) statewide parcel
      polygon layer ''Statewide_Parcels'' (2,968,877 features, all 46 SC counties), published inside RFA
      County Boundary Program service Lexington_Richland_Web_Map_WFL1 (item 0eb57066abc0403b8e2bdf760b6aae7d,
      owner RFA_Administrator, public, capabilities Query,Extract, no token; RFA as-is disclaimer). FILTER
      where County=''Aiken County'': count=101173; parcels 5-150 ac by Acreage=15502; 4326 extent [-82.041,
      33.161, -81.167, 33.906] vs TIGER county bbox [-82.012, 33.198, -81.187, 33.877] (match); sample T_Map_Number
      ''036-08-07-001'' centroid (-81.861,33.528) inside county. Blank T_Map_Number rows: 0. Ownership populated
      100824/101173; M_Value populated 100958/101173. County rows last_edited ~2026-01-30 (layer dataLastEditDate
      2026-09-09). SR wkid 3600 — request outSR=4326; maxRecordCount 2000, paginate with resultOffset. FRAGILITY:
      statewide layer lives in a boundary-dispute project web map, not a dedicated open-data item — may
      be removed/renamed without notice; snapshot the county extract. Replaces North Augusta Parcel_Service
      as county-wide primary: that layer covers only western Aiken County (extent -82.047,33.425 to -81.807,33.662;
      39005 of ~101k parcels).'
    status: usable
    verifiedAt: '2026-09-28'
    verifiedBy: South Carolina Public Info Researcher

  - role: parcels
    name: Parcels (Aiken County CAMA)
    restUrl: https://maps.northaugustasc.gov/arcgisserver/rest/services/Parcel_Service/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: CALCACRE
    coverage: partial (western Aiken County — North Augusta/Aiken area)
    fieldMap:
      PARCEL_NO: parcelId
      PARC_NO: parcelIdAlt
      CALCACRE: acreage
      RECACRE: acreageDeed
      LocationAddress: situsAddress
      LocationCity: situsCity
      LocationState: situsState
      LocationZip: situsZip
      OwnerName: ownerName
      OwnerMailingAddress: mailingAddress.street
      OwnerMailingCity: mailingAddress.city
      OwnerMailingState: mailingAddress.state
      OwnerMailingZip: mailingAddress.zip
      SalePrice: lastSale.price
      SaleDate: lastSale.date
      SaleBuyer: lastSale.buyer
      SaleSeller: lastSale.seller
      SaleBookPage: lastSale.bookPage
      LandValue: tax.landValue
      ImprovementValue: tax.improvementValue
      TotalMarketValue: tax.marketValue
      TotalAppraisedValue: tax.appraisedValue
      AssessedValue: tax.assessedValue
      ZONING: zoning
      ZONING_DES: zoningDescription
      FutureLanduse: flu
      LegalDescription: legalDescription
      PLATBOOK: platBook
      PLATPAGE: platPage
      COUNTY: county
    notes: >
      Verified 2026-09-24: public county-area FeatureServer, count query returned 39005;
      one feature query with outSR=4326 returned polygon coordinates near (-81.9722, 33.5255)
      in Aiken County, SC. Layer exposes owner, sale, valuation, zoning and future-land-use
      attributes. Sample PARCEL_NO was 006 10 02 016; SalePrice was 0.0 in that sample.
    status: partial

  - role: tax
    name: Parcel CAMA tax and ownership attributes
    restUrl: https://maps.northaugustasc.gov/arcgisserver/rest/services/Parcel_Service/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: CALCACRE
    coverage: county-wide
    fieldMap:
      PARCEL_NO: parcelId
      OwnerName: ownerName
      TotalMarketValue: tax.marketValue
      TotalAppraisedValue: tax.appraisedValue
      AssessedValue: tax.assessedValue
      SalePrice: lastSale.price
      SaleDate: lastSale.date
    notes: Same public parcel layer; tax and ownership fields are present. Sale qualification is not separately identified.
    status: usable

  - role: zoning
    name: Aiken County zoning and future land use attributes
    restUrl: https://maps.northaugustasc.gov/arcgisserver/rest/services/Parcel_Service/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      ZONING: zoning
      ZONING_DES: zoningDescription
      FutureLanduse: flu
    notes: Zoning and FutureLanduse fields are carried on the public parcel layer; no separate zoning REST layer was required for this card.
    status: usable

gaps:
  - "2026-09-28 correction: North Augusta Parcel_Service/0 is NOT county-wide (39,005 parcels, west Aiken only; RFA shows 101,173 countywide). Primary switched to SC RFA Statewide_Parcels where County='Aiken County' (fragile state-hosted layer). No Aiken County-published parcel REST found."
  - "SalePrice/SaleDate are exposed, but the layer has no separate sale-qualified flag."
