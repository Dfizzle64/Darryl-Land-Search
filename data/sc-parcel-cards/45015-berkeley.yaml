pass2:
  verifiedAt: '2026-09-28'
  verifiedBy: South Carolina Public Info Researcher
  staleSourceWarning: custom/Addr_muni/MapServer/1 (current primary) is a CAMA SNAPSHOT from 2021-10-27 (DateGenerated
    1635372257000; max SaleDate 2021-11-06). Its owner/sale/value fields are ~5 years stale (e.g. 021-00-02-051
    owner BRAZIER ALLEN E & MARTHA L on Addr_muni vs BRAZIER MARTHA L LIFE ESTATE on live property card + layer
    4). USE internet_map_with_api/MapServer/4 (count 123,119, max SaleDate 2026-09-11) for owner/sale/tax; keep
    Addr_muni only for its richer land-use/district breakdown with a staleness flag.
  tax:
    status: partial
    reason: Current layer 4 has TotalTaxValue only (taxable/assessed-base; sample 144,555). Land/building market
      split exists only on stale Addr_muni (LandMarket/BuildingMarket, 2021).
    source: https://gis.berkeleycountysc.gov/arcgis/rest/services/API/internet_map_with_api/MapServer/4
    fieldMap:
      TotalTaxValue: tax.taxableValue (layer 4, current)
      LandMarket: tax.landValue (Addr_muni, 2021 snapshot)
      BuildingMarket: tax.improvementValue (Addr_muni, 2021 snapshot)
  sale:
    status: usable
    reason: Layer 4 current SalePrice + SaleDate + DeedBook/DeedPage (max SaleDate 2026-09-11). No qualified flag
      on layer 4 (Validity only on stale Addr_muni).
    source: https://gis.berkeleycountysc.gov/arcgis/rest/services/API/internet_map_with_api/MapServer/4
    fieldMap:
      SalePrice: lastSale.price
      SaleDate: lastSale.date
      DeedBook: lastSale.deedBook
      DeedPage: lastSale.deedPage
      Plat: platReference
    format: SaleDate esri Date epoch ms (1761782400000 = 2025-10-30); SalePrice Double, nominal values (5.0) = non-arms-length.
  owner:
    status: usable
    mailingStatus: usable
    source: https://gis.berkeleycountysc.gov/arcgis/rest/services/API/internet_map_with_api/MapServer/4
    fieldMap:
      OwnerName: ownerName
      StreetAddress1: mailingAddress.street
      StreetAddress2: mailingAddress.street2
      City: mailingAddress.city
      StateProvince: mailingAddress.state
      Zip: mailingAddress.zip
  paLink:
    status: usable
    pattern: https://assessor.berkeleycountysc.gov/property_card.php?tms={parcelId}
    testedParcelId: 0210002051 (also 021-00-02-051)
    idTransform: tms accepts O_TMS (10-digit, no dashes) or dashed ParcelID - both returned the same card (HTTP
      200, owner BRAZIER MARTHA L LIFE ESTATE).
    reason: Live-tested 2026-09-28 from box.
  publicGis:
    status: usable
    url: https://gis.berkeleycountysc.gov/maps/cloud_map
    reason: Berkeley County GIS "cloud map" linked from gis.berkeleycountysc.gov home (also /maps/advanced_map).
  aadt:
    status: usable
    reason: enrichment.aadt already present; confirmed, not re-dug.

