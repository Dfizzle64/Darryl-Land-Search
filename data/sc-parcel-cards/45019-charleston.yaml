    defaultSource: "Census ACS B19013 tract medians (national join)"
    localException: null
    checkedAt: "2026-09-24"
    checkedBy: "Public Information Researcher"
  aadt:
    source: "SCDOT (AGOL gallowayra_SCDOT — 2025 Statewide Traffic Points)"
    restUrl: "https://services1.arcgis.com/VaY7cY9pvUYUP1Lf/arcgis/rest/services/2025_Statewide_Traffic_Points/FeatureServer/0"
    layerId: 0
    field: "FactoredAA"
    geography: "state traffic count stations (points)"
    coverage: state-wide
    status: usable
    verifiedAt: "2026-09-24"
    verifiedBy: "Public Information Researcher"
    notes: "SCDOT-published 2025 statewide points (~11570); FactoredAA=factored AADT; FactoredA1 companion; filter CountyName. smpesri.scdot.org EGIS has roads but no AADT layer."
