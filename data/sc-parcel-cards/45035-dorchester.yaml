pass2:
  verifiedAt: '2026-09-28'
  verifiedBy: South Carolina Public Info Researcher
  tax:
    status: gap
    reason: No appraised/assessed/market value field on Parcels_Public/0 (only TAX_DISTRICT, TAXED_ACRES); RFA layer
      18 has no M_Value for Dorchester (0 of 76,932). Values only in county CAMA lookup (human).
    fieldMap:
      TAX_DISTRICT: tax.district
      TAXED_ACRES: acreageTaxed
  sale:
    status: usable
    reason: Last-sale price, sale date, recording date, grantor, grantee, deed on Parcels_Public/0.
    fieldMap:
      SALE_PRICE: lastSale.price
      SALE_DATE: lastSale.date
      RECORDING_DATE: lastSale.recordedDate
      GRANTOR: lastSale.grantor
      GRANTEE: lastSale.grantee
      DEED: lastSale.deedBookPage
    format: SALE_DATE / RECORDING_DATE esri Date epoch ms (1693198800000 = 2023-08-28 ET); SALE_PRICE Double; DEED
      "014917-158" = book-page. No qualified flag.
  owner:
    status: usable
    mailingStatus: usable
    fieldMap:
      OWNER: ownerName
      CARE_OF: ownerCareOf
      MAILING_ADDRESS: mailingAddress.street
      CITY_STATE_ZIP: mailingAddress.cityStateZip (single string, split "HARLEYVILLE SC 29448")
  paLink:
    status: partial
    pattern: null
    searchUrl: https://www.dorchestercountysc.gov/government/property-tax-services/assessor/real-estate-mobile-home-search/cama-property-lookup
    testedParcelId: 0080000018000 (TMS13)
    idTransform: County lookup wants TMS13 (13 digits, no dashes/decimal) = TMS13/PARCELNO field; FULL_TMS 008-00-00-018.000
      -> strip "-" and ".".
    reason: CAMA Parcel Lookup is an in-page Angular app on dorchestercountysc.gov with no documented {parcelId}
      URL parameter; county site returns Akamai "Access Denied" to the box. Search-page link only.
  publicGis:
    status: usable
    url: https://www.arcgis.com/apps/webappviewer/index.html?id=c5b2bd07c3b84ce98d09c6611377e89c
    reason: '"Dorchester County GIS Viewer" public AGOL WAB app (owner Dorchester_GIS, modified 2026-09).'
  aadt:
    status: usable
    reason: enrichment.aadt already present; confirmed, not re-dug.
  gaps:
  - No value (market/assessed) fields in any public Dorchester REST or RFA layer.
  - No PA deep link with parcel id.

