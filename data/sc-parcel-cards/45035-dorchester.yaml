layers:
  - role: parcels
    name: Parcel_PUBLIC (Parcels_Public FeatureServer)
    restUrl: https://gisportal.dorchestercounty.net/hosting/rest/services/General_Data/Parcels_Public/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: GIS_ACREAGE
    coverage: county-wide
    fieldMap:
      TMS13: parcelId
      FULL_TMS: parcelIdAlt
      FULL_PARCELNO: parcelIdFull
      ACCOUNTNO: taxAccount
      OWNER: ownerName
      CARE_OF: ownerCareOf
      MAILING_ADDRESS: mailingAddress
      CITY_STATE_ZIP: mailingAddress.cityStateZip
      PROPERTY_LOCATION: situsAddress
      GIS_ACREAGE: acreage
      TAXED_ACRES: acreageTaxed
      SALE_PRICE: lastSale.price
      SALE_DATE: lastSale.date
      RECORDING_DATE: lastSale.recordedDate
      GRANTOR: lastSale.grantor
      GRANTEE: lastSale.grantee
      DEED: lastSale.deed
      ZONINGCODE: zoning
      JURISDICTION: jurisdiction
      TAX_DISTRICT: tax.district
    notes: 'Verified 2026-09-23: HTTP 200 FeatureServer pjson + layer pjson + count query returned 80111
      features, no token. Best MSA-ready public parcel layer found — geometry + owner + situs + acreage
      + last sale + zoning code on one FeatureServer. No market/assessed value fields on this public layer
      (only TAXED_ACRES / TAX_DISTRICT). MaxRecordCount reported as 90000.

      '
    status: usable
    liveness: '2026-09-28 OK: returnCountOnly=80296; 1-feature outSR=4326 sample TMS13=''0030000037000''
      vertex (-80.573,33.295) inside Dorchester County SC bbox; parcel ID field TMS13 present.'
    count: 80296
    verifiedAt: '2026-09-28'
    verifiedBy: South Carolina Public Info Researcher

  - role: tax
    name: Parcel_PUBLIC assessment values
    restUrl: https://gisportal.dorchestercounty.net/hosting/rest/services/General_Data/Parcels_Public/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: TAXED_ACRES
    coverage: county-wide
    fieldMap:
      TMS13: parcelId
      TAXED_ACRES: acreageTaxed
      TAX_DISTRICT: tax.district
    notes: >
      Same public parcel layer — no LAND/IMP/APPRAISAL/market/assessed value attributes
      exposed in pjson field list (confirmed no *VAL* / *APPR* / *ASSESS* fields).
      Values require county CAMA web inquiry, not this REST layer.
    status: gap

  - role: ownership
    name: Parcel_PUBLIC ownership fields
    restUrl: https://gisportal.dorchestercounty.net/hosting/rest/services/General_Data/Parcels_Public/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      TMS13: parcelId
      OWNER: ownerName
      CARE_OF: ownerCareOf
      MAILING_ADDRESS: mailingAddress
      CITY_STATE_ZIP: mailingAddress.cityStateZip
    notes: Ownership is embedded on Parcels_Public; not a separate ownership service.
    status: usable

  - role: sales
    name: Parcel_PUBLIC last sale fields
    restUrl: https://gisportal.dorchestercounty.net/hosting/rest/services/General_Data/Parcels_Public/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      TMS13: parcelId
      SALE_PRICE: lastSale.price
      SALE_DATE: lastSale.date
      RECORDING_DATE: lastSale.recordedDate
      GRANTOR: lastSale.grantor
      GRANTEE: lastSale.grantee
      DEED: lastSale.deed
    notes: Last-sale attributes embedded on parcels; no separate multi-sale history FeatureServer verified.
    status: partial

  - role: zoning
    name: Zoning Dorchester County (Zoning_PUBLIC)
    restUrl: https://gisportal.dorchestercounty.net/hosting/rest/services/General_Data/Zoning_PUBLIC/MapServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      ZONECLASS: zoning
      ZONEDESC: zoningDescription
      MUNICIPALITY: municipality
    notes: >
      Verified 2026-09-23: public MapServer layer, count 1300. FeatureServer extension
      for this service returns 500 (SOE not found) — query via MapServer.
      Parcel layer also carries ZONINGCODE attribute for join-free filtering.
    status: usable

  - role: parcels
    name: COUNTY LANDS FILTERD (County_Lands_Pub)
    restUrl: https://gisportal.dorchestercounty.net/hosting/rest/services/General_Data/County_Lands_Pub/FeatureServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: GIS_ACREAGE
    coverage: sample
    fieldMap:
      TMS13: parcelId
      OWNER: ownerName
      PROPERTY_LOCATION: situsAddress
      GIS_ACREAGE: acreage
      SALE_PRICE: lastSale.price
      SALE_DATE: lastSale.date
      ZONINGCODE: zoning
    notes: >
      Verified 2026-09-23: public FeatureServer; same schema family as Parcels_Public but
      filtered to county lands — not county-wide inventory. Prefer Parcels_Public for search.
    status: partial

