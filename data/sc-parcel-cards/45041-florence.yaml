pass2:
  verifiedAt: '2026-09-28'
  verifiedBy: South Carolina Public Info Researcher
  tax:
    status: partial
    reason: Only TOTBDGVAL (total building value, Integer) + DISTRICT on County_Tax_Parcel; no land/market/assessed
      totals. RFA Statewide_Parcels Florence rows have Ownership but no M_Value. Full values on county CGI property
      card (HTML).
    source: https://services1.arcgis.com/40L6yX6OtdCifNez/arcgis/rest/services/County_Tax_Parcel/FeatureServer/0
    fieldMap:
      TOTBDGVAL: tax.buildingValue
      DISTRICT: tax.district (e.g. "400")
  sale:
    status: gap
    reason: 'No sale date/price on layer. PROPERTYHISTORY CGI (Clerk of Court mbp.cgi) returns deed Book/Page + Grantor/Grantee
      (tested 00002-04-024: Book A264 Page 1902) but no price/date in the sample. HTML only.'
    fieldMap:
      PROPERTYHISTORY: salesHistoryDeepLink (per-feature URL)
    format: 'n/a (HTML text: "Book: A264 Page: 1902 Grantor: ... Grantee: ...")'
  owner:
    status: usable
    mailingStatus: usable
    reason: 'OWNERNAME + ADD1-3 mailing on layer (70,098). CAVEAT: GIS owner may lag CAMA - test parcel 00002-04-024
      shows a different 2026 billing name on the CGI card than OWNERNAME.'
    source: https://services1.arcgis.com/40L6yX6OtdCifNez/arcgis/rest/services/County_Tax_Parcel/FeatureServer/0
    fieldMap:
      OWNERNAME: ownerName
      ADD1: mailingAddress.line1 (often blank/padded)
      ADD2: mailingAddress.line2
      ADD3: 'mailingAddress.cityStateZip (fixed-width "TIMMONSVILLE         SC29161": city=[0:21].strip, state=[21:23],
        zip=[23:])'
  paLink:
    status: usable
    pattern: http://web.florenceco.org/cgi-bin/ta/tax-pr.cgi?step=2&map={map}&block={block}&parcel={parcel}
    testedParcelId: 00002-04-024
    idTransform: Split TMS on "-" -> map (5 digits, zero-padded), block (2), parcel (3); or use MAP/BLOCK/PARCEL fields
      zero-padded to 5/2/3 (they are stored unpadded, e.g. 2/4/24). PROPERTYCARD field already holds the full URL
      (trailing space - trim). HTTP only.
    reason: 'Live test 2026-09-28: tax-pr.cgi?step=2&map=00002&block=04&parcel=024 -> HTTP 200, "Property Card Record
      for MBP: 00002-04-024 TAX YEAR: 2026". County qPublic (App=FlorenceCountySC) also exists but CGI is the county-native
      link and is not Cloudflare-gated.'
  publicGis:
    status: usable
    reason: 'publicGisUrl set to FlocoGIS "Parcel Info" Experience (public, updated 2026-08-07, ~211k views); jurisdictionGisUrl
      kept as FlocoGIS org (Florence County GIS Department, org otEVSGO5ESloTE5q). Note: parcel layer itself is hosted
      in City of Florence org (40L6yX6OtdCifNez).'
  gaps:
  - No market/assessed totals or sale price/date in REST.
  - GIS owner can lag CAMA billing name.
  aadt:
    status: usable
    reason: reference added Pass 2 (enrichment.aadt) — SCDOT 2025 Statewide Traffic Points, filter CountyName

