layers:
  - role: parcels
    name: Parcels (Parcels_Search_and_Select)
    restUrl: https://www.greenwoodsc.gov/arcgis/rest/services/Operational_Layers/Parcels_Search_and_Select/MapServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: Area
    coverage: county-wide
    fieldMap:
      PIN: parcelId
      Owner: ownerName
      MailAddress: mailingAddress.street
      MailCityState: mailingAddress.cityStateZip
      SiteAddress: situsAddress
      Area: acreageRaw
      PurchaseDate: lastSale.date
      Deed: lastSale.deed
      Plat: lastSale.plat
      DeedLink: lastSale.deedLink
      PlatLink: lastSale.platLink
      TaxValue_Total: tax.taxValue
      CapValue_Total: tax.capValue
      MarketValue_Total: tax.marketValue
      AssessedValue: tax.assessedValue
      TaxValue_Land: tax.taxValueLand
      TaxValue_Improvement: tax.taxValueImprovement
      MarketValue_Land: tax.marketValueLand
      MarketValue_Improvement: tax.marketValueImprovement
      PropType: dorCode
      PropUseCode: dorCodeDescription
      TaxDistrict: tax.district
      Subdivision: subdivision
    notes: 'Verified 2026-09-24: public MapServer, count 40306, no token. Sample polygon centroid approximately
      (-82.2700, 34.3892) WGS84, inside Greenwood County, South Carolina. Parcel layer is CAMA-rich and
      includes tax, owner, mailing, situs, deed/plat and purchase-date fields. Source alias calls Area acres,
      but sample Area=64970.6 for a 1-lot property; treat as acreageRaw and validate units/convert before
      acreage filters. Official GIS Quick Search uses PIN={parcelId}; no stable parcel deep-link pattern
      verified.

      '
    status: usable
    liveness: '2026-09-28 OK: returnCountOnly=40305; 1-feature outSR=4326 sample PIN=''6913-674-230'' vertex
      (-82.270,34.389) inside Greenwood County SC bbox; parcel ID field PIN present.'
    count: 40305
    verifiedAt: '2026-09-28'
    verifiedBy: South Carolina Public Info Researcher

  - role: tax
    name: Parcel tax and assessment attributes (Parcels_Search_and_Select)
    restUrl: https://www.greenwoodsc.gov/arcgis/rest/services/Operational_Layers/Parcels_Search_and_Select/MapServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: Area
    coverage: county-wide
    fieldMap:
      PIN: parcelId
      TaxValue_Total: tax.taxValue
      CapValue_Total: tax.capValue
      MarketValue_Total: tax.marketValue
      AssessedValue: tax.assessedValue
      TaxValue_Land: tax.taxValueLand
      TaxValue_Improvement: tax.taxValueImprovement
      CapValue_Land: tax.capValueLand
      CapValue_Improvement: tax.capValueImprovement
      MarketValue_Land: tax.marketValueLand
      MarketValue_Improvement: tax.marketValueImprovement
      TaxDistrict: tax.district
      TaxCommission: tax.appraisedBy
    notes: Tax and assessment fields are embedded on the countywide parcel polygon layer; assessor data is reported by the county as updated nightly.
    status: usable

  - role: ownership
    name: Parcel ownership and mailing (Parcels_Search_and_Select)
    restUrl: https://www.greenwoodsc.gov/arcgis/rest/services/Operational_Layers/Parcels_Search_and_Select/MapServer/0
    layerId: 0
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      PIN: parcelId
      Owner: ownerName
      MailAddress: mailingAddress.street
      MailCityState: mailingAddress.cityStateZip
      SiteAddress: situsAddress
    notes: Owner, mailing, and situs fields are embedded on the public parcel layer; deed remains the official ownership record.
    status: usable

  - role: sales
    name: Recent sales points (Sales_Points)
    restUrl: https://www.greenwoodsc.gov/arcgis/rest/services/Operational_Layers/Sales_Points/MapServer/6
    layerId: 6
    geometry: point
    auth: none
    acreageField: Area_SqFt
    coverage: county-wide
    fieldMap:
      Pin: parcelId
      SiteAddress: situsAddress
      SalePrice: lastSale.price
      SaleDate: lastSale.date
      SaleType: lastSale.type
      PropType: dorCode
      Area_SqFt: acreageRaw
      Subdivision: subdivision
    notes: >
      Verified 2026-09-24: public point layer, count 83968, sample centroid approximately
      (-82.3284, 34.3424) in Greenwood County SC. Sale fields are useful for comps but are
      point records rather than polygon parcel records; sample included SaleType=Invalid and
      SalePrice=0, so qualify/filter source values and do not assume every point is a valid sale.
    status: partial

  - role: zoning
    name: Greenwood County zoning (Search_and_Select_Query)
    restUrl: https://www.greenwoodsc.gov/arcgis/rest/services/Operational_Layers/Search_and_Select_Query/MapServer/7
    layerId: 7
    geometry: polygon
    auth: none
    acreageField: null
    coverage: county-wide
    fieldMap:
      JURISDICTION: jurisdiction
      ORDINANCENUM: ordinanceNumber
      REVISION: zoningRevision
      IMS_LABEL: zoning
      ZONECLASS: zoningClass
      DENSITY: density
    notes: >
      Verified 2026-09-24: public zoning polygons, count 1650; sample jurisdiction Ware Shoals
      and label I-1, WGS84 centroid inside Greenwood County SC. Spatial join to parcel polygons.
    status: usable

  - role: flu
    name: Future Land Use 2030 (Search_and_Select_Query)
    restUrl: https://www.greenwoodsc.gov/arcgis/rest/services/Operational_Layers/Search_and_Select_Query/MapServer/12
    layerId: 12
    geometry: polygon
    auth: none
    acreageField: Acres
    coverage: county-wide
    fieldMap:
      TaxDistrict: tax.district
      LandUsage: existingLandUse
      F2030Future: flu
      LandUse: landUseCode
      Acres: acreage
    notes: >
      Verified 2026-09-24: public Future Land Use 2030 polygons, count 844; sample
      F2030Future=MDR in Greenwood County SC. Spatial join to parcel polygons.
    status: usable

gaps:
  - "Sales_Points is point-based and includes invalid/zero-price source records; it is not a complete parcel sale-history table."
  - "Greenwood Area/Area_SqFt aliases and observed numeric values require unit validation before converting to acreage."
  - "No stable PIN-specific assessor deep link verified; use official GIS Quick Search with PIN={parcelId}."
  - "Reject SCDOT SC_Parcels token-walled services as a primary source; county MapServer above is public and preferred."

