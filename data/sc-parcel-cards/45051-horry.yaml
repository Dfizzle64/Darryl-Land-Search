      (CG2302 / 270858).
  owner:
    status: usable
    mailingStatus: usable
    fieldMap:
      OwnerName: ownerName
      OwnerStreet: mailingAddress.street
      OwnerCity: mailingAddress.city
      OwnerState: mailingAddress.state
      OwnerZipCode: mailingAddress.zip
    note: OwnerName has trailing spaces - trim.
  paLink:
    status: partial
    pattern: https://www.horrycountysc.gov/apps/LandRecords/?PIN={parcelId}
    testedParcelId: 39308040324 (TMS 1668037030)
    idTransform: PIN = 11-digit PIN (use PINtext string; PIN field is Double) - NOT TMS.
    reason: Land Records honors ?PIN= (302 to /apps/LandRecords/Account/Login?ReturnUrl=...&PIN=39308040324) but
      since 2026-03-16 requires a free Horry County account; unauthenticated users land on sign-in.
