    status: partial
    url: https://www.horrycounty.org/gis/parcels/
    reason: Horry County GIS parcel app (HTTP 200); per county 2026-03-09 notice, GIS/Land Records/Tax apps that
      show property addresses require a free login from 2026-03-16. REST (gispublic) remains open.
  aadt:
    status: usable
    reason: reference added Pass 2 (enrichment.aadt) - SCDOT 2025 Statewide Traffic Points, filter CountyName=HORRY
  gaps:
