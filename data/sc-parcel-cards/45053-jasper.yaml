  tax:
    status: usable
    reason: 'Assessed total + market components (acres/lots/bldgs) + taxable-cap appraisal on county CAMA-joined layer
      (28,929). No single market-total field: sum components.'
    source: https://gis.jaspercountysc.gov/server/rest/services/DataSharing/Parcel_Cama_HDV/FeatureServer/0
    fieldMap:
      CAMA_Table_Tot_Assesd_Value: tax.assessedValue
