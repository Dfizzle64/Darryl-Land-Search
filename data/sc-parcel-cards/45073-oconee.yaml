  - "Municipal inventory: Walhalla, Seneca, Westminster, Salem, West Union — no separate city zoning FeatureServer verified; county ZoningMap hosts county ZEO districts."
  - "REJECT maps.ocoee.org (Florida)."
  - "Do not scrape emails/phones; qPublic HTML is lookup-only."

