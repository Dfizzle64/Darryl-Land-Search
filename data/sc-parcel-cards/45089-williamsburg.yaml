pass2:
  verifiedAt: '2026-09-28'
  verifiedBy: South Carolina Public Info Researcher
  tax:
    status: usable
    reason: Market + taxable totals on RFA Williamsburg_Parcels FS/4 (taxTotMktA>0 on 28,720/29,059). ALL value fields
      are STRINGS - cast. RFA statewide M_Value is empty for Williamsburg.
    source: https://services9.arcgis.com/RvqSyw3diI7dTKo5/arcgis/rest/services/Georgetown_Williamsburg_Web_Map_WFL1/FeatureServer/4
    fieldMap:
      taxTotMktA: tax.marketValue (String, total market)
      taxTotTaxA: tax.taxableValue (String; ag-use/taxable basis, e.g. 11740 vs 2013000 market on timber tract)
      taxTotAc1: tax.marketLand (acres component)
      taxTotLo1: tax.marketLots
      taxTotBl1: tax.marketBuildings
      taxDistric: tax.district
      taxExempt: tax.exempt (Y/N)
  sale:
    status: usable
    reason: Sale date + price on RFA FS/4 (taxSalesPr>0 on 21,217).
    source: https://services9.arcgis.com/RvqSyw3diI7dTKo5/arcgis/rest/services/Georgetown_Williamsburg_Web_Map_WFL1/FeatureServer/4
    fieldMap:
      taxSalesDa: lastSale.date
      taxSaleDat: lastSale.date (untruncated copy)
      taxSalesPr: lastSale.price
      taxConside: lastSale.consideration (same as price in sample)
      taxDeedBoo: lastSale.deedBook
      taxDeedPag: lastSale.deedPage
    format: taxSaleDat String "M/D/YYYY 12:00:00 AM" (US, time always midnight); taxSalesDa same but truncated to
      20 chars ("3/31/2009 12:00:00 A") - parse date part only. taxSalesPr String dollars; multi-parcel deals repeat
      the full price on each parcel (e.g. 40,947,095 timber sale) - no qualified flag.
  owner:
    status: usable
    mailingStatus: usable
    reason: Owner + mailing on RFA FS/4; RFA statewide Ownership also populated.
    source: https://services9.arcgis.com/RvqSyw3diI7dTKo5/arcgis/rest/services/Georgetown_Williamsburg_Web_Map_WFL1/FeatureServer/4
    fieldMap:
      taxName: ownerName
      OwnerAll: ownerNameFull
      taxAddress: mailingAddress.line1 (often blank)
      taxAddre1: mailingAddress.street
      taxAddre2: mailingAddress.cityState ("WILMINGTON NC")
      taxZipCode: mailingAddress.zip (String)
      taxLocNumb + taxLocStre + taxLocSuff: situsAddress
  paLink:
    status: gap
    pattern: https://williamsburgsc.wthgis.com/
    testedParcelId: 3606-33-0876
    idTransform: 'County uses two IDs: PIN = T_Map_Number ("3606-33-0876", grid-style state PIN) and MapNumber ("45-017-002").
      WTH search accepts either via its search form; no URL parameter documented.'
    reason: Williamsburg has no qPublic/Schneider/Tyler PA; the assessor data is exposed only inside the WTH GIS viewer
      (williamsburgsc.wthgis.com, live 200), which has no documented parcel-ID deep link. Treasurer qpaybill is tax-bill
      only. Parcel-level link not possible - landing page only.
  publicGis:
    status: usable
    reason: williamsburgsc.wthgis.com live (200, "Williamsburg County, SC Map"); county Assessor page (200) as jurisdictionGisUrl.
